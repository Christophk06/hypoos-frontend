<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Ouverture</title>
<link rel="icon" href="icon-192.png" />
<style>
  :root { --ink:#1C2430; --paper:#F6F4EF; --brass:#A9834B; --border:#E4DFD3; --muted:#6B7280; --good:#3F7A5C; --bad:#A23B32; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--paper); color: var(--ink); }
  .w { max-width: 480px; margin: 0 auto; padding: 22px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { height: 40px; max-width: 120px; object-fit: contain; }
  .hotel { font-family: Georgia, serif; font-size: 20px; font-weight: 600; flex: 1; }
  select.lang { border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; background: #fff; font-size: 13px; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 25px; margin: 4px 0 6px; }
  .sub { color: var(--muted); font-size: 14.5px; margin-bottom: 16px; }
  .box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .info { white-space: pre-line; font-size: 14.5px; line-height: 1.5; }
  .extra { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 15px; cursor: pointer; }
  .extra:first-of-type { border-top: 0; }
  .extra input { width: 20px; height: 20px; accent-color: var(--ink); }
  .extra b { flex: 1; font-weight: 500; }
  .price { color: var(--muted); font-size: 14px; }
  input[type=time], textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 11px; font: inherit; font-size: 15px; background: #fff; }
  textarea { min-height: 90px; resize: vertical; }
  label.t { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  button.send { width: 100%; margin-top: 14px; background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; }
  button.send:disabled { opacity: .5; }
  .msg { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 15px; }
  .ok { background: #E4EFE8; color: var(--good); } .err { background: #F5E1DE; color: var(--bad); }
  .hp { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  footer { margin-top: 26px; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="w">
  <header><img id="logo" alt="" hidden /><div class="hotel" id="hotel">…</div><select class="lang" id="lang" aria-label="Language"></select></header>
  <div id="app"></div>
  <footer>Ouverture</footer>
</div>
<script>
var API = "https://hpoos-backend-1.onrender.com";
var LANGS = [["de","Deutsch"],["en","English"],["fr","Français"],["it","Italiano"],["es","Español"],["pt","Português"],["tr","Türkçe"],["ja","日本語"],["zh","中文"],["ar","العربية"]];
var T = {
  de: { hello: "Willkommen, {name}!", arrival: "Anreise am {date} · Check-in ab {time} Uhr", eta: "Wann kommen Sie ungefähr an?", extras: "Möchten Sie etwas dazubuchen?", note: "Wünsche oder Hinweise (z. B. Allergien, Kinderbett)", send: "Absenden", saved: "Danke! Wir haben Ihre Angaben erhalten und freuen uns auf Sie.", change: "Angaben ändern", payNote: "Bezahlt wird vor Ort. Das Hotel bestätigt Extras bei Bedarf.", invalid: "Dieser Link ist nicht (mehr) gültig.", error: "Das hat nicht geklappt. Bitte später erneut versuchen.", loading: "Lädt…" },
  en: { hello: "Welcome, {name}!", arrival: "Arrival on {date} · check-in from {time}", eta: "Roughly when will you arrive?", extras: "Would you like to add anything?", note: "Requests or notes (e.g. allergies, baby cot)", send: "Send", saved: "Thank you! We have received your details and look forward to welcoming you.", change: "Change details", payNote: "Payment is made at the hotel. The hotel will confirm extras if needed.", invalid: "This link is not (or no longer) valid.", error: "That didn’t work. Please try again later.", loading: "Loading…" },
  fr: { hello: "Bienvenue, {name} !", arrival: "Arrivée le {date} · check-in à partir de {time}", eta: "À quelle heure arriverez-vous environ ?", extras: "Souhaitez-vous ajouter quelque chose ?", note: "Souhaits ou remarques (p. ex. allergies, lit bébé)", send: "Envoyer", saved: "Merci ! Nous avons bien reçu vos informations et nous réjouissons de vous accueillir.", change: "Modifier", payNote: "Le paiement se fait sur place. L’hôtel confirme les extras si nécessaire.", invalid: "Ce lien n’est pas (ou plus) valable.", error: "Cela n’a pas fonctionné. Veuillez réessayer plus tard.", loading: "Chargement…" },
  it: { hello: "Benvenuto/a, {name}!", arrival: "Arrivo il {date} · check-in dalle {time}", eta: "A che ora arriverà circa?", extras: "Desidera aggiungere qualcosa?", note: "Richieste o note (es. allergie, culla)", send: "Invia", saved: "Grazie! Abbiamo ricevuto i suoi dati e la aspettiamo con piacere.", change: "Modifica", payNote: "Il pagamento avviene in hotel. L’hotel conferma gli extra se necessario.", invalid: "Questo link non è (più) valido.", error: "Non è andato a buon fine. Riprovi più tardi.", loading: "Caricamento…" },
  es: { hello: "¡Bienvenido/a, {name}!", arrival: "Llegada el {date} · check-in desde las {time}", eta: "¿A qué hora llegará aproximadamente?", extras: "¿Desea añadir algo?", note: "Peticiones o notas (p. ej. alergias, cuna)", send: "Enviar", saved: "¡Gracias! Hemos recibido sus datos y esperamos su llegada con ilusión.", change: "Cambiar datos", payNote: "El pago se realiza en el hotel. El hotel confirmará los extras si es necesario.", invalid: "Este enlace no es (o ya no es) válido.", error: "No ha funcionado. Inténtelo de nuevo más tarde.", loading: "Cargando…" },
  pt: { hello: "Bem-vindo/a, {name}!", arrival: "Chegada a {date} · check-in a partir das {time}", eta: "A que horas prevê chegar?", extras: "Deseja acrescentar alguma coisa?", note: "Pedidos ou observações (p. ex. alergias, berço)", send: "Enviar", saved: "Obrigado! Recebemos os seus dados e aguardamos a sua chegada.", change: "Alterar dados", payNote: "O pagamento é feito no hotel. O hotel confirma os extras se necessário.", invalid: "Este link não é (ou já não é) válido.", error: "Não foi possível. Tente novamente mais tarde.", loading: "A carregar…" },
  tr: { hello: "Hoş geldiniz, {name}!", arrival: "Varış {date} · check-in saat {time} itibarıyla", eta: "Yaklaşık ne zaman varacaksınız?", extras: "Eklemek istediğiniz bir şey var mı?", note: "İstekler veya notlar (ör. alerjiler, bebek yatağı)", send: "Gönder", saved: "Teşekkürler! Bilgilerinizi aldık, sizi ağırlamayı dört gözle bekliyoruz.", change: "Bilgileri değiştir", payNote: "Ödeme otelde yapılır. Otel gerekirse ekstraları onaylar.", invalid: "Bu bağlantı geçerli değil (artık).", error: "Olmadı. Lütfen daha sonra tekrar deneyin.", loading: "Yükleniyor…" },
  ja: { hello: "{name} 様、ようこそ！", arrival: "{date} ご到着 · チェックイン {time} から", eta: "到着予定時刻を教えてください", extras: "追加でご希望のものはありますか？", note: "ご要望・ご連絡（アレルギー、ベビーベッドなど）", send: "送信", saved: "ありがとうございます。内容を受け付けました。ご到着をお待ちしております。", change: "内容を変更", payNote: "お支払いはホテルにて承ります。必要に応じてホテルから追加内容をご確認します。", invalid: "このリンクは無効です（期限切れの可能性があります）。", error: "送信できませんでした。しばらくしてから再度お試しください。", loading: "読み込み中…" },
  zh: { hello: "欢迎您，{name}！", arrival: "{date} 抵达 · {time} 起可办理入住", eta: "您大约几点到达？", extras: "需要加订什么吗？", note: "需求或备注（如过敏、婴儿床）", send: "提交", saved: "谢谢！我们已收到您的信息，期待您的光临。", change: "修改信息", payNote: "费用在酒店现场支付。如有需要，酒店会确认加订项目。", invalid: "此链接无效（或已失效）。", error: "提交失败，请稍后再试。", loading: "加载中…" },
  ar: { hello: "أهلًا بكم، {name}!", arrival: "الوصول بتاريخ {date} · تسجيل الوصول من الساعة {time}", eta: "متى تصلون تقريبًا؟", extras: "هل ترغبون في إضافة شيء؟", note: "طلبات أو ملاحظات (مثل الحساسية، سرير أطفال)", send: "إرسال", saved: "شكرًا! استلمنا بياناتكم ونتطلع إلى استقبالكم.", change: "تعديل البيانات", payNote: "يتم الدفع في الفندق. يؤكد الفندق الإضافات عند الحاجة.", invalid: "هذا الرابط غير صالح (أو لم يعد صالحًا).", error: "لم ينجح ذلك. يرجى المحاولة لاحقًا.", loading: "جارٍ التحميل…" },
};
var q = new URLSearchParams(location.search), token = q.get("t") || "", demo = q.get("demo") === "1";
var state = { info: null, extras: [], eta: "", note: "", sent: false, error: null, busy: false };
var lang = (function () { try { var s = localStorage.getItem("ouv_guest_lang"); if (T[s]) return s; } catch (e) {} var n = (navigator.language || "en").slice(0, 2).toLowerCase(); return T[n] ? n : "en"; })();
var $ = function (id) { return document.getElementById(id); };
function t(k, v) { var s = (T[lang] || T.en)[k] || T.en[k]; return s.replace(/\{(\w+)\}/g, function (_, x) { return v && v[x] != null ? v[x] : ""; }); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
LANGS.forEach(function (l) { var o = document.createElement("option"); o.value = l[0]; o.textContent = l[1]; $("lang").appendChild(o); });
$("lang").value = lang;
$("lang").onchange = function () { lang = this.value; try { localStorage.setItem("ouv_guest_lang", lang); } catch (e) {} render(); };
var DEMO = { hotel: { name: "Beispielhotel Alpenblick", currency: "EUR" }, guest: { name: "Familie Weber", arrival_date: new Date(Date.now() + 3 * 86400000).toISOString().slice(0, 10) }, checkin_time: "15:00",
  info: "Parkplätze in der Tiefgarage, Einfahrt Seestraße 4.", extras: [{ id: "x0", name: "Frühstück", price: 24 }, { id: "x1", name: "Parkplatz in der Garage", price: 18 }, { id: "x2", name: "Später Check-out bis 14 Uhr", price: 35 }], chosen: [], eta: null, note: null, answered: false };
function api(path, opt) {
  if (demo) return Promise.resolve(opt ? { ok: true } : DEMO);
  return fetch(API + path, Object.assign({ headers: { "Content-Type": "application/json", "Accept-Language": lang } }, opt || {})).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || t("error")); return j; }); });
}
function fmtDate(iso) { try { return new Date(iso + "T12:00:00Z").toLocaleDateString(lang === "en" ? "en-GB" : lang, { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" }); } catch (e) { return iso; } }
function money(p, cur) { try { return new Intl.NumberFormat(lang, { style: "currency", currency: cur || "EUR" }).format(p); } catch (e) { return p + " " + cur; } }
function render() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  var a = $("app"), i = state.info;
  if (state.error && !i) { a.innerHTML = '<div class="msg err">' + esc(state.error) + "</div>"; return; }
  if (!i) { a.innerHTML = '<div class="sub">' + t("loading") + "</div>"; return; }
  var head = "<h1>" + esc(t("hello", { name: i.guest.name })) + '</h1><div class="sub">' + esc(t("arrival", { date: fmtDate(i.guest.arrival_date), time: i.checkin_time })) + "</div>";
  if (state.sent) { a.innerHTML = head + '<div class="msg ok">✓ ' + esc(t("saved")) + '</div><button class="send" style="background:#fff;color:var(--ink);border:1px solid var(--border)" id="again">' + esc(t("change")) + "</button>";
    $("again").onclick = function () { state.sent = false; render(); }; return; }
  var html = head;
  if (i.info) html += '<div class="box info">' + esc(i.info) + "</div>";
  html += '<label class="t" for="eta">' + esc(t("eta")) + '</label><input type="time" id="eta" value="' + esc(state.eta) + '" />';
  if (i.extras.length) {
    html += '<label class="t">' + esc(t("extras")) + '</label><div class="box">';
    i.extras.forEach(function (x) { html += '<label class="extra"><input type="checkbox" data-x="' + esc(x.id) + '"' + (state.extras.indexOf(x.id) >= 0 ? " checked" : "") + " /><b>" + esc(x.name) + "</b>" + (x.price != null ? '<span class="price">' + esc(money(x.price, i.hotel.currency)) + "</span>" : "") + "</label>"; });
    html += '</div><div class="note">' + esc(t("payNote")) + "</div>";
  }
  html += '<label class="t" for="note">' + esc(t("note")) + '</label><textarea id="note" maxlength="1000">' + esc(state.note) + '</textarea><input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true" />';
  html += '<button class="send" id="send"' + (state.busy ? " disabled" : "") + ">" + esc(t("send")) + "</button>" + (state.error ? '<div class="msg err">' + esc(state.error) + "</div>" : "");
  a.innerHTML = html;
  [].forEach.call(a.querySelectorAll("[data-x]"), function (c) { c.onchange = function () { var id = c.getAttribute("data-x"); state.extras = state.extras.filter(function (x) { return x !== id; }); if (c.checked) state.extras.push(id); }; });
  $("eta").oninput = function () { state.eta = this.value; };
  $("note").oninput = function () { state.note = this.value; };
  $("send").onclick = function () {
    state.busy = true; state.error = null; render();
    api("/api/public/arrival/" + encodeURIComponent(token), { method: "POST", body: JSON.stringify({ eta: state.eta, extras: state.extras, note: state.note, website: $("website") ? $("website").value : "" }) })
      .then(function () { state.sent = true; }).catch(function (e) { state.error = e.message; }).then(function () { state.busy = false; render(); });
  };
}
function brand(h) {
  $("hotel").textContent = h.name; document.title = h.name;
  if (h.logo_data) { $("logo").src = h.logo_data; $("logo").hidden = false; }
  if (h.brand_color) document.documentElement.style.setProperty("--ink", h.brand_color);
}
render();
if (!token && !demo) { state.error = t("invalid"); render(); }
else api("/api/public/arrival/" + encodeURIComponent(token)).then(function (i) {
  state.info = i; state.extras = (i.chosen || []).slice(); state.eta = i.eta || ""; state.note = i.note || ""; state.sent = !!i.answered;
  var chosenLang = null; try { chosenLang = localStorage.getItem("ouv_guest_lang"); } catch (e) {}
  if (i.guest.language && T[i.guest.language] && !chosenLang) { lang = i.guest.language; $("lang").value = lang; }
  brand(i.hotel); render();
}).catch(function (e) { state.error = e.message || t("invalid"); render(); });
</script>
</body>
</html>
