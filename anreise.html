<style>
  :root { --ink:#1C2430; --paper:#F6F4EF; --brass:#A9834B; --border:#E4DFD3; --muted:#6B7280; --good:#3F7A5C; --bad:#A23B32; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--paper); color: var(--ink); }
  .w { max-width: 480px; margin: 0 auto; padding: 22px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { height: 40px; max-width: 120px; object-fit: contain; }
  .hotel { font-family: Georgia, serif; font-size: 20px; font-weight: 600; flex: 1; }
  select.lang { border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; background: #fff; font-size: 13px; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 25px; margin: 4px 0 6px; }
  .sub { color: var(--muted); font-size: 14.5px; margin-bottom: 16px; }
  .box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .info { white-space: pre-line; font-size: 14.5px; line-height: 1.5; }
  .extra { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 15px; cursor: pointer; }
  .extra:first-of-type { border-top: 0; }
  .extra input { width: 20px; height: 20px; accent-color: var(--ink); }
  .extra b { flex: 1; font-weight: 500; }
  .price { color: var(--muted); font-size: 14px; }
  input[type=time], textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 11px; font: inherit; font-size: 15px; background: #fff; }
  textarea { min-height: 90px; resize: vertical; }
  .in { width: 100%; min-height: 44px; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font: inherit; font-size: 15px; background: #fff; color: inherit; }
  .lnk { background: none; border: 0; color: var(--ink); text-decoration: underline; font: inherit; font-size: 14px; min-height: 44px; padding: 0; cursor: pointer; }
  label.t { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  button.send { width: 100%; margin-top: 14px; background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; }
  button.send:disabled { opacity: .5; }
  .msg { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 15px; }
  .ok { background: #E4EFE8; color: var(--good); } .err { background: #F5E1DE; color: var(--bad); }
  .hp { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  footer { margin-top: 26px; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
