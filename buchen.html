    if (s.health_form) {
      h += "<fieldset><legend>" + esc(t("health")) + '</legend><div class="note" style="margin:0 0 6px">' + esc(t("healthHint")) + "</div>"
        + HEALTH.map(function (k) { return '<label class="chk"><input type="checkbox" data-h="' + k + '"' + (f.health[k] ? " checked" : "") + " /> <span>" + esc(t("h_" + k)) + "</span></label>"; }).join("")
        + '<label class="f" for="hnote">' + esc(t("h_note")) + '</label><input id="hnote" maxlength="1000" value="' + esc(f.health.note || "") + '" />'
        + '<label class="chk"><input type="checkbox" id="hok"' + (f.health_consent ? " checked" : "") + " /> <span>" + esc(t("consent")) + "</span></label></fieldset>";
    }
    if (i.terms) h += "<fieldset><legend>" + esc(t("terms")) + '</legend><div class="sub" style="margin:0;font-size:13.5px">' + esc(i.terms) + '</div><label class="chk"><input type="checkbox" id="tok"' + (f.terms_ok ? " checked" : "") + " /> <span>" + esc(t("termsOk")) + "</span></label></fieldset>";
    if (i.cancel_hours) h += '<div class="note">' + esc(t("cancelFree", { h: i.cancel_hours })) + "</div>";
    if (s.deposit_pct > 0 && !room) h += '<div class="note">' + esc(t("deposit", { pct: s.deposit_pct })) + "</div>";
    h += '<div class="hp" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off" /></div>'
      + '<button class="main" type="submit"' + (state.busy ? " disabled" : "") + ">" + esc(state.busy ? t("sending") : s.deposit_pct > 0 && !room ? t("pay") : t("send")) + "</button>"
      + '<div class="note">' + esc(t("privacy")) + "</div></form>";
  }
  a.innerHTML = h; bind();
}
function readForm() {
  var f = state.form; if (!$("gname")) return;
  f.guest_name = $("gname").value; f.email = $("email").value; f.phone = $("phone").value; f.wishes = $("wishes").value;
  if ($("rc")) f.room_charge = $("rc").checked;
  Array.prototype.forEach.call(document.querySelectorAll("[data-h]"), function (x) { f.health[x.getAttribute("data-h")] = x.checked; });
  if ($("hnote")) f.health.note = $("hnote").value;
  if ($("hok")) f.health_consent = $("hok").checked;
  if ($("tok")) f.terms_ok = $("tok").checked;
}
function bind() {
  var all = function (sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); };
  all("[data-cat]", function (b) { b.onclick = function () { state.cat = b.getAttribute("data-cat"); render(); }; });
  all("[data-svc]", function (b) { b.onclick = function () { if (state.svc) return; state.svc = state.info.services.filter(function (s) { return s.id === b.getAttribute("data-svc"); })[0]; state.persons = 1; state.day = null; state.time = null; state.error = null; render(); window.scrollTo(0, 0); }; });
  if ($("back")) $("back").onclick = function () { readForm(); state.svc = null; state.day = null; state.time = null; state.slots = null; render(); };
  if ($("persons")) $("persons").onchange = function () { state.persons = Number(this.value); loadSlots(); };
  if ($("pref")) $("pref").onchange = function () { state.pref = this.value; loadSlots(); };
  all("[data-day]", function (b) { b.onclick = function () { readForm(); state.day = b.getAttribute("data-day"); loadSlots(); }; });
  if ($("dayIn")) $("dayIn").onchange = function () { if (this.value) { state.day = this.value; loadSlots(); } };
  all("[data-time]", function (b) { b.onclick = function () { readForm(); state.time = b.getAttribute("data-time"); render(); var g = $("gname"); if (g) g.focus(); }; });
  var frm = $("frm"); if (!frm) return;
  frm.onsubmit = function (e) {
    e.preventDefault(); readForm();
    var f = state.form, s = state.svc, i = state.info;
    var fail = function (k, el) { state.error = k; render(); if (el && $(el)) $(el).focus(); };
    if (!f.guest_name.trim()) return fail(t("name") + " *", "gname");
    if (!room && !f.email.trim() && !f.phone.trim()) return fail(t("contact"), "email");
    if (s.health_form && !f.health_consent) return fail(t("consentNeed"), "hok");
    if (i.terms && !f.terms_ok) return fail(t("termsNeed"), "tok");
    state.busy = true; state.error = null; render();
    var body = { service_id: s.id, day: state.day, time: state.time, persons: state.persons, staff_pref: state.pref, guest_name: f.guest_name, email: f.email.trim(), phone: f.phone, wishes: f.wishes,
      room_charge: !!f.room_charge, health: s.health_form ? f.health : undefined, health_consent: !!(s.health_form && f.health_consent), lang: lang, website: $("website") ? $("website").value : "" };
    var p = demo ? Promise.resolve({ ok: true, status: "bestätigt", day: state.day, time: state.time, persons: state.persons, service: s.name, price: s.price, manage: "" }) : call("POST", base(), body);
    p.then(function (r) {
      if (r.pay_url) { if (/^https:\/\/[^\s"<>]+$/.test(r.pay_url)) location.href = r.pay_url; else { state.busy = false; state.error = t("error"); render(); } return; }
      state.busy = false; state.done = r; render(); window.scrollTo(0, 0);
    }).catch(function (e) { state.busy = false; state.error = e.message || t("error"); loadSlots(); });
  };
}
function renderManage(a) {
  var m = state.m;
  if (state.error && !m) { a.innerHTML = '<div class="msg err" role="alert">' + esc(state.error) + "</div>"; return; }
  if (!m) { a.innerHTML = '<div class="sub">' + esc(t("loading")) + "</div>"; return; }
  var h = "<h1>" + esc(t("your")) + "</h1>";
  if (state.error) h += '<div class="msg err" role="alert">' + esc(state.error) + "</div>";
  if (m.status === "storniert") h += '<div class="msg wait" role="status">' + esc(t("cancelled")) + (m.deposit_note ? " " + esc(t("depositNote")) : "") + "</div>";
  h += '<div class="box"><dl><dt>' + esc(t("service")) + "</dt><dd>" + esc(m.service) + "</dd><dt>" + esc(t("name")) + "</dt><dd>" + esc(m.name) + "</dd><dt>" + esc(t("day")) + "</dt><dd>" + esc(fmtDay(m.day, { weekday: "long", day: "numeric", month: "long" })) + "</dd><dt>" + esc(t("time")) + "</dt><dd>" + esc(m.time + "–" + m.end) + "</dd><dt>" + esc(t("persons")) + "</dt><dd>" + esc(m.persons) + "</dd>"
    + (m.price != null ? "<dt>" + esc(t("price")) + "</dt><dd>" + esc(money(m.price)) + "</dd>" : "") + "<dt>" + esc(t("status")) + "</dt><dd>" + esc(t(m.status)) + "</dd></dl></div>";
  if (m.status !== "storniert") h += '<a class="chip" style="display:inline-flex;align-items:center;text-decoration:none;margin-bottom:12px" href="' + esc(API + "/api/public/booking/manage/" + encodeURIComponent(manage) + "?ics=1") + '">' + esc(t("calendar")) + "</a>";
  if (m.terms) h += '<div class="sub" style="font-size:13.5px">' + esc(m.terms) + "</div>";
  if (m.can_cancel) h += '<div><button class="sec" id="cancel" type="button">' + esc(t("cancel")) + "</button></div>";
  else if (["angefragt", "bestätigt"].indexOf(m.status) >= 0) h += '<div class="note">' + esc(t("noCancel")) + "</div>";
  a.innerHTML = h;
  var c = $("cancel");
  if (c) c.onclick = function () {
    if (!confirm(t("cancelQ"))) return;
    call("DELETE", "/api/public/booking/manage/" + encodeURIComponent(manage)).then(function (r) { m.status = "storniert"; m.can_cancel = false; m.deposit_note = r.deposit_note; state.error = null; render(); })
      .catch(function (e) { state.error = e.message || t("error"); render(); });
  };
}
render();
if (manage) {
  if (!TOK.test(manage)) { state.error = t("invalid"); render(); }
  else call("GET", "/api/public/booking/manage/" + encodeURIComponent(manage)).then(function (m) { state.m = m; brand(m.hotel || {}); render(); }).catch(function (e) { state.error = e.message || t("error"); render(); });
} else if (!demo && !TOK.test(token) && !TOK.test(room)) { state.error = t("invalid"); render(); }
else {
  var p0 = demo ? Promise.resolve(DEMO) : call("GET", base());
  p0.then(function (i) {
    state.info = i; brand(i.hotel || {}); render();
    if (sid && !demo) {
      var tries = 0;
      (function check() {
        call("GET", "/api/public/booking/" + encodeURIComponent(token) + "/session/" + encodeURIComponent(sid)).then(function (r) { state.paid = r; render(); if (r.status === "angefragt" && ++tries < 5) setTimeout(check, 3000); })
          .catch(function (e) { state.paid = { status: "angefragt" }; state.error = e.message; render(); });
      })();
    }
  }).catch(function (e) { state.error = e.message || t("error"); render(); });
}
</script>
</body>
</html>
