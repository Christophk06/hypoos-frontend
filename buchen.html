  * { box-sizing: border-box; }

  .svc { display: block; width: 100%; text-align: start; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; font: inherit; color: var(--ink); }
  .svc[aria-pressed="true"] { border: 2px solid var(--ink); }

  button.main { background: var(--ink); color: #fff; border: none; border-radius: 10px; padding: 13px 18px; font: inherit; font-weight: 700; width: 100%; min-height: 48px; cursor: pointer; margin-top: 16px; }
  button.main:disabled { opacity: .5; }
  button.sec { background: #fff; color: var(--bad); border: 1px solid var(--bad); border-radius: 10px; padding: 12px 16px; font: inherit; font-weight: 600; min-height: 44px; cursor: pointer; }
  .box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .msg { padding: 14px; border-radius: 10px; font-size: 15px; margin-bottom: 12px; }
  .err { background: #F5E1DE; color: var(--bad); } .ok { background: #E3F0E8; color: var(--good); } .wait { background: #F7EBD3; color: var(--warn); }
  .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 15px; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; }
  fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 12px 0 0; background: #fff; }
  legend { font-size: 13px; color: var(--muted); padding: 0 4px; }
  footer { margin-top: 26px; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>

    call("POST", "/api/public/booking/manage/" + encodeURIComponent(manage) + "/confirm").then(function (r) { m.status = r.status; m.needs_confirm = false; state.error = r.status === "bestätigt" ? null : t("error"); render(); if (r.status === "bestätigt") $("app").insertAdjacentHTML("afterbegin", '<div class="msg ok" role="status">' + esc(t("confirmedNow")) + "</div>"); })
      .catch(function (e) { state.error = e.message || t("error"); render(); });
  };
  var c = $("cancel");
  if (c) c.onclick = function () {
    if (!confirm(t("cancelQ"))) return;
    call("DELETE", "/api/public/booking/manage/" + encodeURIComponent(manage)).then(function (r) { m.status = "storniert"; m.can_cancel = false; m.deposit_note = r.deposit_note; state.error = null; render(); })
      .catch(function (e) { state.error = e.message || t("error"); render(); });
  };
}
render();
if (wo) {
  if (!TOK.test(wo)) { state.error = t("invalid"); render(); }
  else call("GET", "/api/public/booking/offer/" + encodeURIComponent(wo)).then(function (o) { state.offer = o; brand(o.hotel || {}); render(); }).catch(function (e) { state.error = e.message || t("error"); render(); });
} else if (pm) {
  if (!TOK.test(pm)) { state.error = t("invalid"); render(); }
  else call("GET", "/api/public/package/manage/" + encodeURIComponent(pm)).then(function (m) { state.m = m; brand(m.hotel || {}); render(); }).catch(function (e) { state.error = e.message || t("error"); render(); });
} else if (manage) {
  if (!TOK.test(manage)) { state.error = t("invalid"); render(); }
  else call("GET", "/api/public/booking/manage/" + encodeURIComponent(manage)).then(function (m) { state.m = m; brand(m.hotel || {}); render(); }).catch(function (e) { state.error = e.message || t("error"); render(); });
} else if (!demo && !TOK.test(token) && !TOK.test(room)) { state.error = t("invalid"); render(); }
else {
  var p0 = demo ? Promise.resolve(DEMO) : call("GET", base());
  p0.then(function (i) {
    state.info = i; brand(i.hotel || {}); render();
    if (!room && !sid) {
      var pp = demo ? Promise.resolve(DEMO_PKGS) : call("GET", "/api/public/booking/" + encodeURIComponent(token) + "/packages");
      pp.then(function (l) { state.pkgs = Array.isArray(l) ? l : []; render(); }).catch(function () {});
    }
    if (sid && !demo) {
      var tries = 0;
      (function check() {
        call("GET", "/api/public/booking/" + encodeURIComponent(token) + "/session/" + encodeURIComponent(sid)).then(function (r) { state.paid = r; render(); if (r.status === "angefragt" && ++tries < 5) setTimeout(check, 3000); })
          .catch(function (e) { state.paid = { status: "angefragt" }; state.error = e.message; render(); });
      })();
    }
  }).catch(function (e) { state.error = e.message || t("error"); render(); });
}
</script>
