<style>
  :root { --ink:#1C2430; --paper:#F6F4EF; --brass:#A9834B; --border:#E4DFD3; --muted:#6B7280; --good:#3F7A5C; --bad:#A23B32; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--paper); color: var(--ink); }
  .w { max-width: 460px; margin: 0 auto; padding: 22px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { height: 40px; max-width: 120px; object-fit: contain; }
  .hotel { font-family: Georgia, serif; font-size: 20px; font-weight: 600; flex: 1; }
  select.lang { border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; background: #fff; font-size: 13px; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 26px; margin: 4px 0 4px; }
  .room { color: var(--muted); margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { background: #fff; border: 2px solid var(--border); border-radius: 12px; padding: 16px 10px; text-align: center; cursor: pointer; font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .opt .i { font-size: 28px; display: block; margin-bottom: 6px; }
  .opt.on { border-color: var(--brass); background: #FBF6EC; }
  textarea { width: 100%; margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 11px; font: inherit; font-size: 15px; min-height: 84px; resize: vertical; }
  button.send { width: 100%; margin-top: 12px; background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; }
  button.send:disabled { opacity: .5; }
  .msg { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 15px; }
  .ok { background: #E4EFE8; color: var(--good); } .err { background: #F5E1DE; color: var(--bad); }
  .hp { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
  footer { margin-top: 26px; font-size: 11.5px; color: var(--muted); text-align: center; }
  [dir="rtl"] .grid { direction: rtl; }
  .chat { margin-top: 26px; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .chat h2 { font-family: Georgia, serif; font-weight: 500; font-size: 19px; margin: 0 0 4px; }
  .chat .hint { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .bubbles { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; margin-bottom: 10px; }
  .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 15px; white-space: pre-wrap; }
  .bubble.guest { align-self: flex-end; background: var(--ink); color: #fff; }
  .bubble.staff { align-self: flex-start; background: var(--paper); }
  .bubble small { display: block; font-size: 11px; opacity: .65; margin-top: 2px; }
  .chatrow { display: flex; gap: 8px; }
  .chatrow input { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 11px; font: inherit; font-size: 15px; }
  .chatrow button { background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .info { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 4px 14px 10px; margin-bottom: 18px; }
  .info summary { font-weight: 700; padding: 10px 0; cursor: pointer; }
  .info h3 { font-size: 14px; margin: 14px 0 4px; }
  .irow { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); font-size: 14.5px; }
  .irow small { display: block; color: #6B7280; font-size: 12.5px; }
  .inote { font-size: 14px; white-space: pre-wrap; margin: 8px 0; }
  .book { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; min-height: 36px; }
</style>
</head>

  if (i.notes) h += '<p class="inote">' + esc(i.notes) + "</p>";
  if (menu.length) { h += "<h3>" + esc(t("menu")) + "</h3>"; menu.forEach(function (m) { h += '<div class="irow"><span>' + esc(m.name) + (m.note ? '<small>' + esc(m.note) + "</small>" : "") + "</span><b>" + esc(m.price || "") + "</b></div>"; }); }
  if (spa.length) { h += "<h3>" + esc(t("spa")) + "</h3>"; spa.forEach(function (m) { h += '<div class="irow"><span>' + esc(m.name) + (m.duration || m.price ? "<small>" + esc([m.duration, m.price].filter(Boolean).join(" · ")) + "</small>" : "") + '</span><button class="book" data-spa="' + esc(m.name) + '">' + esc(t("book")) + "</button></div>"; }); }
  return h + "</details>";
}
function render() {
  renderChat();
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  var a = $("app");
  if (state.error === "invalid") { a.innerHTML = '<div class="msg err">' + esc(t("invalid")) + "</div>"; return; }
  if (!state.info) { a.innerHTML = '<div style="color:#6B7280">…</div>'; return; }
  if (state.sent) { a.innerHTML = '<div class="msg ok">✓ ' + esc(t("thanks")) + '</div><button class="send" id="again">' + esc(t("again")) + "</button>";
    $("again").onclick = function () { state.sent = false; state.type = null; render(); }; return; }
  var h = infoHtml() + '<h1>' + esc(t("title")) + '</h1><div class="room">' + esc(t("room", state.info.room)) + '</div><div class="grid">';
  ["towels", "cleaning", "amenities", "pillow", "defect", "other"].forEach(function (k) { h += '<button class="opt' + (state.type === k ? " on" : "") + '" data-k="' + k + '"><span class="i">' + ICONS[k] + "</span>" + esc(t(k)) + "</button>"; });
  h += '</div><textarea id="txt" placeholder="' + esc(state.type === "other" ? t("detailsReq") : t("details")) + '"></textarea><input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true" />';
  h += '<button class="send" id="send"' + (state.type && !state.busy ? "" : " disabled") + ">" + esc(t("send")) + "</button>";
  if (state.error) h += '<div class="msg err">' + esc(state.error) + "</div>";
  var keep = $("txt") ? $("txt").value : "";
  a.innerHTML = h; $("txt").value = keep;
  a.querySelectorAll("[data-spa]").forEach(function (b) { b.onclick = function () { state.type = "other"; state.error = null; render(); $("txt").value = t("spaAsk", b.getAttribute("data-spa")); $("txt").focus(); }; });
  a.querySelectorAll(".opt").forEach(function (b) { b.onclick = function () { state.type = b.getAttribute("data-k"); state.error = null; render(); }; });
  $("send").onclick = function () {
    var text = $("txt").value.trim();
    if (state.type === "other" && !text) { state.error = t("detailsReq"); render(); return; }
    state.busy = true; render();
    api("/api/public/room/" + encodeURIComponent(token) + "/request", { method: "POST", body: JSON.stringify({ type: state.type, text: text, lang: lang, website: $("website").value }) })
      .then(function () { state.sent = true; state.error = null; }).catch(function (e) { state.error = e.status === 404 ? t("invalid") : (e.status === 429 || e.status === 400 ? e.message : t("failed")); })
      .then(function () { state.busy = false; render(); });
  };
}
api("/api/public/room/" + encodeURIComponent(token)).then(function (r) {
  state.info = r; $("hotel").textContent = r.hotel.name; document.title = r.hotel.name;
  if (r.hotel.logo_data) { $("logo").src = r.hotel.logo_data; $("logo").hidden = false; }
  if (r.hotel.brand_color) document.documentElement.style.setProperty("--brass", r.hotel.brand_color);
}).catch(function () { state.error = "invalid"; $("hotel").textContent = ""; }).then(function () { render(); loadChat(); });
render();
</script>
