  h2 { font-size: 15px; margin: 18px 0 8px; }

  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
  button.main { background: var(--ink); color: #fff; border: none; border-radius: 10px; padding: 13px 18px; font: inherit; font-weight: 700; width: 100%; min-height: 48px; cursor: pointer; margin-top: 16px; }
  button.main:disabled { opacity: .5; }
  button.sec { background: #fff; color: var(--ink); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font: inherit; min-height: 44px; cursor: pointer; }
  .msg { padding: 14px; border-radius: 10px; font-size: 15px; margin-bottom: 12px; }
  .err { background: #F5E1DE; color: var(--bad); } .ok { background: #E3F0E8; color: var(--good); } .wait { background: #F7EBD3; color: var(--warn); }
  .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .card { background: #fff; border: 2px solid var(--brass); border-radius: 12px; padding: 26px 18px; text-align: center; margin: 12px 0; }
  .card .v { font-family: Georgia, serif; font-size: 38px; font-weight: 700; margin: 8px 0; }
  .card .code { font-family: monospace; font-size: 22px; font-weight: 700; letter-spacing: .12em; }
  .card .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  footer { margin-top: 26px; font-size: 11.5px; color: var(--muted); text-align: center; }
  @media print { header select, footer, .noprint { display: none !important; } body { background: #fff; } }
</style>

    var p = state.paid, h = "<h1>" + esc(i.title || t("title")) + "</h1>";
    if (!p) h += '<div class="sub">' + esc(t("checking")) + "</div>";
    else if (p.status === "aktiv") h += '<div class="msg ok" role="status">' + esc(t("paid")) + "</div>" + (p.view ? '<a class="main" style="display:block;text-align:center;text-decoration:none;padding:13px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700" href="?v=' + esc(p.view) + '">' + esc(t("show")) + "</a>" : "");
    else h += '<div class="msg wait" role="status">' + esc(t("pending")) + "</div>";
    a.innerHTML = h; return;
  }
  var h = "<h1>" + esc(i.title || t("title")) + "</h1>";
  if (i.text) h += '<div class="sub">' + esc(i.text) + "</div>";
  if (aborted) h += '<div class="msg wait" role="status">' + esc(t("aborted")) + "</div>";
  if (state.error) h += '<div class="msg err" role="alert">' + esc(state.error) + "</div>";
  h += "<h2>" + esc(t("amount")) + '</h2><div class="chips" role="group" aria-label="' + esc(t("amount")) + '">' + i.presets.map(function (p) { return '<button type="button" class="chip" data-amt="' + p + '" aria-pressed="' + (state.amount === p) + '">' + esc(money(p, i.currency)) + "</button>"; }).join("") + "</div>";
  if (i.custom) h += '<label class="f" for="custom">' + esc(t("custom")) + " (" + esc(t("range", { min: money(i.custom_min, i.currency), max: money(i.custom_max, i.currency) })) + ')</label><input id="custom" inputmode="decimal" value="' + esc(state.custom) + '" />';
  h += '<form id="frm" novalidate>'
    + '<label class="f" for="buyer">' + esc(t("buyer")) + ' *</label><input id="buyer" autocomplete="name" maxlength="120" value="' + esc(f.buyer_name) + '" />'
    + '<label class="f" for="email">' + esc(t("email")) + ' *</label><input id="email" type="email" autocomplete="email" maxlength="200" value="' + esc(f.buyer_email) + '" aria-describedby="emailNote" /><div class="note" id="emailNote">' + esc(t("emailNote")) + "</div>"
    + '<label class="f" for="recipient">' + esc(t("recipient")) + '</label><input id="recipient" maxlength="120" value="' + esc(f.recipient_name) + '" />'
    + '<label class="f" for="message">' + esc(t("message")) + '</label><textarea id="message" rows="3" maxlength="500">' + esc(f.message) + "</textarea>"
    + '<div class="hp" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off" /></div>'
    + '<div class="note">' + esc(i.valid_years ? t("valid", { years: i.valid_years }) : t("validNone")) + "</div>"
    + '<button class="main" type="submit"' + (state.busy ? " disabled" : "") + ">" + esc(state.busy ? t("paying") : t("pay")) + "</button>"
    + '<div class="note">' + esc(t("secure")) + "</div></form>";
  a.innerHTML = h; bind();
}
function readForm() {
  if (!$("buyer")) return;
  var f = state.form; f.buyer_name = $("buyer").value; f.buyer_email = $("email").value; f.recipient_name = $("recipient").value; f.message = $("message").value;
  if ($("custom")) state.custom = $("custom").value;
}
function bind() {
  Array.prototype.forEach.call(document.querySelectorAll("[data-amt]"), function (b) { b.onclick = function () { readForm(); state.amount = Number(b.getAttribute("data-amt")); state.custom = ""; render(); }; });
  var c = $("custom"); if (c) c.oninput = function () { state.custom = this.value; if (this.value) { state.amount = null; Array.prototype.forEach.call(document.querySelectorAll("[data-amt]"), function (b) { b.setAttribute("aria-pressed", "false"); }); } };
  $("frm").onsubmit = function (e) {
    e.preventDefault(); readForm();
    var f = state.form, amt = state.custom ? parseAmount(state.custom) : state.amount;
    if (!amt) { state.error = t("choose"); render(); return; }
    if (!f.buyer_name.trim()) { state.error = t("buyer") + " *"; render(); $("buyer").focus(); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.buyer_email.trim())) { state.error = t("email") + " *"; render(); $("email").focus(); return; }
    state.busy = true; state.error = null; render();
    if (demo) { setTimeout(function () { state.busy = false; sid = "demo"; state.paid = { status: "aktiv", view: "" }; render(); }, 600); return; }
    call("POST", "/api/public/vouchers/" + encodeURIComponent(token), { amount: amt, buyer_name: f.buyer_name, buyer_email: f.buyer_email.trim(), recipient_name: f.recipient_name, message: f.message, lang: lang, website: $("website") ? $("website").value : "" })
      .then(function (r) { if (r.url && /^https:\/\/[^\s"<>]+$/.test(r.url)) location.href = r.url; else { state.busy = false; state.error = t("error"); render(); } })
      .catch(function (e) { state.busy = false; state.error = e.message || t("error"); render(); });
  };
}
function renderView(a) {
  var v = state.v;
  if (state.error && !v) { a.innerHTML = '<div class="msg err" role="alert">' + esc(state.error) + "</div>"; return; }
  if (!v) { a.innerHTML = '<div class="sub">' + esc(t("loading")) + "</div>"; return; }
  var h = "";
  if (v.status !== "aktiv") h += '<div class="msg wait noprint" role="status">' + esc(t("status_" + v.status)) + "</div>";
  h += '<div class="card"><div class="l">' + esc(v.title || t("voucher")) + " · " + esc(t("worth")) + '</div><div class="v">' + esc(money(v.amount, v.currency)) + "</div>"
    + (v.recipient_name ? "<div>" + esc(t("for")) + " <b>" + esc(v.recipient_name) + "</b></div>" : "")
    + (v.message ? '<div style="font-style:italic;margin-top:12px;white-space:pre-wrap">„' + esc(v.message) + "“</div>" : "")
    + '<div class="l" style="margin-top:20px">' + esc(t("code")) + '</div><div class="code">' + esc(v.code) + "</div>"
    + '<div class="note">' + esc(v.valid_until ? t("until", { date: fmtDate(v.valid_until) }) : t("validNone")) + "</div>"
    + (Number(v.remaining) !== Number(v.amount) ? '<div class="note">' + esc(t("rest")) + ": " + esc(money(v.remaining, v.currency)) + "</div>" : "") + "</div>";
  if (v.text) h += '<div class="sub">' + esc(v.text) + "</div>";
  h += '<div class="note">' + esc(t("redeem")) + "</div>";
  h += '<button class="sec noprint" type="button" id="print" style="margin-top:14px;width:100%">' + esc(t("print")) + "</button>";
  a.innerHTML = h; $("print").onclick = function () { window.print(); };
}
render();
if (view) {
  if (!TOK.test(view)) { state.error = t("invalid"); render(); }
  else call("GET", "/api/public/voucher/" + encodeURIComponent(view)).then(function (v) { state.v = v; brand(v.hotel || {}); render(); }).catch(function (e) { state.error = e.message; render(); });
} else if (!demo && !TOK.test(token)) { state.error = t("invalid"); render(); }
else {
  var p = demo ? Promise.resolve(DEMO) : call("GET", "/api/public/vouchers/" + encodeURIComponent(token));
  p.then(function (i) {
    state.info = i; brand(i.hotel || {}); render();
    if (sid && !demo) {
      var tries = 0;
      (function check() {
        call("GET", "/api/public/vouchers/" + encodeURIComponent(token) + "/session/" + encodeURIComponent(sid)).then(function (r) {
          state.paid = r; render();
          if (r.status === "ausstehend" && ++tries < 5) setTimeout(check, 3000);
        }).catch(function (e) { state.paid = { status: "ausstehend" }; state.error = e.message; render(); });
      })();
    }
  }).catch(function (e) { state.error = e.message || t("error"); render(); });
}
</script>
</body>
</html>
