  );
}

// Dienstplan als Bild zeichnen (zum Teilen per WhatsApp & Co.) – alle Abteilungen, eine Woche
function drawRosterImage({hotelName, weekLabel, days, groups}){
  const scale = 2, colName = 190, colDay = 132, rowH = 38, headH = 92, deptH = 34, pad = 24;
  const width = pad*2 + colName + colDay*7;
  const rowsTotal = groups.reduce((n,g)=>n + Math.max(1, g.rows.length), 0);
  const height = headH + groups.length*deptH + rowsTotal*rowH + pad + 30;
  const c = document.createElement("canvas");
  c.width = width*scale; c.height = height*scale;
  const x = c.getContext("2d"); x.scale(scale, scale);
  const rtl = document.documentElement.dir === "rtl";
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,width,height);
  const font = (w, size) => w+" "+size+"px Inter, 'Segoe UI', 'Noto Sans', 'Hiragino Sans', 'Microsoft YaHei', Arial, sans-serif";
  const text = (t, px, py, opts={}) => {
    x.font = font(opts.weight||"400", opts.size||13); x.fillStyle = opts.color||"#1C2430";
    x.textAlign = opts.align||"left"; x.direction = rtl ? "rtl" : "ltr";
    let s = String(t||""); const max = opts.max;
    if(max){ while(s.length>1 && x.measureText(s).width>max) s = s.slice(0,-1); if(s!==String(t||"")) s = s.slice(0,-1)+"…"; }
    x.fillText(s, px, py);
  };
  // Kopf
  x.fillStyle = "#1C2430"; x.fillRect(0,0,width,headH-22);
  text("Ouverture · " + hotelName, pad, 34, {weight:"600", size:20, color:"#FFFFFF", max: width-pad*2});
  text(tf("Dienstplan") + " · " + weekLabel, pad, 58, {size:14, color:"#C9A66B"});
  // Tage
  days.forEach((d,i)=>text(fmtDay(d), pad+colName+i*colDay+6, headH-6, {weight:"600", size:12, color:"#6B7280"}));
  let y = headH;
  for(const g of groups){
    x.fillStyle = "#F1E8D8"; x.fillRect(pad, y, width-pad*2, deptH);
    text(translateString(g.dept), pad+8, y+22, {weight:"700", size:14});
    y += deptH;
    const rows = g.rows.length ? g.rows : [{name:"—", empty:true}];
    rows.forEach((r,ri)=>{
      if(ri%2===1){ x.fillStyle = "#FAF8F4"; x.fillRect(pad, y, width-pad*2, rowH); }
      text(r.name, pad+8, y+24, {weight:"500", size:13, max: colName-14});
      days.forEach((d,i)=>{
        const list = r.empty ? [] : g.shiftsFor(r, d);
        list.slice(0,2).forEach((s,si)=>{
          const st = SHIFT_STYLE[s.kind] || SHIFT_STYLE["Frei"];
          const bx = pad+colName+i*colDay+4, by = y+4+si*16, bw = colDay-8, bh = list.length>1 ? 15 : rowH-8;
          x.fillStyle = st.bg; x.fillRect(bx, by, bw, bh);
          const label = translateString(s.kind) + (s.start_time ? " " + shiftTimes(s) : "");
          text(label, bx+5, by + (list.length>1 ? 11.5 : 19), {weight:"600", size: list.length>1 ? 10 : 11.5, color: st.fg, max: bw-8});
        });
      });
      x.strokeStyle = "#E4DFD3"; x.beginPath(); x.moveTo(pad, y+rowH); x.lineTo(width-pad, y+rowH); x.stroke();
      y += rowH;
    });
  }
  text(tf("Erstellt mit Ouverture") + " · " + new Date().toLocaleDateString(UI_LOCALE), pad, height-12, {size:11, color:"#6B7280"});
  return c;
}

function RosterView({hotel, api, me, members, role, myDepts, orgId}){
  const isAdmin = role==="admin";
  const canManage = isAdmin || role==="manager";
  const visibleDepts = (role==="admin" || role==="manager" || role==="viewer") ? DEPARTMENTS
    : DEPARTMENTS.filter(d=>myDepts.includes(d)).concat(myDepts.filter(d=>!DEPARTMENTS.includes(d)));
  // "" = alle sichtbaren Abteilungen auf einen Blick
  const [dept,setDeptState] = useState(()=>{
    try { const saved = window.localStorage.getItem("hpoos_roster_dept"); if(saved !== null && (saved==="" || visibleDepts.includes(saved))) return saved; } catch(e){}
    return "";
  });
  const setDept = (d) => { setDeptState(d); setEditor(null); try { window.localStorage.setItem("hpoos_roster_dept", d); } catch(e){} };
  const [week,setWeek] = useState(()=>mondayOfIso(todayIso()));
  const [shifts,setShifts] = useState([]);
  const [mins,setMins] = useState([]);
  const [requests,setRequests] = useState([]);
  const [myShifts,setMyShifts] = useState([]);
  const [msg,setMsg] = useState(null);
  const [editor,setEditor] = useState(null);
  const [extraNames,setExtraNames] = useState([]); // [{dept, name}]
  const [newName,setNewName] = useState("");
  const [newNameDept,setNewNameDept] = useState(visibleDepts[0] || "");
  const [minDept,setMinDept] = useState(visibleDepts[0] || "");
  const [sharing,setSharing] = useState(false);
  const days = Array.from({length:7}, (_,i)=>addDaysIso(week,i));
  const base = "/api/hotels/"+hotel.id;
  const today = todayIso();
  const shownDepts = dept ? [dept] : visibleDepts;

  const load = useCallback(async () => {
    try {
      const [s,m,r,my] = await Promise.all([
        visibleDepts.length ? api(base+"/shifts?from="+week+"&to="+addDaysIso(week,6)+(dept ? "&department="+encodeURIComponent(dept) : "")) : Promise.resolve([]),
        api(base+"/shift-minimums"),
        api(base+"/shift-requests"),
        api("/api/organizations/"+orgId+"/my-shifts"),
      ]);
      setShifts(s); setMins(m); setRequests(r); setMyShifts(my);
    } catch(e){ setMsg({ok:false, text:e.message}); }
  }, [api, base, dept, week, orgId]);
  useEffect(()=>{ load(); }, [load]);

  const run = async (fn, okText) => {
    setMsg(null);
    try { const out = await fn(); if(okText) setMsg({ok:true, text:tf(okText)}); await load(); return out; }
    catch(e){ setMsg({ok:false, text:e.message}); }
  };

  // Zeilen je Abteilung: zugeordnete Teammitglieder, Personen mit Schichten, neu eingetragene Namen
  const rowsFor = (d) => {
    const rows = []; const seen = new Set();
    const add = (key, row) => { if(!seen.has(key)){ seen.add(key); rows.push({key: d+"|"+key, dept: d, ...row}); } };
    members.filter(m=>m.role!=="viewer" && (m.departments||[]).includes(d))
      .forEach(m=>add("u:"+m.user_id, {user_id:m.user_id, name:shortName(m.email), title:m.email}));
    shifts.filter(s=>s.department===d).forEach(s=>{
      if(s.user_id){ const m = members.find(x=>x.user_id===s.user_id); add("u:"+s.user_id, {user_id:s.user_id, name:m ? shortName(m.email) : tf("Teammitglied"), title:m ? m.email : ""}); }
      else add("n:"+(s.employee_name||"").toLowerCase(), {user_id:null, name:s.employee_name, title:""});
    });
    extraNames.filter(e=>e.dept===d).forEach(e=>add("n:"+e.name.toLowerCase(), {user_id:null, name:e.name, title:""}));
    return rows;
  };
  const shiftsFor = (row, date) => shifts.filter(s=>s.shift_date===date && s.department===row.dept &&
    (row.user_id ? s.user_id===row.user_id : (!s.user_id && (s.employee_name||"").toLowerCase()===row.name.toLowerCase())));
  const groups = shownDepts.map(d=>({dept:d, rows:rowsFor(d), shiftsFor}));

  // Besetzung und Unterbesetzung je Abteilung
  const minFor = (d, kind) => { const m = mins.find(x=>x.department===d && x.kind===kind); return m ? m.min_count : 0; };
  const count = (d, date, kind) => shifts.filter(s=>s.department===d && s.shift_date===date && s.kind===kind).length;
  const gaps = [];
  shownDepts.forEach(d=>days.forEach(day=>WORK_KINDS.forEach(k=>{ const need = minFor(d,k); const have = count(d,day,k); if(need>0 && have<need) gaps.push({d,day,k,have,need}); })));

  // Bearbeiten
  const openNew = (row, date) => setEditor({row, date, id:null, kind:"Früh", start_time:SHIFT_TIMES["Früh"][0], end_time:SHIFT_TIMES["Früh"][1], note:""});
  const openEdit = (row, s) => setEditor({row, date:s.shift_date, id:s.id, kind:s.kind,
    start_time:(s.start_time||"").slice(0,5), end_time:(s.end_time||"").slice(0,5), note:s.note||""});
  const setKind = (k) => setEditor(e=>({...e, kind:k, start_time:SHIFT_TIMES[k] ? SHIFT_TIMES[k][0] : "", end_time:SHIFT_TIMES[k] ? SHIFT_TIMES[k][1] : ""}));
  const saveShift = () => run(async () => {
    const work = WORK_KINDS.includes(editor.kind);
    const body = {department:editor.row.dept, shift_date:editor.date, kind:editor.kind,
      start_time:work ? editor.start_time : null, end_time:work ? editor.end_time : null, note:editor.note,
      user_id:editor.row.user_id || null, employee_name:editor.row.user_id ? null : editor.row.name};
    if(editor.id) await api("/api/shifts/"+editor.id, "PATCH", body); else await api(base+"/shifts", "POST", body);
    setEditor(null);
  });
  const deleteShift = () => run(async () => { await api("/api/shifts/"+editor.id, "DELETE"); setEditor(null); });
  const copyPrev = () => {
    if(!window.confirm(tf("Arbeitsschichten der Vorwoche in diese Woche übernehmen? Bereits belegte Tage bleiben unverändert."))) return;
    run(async () => {
      let created = 0;
      for(const d of shownDepts){ const r = await api(base+"/shifts/copy-week", "POST", {department:d, from:addDaysIso(week,-7), to:week}); created += r.created || 0; }
      setMsg({ok:true, text:tf("Übernommene Schichten: {0}", created)});
    });
  };
  const saveMin = (d, kind, value) => {
    const v = Math.max(0, Math.min(200, parseInt(value,10) || 0));
    if(v===minFor(d, kind)) return;
    run(()=>api(base+"/shift-minimums", "PUT", {department:d, kind, min_count:v}));
  };
  const addName = () => {
    const n = newName.trim(); if(!n) return;
    const d = dept || newNameDept;
    setExtraNames([...extraNames, {dept:d, name:n}]); setNewName("");
  };

  const weekLabel = tf("KW {0}", isoWeekNumber(week)) + " · " + fmtDay(week,{day:"2-digit",month:"2-digit"}) + " – " + fmtDay(days[6],{day:"2-digit",month:"2-digit",year:"numeric"});

  // Als Bild teilen: Handy -> Teilen-Menü (WhatsApp, Signal, Mail …); Computer -> Bild speichern
  const shareImage = async () => {
    setSharing(true); setMsg(null);
    try {
      const filled = groups.filter(g=>g.rows.length);
      const canvas = drawRosterImage({hotelName: hotel.name, weekLabel, days, groups: filled.length ? filled : groups});
      const blob = await new Promise(r=>canvas.toBlob(r, "image/png"));
      const name = (tf("Dienstplan")+" "+hotel.name+" "+week).replace(/[\\/:*?"<>|]+/g,"") + ".png";
      const file = new File([blob], name, {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: tf("Dienstplan") + " · " + weekLabel});
      } else {
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
        setMsg({ok:true, text:tf("Bild gespeichert. Du kannst es jetzt in WhatsApp oder per E-Mail verschicken.")});
      }
    } catch(e){ if(e && e.name!=="AbortError") setMsg({ok:false, text:e.message}); }
    setSharing(false);
  };

  const exportXlsx = async () => {
    try {
      const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
      const cell = (list) => list.map(s=>translateString(s.kind)+(s.start_time ? " "+shiftTimes(s) : "")).join(", ");
      const data = [[tf("Abteilung"), tf("Name"), ...days.map(d=>fmtDay(d))]];
      groups.forEach(g=>g.rows.forEach(r=>data.push([translateString(g.dept), r.title || r.name, ...days.map(d=>cell(shiftsFor(r,d)))])));
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws["!cols"] = [{wch:22}, {wch:26}, ...days.map(()=>({wch:18}))];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, tf("Dienstplan").slice(0,31));
      XLSX.writeFile(wb, (tf("Dienstplan")+" "+hotel.name+" "+week).replace(/[\\/:*?"<>|]+/g,"")+".xlsx");
    } catch(e){ setMsg({ok:false, text:tf("Export fehlgeschlagen: {0}", e.message)}); }
  };

  // Anträge
  const requestDept = myDepts[0] || (dept || visibleDepts[0] || "");
  const emptyReq = {kind:"Urlaub", date_from:"", date_to:"", shift_id:"", swap_with:"", note:""};
  const [req,setReq] = useState(emptyReq);
  const myUpcoming = myShifts.filter(s=>s.hotel_id===hotel.id && WORK_KINDS.includes(s.kind));
  const swapShift = myUpcoming.find(s=>s.id===req.shift_id);
  const swapDept = swapShift ? swapShift.department : requestDept;
  const colleagues = members.filter(m=>m.role!=="viewer" && (!me || m.user_id!==me.id) && ((m.departments||[]).includes(swapDept) || m.role==="admin" || m.role==="manager"));
  const submitReq = () => run(async () => {
    await api(base+"/shift-requests", "POST", {...req, department:requestDept, date_to:req.date_to || req.date_from});
    setReq(emptyReq);
  }, "Antrag gestellt. Die Abteilungsleitung entscheidet darüber.");
  const decide = (r, approve) => {
    let note = "";
    if(!approve){ note = window.prompt(tf("Begründung für die Ablehnung (optional)")); if(note===null) return; }
    run(()=>api("/api/shift-requests/"+r.id+"/decide", "POST", {approve, note}), approve ? "Antrag genehmigt." : "Antrag abgelehnt.");
  };
  const withdraw = (r) => run(()=>api("/api/shift-requests/"+r.id+"/withdraw", "POST", {}), "Antrag zurückgezogen.");
  const nameOf = (uid) => { if(me && uid===me.id) return null; const m = members.find(x=>x.user_id===uid); return m ? shortName(m.email) : tf("Teammitglied"); };
  const toDecide = requests.filter(r=>r.status==="Offen" && (!me || r.user_id!==me.id) && canManageDept(r.department));
  const mine = me ? requests.filter(r=>r.user_id===me.id).slice(0,12) : [];
  const forMe = me ? requests.filter(r=>r.swap_with===me.id && r.status==="Offen") : [];

  const RequestLine = ({r, actions}) => {
    const st = REQUEST_STATUS_STYLE[r.status] || REQUEST_STATUS_STYLE["Offen"];
    const sh = r.kind==="Tausch" && shifts.concat(myShifts).find(s=>s.id===r.shift_id);
    return (
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",padding:"9px 0",borderTop:`1px solid ${BORDER}`,fontSize:13.5}}>
        <div style={{flex:"1 1 260px",minWidth:0}}>
          {nameOf(r.user_id) && <b data-no-i18n="" style={{marginInlineEnd:6}}>{nameOf(r.user_id)}</b>}
          <span>{r.kind==="Tausch" ? "Schichttausch" : r.kind}</span>
          <span style={{color:INK_MUTED}}> · </span>
          <bdi data-no-i18n="">{fmtDay(r.date_from)}{r.date_to!==r.date_from ? " – "+fmtDay(r.date_to) : ""}</bdi>
          {sh && <span style={{color:INK_MUTED}}> · <span>{sh.kind}</span> <bdi data-no-i18n="" dir="ltr">{shiftTimes(sh)}</bdi></span>}
          {r.kind==="Tausch" && r.swap_with && <span style={{color:INK_MUTED}}> → <span data-no-i18n="">{nameOf(r.swap_with) || translateString("Du")}</span></span>}
          <span style={{color:INK_MUTED}}> · <span>{r.department}</span></span>
          {r.note && <div style={{fontSize:12.5,color:INK_MUTED}} data-no-i18n="">„{r.note}“</div>}
          {r.decision_note && <div style={{fontSize:12.5,color:INK_MUTED}}><span>Antwort:</span> <span data-no-i18n="">{r.decision_note}</span></div>}
        </div>
        <Pill color={st.color} bg={st.bg}>{r.status}</Pill>
        {actions}
      </div>
    );
  };

  const navBtn = {background:"none",border:`1px solid ${BORDER}`,borderRadius:4,padding:"6px 10px",fontSize:13,cursor:"pointer"};
  const rtl = document.documentElement.dir==="rtl";
  const upcomingMine = myShifts.slice(0,14);

  return (
    <div>
      {msg && <div className="no-print" style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:12}}>{msg.text}</div>}

      {role!=="viewer" && upcomingMine.length>0 && (
        <Card className="no-print" style={{marginBottom:18}}>
          <div style={{fontWeight:700,marginBottom:8}}>Meine Schichten</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(150px, 1fr))",gap:8}}>
            {upcomingMine.map(s=>(
              <div key={s.id} style={{border:`1px solid ${s.shift_date===today?BRASS:BORDER}`,borderRadius:6,padding:"8px 10px"}}>
                <div style={{fontSize:12,color:INK_MUTED}} data-no-i18n="">{fmtDay(s.shift_date)}</div>
                <ShiftChip s={s} />
                <div style={{fontSize:11.5,color:INK_MUTED}}>{s.department}</div>
              </div>
            ))}
          </div>
        </Card>
      )}

      {visibleDepts.length===0 ? (
        <Card style={{marginBottom:18}}><div style={{color:INK_MUTED,fontSize:13.5}}>Dir ist noch keine Abteilung zugeordnet. Ein Admin kann das unter „Team“ ändern – dann siehst du hier den Dienstplan deiner Abteilung.</div></Card>
      ) : (
      <Card style={{marginBottom:18,padding:0}}>
        <div className="no-print" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",padding:"14px 16px"}}>
          <select className="input" style={{width:"auto",minWidth:190}} value={dept} onChange={e=>setDept(e.target.value)}>
            <option value="">{tf("Alle Abteilungen")}</option>
            {visibleDepts.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
          <button style={navBtn} onClick={()=>{ setWeek(addDaysIso(week,-7)); setEditor(null); }} aria-label="Vorige Woche">{rtl ? "›" : "‹"}</button>
          <div style={{fontSize:13.5,fontWeight:600,minWidth:150,textAlign:"center"}} data-no-i18n="">{weekLabel}</div>
          <button style={navBtn} onClick={()=>{ setWeek(addDaysIso(week,7)); setEditor(null); }} aria-label="Nächste Woche">{rtl ? "‹" : "›"}</button>
          <button style={navBtn} onClick={()=>{ setWeek(mondayOfIso(today)); setEditor(null); }}>Heute</button>
          <span style={{flex:1}}></span>
          <button className="btn-primary" onClick={shareImage} disabled={sharing} title={tf("Auf dem Handy direkt an WhatsApp & Co. – am Computer wird das Bild gespeichert.")}>
            {sharing ? "…" : tf("Als Bild teilen")}
          </button>
          {canManage && <button style={navBtn} onClick={copyPrev}>Vorwoche übernehmen</button>}
          <button style={navBtn} onClick={()=>window.print()}>Drucken</button>
          <button style={navBtn} onClick={exportXlsx}>Excel</button>
        </div>
        <div style={{padding:"0 16px 6px",fontFamily:"Fraunces, serif",fontSize:16,fontWeight:600}}>
          <span>Dienstplan</span> · <span data-no-i18n="">{hotel.name}</span> · <span data-no-i18n="">{weekLabel}</span>
        </div>

        {gaps.length>0 && (
          <div style={{margin:"6px 16px 10px",border:`1px solid ${BAD}`,background:BAD_SOFT,borderRadius:6,padding:"8px 12px",fontSize:13}}>
            <b>Unterbesetzt:</b>
            {shownDepts.filter(d=>gaps.some(g=>g.d===d)).map(d=>(
              <div key={d} style={{marginTop:2}}>
                <b>{translateString(d)}</b>{" – "}
                {days.filter(day=>gaps.some(g=>g.d===d && g.day===day)).map((day,i)=>(
                  <React.Fragment key={day}>{i>0 && " · "}<bdi data-no-i18n="">{fmtDay(day)}</bdi>{": "}
                    {gaps.filter(g=>g.d===d && g.day===day).map((g,j)=>(
                      <React.Fragment key={g.k}>{j>0 && ", "}<span>{g.k}</span> <bdi data-no-i18n="" dir="ltr">{g.have}/{g.need}</bdi></React.Fragment>
                    ))}
                  </React.Fragment>
                ))}
              </div>
            ))}
          </div>
        )}

        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",minWidth:860,borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr>
                <th style={{textAlign:"start",padding:"8px 12px",fontSize:12,color:INK_MUTED,fontWeight:600,borderTop:`1px solid ${BORDER}`,minWidth:150}}>Name</th>
                {days.map(d=>(
                  <th key={d} style={{textAlign:"start",padding:"8px 6px",fontSize:12,fontWeight:600,borderTop:`1px solid ${BORDER}`,
                    color:d===today?BRASS:INK_MUTED,background:d===today?BRASS_SOFT:"transparent"}} data-no-i18n="">{fmtDay(d)}</th>
                ))}
              </tr>
            </thead>
            {groups.map(g=>(
              <tbody key={g.dept}>
                <tr style={{background:"#F1E8D8"}}>
                  <td colSpan={8} style={{padding:"7px 12px",fontWeight:700,fontSize:13}}>
                    <span>{g.dept}</span> <span style={{fontWeight:400,color:INK_MUTED}} data-no-i18n="">· {g.rows.length}</span>
                  </td>
                </tr>
                {g.rows.length===0 && (
                  <tr><td colSpan={8} style={{padding:"10px 12px",color:INK_MUTED,borderTop:`1px solid ${BORDER}`}}>
                    {tf("Noch niemand in dieser Abteilung. Ordne unter „Team“ Mitarbeitende zu oder trage unten einen Namen ein.")}
                  </td></tr>
                )}
                {g.rows.map(r=>(
                  <tr key={r.key} style={{borderTop:`1px solid ${BORDER}`}}>
                    <td style={{padding:"8px 12px",verticalAlign:"top",whiteSpace:"nowrap"}} title={r.title}>
                      <span data-no-i18n="" style={{fontWeight:me && r.user_id===me.id ? 700 : 500}}>{r.name}</span>
                      {!r.user_id && <div style={{fontSize:11,color:INK_MUTED}}>ohne Login</div>}
                    </td>
                    {days.map(d=>{
                      const list = shiftsFor(r,d);
                      const active = editor && editor.row.key===r.key && editor.date===d;
                      return (
                        <td key={d} style={{padding:"6px 4px",verticalAlign:"top",minWidth:96,background:active?BRASS_SOFT:(d===today?"#FBF8F2":"transparent")}}>
                          {list.map(s=><ShiftChip key={s.id} s={s} onClick={canManage ? ()=>openEdit(r,s) : null} />)}
                          {canManage && list.length===0 && (
                            <button className="no-print" onClick={()=>openNew(r,d)} title="Schicht eintragen"
                              style={{width:"100%",border:`1px dashed ${BORDER}`,background:"none",color:INK_MUTED,borderRadius:4,padding:"4px 0",fontSize:13,cursor:"pointer"}}>+</button>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
                {(WORK_KINDS.some(k=>minFor(g.dept,k)>0) || shifts.some(s=>s.department===g.dept)) && (
                  <tr style={{borderTop:`1px solid ${BORDER}`,background:PAPER}}>
                    <td style={{padding:"6px 12px",fontSize:11.5,color:INK_MUTED,fontWeight:600,verticalAlign:"top"}}>Besetzung</td>
                    {days.map(d=>(
                      <td key={d} style={{padding:"4px 6px",fontSize:11,verticalAlign:"top"}}>
                        {WORK_KINDS.map(k=>{
                          const have = count(g.dept,d,k), need = minFor(g.dept,k);
                          if(!have && !need) return null;
                          return <div key={k} style={{color:need && have<need ? BAD : INK_MUTED,fontWeight:need && have<need ? 700 : 400}}>
                            <span>{k}</span> <bdi data-no-i18n="" dir="ltr">{have}{need ? "/"+need : ""}</bdi>
                          </div>;
                        })}
                      </td>
                    ))}
                  </tr>
                )}
              </tbody>
            ))}
          </table>
        </div>

        {canManage && (
          <div className="no-print" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",padding:"12px 16px",borderTop:`1px solid ${BORDER}`}}>
            <input className="input" style={{maxWidth:240}} placeholder="Name ohne Login (z. B. Aushilfe)" value={newName}
              onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter" && addName()} />
            {!dept && (
              <select className="input" style={{width:"auto"}} value={newNameDept} onChange={e=>setNewNameDept(e.target.value)}>
                {visibleDepts.map(d=><option key={d} value={d}>{d}</option>)}
              </select>
            )}
            <button style={navBtn} onClick={addName}>Zeile hinzufügen</button>
          </div>
        )}
      </Card>
      )}

      {editor && canManage && (
        <Card style={{marginBottom:18,borderColor:BRASS}}>
          <div style={{fontWeight:700,marginBottom:10}}>
            <span>{editor.id ? "Schicht bearbeiten" : "Schicht eintragen"}</span>{" · "}
            <span data-no-i18n="">{editor.row.name}</span>{" · "}<span>{editor.row.dept}</span>{" · "}
            <span data-no-i18n="">{fmtDay(editor.date,{weekday:"long",day:"2-digit",month:"long"})}</span>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
            {SHIFT_KINDS.map(k=>{
              const st = SHIFT_STYLE[k]; const on = editor.kind===k;
              return <button key={k} onClick={()=>setKind(k)}
                style={{border:`1px solid ${on?st.fg:BORDER}`,background:on?st.bg:"#fff",color:on?st.fg:INK,fontWeight:on?700:400,borderRadius:999,padding:"5px 12px",fontSize:12.5,cursor:"pointer"}}>{k}</button>;
            })}
          </div>
          <div className="stack" style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
            {WORK_KINDS.includes(editor.kind) && (
              <React.Fragment>
                <label><div className="field-label">Beginn</div><input type="time" className="input" style={{width:130}} value={editor.start_time} onChange={e=>setEditor({...editor,start_time:e.target.value})} /></label>
                <label><div className="field-label">Ende</div><input type="time" className="input" style={{width:130}} value={editor.end_time} onChange={e=>setEditor({...editor,end_time:e.target.value})} /></label>
              </React.Fragment>
            )}
            <label style={{flex:"1 1 200px"}}><div className="field-label">Notiz</div><input className="input" value={editor.note} onChange={e=>setEditor({...editor,note:e.target.value})} /></label>
            <button className="btn-primary" onClick={saveShift}>Speichern</button>
            {editor.id && <button style={{...linkBtn,color:BAD}} onClick={deleteShift}>Löschen</button>}
            <button style={linkBtn} onClick={()=>setEditor(null)}>Abbrechen</button>
          </div>
        </Card>
      )}

      {canManage && visibleDepts.length>0 && (
        <Card className="no-print" style={{marginBottom:18}}>
          <div style={{fontWeight:700,marginBottom:6}}>Mindestbesetzung</div>
          <div style={{fontSize:12.5,color:INK_MUTED,marginBottom:10}}>Wie viele Personen braucht diese Abteilung je Schicht? Fehlen welche, warnt der Plan.</div>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
            <label><div className="field-label">Abteilung</div>
              <select className="input" style={{width:"auto"}} value={dept || minDept} onChange={e=>setMinDept(e.target.value)} disabled={!!dept}>
                {visibleDepts.map(d=><option key={d} value={d}>{d}</option>)}
              </select>
            </label>
            {WORK_KINDS.map(k=>{ const d = dept || minDept; return (
              <label key={k+d}><div className="field-label">{k}</div>
                <input type="number" min="0" max="200" className="input" style={{width:90}} defaultValue={minFor(d,k)}
                  key={k+d+minFor(d,k)} onBlur={e=>saveMin(d, k, e.target.value)} />
              </label>
            ); })}
          </div>
        </Card>
      )}

      {toDecide.length>0 && (
        <Card className="no-print" style={{marginBottom:18,borderColor:WARN}}>
          <div style={{fontWeight:700,marginBottom:4}}>Anträge zur Entscheidung</div>
          {toDecide.map(r=>(
            <RequestLine key={r.id} r={r} actions={
              <span style={{display:"flex",gap:6}}>
                <button className="btn-primary" style={{padding:"6px 12px",fontSize:12.5}} onClick={()=>decide(r,true)}>Genehmigen</button>
                <button style={{...navBtn,color:BAD}} onClick={()=>decide(r,false)}>Ablehnen</button>
              </span>
            } />
          ))}
        </Card>
      )}

      {forMe.length>0 && (
        <Card className="no-print" style={{marginBottom:18}}>
          <div style={{fontWeight:700,marginBottom:4}}>Schichten, die du übernehmen sollst</div>
          <div style={{fontSize:12.5,color:INK_MUTED}}>Die Abteilungsleitung entscheidet; sprich dich bei Fragen direkt ab.</div>
          {forMe.map(r=><RequestLine key={r.id} r={r} />)}
        </Card>
      )}

      {role!=="viewer" && (myDepts.length>0 || isAdmin || role==="manager") && (
        <Card className="no-print" style={{marginBottom:18}}>
          <div style={{fontWeight:700,marginBottom:10}}>Antrag stellen</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
            {[["Urlaub","Urlaub"],["Frei-Wunsch","Frei-Wunsch"],["Tausch","Schichttausch"]].map(([k,l])=>(
              <button key={k} onClick={()=>setReq({...emptyReq, kind:k})}
                style={{border:`1px solid ${req.kind===k?INK:BORDER}`,background:req.kind===k?INK:"#fff",color:req.kind===k?"#fff":INK,borderRadius:999,padding:"5px 12px",fontSize:12.5,cursor:"pointer"}}>{l}</button>
            ))}
          </div>
          <div className="stack" style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
            {req.kind!=="Tausch" ? (
              <React.Fragment>
                <label><div className="field-label">Von</div><input type="date" className="input" style={{width:160}} value={req.date_from} onChange={e=>setReq({...req,date_from:e.target.value})} /></label>
                <label><div className="field-label">Bis</div><input type="date" className="input" style={{width:160}} value={req.date_to} min={req.date_from} onChange={e=>setReq({...req,date_to:e.target.value})} /></label>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <label style={{flex:"1 1 200px"}}><div className="field-label">Meine Schicht</div>
                  <select className="input" value={req.shift_id} onChange={e=>setReq({...req,shift_id:e.target.value,swap_with:""})}>
                    <option value="">Bitte wählen</option>
                    {myUpcoming.map(s=><option key={s.id} value={s.id} data-no-i18n="">{fmtDay(s.shift_date)} · {translateString(s.kind)} {shiftTimes(s)}</option>)}
                  </select>
                </label>
                <label style={{flex:"1 1 200px"}}><div className="field-label">Übernimmt</div>
                  <select className="input" value={req.swap_with} onChange={e=>setReq({...req,swap_with:e.target.value})}>
                    <option value="">Bitte wählen</option>
                    {colleagues.map(m=><option key={m.user_id} value={m.user_id} data-no-i18n="">{m.email}</option>)}
                  </select>
                </label>
              </React.Fragment>
            )}
            <label style={{flex:"1 1 200px"}}><div className="field-label">Notiz</div><input className="input" value={req.note} onChange={e=>setReq({...req,note:e.target.value})} /></label>
            <button className="btn-primary" onClick={submitReq}
              disabled={req.kind==="Tausch" ? !(req.shift_id && req.swap_with) : !req.date_from}>Antrag stellen</button>
          </div>
          {req.kind==="Tausch" && myUpcoming.length===0 && <div style={{fontSize:12.5,color:INK_MUTED,marginTop:8}}>Du hast in diesem Hotel keine kommenden Schichten, die du tauschen könntest.</div>}
        </Card>
      )}

      {mine.length>0 && (
        <Card className="no-print">
          <div style={{fontWeight:700,marginBottom:4}}>Meine Anträge</div>
          {mine.map(r=>(
            <RequestLine key={r.id} r={r} actions={r.status==="Offen" && <button style={linkBtn} onClick={()=>withdraw(r)}>Zurückziehen</button>} />
          ))}
        </Card>
      )}
    </div>
  );
}

function PasswordCard({config, token}){
  const [pw,setPw] = useState(""); const [pw2,setPw2] = useState("");
  const [msg,setMsg] = useState(null); const [busy,setBusy] = useState(false);
  const save = async () => {
    setMsg(null);
    if(pw.length < 8) return setMsg({ok:false, text:"Das neue Passwort muss mindestens 8 Zeichen haben."});
    if(pw !== pw2) return setMsg({ok:false, text:"Die beiden Passwörter stimmen nicht überein."});
    setBusy(true);
    try {
      await supabaseSetNewPassword(config.supabaseUrl, config.supabaseAnonKey, await freshToken(token), pw);
      setPw(""); setPw2(""); setMsg({ok:true, text:"Passwort geändert."});
    } catch(e){ setMsg({ok:false, text:e.message}); }
    setBusy(false);
  };
  return (
    <Card style={{marginBottom:18,maxWidth:520}}>
      <div style={{fontWeight:700,marginBottom:12}}>Passwort ändern</div>
      <Field label="Neues Passwort"><input type="password" className="input" value={pw} onChange={e=>setPw(e.target.value)} autoComplete="new-password" /></Field>
      <Field label="Neues Passwort wiederholen"><input type="password" className="input" value={pw2} onChange={e=>setPw2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()} autoComplete="new-password" /></Field>
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:10}}>{msg.text}</div>}
      <button className="btn-primary" onClick={save} disabled={busy}>{busy?"Speichert…":"Passwort ändern"}</button>
    </Card>
  );
}

function DeleteAccountCard({api, onDeleted}){
  const [confirm,setConfirm] = useState(""); const [busy,setBusy] = useState(false); const [error,setError] = useState("");
  const WORD = tf("LÖSCHEN");
  const run = async () => {
    setBusy(true); setError("");
    try { await api("/api/me","DELETE",{confirm:true}); onDeleted(); }
    catch(e){ setError(e.message); setBusy(false); }
  };
  return (
    <Card style={{marginBottom:18,maxWidth:520,borderColor:BAD_SOFT}}>
      <div style={{fontWeight:700,marginBottom:6,color:BAD}}>Konto löschen</div>
      <div style={{fontSize:13,color:INK_MUTED,marginBottom:10}}>
        Löscht dein Login und deine Mitgliedschaften. Organisationen, in denen du allein bist, werden mit allen Daten gelöscht (ein laufendes Abo endet sofort).
        In Organisationen mit anderen Mitgliedern bleiben die Daten erhalten. Bist du dort der letzte Admin, gib die Rolle vorher unter „Team“ weiter.
      </div>
      <Field label={"Zur Bestätigung „"+WORD+"“ eingeben"}><input className="input" value={confirm} onChange={e=>setConfirm(e.target.value)} /></Field>
      {error && <div style={{color:BAD,fontSize:13,marginBottom:10}}>{error}</div>}
      <button onClick={run} disabled={busy || confirm.trim().toUpperCase()!==WORD}
        style={{background:confirm.trim().toUpperCase()===WORD?BAD:"#ccc",color:"#fff",border:"none",borderRadius:4,padding:"9px 16px",fontSize:13.5,fontWeight:600,cursor:"pointer"}}>
        {busy ? "Wird gelöscht…" : "Konto endgültig löschen"}
      </button>
    </Card>
  );
}

const ROLE_LABELS = {admin:"Admin", manager:"Abteilungsleitung", member:"Mitarbeitende", viewer:"Eigentümer (nur lesen)"};
const ROLES_WITH_DEPTS = ["manager","member"];

// Abteilungen als Auswahl-Chips
function DeptChips({value, onChange, disabled}){
  const list = value || [];
  return (
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      {DEPARTMENTS.map(d=>{
        const on = list.includes(d);
        return <button key={d} type="button" disabled={disabled} onClick={()=>onChange(on ? list.filter(x=>x!==d) : [...list, d])}
          style={{border:`1px solid ${on?INK:BORDER}`,background:on?INK:"#fff",color:on?"#fff":INK,borderRadius:999,padding:"4px 10px",fontSize:12,cursor:disabled?"default":"pointer"}}>{d}</button>;

function TeamView({orgId, api, inviteLinkBase, orgName, onRenamed, me, orgLanguage, onOrgGone, onLanguageChanged}){
  const [members,setMembers] = useState([]);
  const [invites,setInvites] = useState([]);
  const [email,setEmail] = useState(""); const [role,setRole] = useState("member"); const [inviteDepts,setInviteDepts] = useState([]);
  const [error,setError] = useState(""); const [copiedId,setCopiedId] = useState(null); const [loading,setLoading] = useState(false);
  const [isAdmin,setIsAdmin] = useState(false);

  const load = useCallback(async () => {
    try {
      const [m,r] = await Promise.all([
        api("/api/organizations/"+orgId+"/members"),
        api("/api/organizations/"+orgId+"/my-role"),
      ]);
      setMembers(m); setIsAdmin(r.is_admin);
      // Einladungen sehen und verwalten dürfen nur Admins (erzwingt auch die Datenbank).
      setInvites(r.is_admin ? await api("/api/organizations/"+orgId+"/invites") : []);
    } catch(e){ setError(e.message); }
  }, [api, orgId]);

  useEffect(()=>{ load(); }, [load]);

  const invite = async () => {
    if(!email) return;
    setError(""); setInviteMsg(null); setLoading(true);
    try {
      const inv = await api("/api/invites","POST",{organization_id:orgId, email, role, departments: ROLES_WITH_DEPTS.includes(role) ? inviteDepts : []});
      setInviteMsg(inv.email_sent
        ? {ok:true, text:tf("Einladung per E-Mail an {0} verschickt.", inv.email)}
        : {ok:false, text:"Einladung angelegt, aber keine E-Mail verschickt (E-Mail-Versand nicht eingerichtet). Bitte unten den Link kopieren und weitergeben."});
      setEmail(""); await load();
    }
    catch(e){ setError(e.message); }
    setLoading(false);
  };
  const [inviteMsg,setInviteMsg] = useState(null);

  const revoke = async (id) => { await api("/api/invites/"+id,"DELETE"); await load(); };

  const [teamMsg,setTeamMsg] = useState(null);
  const changeRole = async (m, newRole) => {
    setTeamMsg(null);
    try { await api("/api/organizations/"+orgId+"/members/"+m.user_id, "PATCH", {role:newRole}); await load(); setTeamMsg({ok:true, text:tf("{0} ist jetzt {1}.", m.email, translateString(ROLE_LABELS[newRole]))}); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); }
  };
  const changeDepts = async (m, list) => {
    setTeamMsg(null);
    setMembers(ms=>ms.map(x=>x.user_id===m.user_id ? {...x, departments:list} : x));
    try { await api("/api/organizations/"+orgId+"/members/"+m.user_id, "PATCH", {departments:list}); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); await load(); }
  };
  const removeMember = async (m) => {
    if(!window.confirm(tf("{0} aus der Organisation entfernen? Die Person verliert sofort den Zugriff; ihre Aufgaben bleiben erhalten, aber ohne Zuständigkeit.", m.email))) return;
    setTeamMsg(null);
    try { await api("/api/organizations/"+orgId+"/members/"+m.user_id, "DELETE"); await load(); setTeamMsg({ok:true, text:tf("{0} wurde entfernt.", m.email)}); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); }
  };
  const leave = async () => {
    if(!window.confirm(tf("„{0}“ wirklich verlassen? Du verlierst den Zugriff, bis dich ein Admin wieder einlädt.", orgName))) return;
    try { await api("/api/organizations/"+orgId+"/members/"+me.id, "DELETE"); onOrgGone(); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); }
  };
  const [confirmName,setConfirmName] = useState("");
  const [deleting,setDeleting] = useState(false);
  const deleteOrg = async () => {
    setDeleting(true); setTeamMsg(null);
    try { await api("/api/organizations/"+orgId, "DELETE", {confirm:true}); onOrgGone(); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); setDeleting(false); }
  };
  const setLanguage = async (lang) => {
    setTeamMsg(null);
    try { await api("/api/organizations/"+orgId, "PATCH", {language:lang}); onLanguageChanged(lang); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); }
  };

  const [shownLinkId,setShownLinkId] = useState(null);
  const linkFor = (invite) => inviteLinkBase + "?invite=" + invite.token;
  const copyLink = (invite) => {
    // Link immer auch sichtbar anzeigen – manche Browser blockieren die Zwischenablage.
    setShownLinkId(invite.id);
    try {
      navigator.clipboard.writeText(linkFor(invite))
        .then(()=>{ setCopiedId(invite.id); setTimeout(()=>setCopiedId(null),1800); })
        .catch(()=>{});
    } catch(e){}
  };

  return (
    <div>
      {!isAdmin && error && <div style={{color:BAD,fontSize:13,marginBottom:14}}>{error}</div>}
      {isAdmin && <OrgRenameCard orgId={orgId} orgName={orgName} api={api} onRenamed={onRenamed} />}
      {isAdmin && <Card style={{marginBottom:18}}>
        <div style={{fontWeight:700,marginBottom:10}}>Teammitglied einladen</div>
        <div className="stack" style={{display:"flex",gap:10}}>
          <input className="input" placeholder="E-Mail-Adresse" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&invite()} />
          <select className="input" style={{width:190}} value={role} onChange={e=>setRole(e.target.value)}>
            <option value="member">Mitarbeitende</option>
            <option value="manager">Abteilungsleitung</option>
            <option value="viewer">Eigentümer (nur lesen)</option>
            <option value="admin">Admin</option>
          </select>
          <button className="btn-primary" onClick={invite} disabled={loading}>{loading?"…":"Einladen"}</button>
        </div>
        {ROLES_WITH_DEPTS.includes(role) && (
          <div style={{marginTop:12}}>
            <div className="field-label">Abteilungen</div>
            <DeptChips value={inviteDepts} onChange={setInviteDepts} />
          </div>
        )}
        {error && <div style={{color:BAD,fontSize:13,marginTop:10}}>{error}</div>}
        {inviteMsg && <div style={{color:inviteMsg.ok?GOOD:WARN,fontSize:13,marginTop:10}}>{inviteMsg.text}</div>}
        <div style={{fontSize:12,color:INK_MUTED,marginTop:10}}>
          Die Person bekommt den Einladungslink per E-Mail. Sie muss sich damit registrieren oder anmelden,
          dann gehört sie automatisch zu deiner Organisation. Kommt keine Mail an, kannst du den Link unten auch kopieren und selbst weitergeben.
          <br /><b>Admin</b> sieht und verwaltet alles, auch Abo und Team.
          <br /><b>Abteilungsleitung</b> {tf("sieht und verwaltet alle Abteilungen – Aufgaben, Budget, Risiken, Personal und Dienstplan – und genehmigt Anträge.")}
          <br /><b>Mitarbeitende</b> sehen nur die Aufgaben ihrer Abteilungen und ihre eigenen, ihren Dienstplan und können Urlaub, Frei-Wünsche und Schichttausch beantragen.
          <br /><b>Eigentümer (nur lesen)</b> sehen Dashboard, KI-Lagebericht und Statusbericht und können kommentieren, aber nichts ändern – ideal für Eigentümer und Investoren.
        </div>
      </Card>}

      <Card style={{marginBottom:18,padding:0}}>
        <div style={{fontWeight:700,padding:"14px 16px 6px"}}>Mitglieder</div>
        <table className="resp-table" style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
          {members.map(m=>{
            const isMe = me && m.user_id===me.id;
            return (
              <tr key={m.user_id} style={{borderTop:`1px solid ${BORDER}`}}>
                <td style={{padding:12}}>
                  <span data-no-i18n="">{m.email}</span>{isMe && <span style={{color:INK_MUTED}}> (du)</span>}
                  {ROLES_WITH_DEPTS.includes(m.role) && (isAdmin
                    ? <div style={{marginTop:8}}><DeptChips value={m.departments} onChange={list=>changeDepts(m, list)} /></div>
                    : <div style={{fontSize:12,color:INK_MUTED,marginTop:4}}>{(m.departments||[]).length ? (m.departments||[]).map((d,i)=><React.Fragment key={d}>{i>0 && ", "}<span>{d}</span></React.Fragment>) : <span>Keine Abteilung</span>}</div>)}
                  {isAdmin && ROLES_WITH_DEPTS.includes(m.role) && (m.departments||[]).length===0 && <div style={{fontSize:12,color:WARN,marginTop:4}}>Ohne Abteilung sieht diese Person nur Aufgaben, die ihr direkt zugewiesen sind.</div>}
                </td>
                <td style={{padding:12,color:INK_MUTED}}>
                  {isAdmin && !isMe
                    ? <select className="input" style={{width:200,padding:"5px 8px",fontSize:13}} value={m.role} onChange={e=>changeRole(m, e.target.value)}>
                        {Object.entries(ROLE_LABELS).map(([k,l])=><option key={k} value={k}>{l}</option>)}
                      </select>
                    : (ROLE_LABELS[m.role] || m.role)}
                </td>
                <td style={{padding:12,color:INK_MUTED}}>{tf("seit {0}", fmtDate(m.joined_at))}</td>
                <td style={{padding:12,textAlign:"right"}}>
                  {isAdmin && !isMe && <button style={{...linkBtn,color:BAD}} onClick={()=>removeMember(m)}>Entfernen</button>}
                </td>
              </tr>
            );
          })}
        </tbody></table>
      </Card>

      {teamMsg && <div style={{color:teamMsg.ok?GOOD:BAD,fontSize:13,margin:"-8px 0 14px"}}>{teamMsg.text}</div>}

      {isAdmin && (
        <Card style={{marginBottom:18}}>
          <div style={{fontWeight:700,marginBottom:6}}>Standardsprache der Organisation</div>
          <div style={{fontSize:12.5,color:INK_MUTED,marginBottom:10}}>Gilt für E-Mails, die Pre-Opening-Vorlage, den KI-Lagebericht und für alle Mitglieder ohne eigene Sprachauswahl.</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}} data-no-i18n="">
            {LANGS.map(([k,l])=>(
              <button key={k} onClick={()=>setLanguage(k)} className={orgLanguage===k?"btn-primary":""}
                style={orgLanguage===k ? {} : {background:"none",border:`1px solid ${BORDER}`,borderRadius:4,padding:"9px 16px",fontSize:13.5,cursor:"pointer"}}>{l}</button>
            ))}
          </div>
        </Card>
      )}

      {invites.filter(i=>i.status==="ausstehend").length > 0 && (
        <Card style={{padding:0}}>
          <div style={{fontWeight:700,padding:"14px 16px 6px"}}>Ausstehende Einladungen</div>
          <table className="resp-table" style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
            {invites.filter(i=>i.status==="ausstehend").map(i=>(
              <tr key={i.id} style={{borderTop:`1px solid ${BORDER}`}}>
                <td style={{padding:12}}><span data-no-i18n="">{i.email}</span><div style={{fontSize:11.5,color:INK_MUTED}}>{ROLE_LABELS[i.role] || i.role}</div>
                  {shownLinkId===i.id && (
                    <input readOnly className="input" value={linkFor(i)} onFocus={e=>e.target.select()} autoFocus
                      style={{marginTop:8,fontSize:12}} />
                  )}
                </td>
                <td style={{padding:12}}>
                  <button onClick={()=>copyLink(i)} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 10px",fontSize:12.5,cursor:"pointer"}}>
                    {copiedId===i.id ? "Kopiert!" : "Link kopieren"}
                  </button>
                </td>
                <td style={{padding:12}}><button onClick={()=>revoke(i.id)} style={{background:"none",border:"none",color:INK_MUTED,cursor:"pointer"}}>✕</button></td>
              </tr>
            ))}
          </tbody></table>
        </Card>
      )}

      <Card style={{marginTop:18,borderColor:BAD_SOFT}}>
        <div style={{fontWeight:700,marginBottom:6,color:BAD}}>Gefahrenzone</div>
        {!isAdmin && (
          <div>
            <div style={{fontSize:13,color:INK_MUTED,marginBottom:10}}>Wenn du die Organisation verlässt, verlierst du den Zugriff auf alle ihre Hotels.</div>
            <button onClick={leave} style={{background:"none",border:`1px solid ${BAD}`,color:BAD,borderRadius:4,padding:"8px 14px",fontSize:13,cursor:"pointer"}}>Organisation verlassen</button>
          </div>
        )}
        {isAdmin && (
          <div>
            <div style={{fontSize:13,color:INK_MUTED,marginBottom:10}}>
              Löscht <b>„{orgName}“</b> endgültig mit allen Hotels, Aufgaben, Kommentaren, Dokumenten und Berichten. Ein laufendes Abo wird sofort beendet.
              Exportiere vorher bei Bedarf jedes Hotel über „Excel-Export“. <b>Das kann nicht rückgängig gemacht werden.</b>
            </div>
            <Field label={tf("Zur Bestätigung den Namen der Organisation eingeben: {0}", orgName)}>
              <input className="input" value={confirmName} onChange={e=>setConfirmName(e.target.value)} />
            </Field>
            <button onClick={deleteOrg} disabled={deleting || confirmName.trim()!==orgName.trim()}
              style={{background:confirmName.trim()===orgName.trim()?BAD:"#ccc",color:"#fff",border:"none",borderRadius:4,padding:"9px 16px",fontSize:13.5,fontWeight:600,cursor:"pointer"}}>
              {deleting ? "Wird gelöscht…" : "Organisation endgültig löschen"}
            </button>
          </div>
        )}
      </Card>
    </div>
  );
}

// Menü je Rolle
function navFor(role, hasBilling){
  const N = (key,label) => ({key,label});
  if(role==="viewer") return [N("dashboard","Dashboard"), N("timeline","Zeitstrahl"), N("team","Team"), N("account","Konto")];
  if(role==="member") return [N("dashboard","Dashboard"), N("mine","Meine Aufgaben"), N("tasks","Aufgaben"), N("timeline","Zeitstrahl"),
    N("roster","Dienstplan"), N("docs","Dokumente"), N("team","Team"), N("account","Konto")];
  return [
    N("dashboard","Dashboard"), N("mine","Meine Aufgaben"), N("tasks","Aufgaben"), N("milestones","Meilensteine"), N("timeline","Zeitstrahl"),
    N("risks","Risiken"), N("budget","Budget"), N("staff","Personal"), N("roster","Dienstplan"), N("docs","Dokumente"), N("team","Team"),
    ...(role==="admin" && hasBilling ? [N("billing","Abo")] : []),
    N("account","Konto"),
  ];
}

function App(){
  // Verbindungsdaten sofort setzen: eine gespeicherte Sitzung braucht sie schon beim ersten Anzeigen
  const [config,setConfig] = useState(DEFAULT_CONFIG);
  // Gespeicherte Sitzung wiederherstellen – so bleibt man nach dem Neuladen angemeldet
  const [token,setToken] = useState(() => { const s = Session.load(); return s ? s.access_token : null; });
  const [orgId,setOrgId] = useState(null);
  const [orgs,setOrgs] = useState([]);
  const [members,setMembers] = useState([]);
  const [me,setMe] = useState(null);
  const [hotels,setHotels] = useState(null);
  const [hotel,setHotel] = useState(null);
  const [tab,setTab] = useState("dashboard");
  const [tasks,setTasks] = useState([]);
  const [milestones,setMilestones] = useState([]);
  const [risks,setRisks] = useState([]);
  const [budget,setBudget] = useState([]);
  const [staff,setStaff] = useState([]);
  const [readiness,setReadiness] = useState(null);
  const [fatalError,setFatalError] = useState("");
  const [recoveryToken,setRecoveryToken] = useState(null);
  const [recoveryDone,setRecoveryDone] = useState(false);
  const [editingHotel,setEditingHotel] = useState(false);
  const [showReport,setShowReport] = useState(false);
  const [billing,setBilling] = useState(null);
  const [billingNotice,setBillingNotice] = useState(null);
  const [ai,setAi] = useState(null);
  const [fxTick,setFxTick] = useState(0); // neu zeichnen, wenn Kurse oder Anzeigewährung sich ändern

  useEffect(()=>{
    // Verbindungsdaten sind fest eingebaut – niemand muss sie mehr eintragen.
    setConfig(DEFAULT_CONFIG);
    // Erkennt den Link aus der "Passwort vergessen"-E-Mail: Supabase hängt
    // #access_token=...&type=recovery an die URL an, wenn man draufklickt.
    try {
      const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
      const params = new URLSearchParams(hash);
      if(params.get("type")==="recovery" && params.get("access_token")){
        setRecoveryToken(params.get("access_token"));
        window.history.replaceState(null,"",window.location.pathname);
      }
    } catch(e){}
    // Erkennt einen Team-Einladungslink: ?invite=<token>. Der Token wird im
    // Browser gemerkt, damit er auch nach Registrierung + E-Mail-Bestätigung
    // (die zurück auf die Seite ohne ?invite führt) noch da ist.
    try {
      const search = new URLSearchParams(window.location.search);
      if(search.get("invite")){
        try { window.localStorage.setItem(LS_INVITE_KEY, search.get("invite")); } catch(e){}
        window.history.replaceState(null,"",window.location.pathname);
      }
      // Rückkehr von der Stripe-Bezahlseite oder der Abo-Verwaltung: ?billing=success|cancel|portal
      if(search.get("billing")){
        setBillingNotice(search.get("billing"));
        setTab("billing");
        window.history.replaceState(null,"",window.location.pathname);
      }
    } catch(e){}
  },[]);

  // Erneuerung fehlgeschlagen (z. B. lange nicht benutzt) -> zurück zur Anmeldung
  useEffect(()=>{ Session.onExpired = () => { setToken(null); setOrgId(null); }; return () => { Session.onExpired = null; }; },[]);
  const login = (data) => { Session.save(sessionFromAuth(data)); setToken(data.access_token); };
  const logout = () => { Session.save(null); setToken(null); setOrgId(null); setOrgs([]); setHotel(null); setHotels(null); };

  const saveConfig = (cfg) => {
    setConfig(cfg);
    try { if(cfg) window.localStorage.setItem(LS_KEY, JSON.stringify(cfg)); else window.localStorage.removeItem(LS_KEY); } catch(e){}
  };

  const api = useCallback((path, method, body) => apiCall(config.backendUrl, token, path, method, body), [config, token]);

  useEffect(()=>{
    if(!token || !config) return;
    (async () => {
      try {
        let organizationId;
        let fromInvite = false;
        let inviteToken = null;
        try { inviteToken = window.localStorage.getItem(LS_INVITE_KEY); } catch(e){}
        if(inviteToken){
          try {
            const accepted = await apiCall(config.backendUrl, token, "/api/invites/accept", "POST", {token:inviteToken});
            organizationId = accepted.organization_id; fromInvite = true;
          } catch(e){ setFatalError(tf("Einladung: {0}", e.message)); }
          // Einladung nur einmal verarbeiten – egal ob angenommen oder ungültig.
          try { window.localStorage.removeItem(LS_INVITE_KEY); } catch(e){}
        }
        if(!organizationId){
          const boot = await apiCall(config.backendUrl, token, "/api/bootstrap-organization", "POST", {name:"Meine Organisation"});
          organizationId = boot.organization_id;
        }
        const list = await apiCall(config.backendUrl, token, "/api/organizations");
        // Zuletzt benutzte Organisation wiederherstellen – außer man kommt gerade über eine Einladung.
        let saved = null;
        try { saved = window.localStorage.getItem(LS_ORG_KEY); } catch(e){}
        if(!fromInvite && saved && list.some(o=>o.id===saved)) organizationId = saved;
        setOrgs(list);
        setOrgId(organizationId);
      } catch(e){ setFatalError(e.message); }
    })();
  },[token, config]);

  // Hotels immer nur für die gewählte Organisation laden.
  useEffect(()=>{
    if(!token || !orgId) return;
    let cancelled = false;
    setHotels(null);
    apiCall(config.backendUrl, token, "/api/hotels?organization_id=" + encodeURIComponent(orgId))
      .then(h=>{ if(!cancelled) setHotels(h); })
      .catch(e=>{ if(!cancelled) setFatalError(e.message); });
    return () => { cancelled = true; };
  },[token, orgId, config]);

  // Abo der gewählten Organisation. Fehlt es (z. B. Backend noch ohne Abo-Funktion), wird nichts angezeigt.
  const loadBilling = useCallback(() => {
    if(!token || !orgId) { setBilling(null); return; }
    apiCall(config.backendUrl, token, "/api/organizations/"+orgId+"/billing").then(setBilling).catch(()=>setBilling(null));
  },[token, orgId, config]);
  useEffect(()=>{ loadBilling(); },[loadBilling]);
  // Nach der Bezahlung meldet Stripe das Abo per Webhook – kann ein paar Sekunden dauern.
  useEffect(()=>{
    if(billingNotice!=="success" && billingNotice!=="portal") return;
    const timers = [2000, 5000, 10000, 20000].map(ms=>setTimeout(loadBilling, ms));
    return () => timers.forEach(clearTimeout);
  },[billingNotice, loadBilling]);

  const switchOrg = (id) => {
    setHotel(null); setTab("dashboard"); setFatalError(""); setOrgId(id);
    try { window.localStorage.setItem(LS_ORG_KEY, id); } catch(e){}
  };
  const currentOrg = orgs.find(o=>o.id===orgId);
  // Eigentümer-Zugang: alles sehen, nichts ändern (die Datenbank erzwingt das zusätzlich)
  const isViewer = !!(currentOrg && currentOrg.role==="viewer");
  const role = currentOrg ? currentOrg.role : "member";
  const myDepts = (currentOrg && currentOrg.departments) || [];
  ACCESS = {role, depts: myDepts};
  const isAdmin = role==="admin";
  const isLead = role==="admin" || role==="manager";
  // Oberfläche in der Sprache der Organisation
  useEffect(()=>{ if(currentOrg) followOrgLanguage(currentOrg.language || "de"); },[currentOrg && currentOrg.language]);
  useEffect(()=>{ if(currentOrg && !navFor(role, !!billing).some(n=>n.key===tab)) setTab("dashboard"); },[role, tab, !!billing, !!currentOrg]);

  // Tageskurse für die eigene Anzeigewährung
  useEffect(()=>{
    apiCall(config.backendUrl, null, "/api/fx").then(r=>{ FX = r; setFxTick(x=>x+1); }).catch(()=>{});
  },[config]);
  // Sprache und Währung geräteübergreifend: gespeicherte Einstellung übernehmen bzw. nachtragen
  useEffect(()=>{
    if(!me) return;
    if(me.currency && !DISPLAY_CURRENCY){ setDisplayCurrency(me.currency); setFxTick(x=>x+1); }
    const chosen = chosenUiLanguage();
    if(me.language && !chosen && me.language !== UI_LANG){ chooseUiLanguage(me.language); return; }
    if(chosen && chosen !== me.language) apiCall(config.backendUrl, token, "/api/me/settings", "PUT", {language: chosen}).catch(()=>{});
  },[me && me.id]);
  // Zuletzt geöffnetes Hotel und Ansicht merken – nach Sprachwechsel oder Neuladen geht es dort weiter
  useEffect(()=>{
    if(!hotel || !orgId) return;
    try { window.localStorage.setItem(LS_HOTEL_KEY, JSON.stringify({orgId, hotelId: hotel.id, tab})); } catch(e){}
  },[hotel && hotel.id, tab, orgId]);
  useEffect(()=>{
    if(hotel || !hotels || !orgId) return;
    let saved = null;
    try { saved = JSON.parse(window.localStorage.getItem(LS_HOTEL_KEY) || "null"); } catch(e){}
    if(!saved || saved.orgId !== orgId) return;
    const h = hotels.find(x=>x.id===saved.hotelId);
    if(h){ setHotel(h); if(saved.tab) setTab(saved.tab); }
  },[hotels, orgId]);
  const leaveHotel = () => { try { window.localStorage.removeItem(LS_HOTEL_KEY); } catch(e){} setHotel(null); };

  // Wer bin ich, und wer ist im Team? (für Zuständigkeiten)
  useEffect(()=>{
    if(!token) { setMe(null); return; }
    apiCall(config.backendUrl, token, "/api/me").then(setMe).catch(()=>setMe(null));
  },[token, config]);
  useEffect(()=>{
    if(!token || !orgId) { setMembers([]); return; }
    apiCall(config.backendUrl, token, "/api/organizations/"+orgId+"/members").then(setMembers).catch(()=>setMembers([]));
  },[token, orgId, config]);

  const loadHotelData = useCallback(async (h) => {
    if(!h) return;
    const base = "/api/hotels/" + h.id;
    try {
      const [t,m,r,rd,b,s] = await Promise.all([
        apiCall(config.backendUrl, token, base+"/tasks"),
        apiCall(config.backendUrl, token, base+"/milestones"),
        apiCall(config.backendUrl, token, base+"/risks"),
        apiCall(config.backendUrl, token, base+"/readiness"),
        // Budget/Personal dürfen das Laden der übrigen Daten nie blockieren.
        apiCall(config.backendUrl, token, base+"/budget").catch(()=>[]),
        apiCall(config.backendUrl, token, base+"/staff").catch(()=>[]),
      ]);
      setTasks(t); setMilestones(m); setRisks(r); setReadiness(rd); setBudget(b); setStaff(s);
    } catch(e){ setFatalError(e.message); }
  },[config, token]);

  useEffect(()=>{ if(hotel) loadHotelData(hotel); },[hotel, loadHotelData]);
  useEffect(()=>{
    setAi(null);
    if(!hotel || !token) return;
    if(ACCESS.role==="member") return;
    apiCall(config.backendUrl, token, "/api/hotels/"+hotel.id+"/ai-report").then(setAi).catch(()=>setAi(null));
  },[hotel, token, config]);

  if(config===undefined) return <div style={{padding:40,color:INK_MUTED}}>Lädt…</div>;
  if(!config) return <SetupView onSave={saveConfig} />;
  if(recoveryToken && !recoveryDone) return <ResetPasswordView config={config} accessToken={recoveryToken} onDone={()=>{setRecoveryDone(true);setRecoveryToken(null);}} />;
  if(recoveryDone) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:380,width:"100%",textAlign:"center"}}>
        <div style={{fontFamily:"Fraunces, serif",fontSize:18,fontWeight:600,marginBottom:10}}>Passwort geändert</div>
        <div style={{fontSize:13.5,color:INK_MUTED,marginBottom:16}}>Du kannst dich jetzt mit deinem neuen Passwort anmelden.</div>
        <button className="btn-primary" style={{width:"100%"}} onClick={()=>setRecoveryDone(false)}>Zur Anmeldung</button>
      </Card>
    </div>
  );
  if(!token) return <LoginView config={config} onLogin={login} onReset={()=>saveConfig(null)} />;
  // hotels === null heißt: noch nicht geladen. Erst danach entscheiden, ob Liste oder Formular.
  if(!hotel && hotels===null) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:380,width:"100%",textAlign:"center"}}>
        {fatalError
          ? <React.Fragment>
              <div style={{color:BAD,fontSize:13.5,marginBottom:14}}>{fatalError}</div>
              <button className="btn-primary" style={{width:"100%"}} onClick={()=>{setFatalError("");logout();}}>Zurück zur Anmeldung</button>
            </React.Fragment>
          : <div style={{color:INK_MUTED,fontSize:13.5}}>Hotels werden geladen…</div>}
      </Card>
    </div>
  );
  if(!hotel) return <HotelSetupView hotels={hotels} orgId={orgId} api={api} orgs={orgs} onSwitchOrg={switchOrg} readOnly={!isAdmin}
    onCreated={(h)=>{ setHotels([...hotels,h]); setHotel(h); }} onSelect={setHotel} />;
  if(hotel) HOTEL_CURRENCY = hotel.currency || "EUR";
  if(showReport) return <ReportView hotel={hotel} orgName={currentOrg ? currentOrg.name : ""} me={me}
    readiness={readiness} tasks={tasks} milestones={milestones} risks={risks} budget={budget} staff={staff}
    aiReport={ai && ai.report} onClose={()=>setShowReport(false)} />;

  const NAV = navFor(role, !!billing);

  HOTEL_CURRENCY = hotel.currency || "EUR";
  const callHotel = (suffix, method, body) => api("/api/hotels/"+hotel.id+suffix, method, body);
  // Für Dokumente: Upload direkt in den Supabase-Speicher; Admins dürfen alle Dokumente löschen
  const docCtx = {
    hotel,
    upload: {supabaseUrl: config.supabaseUrl, anonKey: config.supabaseAnonKey, token},
    me: me ? {...me, isAdmin: !!(currentOrg && currentOrg.role==="admin")} : null,
  };
  const callId = (resource, id, method, body) => api("/api/"+resource+"/"+id, method, body);

  return (
    <div className="app-shell" style={{fontFamily:"Inter, sans-serif",background:PAPER,minHeight:"100vh",display:"flex"}}>
      <div className="sidebar" style={{width:210,background:INK,color:"#fff",padding:"22px 14px",flexShrink:0}}>
        <div className="brand" style={{fontFamily:"Fraunces, serif",fontSize:18,fontWeight:500,letterSpacing:0.3,padding:"0 8px 20px",borderBottom:"1px solid rgba(201,166,107,0.3)",marginBottom:16,display:"flex",alignItems:"center",gap:9}}><Logo size={22} />Ouverture</div>
        <OrgSwitcher orgs={orgs} orgId={orgId} onSwitch={switchOrg} dark />
        {NAV.map(n=>(
          <div key={n.key} className="nav-item" onClick={()=>setTab(n.key)} style={{padding:"8px 10px 8px 12px",borderRadius:0,cursor:"pointer",marginBottom:2,fontSize:13.5,borderInlineStart:"2px solid "+(tab===n.key?"#C9A66B":"transparent"),background:tab===n.key?"rgba(201,166,107,0.08)":"transparent",color:tab===n.key?"#fff":"rgba(255,255,255,0.62)"}}>{n.label}</div>
        ))}
        <div className="nav-item" onClick={leaveHotel} style={{padding:"9px 10px",borderRadius:7,cursor:"pointer",marginTop:14,fontSize:13,color:"rgba(255,255,255,0.65)"}}>Hotel wechseln</div>
        <div style={{marginTop:18}}><LanguageSwitcher dark withDefault api={api} me={me} onCurrency={()=>setFxTick(x=>x+1)} /></div>
        <div className="logout" onClick={logout} style={{marginTop:20,fontSize:13,color:"rgba(255,255,255,0.5)",cursor:"pointer"}}>Abmelden</div>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div className="page-header" style={{padding:"18px 28px",borderBottom:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
          <div>
            <div style={{fontFamily:"Fraunces, serif",fontSize:20,fontWeight:600,display:"flex",alignItems:"center",gap:10}}>{hotel.name}{hotel.is_demo && <Pill color={BRASS} bg={BRASS_SOFT}>Beispielhotel</Pill>}</div>
            <div style={{fontSize:12.5,color:INK_MUTED}}>{hotel.city} · {tf("{0} Zimmer · Eröffnung {1}", hotel.rooms, fmtDate(hotel.opening_date))}</div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={()=>{ setShowReport(true); window.scrollTo(0,0); }} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer"}}>Statusbericht</button>
            <button onClick={async ()=>{ try { await exportHotelXlsx({hotel, tasks, milestones, risks, budget, staff, members}); } catch(e){ setFatalError(tf("Export fehlgeschlagen: {0}", e.message)); } }}
              style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer"}}>Excel-Export</button>
            <button onClick={()=>downloadIcs({hotel, tasks, milestones})} title="Offene Fristen und Meilensteine für Outlook, Google oder Apple Kalender"
              style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer"}}>Kalender</button>
            {hotel.is_demo && isAdmin && <button onClick={async ()=>{
                if(!window.confirm("Beispielhotel mit allen Beispieldaten löschen? Du kannst es später jederzeit neu anlegen.")) return;
                try { await api("/api/hotels/"+hotel.id,"DELETE"); setHotels((hotels||[]).filter(x=>x.id!==hotel.id)); setHotel(null); }
                catch(e){ setFatalError(e.message); }
              }} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer",color:INK_MUTED}}>Beispiel entfernen</button>}
            {!editingHotel && isAdmin && <button onClick={()=>setEditingHotel(true)} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer"}}>Hotel bearbeiten</button>}
          </div>
        </div>
        <div className="page-content" style={{padding:"22px 28px"}}>
          {fatalError && <div style={{color:BAD,marginBottom:14}}>{fatalError}</div>}
          {tab!=="billing" && isAdmin && <BillingBanner billing={billing} onOpen={()=>setTab("billing")} />}
          {role==="member" && tab==="dashboard" && <div className="no-print" style={{border:`1px solid ${BORDER}`,background:"#fff",borderRadius:8,padding:"9px 14px",marginBottom:16,fontSize:13.5}}>
            <b>Deine Ansicht:</b> Du siehst die Aufgaben deiner Abteilungen und alle, die dir zugewiesen sind. Budget, Risiken und Personal sieht die Abteilungsleitung.
          </div>}
          {isViewer && <div className="no-print" style={{border:`1px solid ${BRASS}`,background:BRASS_SOFT,borderRadius:8,padding:"9px 14px",marginBottom:16,fontSize:13.5}}>
            <b>Eigentümer-Ansicht:</b> Du siehst den aktuellen Stand, den KI-Lagebericht und den Statusbericht. Ändern können nur Mitglieder des Projektteams.
          </div>}
          {editingHotel && <HotelEditForm hotel={hotel} api={api} onCancel={()=>setEditingHotel(false)}
            onSaved={(h)=>{ setHotel(h); setHotels((hotels||[]).map(x=>x.id===h.id?h:x)); setEditingHotel(false); }} />}
          {tab==="dashboard" && role!=="member" && <AiReportCard hotel={hotel} api={api} ai={ai} onChange={setAi} readOnly={!isLead} />}
          {tab==="dashboard" && <DashboardView readiness={readiness} tasks={tasks} risks={risks} budget={budget} staff={staff} lead={role!=="member"} onOpen={isLead ? setTab : ()=>{}} />}
          {tab==="mine" && <MyTasksView orgId={orgId} api={api} hotelId={hotel.id} refresh={()=>loadHotelData(hotel)} />}
          {tab==="tasks" && <TasksView tasks={tasks} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} members={members} me={me} api={api} docCtx={docCtx} />}
          {tab==="timeline" && <TimelineView hotel={hotel} tasks={tasks} milestones={milestones} />}
          {tab==="milestones" && <MilestonesView milestones={milestones} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="risks" && <RisksView risks={risks} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="budget" && <ConversionNote />}
          {tab==="budget" && <BudgetView items={budget} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="roster" && <RosterView hotel={hotel} api={api} me={me} members={members} role={role} myDepts={myDepts} orgId={orgId} />}
          {tab==="docs" && <DocumentsPanel hotel={hotel} api={api} upload={docCtx.upload} me={docCtx.me} />}
          {tab==="staff" && <StaffView positions={staff} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="team" && <TeamView orgId={orgId} api={api} inviteLinkBase={window.location.origin + window.location.pathname}
            orgName={currentOrg ? currentOrg.name : ""} me={me} orgLanguage={currentOrg ? currentOrg.language : "de"}
            onRenamed={(org)=>setOrgs(orgs.map(o=>o.id===org.id?{...o,name:org.name}:o))}
            onLanguageChanged={(lang)=>setOrgs(orgs.map(o=>o.id===orgId?{...o,language:lang}:o))}
            onOrgGone={()=>{ try { window.localStorage.removeItem(LS_ORG_KEY); } catch(e){} window.location.reload(); }} />}
          {tab==="account" && <AccountView config={config} token={token} me={me} api={api}
            onDeleted={()=>{ Session.save(null); try { window.localStorage.removeItem(LS_ORG_KEY); } catch(e){} window.location.reload(); }} />}
          {tab==="billing" && <BillingView billing={billing} orgId={orgId} api={api} notice={billingNotice}
            isAdmin={isAdmin} onReload={loadBilling} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
