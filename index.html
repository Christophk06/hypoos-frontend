const { useState, useEffect, useCallback } = React;

const INK="#1C2430", INK_SOFT="#2A3444", PAPER="#F6F4EF", CARD="#FFFFFF", BORDER="#E4DFD3";
const BRASS="#A9834B", BRASS_SOFT="#F1E8D8", GOOD="#3F7A5C", GOOD_SOFT="#E4EFE8";
const WARN="#B9822E", WARN_SOFT="#F5E9D5", BAD="#A23B32", BAD_SOFT="#F5E1DE", INK_MUTED="#6B7280";

const DEPARTMENTS = ["Rezeption & Empfang","Housekeeping","Food & Beverage","Technik","IT & Systeme","Personal","Einkauf","Sicherheit","Revenue Management","Finanzen & Controlling"];
// Eigene Rolle und Abteilungen in der gewählten Organisation (setzt App bei jedem Anzeigen).
// Die Datenbank erzwingt die Rechte; die Oberfläche blendet nur aus, was nicht geht.
let ACCESS = {role:"admin", depts:[]};
const isLeadRole = () => ACCESS.role==="admin" || ACCESS.role==="manager";
// Abteilungen, in denen man Einträge anlegen darf
// Abteilungsleitung mit zugeordneten Abteilungen: nur diese; ohne Zuordnung (z. B. Direktion): alle
const isScopedManager = () => ACCESS.role==="manager" && (ACCESS.depts||[]).length>0;
function editableDepts(){
  if(ACCESS.role==="admin" || (ACCESS.role==="manager" && !isScopedManager())) return DEPARTMENTS;
  const own = ACCESS.depts || [];
  return DEPARTMENTS.filter(d=>own.includes(d)).concat(own.filter(d=>!DEPARTMENTS.includes(d)));
}
function deptOptions(current){ const list = editableDepts(); return current && !list.includes(current) ? [current, ...list] : list; }
function canManageDept(d){ return ACCESS.role==="admin" || (ACCESS.role==="manager" && (!isScopedManager() || (ACCESS.depts||[]).includes(d))); }
const PRIORITIES = ["Kritisch","Hoch","Mittel","Niedrig"];
const TASK_STATUSES = ["Nicht begonnen","In Arbeit","Blockiert","In Prüfung","Abgeschlossen"];
const MILESTONE_STATUSES = ["Geplant","In Arbeit","Gefährdet","Abgeschlossen"];
const LS_KEY = "hpoos_connection_config_v1";
const LS_INVITE_KEY = "hpoos_pending_invite_v1";
const LS_ORG_KEY = "hpoos_last_org_v1";
const LS_HOTEL_KEY = "hpoos_last_hotel_v1";
// Öffentliche Verbindungsdaten. Der publishable Key darf im Frontend stehen –
// die Daten schützen Login-Pflicht und Row Level Security in der Datenbank.
const DEFAULT_CONFIG = {
  backendUrl: "https://hpoos-backend-1.onrender.com",
  supabaseUrl: "https://czixqievmbftumcavtqr.supabase.co",
  supabaseAnonKey: "sb_publishable_z7UkYgbek05ZFR199O93eg_0MxUM3Nx",
};


function fmtDate(d){ return d ? new Date(d).toLocaleDateString(UI_LOCALE,{day:"2-digit",month:"short",year:"numeric"}) : "—"; }
function priorityColor(p){
  if(p==="Kritisch") return {color:BAD,bg:BAD_SOFT};
  if(p==="Hoch") return {color:WARN,bg:WARN_SOFT};
  if(p==="Mittel") return {color:BRASS,bg:BRASS_SOFT};
  return {color:INK_MUTED,bg:PAPER};
}

/* ------------------------ Fehler an das Backend melden ------------------------
   Landet im Server-Protokoll und (falls eingerichtet) als Sammel-Mail beim Betreiber. */
let reportedErrors = 0;
function reportClientError(message, stack){
  if(reportedErrors++ >= 10) return; // pro Seitenaufruf höchstens 10 Meldungen
  try {
    fetch(DEFAULT_CONFIG.backendUrl.replace(/\/$/,"") + "/api/client-error", {
      method:"POST", headers:{"Content-Type":"application/json"}, keepalive:true,
      body: JSON.stringify({message:String(message||"").slice(0,500), stack:String(stack||"").slice(0,1500),
        url: window.location.pathname, userAgent: navigator.userAgent}),
    }).catch(()=>{});
  } catch(e){}
}
window.addEventListener("error", (e) => reportClientError(e.message, e.error && e.error.stack));
window.addEventListener("unhandledrejection", (e) => reportClientError(e.reason && e.reason.message || e.reason, e.reason && e.reason.stack));

// Stürzt eine Ansicht ab, erscheint eine Meldung statt einer weißen Seite.
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = {failed:false}; }
  static getDerivedStateFromError(){ return {failed:true}; }
  componentDidCatch(error, info){ reportClientError(error && error.message, (error && error.stack || "") + (info && info.componentStack || "")); }
  render(){
    if(!this.state.failed) return this.props.children;
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
        <Card style={{maxWidth:420,width:"100%",textAlign:"center"}}>
          <div style={{fontFamily:"Fraunces, serif",fontSize:19,fontWeight:600,marginBottom:8}}>Da ist etwas schiefgelaufen</div>
          <div style={{fontSize:13.5,color:INK_MUTED,marginBottom:16}}>Der Fehler wurde automatisch gemeldet. Deine Daten sind gespeichert – bitte die Seite neu laden.</div>
          <button className="btn-primary" onClick={()=>window.location.reload()}>Seite neu laden</button>
        </Card>
      </div>
    );
  }
}

/* --------------------------- Anmeldung merken ---------------------------
   Die Sitzung (Zugangs- und Erneuerungsschlüssel) liegt im Browser, damit man
   nach dem Neuladen angemeldet bleibt. Der Zugangsschlüssel gilt nur eine Stunde
   und wird vor jeder Anfrage bei Bedarf still erneuert – die App muss dafür nichts
   neu laden. Schlägt die Erneuerung fehl, geht es zurück zur Anmeldung. */
const LS_SESSION_KEY = "hpoos_session_v1";
const Session = {
  current: null,
  onExpired: null,
  load(){ try { this.current = JSON.parse(window.localStorage.getItem(LS_SESSION_KEY)); } catch(e){ this.current = null; } return this.current; },
  save(s){ this.current = s; try { if(s) window.localStorage.setItem(LS_SESSION_KEY, JSON.stringify(s)); else window.localStorage.removeItem(LS_SESSION_KEY); } catch(e){} },
};
function sessionFromAuth(data){
  return { access_token: data.access_token, refresh_token: data.refresh_token,
    expires_at: data.expires_at || Math.floor(Date.now()/1000) + (data.expires_in || 3600) };
}
let refreshing = null;
function refreshSession(){
  if(!Session.current || !Session.current.refresh_token) return Promise.reject(new Error("Bitte erneut anmelden."));
  // Mehrere gleichzeitige Anfragen teilen sich eine Erneuerung
  refreshing = refreshing || (async () => {
    const res = await fetch(DEFAULT_CONFIG.supabaseUrl.replace(/\/$/,"") + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST", headers:{apikey:DEFAULT_CONFIG.supabaseAnonKey, "Content-Type":"application/json"},
      body: JSON.stringify({refresh_token: Session.current.refresh_token}),
    });
    let data = null; try { data = await res.json(); } catch(e){}
    if(!res.ok || !data || !data.access_token){
      Session.save(null);
      if(Session.onExpired) Session.onExpired();
      throw new Error("Deine Sitzung ist abgelaufen – bitte erneut anmelden.");
    }
    Session.save(sessionFromAuth(data));
    return data.access_token;
  })().finally(() => { refreshing = null; });
  return refreshing;
}
// Liefert einen gültigen Zugangsschlüssel (erneuert ihn kurz vor Ablauf).
async function freshToken(token){
  const s = Session.current;
  if(!token || !s) return token;
  if(s.expires_at - 60 < Date.now()/1000) return refreshSession();
  return s.access_token;
}

async function apiCall(backendUrl, token, path, method, body){
  const send = (t) => fetch(backendUrl.replace(/\/$/,"") + path, {
    method: method || "GET",
    // Sprache der Oberfläche: Server antwortet mit Meldungen, Vorlage, Beispielhotel und KI-Bericht darin
    headers: { "Content-Type":"application/json", "Accept-Language": UI_LANG, ...(t ? {Authorization:`Bearer ${t}`} : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let res = await send(await freshToken(token));
  // Schlüssel trotzdem abgelehnt (z. B. Rechner war im Ruhezustand): einmal erneuern und wiederholen
  if(res.status === 401 && token && Session.current) res = await send(await refreshSession());
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if(!res.ok) throw new Error((data && data.error) || tf("Fehler {0}", res.status));
  return data;
}
async function supabaseLogin(supabaseUrl, anonKey, email, password){
  const res = await fetch(supabaseUrl.replace(/\/$/,"") + "/auth/v1/token?grant_type=password", {
    method:"POST", headers:{apikey:anonKey,"Content-Type":"application/json"},
    body: JSON.stringify({email,password}),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || "Login fehlgeschlagen.");
  return data;
}
async function supabaseSignUp(supabaseUrl, anonKey, email, password){
  const res = await fetch(supabaseUrl.replace(/\/$/,"") + "/auth/v1/signup", {
    method:"POST", headers:{apikey:anonKey,"Content-Type":"application/json"},
    body: JSON.stringify({email,password}),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || "Registrierung fehlgeschlagen.");
  // Wenn E-Mail-Bestätigung in Supabase deaktiviert ist, liefert Supabase sofort
  // eine Session (access_token) zurück. Ist Bestätigung aktiviert, ist
  // access_token leer und der Nutzer muss zuerst auf den Link in der Mail klicken.
  return data.access_token ? data : null;
}
async function supabaseRecover(supabaseUrl, anonKey, email, redirectTo){
  const res = await fetch(supabaseUrl.replace(/\/$/,"") + "/auth/v1/recover", {
    method:"POST", headers:{apikey:anonKey,"Content-Type":"application/json"},
    body: JSON.stringify({email, redirect_to: redirectTo}),
  });
  if(!res.ok){
    let data = null; try { data = await res.json(); } catch(e){}
    throw new Error((data && (data.error_description||data.msg)) || "Anfrage fehlgeschlagen.");
  }
}
async function supabaseSetNewPassword(supabaseUrl, anonKey, accessToken, newPassword){
  const res = await fetch(supabaseUrl.replace(/\/$/,"") + "/auth/v1/user", {
    method:"PUT",
    headers:{apikey:anonKey,"Content-Type":"application/json",Authorization:`Bearer ${accessToken}`},
    body: JSON.stringify({password:newPassword}),
  });
  const data = await res.json();
  if(!res.ok) throw new Error((data && (data.error_description||data.msg)) || "Passwort konnte nicht geändert werden.");
  return data;
}

function LoginView({config,onLogin,onReset}){
  const [mode,setMode]=useState("login"); // "login" | "register" | "forgot"
  const [email,setEmail]=useState(""); const [password,setPassword]=useState("");
  const [error,setError]=useState(""); const [info,setInfo]=useState(""); const [loading,setLoading]=useState(false);

  const submitLogin = async () => {
    setError(""); setInfo(""); setLoading(true);
    try { onLogin(await supabaseLogin(config.supabaseUrl, config.supabaseAnonKey, email, password)); }
    catch(e){ setError(e.message); }
    setLoading(false);
  };

  const submitRegister = async () => {
    setError(""); setInfo(""); setLoading(true);
    try {
      if(password.length < 6){ setError("Das Passwort muss mindestens 6 Zeichen haben."); setLoading(false); return; }
      const session = await supabaseSignUp(config.supabaseUrl, config.supabaseAnonKey, email, password);
      if(session){ onLogin(session); }
      else { setInfo("Konto angelegt! Bitte bestätige deine E-Mail-Adresse über den Link, den wir dir geschickt haben, und melde dich danach an."); setMode("login"); }
    } catch(e){ setError(e.message); }
    setLoading(false);
  };

  const submitForgot = async () => {
    setError(""); setInfo(""); setLoading(true);
    try {
      const redirectTo = window.location.origin + window.location.pathname;
      await supabaseRecover(config.supabaseUrl, config.supabaseAnonKey, email, redirectTo);
      setInfo("Falls diese E-Mail-Adresse bei uns registriert ist, haben wir dir gerade einen Link zum Zurücksetzen deines Passworts geschickt. Bitte schau in dein Postfach (auch im Spam-Ordner).");
    } catch(e){ setError(e.message); }
    setLoading(false);
  };

  const submit = mode==="login" ? submitLogin : mode==="register" ? submitRegister : submitForgot;

  if(mode==="forgot"){
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
        <Card style={{maxWidth:380,width:"100%"}}>
          <div style={{fontFamily:"Fraunces, serif",fontSize:19,fontWeight:600,marginBottom:8}}>Passwort vergessen</div>
          <div style={{fontSize:13,color:INK_MUTED,marginBottom:16}}>Gib deine E-Mail-Adresse ein — wir schicken dir einen Link zum Zurücksetzen.</div>
          <Field label="E-Mail"><input className="input" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></Field>
          {error && <div style={{color:BAD,fontSize:13,marginBottom:12}}>{error}</div>}
          {info && <div style={{color:GOOD,fontSize:13,marginBottom:12}}>{info}</div>}
          <button className="btn-primary" style={{width:"100%"}} onClick={submit} disabled={loading}>{loading?"Bitte warten…":"Link schicken"}</button>
          <div style={{textAlign:"center",marginTop:12}}>
            <button onClick={()=>{setMode("login");setError("");setInfo("");}} style={{background:"none",border:"none",color:INK_MUTED,fontSize:12,cursor:"pointer",textDecoration:"underline"}}>Zurück zur Anmeldung</button>
          </div>
        </Card>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",display:"flex",background:PAPER}}>
      <div className="login-side" style={{flex:"0 0 42%",background:INK,color:"#F6F4EF",padding:"48px 44px",flexDirection:"column",justifyContent:"space-between",position:"relative",overflow:"hidden"}}>
        <svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true" style={{position:"absolute",inset:0,width:"100%",height:"100%",opacity:0.5}}>
          <g fill="none" stroke="#C9A66B" strokeOpacity="0.22">
            <path d="M40 600V300a90 90 0 0 1 180 0v300M75 600V320a55 55 0 0 1 110 0v280" />
            <path d="M250 600V300a90 90 0 0 1 180 0v300M285 600V320a55 55 0 0 1 110 0v280" />
          </g>
        </svg>
        <div style={{display:"flex",alignItems:"center",gap:10,fontFamily:"Fraunces, serif",fontSize:22,position:"relative"}}><Logo size={28} />Ouverture</div>
        <div style={{position:"relative"}}>
          <div style={{fontSize:11.5,letterSpacing:"0.18em",color:"#C9A66B",marginBottom:14}}>PRE-OPENING-SOFTWARE FÜR HOTELS</div>
          <div style={{fontFamily:"Fraunces, serif",fontSize:30,lineHeight:1.2,maxWidth:340}}>Bis zum ersten Gast – <span style={{fontStyle:"italic",color:"#C9A66B"}}>alles im Blick.</span></div>
        </div>
        <div style={{fontSize:12,color:"rgba(246,244,239,0.5)",position:"relative"}}>Aufgaben · Meilensteine · Risiken · KI-Lagebericht</div>
      </div>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative"}}>

function ResetPasswordView({config, accessToken, onDone}){
  const [password,setPassword]=useState(""); const [password2,setPassword2]=useState("");
  const [error,setError]=useState(""); const [loading,setLoading]=useState(false);
  const submit = async () => {
    setError("");
    if(password.length < 6){ setError("Das Passwort muss mindestens 6 Zeichen haben."); return; }
    if(password !== password2){ setError("Die beiden Passwörter stimmen nicht überein."); return; }
    setLoading(true);
    try { await supabaseSetNewPassword(config.supabaseUrl, config.supabaseAnonKey, accessToken, password); onDone(); }
    catch(e){ setError(e.message); }
    setLoading(false);
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:380,width:"100%"}}>
        <div style={{fontFamily:"Fraunces, serif",fontSize:19,fontWeight:600,marginBottom:8}}>Neues Passwort festlegen</div>
        <Field label="Neues Passwort"><input type="password" className="input" value={password} onChange={e=>setPassword(e.target.value)} /></Field>
        <Field label="Neues Passwort wiederholen"><input type="password" className="input" value={password2} onChange={e=>setPassword2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></Field>
        {error && <div style={{color:BAD,fontSize:13,marginBottom:12}}>{error}</div>}
        <button className="btn-primary" style={{width:"100%"}} onClick={submit} disabled={loading}>{loading?"Bitte warten…":"Passwort speichern"}</button>
      </Card>
    </div>
  );
}

/* -------------------------------- Excel-Import -------------------------------- */
// Welche Spaltenüberschriften (klein geschrieben, ohne Sonderzeichen) zu welchem Feld gehören
const IMPORT_FIELDS = [
  {key:"title", label:"Aufgabe", hints:["aufgabe","titel","task","title","bezeichnung","beschreibung","todo","massnahme","maßnahme","name"]},
  {key:"department", label:"Abteilung", hints:["abteilung","bereich","department","dept","team","gewerk"]},
  {key:"priority", label:"Priorität", hints:["prioritat","priorität","prio","priority","wichtigkeit"]},
  {key:"status", label:"Status", hints:["status","stand","state","erledigt","done"]},
  {key:"due_date", label:"Fällig am", hints:["fallig","fällig","fälligkeit","termin","deadline","due","datum","date","bis","frist","enddatum","ende"]},
  {key:"owner", label:"Zuständig", hints:["zustandig","zuständig","verantwortlich","owner","responsible","wer","assigned","person"]},
];
const normHeader = (h) => String(h||"").toLowerCase().replace(/[^a-zäöüß]/g,"");
function guessMapping(headers){
  const used = new Set(); const map = {};
  for(const f of IMPORT_FIELDS){
    // Erst exakte Treffer ("Status"), dann enthaltene ("Fälligkeitsdatum" enthält "fällig")
    const free = (test) => headers.findIndex((h,i)=>!used.has(i) && f.hints.some(x=>test(normHeader(h), normHeader(x))));
    const exact = free((h,x)=>h===x);
    const idx = exact>=0 ? exact : free((h,x)=>x.length>=4 && h.includes(x));
    if(idx>=0){ map[f.key]=idx; used.add(idx); }
  }
  return map;
}
// Excel-Datumswerte (Seriennummern) in der Vorschau lesbar zeigen; der Server wertet sie selbst aus.
function previewCell(v){
  if(typeof v==="number" && v>20000 && v<80000) return new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000).toLocaleDateString(UI_LOCALE);
  return String(v ?? "");
}

function ImportPanel({callHotel, refresh, onClose}){
  const [sheet,setSheet] = useState(null); // {name, headers, rows}
  const [map,setMap] = useState({});
  const [error,setError] = useState(""); const [result,setResult] = useState(""); const [busy,setBusy] = useState(false);

  const readFile = async (file) => {
    setError(""); setResult(""); setSheet(null);
    if(!file) return;
    try {
      const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
      const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const all = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""}).filter(r=>r.some(c=>String(c).trim()!==""));
      if(all.length<2) throw new Error("In der Datei wurden keine Zeilen unter der Überschrift gefunden.");
      // Überschrift = erste Zeile mit mindestens zwei Textzellen
      const headIdx = Math.max(0, all.findIndex(r=>r.filter(c=>typeof c==="string" && c.trim()).length>=2));
      const headers = all[headIdx].map(h=>String(h).trim());
      const rows = all.slice(headIdx+1);
      setSheet({name:file.name, headers, rows});
      setMap(guessMapping(headers));
    } catch(e){ setError(tf("Datei konnte nicht gelesen werden: {0}", e.message)); }
  };

  const rowsForImport = () => (sheet ? sheet.rows : []).map(r => {
    const o = {}; for(const f of IMPORT_FIELDS) if(map[f.key]!=null && map[f.key]!=="") o[f.key] = r[map[f.key]];
    return o;
  });

function memberEmail(members, id){ const m = members.find(x=>x.user_id===id); return m ? m.email : ""; }

const LS_TASK_FILTERS = "hpoos_task_filters_v1";
const TASK_FILTER_DEFAULTS = {q:"", department:"", status:"", sort:"due", mine:false, overdue:false, unassigned:false};
const PRIORITY_RANK = {Kritisch:0, Hoch:1, Mittel:2, Niedrig:3};

// Wendet Suche, Filter und Sortierung auf die Aufgabenliste an.
function filterTasks(tasks, f, {me, members}){
  const today = new Date().toISOString().slice(0,10);
  const q = f.q.trim().toLowerCase();
  const list = tasks.filter(t=>{
    if(f.department && t.department!==f.department) return false;
    if(f.status==="open" && t.status==="Abgeschlossen") return false;
    if(f.status && f.status!=="open" && t.status!==f.status) return false;
    if(f.mine && !(me && t.assignee_id===me.id)) return false;
    if(f.unassigned && t.assignee_id) return false;
    if(f.overdue && !(t.due_date && t.due_date<today && t.status!=="Abgeschlossen")) return false;
    if(q){
      const hay = [t.title, t.owner, t.department, memberEmail(members,t.assignee_id)].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const byDue = (a,b) => (a.due_date||"9999") < (b.due_date||"9999") ? -1 : (a.due_date||"9999") > (b.due_date||"9999") ? 1 : 0;
  const cmp = {
    due: byDue,
    priority: (a,b) => (PRIORITY_RANK[a.priority]??9) - (PRIORITY_RANK[b.priority]??9) || byDue(a,b),
    department: (a,b) => a.department.localeCompare(b.department,"de") || byDue(a,b),
  }[f.sort] || byDue;
  return [...list].sort(cmp);
}

// Was im Verlauf für eine Änderung angezeigt wird
function describeEvent(e){
  const v = (x) => x==null || x==="" ? "—" : x;
  const d = (x) => x ? fmtDate(x) : "kein Termin";
  switch(e.kind){
    case "created":  return "hat die Aufgabe angelegt";
    case "status":   return <span>Status: {v(e.old_value)} → <b>{v(e.new_value)}</b></span>;
    case "due_date": return <span>Termin: {d(e.old_value)} → <b>{d(e.new_value)}</b>{e.automatic ? " (Eröffnung verschoben)" : ""}</span>;
    case "assignee": return <span>Zuständig: {e.old_value || "niemand"} → <b>{e.new_value || "niemand"}</b></span>;
    case "priority": return <span>Priorität: {v(e.old_value)} → <b>{v(e.new_value)}</b></span>;
    case "title":    return <span>Titel: „{v(e.old_value)}“ → <b>„{v(e.new_value)}“</b></span>;
    default:         return e.kind;
  }
}
function fmtDateTime(iso){
  return new Date(iso).toLocaleString(UI_LOCALE,{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

// Kommentare und Änderungsverlauf einer Aufgabe
const MAX_UPLOAD_BYTES = 25 * 1024 * 1024;
function fmtBytes(n){
  if(!n) return "0 KB";
  if(n < 1024*1024) return Math.max(1, Math.round(n/1024)) + " KB";
  return (n/1024/1024).toLocaleString(UI_LOCALE,{maximumFractionDigits:1}) + " MB";
}
function fileIcon(mime, name){
  const ext = (name.split(".").pop()||"").toLowerCase();
  if((mime||"").startsWith("image/")) return "🖼️";
  if(ext==="pdf") return "📕";
  if(["xls","xlsx","csv"].includes(ext)) return "📊";
  if(["doc","docx","odt","txt"].includes(ext)) return "📝";
  return "📄";
}
// Dateiname für den Speicherpfad: nur unproblematische Zeichen (der Originalname bleibt im Eintrag)
function storageSafeName(name){
  return name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,100) || "datei";
}

// Liste + Upload von Dokumenten eines Hotels (optional nur einer Aufgabe)
function DocumentsPanel({hotel, api, upload, me, taskId, compact, onChanged}){
  const [docs,setDocs] = useState(null);
  const [error,setError] = useState(""); const [busy,setBusy] = useState("");
  const inputRef = React.useRef(null);
  const load = useCallback(()=>{
    api("/api/hotels/"+hotel.id+"/documents"+(taskId?"?task_id="+taskId:"")).then(setDocs).catch(e=>setError(e.message));
  }, [api, hotel.id, taskId]);
  useEffect(()=>{ load(); }, [load]);

  const uploadFiles = async (files) => {
    setError("");
    for(const file of files){
      if(file.size > MAX_UPLOAD_BYTES){ setError(tf("„{0}“ ist größer als 25 MB.", file.name)); continue; }
      setBusy(tf("Lädt hoch: {0}", file.name));
      const path = hotel.organization_id+"/"+hotel.id+"/"+crypto.randomUUID().slice(0,8)+"-"+storageSafeName(file.name);
      try {
        // Datei direkt in den Supabase-Speicher – mit dem Login des Nutzers, die Regeln greifen dort
        const res = await fetch(upload.supabaseUrl.replace(/\/$/,"")+"/storage/v1/object/documents/"+path.split("/").map(encodeURIComponent).join("/"), {
          method:"POST",
          headers:{Authorization:"Bearer "+(await freshToken(upload.token)), apikey:upload.anonKey, "Content-Type":file.type||"application/octet-stream", "x-upsert":"false"},
          body:file,
        });
        if(!res.ok){ let m=""; try{ m=(await res.json()).message; }catch(e){} throw new Error(m ? tf("Hochladen fehlgeschlagen: {0}", m) : tf("Hochladen fehlgeschlagen")); }
        await api("/api/hotels/"+hotel.id+"/documents","POST",{name:file.name, storage_path:path, size_bytes:file.size, mime_type:file.type, task_id:taskId||null});
      } catch(e){ setError(e.message); }
    }
    setBusy(""); load(); if(onChanged) onChanged();
  };
  const download = async (d) => {
    try {
      const {url} = await api("/api/documents/"+d.id+"/download");
      const a = document.createElement("a"); a.href = url; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
    } catch(e){ setError(e.message); }
  };
  const remove = async (d) => {
    if(!window.confirm(tf("„{0}“ löschen? Die Datei wird endgültig entfernt.", d.name))) return;
    try { await api("/api/documents/"+d.id,"DELETE"); load(); if(onChanged) onChanged(); } catch(e){ setError(e.message); }
  };
  const [dragOver,setDragOver] = useState(false);
  const canDelete = (d) => me && (d.uploaded_by===me.id || me.isAdmin);

  return (
    <div>
      <div onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
        onDrop={e=>{e.preventDefault();setDragOver(false);uploadFiles([...e.dataTransfer.files]);}}
        style={{border:`1.5px dashed ${dragOver?BRASS:BORDER}`,background:dragOver?BRASS_SOFT:(compact?"#fff":PAPER),borderRadius:8,padding:compact?"8px 10px":"14px 16px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:10}}>
        <input ref={inputRef} type="file" multiple style={{display:"none"}} onChange={e=>{ uploadFiles([...e.target.files]); e.target.value=""; }} />
        <button className="btn-primary" onClick={()=>inputRef.current.click()} disabled={!!busy} style={compact?{padding:"6px 12px",fontSize:12.5}:{}}>{compact?"Datei anhängen":"Dateien hochladen"}</button>
        <span style={{fontSize:12,color:INK_MUTED}}>{busy || "oder hierher ziehen · max. 25 MB je Datei"}</span>
      </div>
      {error && <div style={{color:BAD,fontSize:12.5,marginBottom:8}}>{error}</div>}
      {docs===null && !error && <div style={{fontSize:12.5,color:INK_MUTED}}>Lädt…</div>}
      {docs && docs.length===0 && <div style={{fontSize:12.5,color:INK_MUTED}}>{taskId ? "Keine Anhänge." : "Noch keine Dokumente."}</div>}
      {docs && docs.length>0 && (
        <Card style={{padding:0}}>
          <table className="resp-table" style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><tbody>
            {docs.map(d=>(
              <tr key={d.id} style={{borderTop:`1px solid ${BORDER}`}}>
                <td style={{padding:"8px 12px"}}>
                  <button onClick={()=>download(d)} style={{background:"none",border:"none",padding:0,cursor:"pointer",color:INK,fontWeight:600,fontSize:13.5,textAlign:"left",wordBreak:"break-word"}}>{fileIcon(d.mime_type,d.name)} {d.name}</button>
                  <div style={{fontSize:11.5,color:INK_MUTED}}>
                    {fmtBytes(d.size_bytes)} · {d.uploaded_by && me && d.uploaded_by===me.id ? tf("von dir") : (d.uploaded_by_email ? tf("von {0}", d.uploaded_by_email) : "")} · {fmtDateTime(d.created_at)}
                    {!taskId && d.task_title ? <span> · {tf("Aufgabe: {0}", d.task_title)}</span> : null}
                  </div>
                </td>
                <td style={{padding:"8px 12px",whiteSpace:"nowrap",textAlign:"right"}}>
                  <button style={linkBtn} onClick={()=>download(d)}>Herunterladen</button>
                  {canDelete(d) && <button style={linkBtn} onClick={()=>remove(d)} title="Löschen">✕</button>}
                </td>
              </tr>
            ))}
          </tbody></table>
        </Card>
      )}
    </div>
  );
}

function TasksView({tasks, callHotel, callId, refresh, members, me, api, docCtx}){
  const empty = {title:"",department:(editableDepts()[0]||DEPARTMENTS[0]),priority:"Mittel",status:"Nicht begonnen",due_date:"",owner:"",assignee_id:""};
  const [showForm,setShowForm]=useState(false);
  const [draft,setDraft]=useState(empty);
  const [editId,setEditId]=useState(null); const [edit,setEdit]=useState(null);
  const [error,setError]=useState("");
  const run = async (fn) => { setError(""); try { await fn(); refresh(); } catch(e){ setError(e.message); } };
  const add = () => { if(!draft.title) return; run(async()=>{ await callHotel("/tasks","POST",draft); setShowForm(false); setDraft({...draft,title:""}); }); };
  const updateStatus = (id,status) => run(()=>callId("tasks",id,"PATCH",{status}));
  const [origDue,setOrigDue]=useState("");
  const [showTemplate,setShowTemplate]=useState(false);
  const [showImport,setShowImport]=useState(false);
  const [openActivity,setOpenActivity]=useState(null);
  const startEdit = (t) => { setEditId(t.id); setOrigDue(t.due_date||""); setEdit({title:t.title,department:t.department,priority:t.priority,due_date:t.due_date||"",owner:t.owner||"",assignee_id:t.assignee_id||""}); };
  // Termin nur mitschicken, wenn er geändert wurde – sonst bliebe die Aufgabe nicht mehr ans Eröffnungsdatum gekoppelt.
  const saveEdit = () => { if(!edit.title) return; const body={...edit}; if(body.due_date===origDue) delete body.due_date; run(async()=>{ await callId("tasks",editId,"PATCH",body); setEditId(null); }); };
  const remove = (t) => { if(confirmDelete(tf("Aufgabe „{0}“", t.title))) run(()=>callId("tasks",t.id,"DELETE")); };

  // Filter und Sortierung (pro Browser gemerkt)
  const [filters,setFilters] = useState(()=>{
    try { return {...TASK_FILTER_DEFAULTS, ...JSON.parse(window.localStorage.getItem(LS_TASK_FILTERS)||"{}")}; }
    catch(e){ return TASK_FILTER_DEFAULTS; }
  });
  const setFilter = (k,v) => setFilters(f=>{ const n={...f,[k]:v}; try { window.localStorage.setItem(LS_TASK_FILTERS, JSON.stringify(n)); } catch(e){} return n; });
  const resetFilters = () => { setFilters(TASK_FILTER_DEFAULTS); try { window.localStorage.removeItem(LS_TASK_FILTERS); } catch(e){} };
  const visible = filterTasks(tasks, filters, {me, members});
  const filtersActive = JSON.stringify({...filters, sort:null}) !== JSON.stringify({...TASK_FILTER_DEFAULTS, sort:null});
  const chip = (key,label) => (
    <button onClick={()=>setFilter(key,!filters[key])}

      {ACCESS.role==="admin" && (showTemplate || (tasks.length===0 && !showImport)) && <TemplatePanel callHotel={callHotel} refresh={()=>{ setShowTemplate(true); refresh(); }} onClose={tasks.length>0 ? ()=>setShowTemplate(false) : null} />}
      {showForm && (
        <Card style={{marginBottom:16}}>
          <div className="stack" style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>

            <select className="input" value={draft.department} onChange={e=>setDraft({...draft,department:e.target.value})}>{deptOptions(draft.department).map(d=><option key={d}>{d}</option>)}</select>
            <select className="input" value={draft.priority} onChange={e=>setDraft({...draft,priority:e.target.value})}>{PRIORITIES.map(p=><option key={p}>{p}</option>)}</select>

          <div className="stack" style={{display:"flex",gap:10}}>
            <input type="date" className="input" value={draft.due_date} onChange={e=>setDraft({...draft,due_date:e.target.value})} />
            <AssigneeSelect value={draft.assignee_id} onChange={v=>setDraft({...draft,assignee_id:v})} members={members} />
            <input className="input" placeholder="Extern / Sonstige" value={draft.owner} onChange={e=>setDraft({...draft,owner:e.target.value})} />
            <button className="btn-primary" onClick={add}>Speichern</button>
          </div>
        </Card>
      )}
      {tasks.length>0 && (
        <Card style={{marginBottom:12,padding:14}}>
          <div className="stack" style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 1fr",gap:10,marginBottom:10}}>
            <input className="input" placeholder="Suchen: Titel, Zuständige, Externe …" value={filters.q} onChange={e=>setFilter("q",e.target.value)} />
            <select className="input" value={filters.department} onChange={e=>setFilter("department",e.target.value)}>
              <option value="">Alle Abteilungen</option>{DEPARTMENTS.map(d=><option key={d}>{d}</option>)}
            </select>
            <select className="input" value={filters.status} onChange={e=>setFilter("status",e.target.value)}>
              <option value="">Alle Status</option><option value="open">Alle offenen</option>{TASK_STATUSES.map(s=><option key={s}>{s}</option>)}
            </select>
            <select className="input" value={filters.sort} onChange={e=>setFilter("sort",e.target.value)} title="Sortierung">
              <option value="due">Nach Termin</option><option value="priority">Nach Priorität</option><option value="department">Nach Abteilung</option>
            </select>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            {chip("mine","Nur meine")}{chip("overdue","Überfällig")}{chip("unassigned","Ohne Zuständigkeit")}
            <span style={{marginLeft:"auto",fontSize:12.5,color:INK_MUTED}}>
              {tf("{0} von {1} Aufgaben", visible.length, tasks.length)}
              {filtersActive && <button style={{...linkBtn,textDecoration:"underline"}} onClick={resetFilters}>Filter zurücksetzen</button>}
            </span>
          </div>
        </Card>
      )}
      <Card style={{padding:0}}>
        <table className="resp-table" style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
          {tasks.length>0 && visible.length===0 && <tr><td style={{padding:16,color:INK_MUTED}}>Keine Aufgabe passt zu den Filtern.</td></tr>}
          {visible.map(t=> editId===t.id ? (
            <tr key={t.id} style={{borderTop:`1px solid ${BORDER}`,background:PAPER}}>
              <td colSpan={5} style={{padding:12}}>
                <div className="stack" style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>
                  <input className="input" value={edit.title} onChange={e=>setEdit({...edit,title:e.target.value})} />
                  <select className="input" value={edit.department} onChange={e=>setEdit({...edit,department:e.target.value})}>{deptOptions(edit.department).map(d=><option key={d}>{d}</option>)}</select>
                  <select className="input" value={edit.priority} onChange={e=>setEdit({...edit,priority:e.target.value})}>{PRIORITIES.map(p=><option key={p}>{p}</option>)}</select>
                </div>
                <div className="stack" style={{display:"flex",gap:10,alignItems:"center"}}>
                  <input type="date" className="input" value={edit.due_date} onChange={e=>setEdit({...edit,due_date:e.target.value})} />
                  <AssigneeSelect value={edit.assignee_id} onChange={v=>setEdit({...edit,assignee_id:v})} members={members} />
                  <input className="input" placeholder="Extern / Sonstige" value={edit.owner} onChange={e=>setEdit({...edit,owner:e.target.value})} />
                  <button className="btn-primary" onClick={saveEdit}>Speichern</button>
                  <button style={linkBtn} onClick={()=>setEditId(null)}>Abbrechen</button>
                </div>

            </tr>
          ) : (
            <React.Fragment key={t.id}>
            <tr style={{borderTop:`1px solid ${BORDER}`}}>
              <td style={{padding:12}}>{t.title}<div style={{fontSize:11.5,color:INK_MUTED}}>{t.department}{t.assignee_id ? <span style={{color:t.assignee_id===(me&&me.id)?BRASS:INK_MUTED,fontWeight:t.assignee_id===(me&&me.id)?600:400}}> · {t.assignee_id===(me&&me.id) ? "Du" : (memberEmail(members,t.assignee_id)||"Teammitglied")}</span> : ""}{t.owner ? " · "+t.owner : ""}{offsetLabel(t.opening_offset_days)}</div></td>
              <td style={{padding:12}}><Pill {...priorityColor(t.priority)}>{t.priority}</Pill></td>
              <td style={{padding:12}}>
                <select value={t.status} onChange={e=>updateStatus(t.id,e.target.value)} className="input" style={{width:"auto",padding:"5px 8px",fontSize:12.5}}>{TASK_STATUSES.map(s=><option key={s}>{s}</option>)}</select>
              </td>
              <td style={{padding:12,color:INK_MUTED}}>{fmtDate(t.due_date)}</td>
              <td style={{padding:12,whiteSpace:"nowrap"}}>
                <button style={{...linkBtn,color:openActivity===t.id?INK:INK_MUTED,fontWeight:openActivity===t.id?600:400}} onClick={()=>setOpenActivity(openActivity===t.id?null:t.id)} title="Kommentare und Verlauf">
                  💬 {t.comment_count||0}{t.document_count ? "  📎 "+t.document_count : ""}
                </button>
                <button style={linkBtn} onClick={()=>startEdit(t)}>Bearbeiten</button>
                {canManageDept(t.department) && <button style={linkBtn} onClick={()=>remove(t)} title="Löschen">✕</button>}
              </td>
            </tr>
            {openActivity===t.id && (
              <tr style={{background:PAPER}}>
                <td colSpan={5} style={{padding:"4px 12px 14px"}}>
                  <TaskActivity taskId={t.id} api={api} me={me} onChanged={refresh} docCtx={docCtx} />
                </td>
              </tr>
            )}
            </React.Fragment>
          ))}
        </tbody></table>
      </Card>
    </div>
  );
}

function MilestonesView({milestones, callHotel, callId, refresh}){
  const [draft,setDraft]=useState({title:"",date:"",criticality:"Hoch"});
  const [editId,setEditId]=useState(null); const [edit,setEdit]=useState(null);
  const [error,setError]=useState("");
  const run = async (fn) => { setError(""); try { await fn(); refresh(); } catch(e){ setError(e.message); } };
  const add = () => { if(!draft.title||!draft.date) return; run(async()=>{ await callHotel("/milestones","POST",draft); setDraft({title:"",date:"",criticality:"Hoch"}); }); };
  const updateStatus = (id,status) => run(()=>callId("milestones",id,"PATCH",{status}));
  const [origDate,setOrigDate]=useState("");
  const startEdit = (m) => { setEditId(m.id); setOrigDate(m.date); setEdit({title:m.title,date:m.date,criticality:m.criticality}); };
  const saveEdit = () => { if(!edit.title||!edit.date) return; const body={...edit}; if(body.date===origDate) delete body.date; run(async()=>{ await callId("milestones",editId,"PATCH",body); setEditId(null); }); };
  const remove = (m) => { if(confirmDelete(tf("Meilenstein „{0}“", m.title))) run(()=>callId("milestones",m.id,"DELETE")); };
  return (
    <div>
      <Card style={{marginBottom:16}}>
        <div className="stack" style={{display:"flex",gap:10}}>
          <input className="input" placeholder="Titel" value={draft.title} onChange={e=>setDraft({...draft,title:e.target.value})} />
          <input type="date" className="input" value={draft.date} onChange={e=>setDraft({...draft,date:e.target.value})} />
          <select className="input" value={draft.criticality} onChange={e=>setDraft({...draft,criticality:e.target.value})}><option>Kritisch</option><option>Hoch</option><option>Mittel</option></select>
          <button className="btn-primary" onClick={add}>+</button>
        </div>
      </Card>
      {error && <div style={{color:BAD,fontSize:13,marginBottom:12}}>{error}</div>}
      {[...milestones].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(m=> editId===m.id ? (
        <Card key={m.id} style={{marginBottom:10,background:PAPER}}>
          <div className="stack" style={{display:"flex",gap:10,alignItems:"center"}}>
            <input className="input" value={edit.title} onChange={e=>setEdit({...edit,title:e.target.value})} />
            <input type="date" className="input" value={edit.date} onChange={e=>setEdit({...edit,date:e.target.value})} />
            <select className="input" value={edit.criticality} onChange={e=>setEdit({...edit,criticality:e.target.value})}><option>Kritisch</option><option>Hoch</option><option>Mittel</option></select>
            <button className="btn-primary" onClick={saveEdit}>Speichern</button>
            <button style={linkBtn} onClick={()=>setEditId(null)}>Abbrechen</button>
          </div>
        </Card>
      ) : (
        <Card key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:10,flexWrap:"wrap"}}>
          <div><div style={{fontWeight:600}}>{m.title}</div><div style={{fontSize:12.5,color:INK_MUTED}}>{fmtDate(m.date)} · {m.criticality}{offsetLabel(m.opening_offset_days)}</div></div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <select value={m.status} onChange={e=>updateStatus(m.id,e.target.value)} className="input" style={{width:"auto",padding:"6px 9px",fontSize:12.5}}>{MILESTONE_STATUSES.map(s=><option key={s}>{s}</option>)}</select>
            <button style={linkBtn} onClick={()=>startEdit(m)}>Bearbeiten</button>
            <button style={linkBtn} onClick={()=>remove(m)} title="Löschen">✕</button>
          </div>
        </Card>
      ))}
    </div>
  );
}

function HotelEditForm({hotel, api, onSaved, onCancel}){
  const [form,setForm]=useState({name:hotel.name||"",city:hotel.city||"",country:hotel.country||"",rooms:hotel.rooms||"",opening_date:hotel.opening_date||"",currency:hotel.currency||"EUR",
    brand_color:hotel.brand_color||"", logo_data:hotel.logo_data||"", holiday_region:hotel.holiday_region||""});
  // Logo verkleinern (max. 320 px) und als Bild-Text speichern
  const pickLogo = (file) => {
    if(!file) return;
    if(!/^image\//.test(file.type)){ setError(tf("Bitte eine Bilddatei wählen.")); return; }
    const reader = new FileReader();
    reader.onload = () => {
      if(file.type==="image/svg+xml"){ if(String(reader.result).length>270000) return setError(tf("Das Logo ist zu groß.")); return setForm(f=>({...f, logo_data:reader.result})); }
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 320/Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL("image/png");
        if(data.length>270000) return setError(tf("Das Logo ist zu groß."));
        setForm(f=>({...f, logo_data:data}));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  const [error,setError]=useState(""); const [saving,setSaving]=useState(false);
  const save = async () => {
    if(!form.name) return;
    setSaving(true); setError("");
    try { onSaved(await api("/api/hotels/"+hotel.id,"PATCH",{...form, rooms: form.rooms==="" ? "" : Number(form.rooms), brand_color: form.brand_color || null, logo_data: form.logo_data || null, holiday_region: form.holiday_region || null})); }
    catch(e){ setError(e.message); }
    setSaving(false);
  };
  return (
    <Card style={{marginBottom:18}}>
      <div style={{fontWeight:700,marginBottom:10}}>Hotel bearbeiten</div>
      <div className="stack" style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>
        <input className="input" placeholder="Name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} />
        <input className="input" placeholder="Stadt" value={form.city} onChange={e=>setForm({...form,city:e.target.value})} />
        <input className="input" placeholder="Land" value={form.country} onChange={e=>setForm({...form,country:e.target.value})} />
      </div>
      <div className="stack" style={{display:"flex",gap:10,alignItems:"flex-end"}}>
        <label style={{flex:1}}><div className="field-label">Zimmeranzahl</div><input type="number" className="input" value={form.rooms} onChange={e=>setForm({...form,rooms:e.target.value})} /></label>
        <label style={{flex:1}}><div className="field-label">Eröffnungsdatum</div><input type="date" className="input" value={form.opening_date} onChange={e=>setForm({...form,opening_date:e.target.value})} /></label>
        <label style={{flex:1}}><div className="field-label">Währung</div><CurrencySelect value={form.currency} onChange={v=>setForm({...form,currency:v})} /></label>
        <label style={{flex:1}}><div className="field-label">{tf("Feiertage")}</div>
          <select className="input" value={form.holiday_region} onChange={e=>setForm({...form,holiday_region:e.target.value})}>
            <option value="">{tf("Keine")}</option>
            {HOLIDAY_REGIONS.map(c=>[c, holidayRegionLabel(c, UI_LOCALE)]).sort((a,b)=>a[1].localeCompare(b[1])).map(([c,l])=><option key={c} value={c}>{l}</option>)}
          </select></label>
      </div>
      <div className="stack" style={{display:"flex",gap:16,alignItems:"center",flexWrap:"wrap",marginTop:12,paddingTop:12,borderTop:`1px solid ${BORDER}`}}>
        <div>
          <div className="field-label">{tf("Logo")}</div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:56,height:56,border:`1px solid ${BORDER}`,borderRadius:6,display:"grid",placeItems:"center",background:"#fff",overflow:"hidden"}}>
              {form.logo_data ? <img src={form.logo_data} alt="" style={{maxWidth:"100%",maxHeight:"100%"}} /> : <Logo size={26} color={BRASS} />}
            </div>
            <label style={{...linkBtn,border:`1px solid ${BORDER}`,borderRadius:4,padding:"6px 10px",cursor:"pointer"}}>
              {tf("Logo hochladen")}<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" style={{display:"none"}} onChange={e=>pickLogo(e.target.files[0])} />
            </label>
            {form.logo_data && <button style={{...linkBtn,color:BAD}} onClick={()=>setForm({...form,logo_data:""})}>{tf("Entfernen")}</button>}
          </div>
        </div>
        <div>
          <div className="field-label">{tf("Markenfarbe")}</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input type="color" value={form.brand_color || "#C9A66B"} onChange={e=>setForm({...form,brand_color:e.target.value})} style={{width:44,height:34,border:`1px solid ${BORDER}`,borderRadius:4,padding:2,background:"#fff"}} />
            {form.brand_color && <button style={linkBtn} onClick={()=>setForm({...form,brand_color:""})}>{tf("Standard")}</button>}
          </div>
        </div>
        <div style={{fontSize:12,color:INK_MUTED,flex:"1 1 220px"}}>{tf("Logo und Farbe erscheinen in der Seitenleiste, im Statusbericht und auf geteilten Dienstplan-Bildern.")}</div>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:12}}>
        <button style={linkBtn} onClick={onCancel}>Abbrechen</button>
        <button className="btn-primary" onClick={save} disabled={saving}>{saving?"Speichert…":"Speichern"}</button>
      </div>
      {error && <div style={{color:BAD,fontSize:13,marginTop:10}}>{error}</div>}
    </Card>
  );
}

const BUDGET_CATEGORIES = ["Ausstattung","Personal & Schulung","Marketing","IT & Technik","Bau & Instandhaltung","Vorräte","Dienstleister","Sonstiges"];
// Währungen, die ein Hotel haben kann (muss zu migrations/012 passen)
// Budget-Währungen je Hotel (wie CURRENCIES im Backend / migrations/014)
const CURRENCY_CODES = ["EUR","CHF","GBP","USD","CAD","AUD","NZD","JPY","CNY","HKD","SGD","KRW","INR","THB","MYR","IDR",
  "AED","SAR","QAR","KWD","BHD","OMR","EGP","MAD","TRY","BRL","MXN","ZAR","SEK","NOK","DKK","PLN","CZK","HUF","RON"];
// Name der Währung in der Sprache der Oberfläche (vom Browser, z. B. "日本円" oder "Japanese Yen")
function currencyName(c){ try { return new Intl.DisplayNames([UI_LOCALE], {type:"currency"}).of(c) || c; } catch(e){ return c; } }
const CURRENCIES = CURRENCY_CODES.map(c=>[c, currencyName(c)+" ("+c+")"]);
let HOTEL_CURRENCY = "EUR";
// Eigene Anzeigewährung (null = Währung des Hotels) und Tageskurse (Basis EUR, vom Backend)
const LS_DISPLAY_CURRENCY = "hpoos_display_currency";
let DISPLAY_CURRENCY = (() => { try { return window.localStorage.getItem(LS_DISPLAY_CURRENCY) || null; } catch(e){ return null; } })();
let FX = null;
function setDisplayCurrency(c){ DISPLAY_CURRENCY = c || null; try { if(c) window.localStorage.setItem(LS_DISPLAY_CURRENCY, c); else window.localStorage.removeItem(LS_DISPLAY_CURRENCY); } catch(e){} }
// Betrag aus der Hotelwährung in die Anzeigewährung umrechnen
function convertAmount(n){
  const from = HOTEL_CURRENCY, to = DISPLAY_CURRENCY;
  if(!to || to===from || !FX || !FX.rates || !FX.rates[from] || !FX.rates[to]) return {value:n, currency:from, converted:false};
  return {value: n / FX.rates[from] * FX.rates[to], currency: to, converted: true};
}
function isConverting(){ return convertAmount(1).converted; }
// Beträge des geöffneten Hotels – in der eigenen Anzeigewährung, falls gewählt
function fmtEur(n){ const x = convertAmount(Number(n||0)); return x.value.toLocaleString(UI_LOCALE,{style:"currency",currency:x.currency,maximumFractionDigits:0}); }
function currencySymbol(){ try { return (0).toLocaleString(UI_LOCALE,{style:"currency",currency:HOTEL_CURRENCY,maximumFractionDigits:0}).replace(/[\d\s.,]/g,"") || HOTEL_CURRENCY; } catch(e){ return HOTEL_CURRENCY; } }
function CurrencySelect({value, onChange}){
  return <select className="input" value={value||"EUR"} onChange={e=>onChange(e.target.value)} data-no-i18n="">{CURRENCIES.map(([c,l])=><option key={c} value={c}>{l}</option>)}</select>;
}
function sumBy(items, key, field){
  const out = {};
  items.forEach(i=>{ const k=i[key]; out[k]=(out[k]||0)+Number(i[field]||0); });
  return out;
}
function StatTile({label, value, sub, color}){
  return (
    <Card style={{flex:1,minWidth:150}}>
      <div style={{fontSize:12,color:INK_MUTED,fontWeight:600,marginBottom:4}}>{label}</div>
      <div style={{fontFamily:"Fraunces, serif",fontSize:24,fontWeight:600,color:color||INK}}>{value}</div>
      {sub && <div style={{fontSize:12,color:INK_MUTED,marginTop:2}}>{sub}</div>}
    </Card>
  );
}
function Bar({pct, color}){
  return (
    <div style={{flex:1,height:6,background:PAPER,borderRadius:4,overflow:"hidden"}}>
      <div style={{width:Math.max(0,Math.min(100,pct))+"%",height:"100%",background:color}}></div>
    </div>
  );
}

function BudgetView({items, callHotel, callId, refresh}){
  const empty = {title:"",department:(editableDepts()[0]||DEPARTMENTS[0]),category:BUDGET_CATEGORIES[0],planned:"",actual:"",note:""};
  const [showForm,setShowForm]=useState(false);
  const [draft,setDraft]=useState(empty);
  const [editId,setEditId]=useState(null); const [edit,setEdit]=useState(null);
  const [error,setError]=useState("");
  const run = async (fn) => { setError(""); try { await fn(); refresh(); } catch(e){ setError(e.message); } };
  const toBody = (v) => ({...v, planned:Number(v.planned||0), actual:Number(v.actual||0)});
  const add = () => { if(!draft.title) return; run(async()=>{ await callHotel("/budget","POST",toBody(draft)); setDraft({...empty,department:draft.department,category:draft.category}); setShowForm(false); }); };
  const startEdit = (b) => { setEditId(b.id); setEdit({title:b.title,department:b.department,category:b.category,planned:b.planned,actual:b.actual,note:b.note||""}); };
  const saveEdit = () => { if(!edit.title) return; run(async()=>{ await callId("budget",editId,"PATCH",toBody(edit)); setEditId(null); }); };
  const remove = (b) => { if(confirmDelete(tf("Budgetposten „{0}“", b.title))) run(()=>callId("budget",b.id,"DELETE")); };

  const planned = items.reduce((s,i)=>s+Number(i.planned||0),0);
  const actual = items.reduce((s,i)=>s+Number(i.actual||0),0);
  const diff = planned - actual;
  const plannedByDept = sumBy(items,"department","planned");
  const actualByDept = sumBy(items,"department","actual");
  const depts = Object.keys(plannedByDept).sort();

  return (
    <div>
      <div className="stack" style={{display:"flex",gap:14,marginBottom:18}}>
        <StatTile label="PLAN" value={fmtEur(planned)} sub={tf("{0} Posten", items.length)} />
        <StatTile label="IST" value={fmtEur(actual)} sub={planned>0 ? tf("{0} % vom Plan", Math.round(actual/planned*100)) : "—"} />
        <StatTile label={diff>=0 ? "NOCH VERFÜGBAR" : "ÜBERSCHRITTEN"} value={fmtEur(Math.abs(diff))} color={diff>=0?GOOD:BAD} />
      </div>

      {depts.length>0 && (
        <Card style={{marginBottom:18}}>
          <div style={{fontWeight:700,marginBottom:8}}>Ist vs. Plan je Abteilung</div>
          {depts.map(d=>{
            const p=plannedByDept[d], a=actualByDept[d]||0, pct = p>0 ? a/p*100 : (a>0?100:0);
            return (
              <div key={d} style={{display:"flex",alignItems:"center",gap:10,padding:"5px 0"}}>
                <div className="dept-label" style={{width:150,fontSize:13}}>{d}</div>
                <Bar pct={pct} color={pct>100?BAD:pct>90?WARN:GOOD} />
                <div style={{width:150,textAlign:"right",fontSize:12.5,color:INK_MUTED}}>{fmtEur(a)} / {fmtEur(p)}</div>
              </div>
            );
          })}
        </Card>
      )}

      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
        <button className="btn-primary" onClick={()=>setShowForm(!showForm)}>+ Budgetposten</button>
      </div>
      {error && <div style={{color:BAD,fontSize:13,marginBottom:12}}>{error}</div>}
      {showForm && (
        <Card style={{marginBottom:16}}>
          <BudgetFields value={draft} onChange={setDraft} />
          <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:10}}>
            <button style={linkBtn} onClick={()=>setShowForm(false)}>Abbrechen</button>
            <button className="btn-primary" onClick={add}>Speichern</button>
          </div>
        </Card>
      )}
      <Card style={{padding:0}}>
        <table className="resp-table" style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
          {items.length===0 && <tr><td style={{padding:16,color:INK_MUTED}}>Noch keine Budgetposten.</td></tr>}
          {items.map(b=> editId===b.id ? (
            <tr key={b.id} style={{borderTop:`1px solid ${BORDER}`,background:PAPER}}>
              <td colSpan={4} style={{padding:12}}>
                <BudgetFields value={edit} onChange={setEdit} />
                <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:10}}>
                  <button style={linkBtn} onClick={()=>setEditId(null)}>Abbrechen</button>
                  <button className="btn-primary" onClick={saveEdit}>Speichern</button>
                </div>
              </td>
            </tr>
          ) : (
            <tr key={b.id} style={{borderTop:`1px solid ${BORDER}`}}>
              <td style={{padding:12}}>{b.title}<div style={{fontSize:11.5,color:INK_MUTED}}>{b.department} · {b.category}{b.note ? " · "+b.note : ""}</div></td>

              <td style={{padding:12,whiteSpace:"nowrap"}}>

function StaffView({positions, callHotel, callId, refresh}){
  const empty = {title:"",department:(editableDepts()[0]||DEPARTMENTS[0]),headcount:1,filled:0,start_date:""};
  const [showForm,setShowForm]=useState(false);
  const [draft,setDraft]=useState(empty);
  const [editId,setEditId]=useState(null); const [edit,setEdit]=useState(null);
  const [error,setError]=useState("");
  const run = async (fn) => { setError(""); try { await fn(); refresh(); } catch(e){ setError(e.message); } };
  const check = (v) => {
    const h=Number(v.headcount), f=Number(v.filled);
    if(!v.title) return "Bitte eine Stellenbezeichnung eingeben.";
    if(!(h>=1)) return "„Benötigt“ muss mindestens 1 sein.";
    if(f<0 || f>h) return "„Besetzt“ muss zwischen 0 und „Benötigt“ liegen.";
    return "";
  };
  const toBody = (v) => ({...v, headcount:Number(v.headcount), filled:Number(v.filled)});
  const add = () => { const m=check(draft); if(m) return setError(m); run(async()=>{ await callHotel("/staff","POST",toBody(draft)); setDraft({...empty,department:draft.department}); setShowForm(false); }); };
  const startEdit = (p) => { setEditId(p.id); setEdit({title:p.title,department:p.department,headcount:p.headcount,filled:p.filled,start_date:p.start_date||""}); };
  const saveEdit = () => { const m=check(edit); if(m) return setError(m); run(async()=>{ await callId("staff",editId,"PATCH",toBody(edit)); setEditId(null); }); };
  const step = (p, d) => { const f=p.filled+d; if(f<0||f>p.headcount) return; run(()=>callId("staff",p.id,"PATCH",{filled:f})); };
  const remove = (p) => { if(confirmDelete(tf("Stelle „{0}“", p.title))) run(()=>callId("staff",p.id,"DELETE")); };

  const need = positions.reduce((s,p)=>s+p.headcount,0);
  const have = positions.reduce((s,p)=>s+p.filled,0);
  const pct = need>0 ? Math.round(have/need*100) : 0;
  const needByDept = sumBy(positions,"department","headcount");
  const haveByDept = sumBy(positions,"department","filled");
  const depts = Object.keys(needByDept).sort();
  const today = new Date();
  const urgent = positions.filter(p=>p.filled<p.headcount && p.start_date && (new Date(p.start_date)-today)/86400000 <= 30).length;

  return (
    <div>
      <div className="stack" style={{display:"flex",gap:14,marginBottom:18}}>
        <StatTile label="BESETZT" value={pct+" %"} sub={tf("{0} von {1} Personen", have, need)} color={pct>=80?GOOD:pct>=50?WARN:BAD} />
        <StatTile label="OFFEN" value={need-have} sub={(n=>n===1?tf("1 Stelle mit Lücken"):tf("{0} Stellen mit Lücken", n))(positions.filter(p=>p.filled<p.headcount).length)} />
        <StatTile label="DRINGEND" value={urgent} sub={tf("offen, Start in ≤ 30 Tagen")} color={urgent>0?BAD:INK} />
      </div>

      {depts.length>0 && (
        <Card style={{marginBottom:18}}>
          <div style={{fontWeight:700,marginBottom:8}}>Besetzung je Abteilung</div>
          {depts.map(d=>{
            const n=needByDept[d], h=haveByDept[d]||0, p=n>0?h/n*100:0;
            return (
              <div key={d} style={{display:"flex",alignItems:"center",gap:10,padding:"5px 0"}}>
                <div className="dept-label" style={{width:150,fontSize:13}}>{d}</div>
                <Bar pct={p} color={p>=80?GOOD:p>=50?WARN:BAD} />
                <div style={{width:60,textAlign:"right",fontSize:12.5,color:INK_MUTED}}>{h} / {n}</div>
              </div>
            );
          })}
        </Card>
      )}

      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
        <button className="btn-primary" onClick={()=>setShowForm(!showForm)}>+ Stelle</button>
      </div>
      {error && <div style={{color:BAD,fontSize:13,marginBottom:12}}>{error}</div>}
      {showForm && (
        <Card style={{marginBottom:16}}>
          <StaffFields value={draft} onChange={setDraft} />
          <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:10}}>
            <button style={linkBtn} onClick={()=>setShowForm(false)}>Abbrechen</button>
            <button className="btn-primary" onClick={add}>Speichern</button>
          </div>
        </Card>
      )}
      <Card style={{padding:0}}>
        <table className="resp-table" style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
          {positions.length===0 && <tr><td style={{padding:16,color:INK_MUTED}}>Noch keine Stellen angelegt.</td></tr>}
          {[...positions].sort((a,b)=>a.department.localeCompare(b.department)).map(p=> editId===p.id ? (
            <tr key={p.id} style={{borderTop:`1px solid ${BORDER}`,background:PAPER}}>
              <td colSpan={4} style={{padding:12}}>
                <StaffFields value={edit} onChange={setEdit} />
                <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:10}}>
                  <button style={linkBtn} onClick={()=>setEditId(null)}>Abbrechen</button>
                  <button className="btn-primary" onClick={saveEdit}>Speichern</button>
                </div>
              </td>
            </tr>
          ) : (
            <tr key={p.id} style={{borderTop:`1px solid ${BORDER}`}}>
              <td style={{padding:12}}>{p.title}<div style={{fontSize:11.5,color:INK_MUTED}}>{p.department}{p.start_date ? " · "+tf("Start {0}", fmtDate(p.start_date)) : ""}</div></td>
              <td style={{padding:12,whiteSpace:"nowrap"}}>
                <button style={{...linkBtn,border:`1px solid ${BORDER}`,borderRadius:6,padding:"2px 9px"}} onClick={()=>step(p,-1)} title="Eine Person weniger">−</button>
                <span style={{display:"inline-block",minWidth:54,textAlign:"center",fontWeight:600}}>{p.filled} / {p.headcount}</span>
                <button style={{...linkBtn,border:`1px solid ${BORDER}`,borderRadius:6,padding:"2px 9px"}} onClick={()=>step(p,1)} title="Eine Person mehr">+</button>
              </td>
              <td style={{padding:12}}>
                {p.filled>=p.headcount ? <Pill color={GOOD} bg={GOOD_SOFT}>Besetzt</Pill> : <Pill color={WARN} bg={WARN_SOFT}>{tf("{0} offen", p.headcount-p.filled)}</Pill>}
              </td>
              <td style={{padding:12,whiteSpace:"nowrap"}}>
                <button style={linkBtn} onClick={()=>startEdit(p)}>Bearbeiten</button>
                <button style={linkBtn} onClick={()=>remove(p)} title="Löschen">✕</button>
              </td>
            </tr>
          ))}
        </tbody></table>
      </Card>
    </div>
  );
}

function OrgRenameCard({orgId, orgName, api, onRenamed}){
  const [name,setName] = useState(orgName);
  const [msg,setMsg] = useState(""); const [error,setError] = useState(""); const [saving,setSaving] = useState(false);
  useEffect(()=>{ setName(orgName); }, [orgName]);
  const save = async () => {
    if(!name.trim() || name.trim()===orgName) return;
    setSaving(true); setError(""); setMsg("");
    try { onRenamed(await api("/api/organizations/"+orgId,"PATCH",{name})); setMsg("Gespeichert."); }
    catch(e){ setError(e.message); }
    setSaving(false);
  };
  return (
    <Card style={{marginBottom:18}}>
      <div style={{fontWeight:700,marginBottom:10}}>Organisation</div>
      <div className="stack" style={{display:"flex",gap:10}}>
        <input className="input" value={name} onChange={e=>{setName(e.target.value);setMsg("");}} onKeyDown={e=>e.key==="Enter"&&save()} placeholder="Name der Organisation, z. B. Hotelgruppe Wien" />
        <button className="btn-primary" onClick={save} disabled={saving}>{saving?"…":"Umbenennen"}</button>
      </div>
      {error && <div style={{color:BAD,fontSize:13,marginTop:10}}>{error}</div>}
      {msg && <div style={{color:GOOD,fontSize:13,marginTop:10}}>{msg}</div>}
    </Card>
  );
}

// Druckfertiger Statusbericht (A4) – über den Druckdialog des Browsers als PDF speicherbar.
function ReportView({hotel, orgName, me, readiness, tasks, milestones, risks, budget, staff, aiReport, onClose}){
  useEffect(()=>{
    const prev = document.title;
    // Der Titel wird im Druckdialog als Dateiname vorgeschlagen.
    document.title = tf("Statusbericht {0}", hotel.name) + " " + new Date().toISOString().slice(0,10);
    return () => { document.title = prev; };
  }, [hotel.name]);

  const today = new Date().toISOString().slice(0,10);
  const r = readiness || {overall:0, deptScores:{}};
  const scoreColor = (s) => s>=80 ? GOOD : s>=60 ? WARN : BAD;
  const isLate = (t) => t.due_date && t.due_date < today && t.status!=="Abgeschlossen";

  const doneTasks = tasks.filter(t=>t.status==="Abgeschlossen").length;
  const openTasks = tasks.length - doneTasks;
  const lateTasks = tasks.filter(isLate);
  const urgentLate = lateTasks.filter(t=>t.priority==="Kritisch"||t.priority==="Hoch")
    .sort((a,b)=>(PRIORITY_RANK[a.priority]-PRIORITY_RANK[b.priority]) || (a.due_date<b.due_date?-1:1));
  const blocked = tasks.filter(t=>t.status==="Blockiert");

  const msOpen = milestones.filter(m=>m.status!=="Abgeschlossen").sort((a,b)=>a.date<b.date?-1:1);
  const msAtRisk = msOpen.filter(m=>m.status==="Gefährdet" || m.date < today);
  const msNext = msOpen.filter(m=>!msAtRisk.includes(m)).slice(0,5);

  const planned = budget.reduce((s,i)=>s+Number(i.planned||0),0);
  const actual = budget.reduce((s,i)=>s+Number(i.actual||0),0);
  const pB = sumBy(budget,"department","planned"), aB = sumBy(budget,"department","actual");
  const overDepts = Object.keys(pB).filter(d=>(aB[d]||0)>pB[d]).map(d=>({d, over:(aB[d]||0)-pB[d], pct: pB[d]>0 ? Math.round(((aB[d]||0)-pB[d])/pB[d]*100) : null}));

  const need = staff.reduce((s,p)=>s+p.headcount,0), have = staff.reduce((s,p)=>s+Math.min(p.filled,p.headcount),0);
  const openPositions = staff.filter(p=>p.filled<p.headcount).sort((a,b)=>(a.start_date||"9999")<(b.start_date||"9999")?-1:1);

  const topRisks = [...risks].sort((a,b)=>b.probability*b.impact - a.probability*a.impact).slice(0,5);
  const days = r.daysToOpening;

    </div>
  );
  const None = ({children}) => <div style={{color:INK_MUTED}}>{children}</div>;

  return (
    <div className="report-wrap" style={{background:PAPER,minHeight:"100vh",padding:"16px 12px"}}>
      <div className="no-print" style={{maxWidth:"210mm",margin:"0 auto 12px",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>

        <button className="btn-primary" onClick={()=>window.print()}>Als PDF speichern / Drucken</button>
      </div>

      <div className="report" style={{boxShadow:"0 1px 8px rgba(0,0,0,0.08)",borderRadius:6}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
          <div>
            {hotel.logo_data && <img src={hotel.logo_data} alt="" style={{height:44,maxWidth:160,objectFit:"contain",marginBottom:6,display:"block"}} />}
            <div style={{fontSize:11,color:hotel.brand_color||INK_MUTED,fontWeight:600,letterSpacing:0.5}}>STATUSBERICHT PRE-OPENING</div>
            <div style={{fontFamily:"Fraunces, serif",fontSize:24,fontWeight:600}}>{hotel.name}</div>
            <div style={{color:INK_MUTED}}>{[hotel.city, hotel.country].filter(Boolean).join(", ")}{hotel.rooms ? " · "+tf("{0} Zimmer", hotel.rooms) : ""}{orgName ? " · "+orgName : ""}</div>
          </div>
          <div style={{textAlign:"right",fontSize:11.5,color:INK_MUTED}}>
            <div>Stand: <b style={{color:INK}}>{fmtDate(today)}</b></div>
            <div>Eröffnung: <b style={{color:INK}}>{fmtDate(hotel.opening_date)}</b></div>
            {days!=null && <div>{days>=0 ? tf("noch {0} Tage", days) : tf("seit {0} Tagen eröffnet", -days)}</div>}
            {me && <div>{tf("erstellt von {0}", me.email)}</div>}
          </div>
        </div>

        <div className="avoid-break" style={{display:"flex",gap:16,marginTop:16,alignItems:"stretch"}}>
          <div style={{border:`1px solid ${BORDER}`,borderRadius:8,padding:"10px 16px",textAlign:"center",minWidth:120}}>
            <div style={{fontSize:10.5,color:INK_MUTED,fontWeight:600}}>IM ZEITPLAN</div>
            <div style={{fontFamily:"Fraunces, serif",fontSize:40,fontWeight:600,color:scoreColor(r.overall),lineHeight:1.1}}>{r.overall}%</div>
            {r.progressPct!=null && <div style={{fontSize:10.5,color:INK_MUTED,marginTop:2}}>{tf("{0} % aller Aufgaben erledigt", r.progressPct)}</div>}
          </div>
          <div style={{flex:1}}>
            {Object.entries(r.deptScores||{}).sort((a,b)=>a[1]-b[1]).map(([d,s])=>(
              <div key={d} style={{display:"flex",alignItems:"center",gap:8,padding:"2px 0"}}>
                <div style={{width:140,fontSize:11.5}}>{d}</div>
                <Bar pct={s} color={scoreColor(s)} />
                <div style={{width:34,textAlign:"right",fontSize:11.5,fontWeight:700}}>{s}%</div>
              </div>
            ))}
            {Object.keys(r.deptScores||{}).length===0 && <None>Noch keine Abteilungsdaten.</None>}
          </div>
        </div>

        <div className="avoid-break" style={{display:"flex",gap:8,marginTop:12}}>
          <Kpi label="AUFGABEN" value={doneTasks+" / "+tasks.length} sub={tf("{0} offen · {1} überfällig", openTasks, lateTasks.length)} color={lateTasks.length?BAD:INK} />
          <Kpi label="MEILENSTEINE" value={msAtRisk.length ? tf("{0} gefährdet", msAtRisk.length) : tf("im Plan")} sub={tf("{0} offen", msOpen.length)} color={msAtRisk.length?BAD:GOOD} />
          <Kpi label="BUDGET (IST / PLAN)" value={planned>0 ? Math.round(actual/planned*100)+" %" : "—"} sub={fmtEur(actual)+" / "+fmtEur(planned)} color={actual>planned?BAD:INK} />
          <Kpi label="PERSONAL" value={need>0 ? Math.round(have/need*100)+" %" : "—"} sub={tf("{0} / {1} besetzt", have, need)} color={need>0 && have/need<0.5?BAD:INK} />
        </div>

        {aiReport && (
          <React.Fragment>
            <h2 style={{display:"flex",alignItems:"center",gap:8}}>
              Einschätzung
              <span style={{fontFamily:"Inter, sans-serif",fontSize:11,fontWeight:700,color:(AMPEL[aiReport.content.ampel]||AMPEL["gelb"]).color}}>● {(AMPEL[aiReport.content.ampel]||AMPEL["gelb"]).label}</span>
              <span style={{fontFamily:"Inter, sans-serif",fontSize:10.5,fontWeight:400,color:INK_MUTED,marginLeft:"auto"}}>{tf("KI-Lagebericht vom {0}", fmtDateTime(aiReport.created_at))}</span>
            </h2>
            <AiReportBody content={aiReport.content} full />
          </React.Fragment>
        )}

        <h2>Überfällige Aufgaben mit hoher Priorität</h2>
        {urgentLate.length===0 ? <None>Keine.</None> : (
          <table><thead><tr><th>Aufgabe</th><th>Abteilung</th><th>Priorität</th><th>Fällig</th><th>Status</th></tr></thead><tbody>
            {urgentLate.slice(0,12).map(t=>(
              <tr key={t.id}><td>{t.title}</td><td>{t.department}</td><td style={{color:priorityColor(t.priority).color,fontWeight:600}}>{t.priority}</td><td style={{color:BAD}}>{fmtDate(t.due_date)}</td><td>{t.status}</td></tr>
            ))}
          </tbody></table>
        )}
        {urgentLate.length>12 && <None>{tf("… und {0} weitere.", urgentLate.length-12)}</None>}
        {blocked.length>0 && <div style={{marginTop:6}}><b>Blockiert:</b> {blocked.map(t=>t.title).join(" · ")}</div>}

        <h2>Meilensteine</h2>
        {msAtRisk.length===0 && msNext.length===0 ? <None>Keine offenen Meilensteine.</None> : (
          <table><thead><tr><th>Meilenstein</th><th>Datum</th><th>Kritikalität</th><th>Status</th></tr></thead><tbody>
            {[...msAtRisk, ...msNext].map(m=>{
              const risk = msAtRisk.includes(m);
              return <tr key={m.id}><td style={{fontWeight:risk?600:400}}>{m.title}</td><td style={{color:risk?BAD:INK}}>{fmtDate(m.date)}</td><td>{m.criticality}</td><td style={{color:risk?BAD:INK}}>{m.date<today ? "überfällig" : m.status}</td></tr>;
            })}
          </tbody></table>
        )}

        <h2>Größte Risiken</h2>
        {topRisks.length===0 ? <None>Keine Risiken erfasst.</None> : (
          <table><thead><tr><th>Risiko</th><th>Abteilung</th><th>Score</th><th>Gegenmaßnahme</th></tr></thead><tbody>
            {topRisks.map(x=>(
              <tr key={x.id} className="avoid-break"><td>{x.title}</td><td>{x.department}</td><td style={{fontWeight:700,color:x.probability*x.impact>=16?BAD:x.probability*x.impact>=9?WARN:INK}}>{x.probability*x.impact}</td><td>{x.mitigation || <span style={{color:BAD}}>keine festgelegt</span>}</td></tr>
            ))}
          </tbody></table>
        )}

        <div className="avoid-break" style={{display:"flex",gap:20}}>
          <div style={{flex:1}}>
            <h2>Budget</h2>
            {budget.length===0 ? <None>Kein Budget erfasst.</None> : (
              <React.Fragment>
                <div>{tf("Plan {0} · Ist {1}", fmtEur(planned), fmtEur(actual))} · {planned>=actual ? tf("verfügbar {0}", fmtEur(planned-actual)) : <b style={{color:BAD}}>{tf("überschritten um {0}", fmtEur(actual-planned))}</b>}</div>
                {overDepts.length>0 ? (
                  <div style={{marginTop:6}}>{overDepts.map(o=><div key={o.d} style={{color:BAD}}>{translateString(o.d)}: +{fmtEur(o.over)}{o.pct!=null ? " "+tf("({0} % über Plan)", o.pct) : ""}</div>)}</div>
                ) : <div style={{marginTop:6,color:GOOD}}>Alle Abteilungen im Plan.</div>}
              </React.Fragment>
            )}
          </div>
          <div style={{flex:1}}>
            <h2>Personal</h2>
            {staff.length===0 ? <None>Keine Stellen erfasst.</None> : (
              <React.Fragment>
                <div>{tf("{0} von {1} Personen eingestellt · {2} offen", have, need, need-have)}</div>
                {openPositions.slice(0,8).map(p=>(
                  <div key={p.id} style={{color:p.start_date && p.start_date<today ? BAD : INK}}>
                    {p.title} ({translateString(p.department)}): {tf("{0} offen", p.headcount-p.filled)}{p.start_date ? ", "+tf("Start {0}", fmtDate(p.start_date)) : ""}
                  </div>
                ))}
                {openPositions.length>8 && <None>{tf("… und {0} weitere Stellen.", openPositions.length-8)}</None>}
              </React.Fragment>
            )}
          </div>
        </div>

        <div style={{marginTop:18,paddingTop:6,borderTop:`1px solid ${BORDER}`,fontSize:10,color:INK_MUTED,display:"flex",justifyContent:"space-between"}}>
          <span>Erstellt mit Ouverture</span><span>{new Date().toLocaleString(UI_LOCALE)}</span>
        </div>
      </div>
    </div>
  );
}
