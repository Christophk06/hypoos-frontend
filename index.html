// Alle Daten eines Hotels als Excel-Datei mit einem Blatt je Bereich.
async function exportHotelXlsx({hotel, tasks, milestones, risks, budget, staff, members}){
  const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
  const email = (id) => (members.find(m=>m.user_id===id)||{}).email || "";
  const T = translateString, C = (k) => tf(k);
  const sheets = [
    [C("Aufgaben"), tasks.map(t=>({[C("Aufgabe")]:t.title, [C("Abteilung")]:T(t.department), [C("Priorität")]:T(t.priority), [C("Status")]:T(t.status), [C("Fällig")]:t.due_date||"", [C("Zuständig")]:email(t.assignee_id)||t.owner||""}))],
    [C("Meilensteine"), milestones.map(m=>({[C("Meilenstein")]:m.title, [C("Datum")]:m.date, [C("Kritikalität")]:T(m.criticality), [C("Status")]:T(m.status)}))],
    [C("Risiken"), risks.map(r=>({[C("Risiko")]:r.title, [C("Abteilung")]:T(r.department), [C("Wahrscheinlichkeit")]:r.probability, [C("Auswirkung")]:r.impact, [C("Score")]:r.probability*r.impact, [C("Gegenmaßnahme")]:r.mitigation||""}))],
    [C("Budget"), budget.map(b=>({[C("Posten")]:b.title, [C("Abteilung")]:T(b.department), [C("Kategorie")]:T(b.category), [tf("Plan ({0})", HOTEL_CURRENCY)]:Number(b.planned), [tf("Ist ({0})", HOTEL_CURRENCY)]:Number(b.actual), [C("Notiz")]:b.note||""}))],
    [C("Personal"), staff.map(p=>({[C("Stelle")]:p.title, [C("Abteilung")]:T(p.department), [C("Benötigt")]:p.headcount, [C("Besetzt")]:p.filled, [C("Offen")]:p.headcount-p.filled, [C("Start")]:p.start_date||""}))],
  ];
  const wide = [C("Aufgabe"), C("Risiko"), C("Posten"), C("Meilenstein"), C("Gegenmaßnahme")];
  const wb = XLSX.utils.book_new();
  for(const [name, rows] of sheets){
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{[C("Hinweis")]:C("Keine Einträge")}]);
    ws["!cols"] = Object.keys(rows[0]||{x:""}).map(k=>({wch: wide.includes(k) ? 48 : 16}));
    XLSX.utils.book_append_sheet(wb, ws, String(name).slice(0,31));
  }
  const safe = hotel.name.replace(/[\\/:*?"<>|\[\]]+/g,"").trim() || "Hotel";
  XLSX.writeFile(wb, "Ouverture " + safe + " " + new Date().toISOString().slice(0,10) + ".xlsx");
}

/* ------------------------------ Kalender-Export ------------------------------ */
// Offene Fristen und Meilensteine als ganztägige Termine (.ics) für Outlook, Google, Apple.
function icsEscape(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1"); }
function icsFold(line){
  // Zeilen über 75 Zeichen umbrechen (Folgezeilen beginnen mit einem Leerzeichen)
  const parts = []; let rest = line;
  while(rest.length > 74){ parts.push(rest.slice(0,74)); rest = " " + rest.slice(74); }
  parts.push(rest); return parts.join("\r\n");
}
function buildIcs({hotel, tasks, milestones}){
  const day = (iso) => iso.replace(/-/g,"");
  const next = (iso) => { const d = new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10).replace(/-/g,""); };
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ev = (uid, date, summary, desc) => [
    "BEGIN:VEVENT", "UID:"+uid+"@ouverture", "DTSTAMP:"+stamp,
    "DTSTART;VALUE=DATE:"+day(date), "DTEND;VALUE=DATE:"+next(date),
    "SUMMARY:"+icsEscape(summary), "DESCRIPTION:"+icsEscape(desc), "TRANSP:TRANSPARENT", "END:VEVENT",
  ];
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ouverture//Pre-Opening//DE","CALSCALE:GREGORIAN",
    "X-WR-CALNAME:"+icsEscape("Ouverture – "+hotel.name)];
  const T = translateString;
  if(hotel.opening_date) lines.push(...ev("opening-"+hotel.id, hotel.opening_date, "🎉 "+tf("Eröffnung {0}", hotel.name), tf("Eröffnungstermin")));
  milestones.filter(m=>m.date && m.status!=="Abgeschlossen").forEach(m=>lines.push(...ev("m-"+m.id, m.date, "◆ "+m.title, T("Meilenstein")+" · "+T(m.criticality)+" · "+T(m.status))));
  tasks.filter(t=>t.due_date && t.status!=="Abgeschlossen").forEach(t=>lines.push(...ev("t-"+t.id, t.due_date, t.title, T(t.department)+" · "+tf("Priorität {0}", T(t.priority))+" · "+T(t.status)+(t.owner?" · "+t.owner:""))));
  lines.push("END:VCALENDAR");
  return lines.map(icsFold).join("\r\n") + "\r\n";
}
function downloadIcs(data){
  const blob = new Blob([buildIcs(data)], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Ouverture " + data.hotel.name.replace(/[^\wäöüÄÖÜß -]/g,"").trim() + " " + tf("Termine") + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* -------------------------------- Zeitstrahl -------------------------------- */
function TimelineView({hotel, tasks, milestones}){
  const [onlyOpen,setOnlyOpen] = useState(false);
  const [range,setRange] = useState(()=>{ try { return window.localStorage.getItem("hpoos_timeline_range") || "all"; } catch(e){ return "all"; } });
  const pickRange = (r) => { setRange(r); try { window.localStorage.setItem("hpoos_timeline_range", r); } catch(e){} };
  const [picked,setPicked] = useState(null);
  const [labelsPref,setLabelsPref] = useState(null); // null = automatisch (Beschriftung im 6-Wochen-Zeitraum)
  // Breite der Zeitachse messen, damit nahe Aufgaben in eigene Spuren rücken statt sich zu überlappen
  const boxRef = React.useRef(null);
  const [boxW,setBoxW] = useState(1000);
  useEffect(()=>{
    if(!boxRef.current || !window.ResizeObserver) return;
    const ro = new ResizeObserver(es=>setBoxW(es[0].contentRect.width));
    ro.observe(boxRef.current); return () => ro.disconnect();
  },[boxRef.current]);
  const today = new Date().toISOString().slice(0,10);
  const toT = (iso) => new Date(iso+"T00:00:00Z").getTime();
  const addD = (iso, n) => new Date(toT(iso)+n*86400000).toISOString().slice(0,10);
  const allDated = tasks.filter(t=>t.due_date);
  if(allDated.length===0 && milestones.length===0) return <Card><div style={{color:INK_MUTED,fontSize:13.5}}>Noch keine Aufgaben oder Meilensteine mit Termin.</div></Card>;

  // Zeitraum: alles, nächste 3 Monate oder nächste 6 Wochen (jeweils mit zwei Wochen Rückblick)
  const dates = [...allDated.map(t=>t.due_date), ...milestones.map(m=>m.date), today, hotel.opening_date].filter(Boolean).sort();
  let startIso = dates[0], endIso = dates[dates.length-1];
  if(range!=="all"){ startIso = addD(today,-14); endIso = addD(today, range==="6w" ? 42 : 91); }
  const inRange = (iso) => iso >= startIso && iso <= endIso;
  const dated = allDated.filter(t=>(!onlyOpen || t.status!=="Abgeschlossen") && inRange(t.due_date));
  const ms = milestones.filter(m=>m.date && inRange(m.date));
  const pad = 3*86400000;
  const start = toT(startIso) - pad, end = toT(endIso) + pad;
  const frac = (iso) => (toT(iso)-start)/(end-start);
  const pos = (iso) => (frac(iso)*100) + "%";

  const depts = [...new Set(allDated.map(t=>t.department))].sort((a,b)=>DEPARTMENTS.indexOf(a)-DEPARTMENTS.indexOf(b));
  const colorOf = (t) => t.status==="Abgeschlossen" ? GOOD : (t.due_date<today ? BAD : t.status==="Blockiert" ? WARN : BRASS);
  // Achse: Monate, im kurzen Zeitraum Wochen
  const ticks = [];
  if(range==="all"){ const d = new Date(start); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+1);
    while(d.getTime() < end){ const iso = d.toISOString().slice(0,10); ticks.push({iso, label:new Date(iso+"T12:00:00").toLocaleDateString(UI_LOCALE,{month:"short",year:"2-digit"})}); d.setUTCMonth(d.getUTCMonth()+1); } }
  else { let iso = mondayOfIso(startIso); while(toT(iso) < end){ if(toT(iso) > start) ticks.push({iso, label:tf("KW {0}", isoWeekNumber(iso))}); iso = addD(iso, 7); } }

  // Kennzahlen
  const open = allDated.filter(t=>t.status!=="Abgeschlossen");
  const late = open.filter(t=>t.due_date<today);
  const doneShare = allDated.length ? Math.round((allDated.length-open.length)/allDated.length*100) : 0;
  const nextMs = milestones.filter(m=>m.date && m.date>=today && m.status!=="Abgeschlossen").sort((a,b)=>a.date<b.date?-1:1)[0];
  const daysLeft = hotel.opening_date ? Math.round((toT(hotel.opening_date)-toT(today))/86400000) : null;

  // Agenda: Überfälliges und die nächsten 3 Wochen, nach Woche gruppiert
  const agendaEnd = addD(today, 21);
  const agendaItems = [
    ...open.filter(t=>t.due_date<=agendaEnd).map(t=>({kind:"task", date:t.due_date, item:t})),
    ...milestones.filter(m=>m.date && m.status!=="Abgeschlossen" && m.date<=agendaEnd && m.date>=addD(today,-30)).map(m=>({kind:"ms", date:m.date, item:m})),
  ].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const agendaGroups = [];
  agendaItems.forEach(a=>{
    const key = a.date<today ? "late" : mondayOfIso(a.date);
    let g = agendaGroups.find(x=>x.key===key); if(!g){ g = {key, items:[]}; agendaGroups.push(g); }
    g.items.push(a);
  });

  const LABEL_W = 190;
  const Row = ({label, sub, children, height=40}) => (
    <div style={{display:"flex",alignItems:"stretch",borderTop:`1px solid ${BORDER}`,minHeight:height}}>
      <div style={{width:LABEL_W,flexShrink:0,fontSize:12.5,padding:"6px 10px",display:"flex",flexDirection:"column",justifyContent:"center",gap:3}}>
        <div style={{fontWeight:600}}>{label}</div>{sub}
      </div>
      <div style={{position:"relative",flex:1,height}}>{children}</div>
    </div>
  );
  const VLine = ({iso, color, label, dashed}) => frac(iso)<0 || frac(iso)>1 ? null : (
    <div style={{position:"absolute",top:0,bottom:0,insetInlineStart:`calc(${LABEL_W}px + (100% - ${LABEL_W}px) * ${frac(iso)})`,borderInlineStart:`2px ${dashed?"dashed":"solid"} ${color}`,pointerEvents:"none",zIndex:1}}>
      <div style={{position:"absolute",top:-20,insetInlineStart:-40,width:80,textAlign:"center",fontSize:11,fontWeight:700,color}}>{label}</div>
    </div>
  );
  // Spuren: Aufgaben, die sich sonst überdecken würden, kommen in die nächste Zeile
  const showLabels = labelsPref===null ? range==="6w" : labelsPref;
  const trackW = Math.max(300, boxW - LABEL_W);
  const CHIP_W = 168, LANE_H = showLabels ? 26 : 18;
  const layout = (list) => {
    const sorted = [...list].sort((a,b)=>a.due_date<b.due_date?-1:a.due_date>b.due_date?1:0);
    const ends = []; const placed = [];
    for(const t of sorted){
      const x = frac(t.due_date)*trackW;
      const left = showLabels ? x-7 : x-9, right = showLabels ? x-7+CHIP_W : x+9;
      let lane = ends.findIndex(e=>e <= left);
      if(lane<0){ lane = ends.length; ends.push(0); }
      ends[lane] = right + 4; placed.push({t, lane});
    }
    return {placed, lanes: Math.max(1, ends.length)};
  };
  // Meilenstein-Beschriftungen in Spuren, damit sich die Namen nicht überdecken
  const msLane = {}; let msLanes = 1;
  { const ends = []; [...ms].sort((a,b)=>a.date<b.date?-1:1).forEach(m=>{
      const x = frac(m.date)*trackW; let l = ends.findIndex(e=>e<=x-75);
      if(l<0){ l = ends.length; ends.push(0); } ends[l] = x+81; msLane[m.id] = l; });
    msLanes = Math.max(1, ends.length); }
  const Dot = ({t, lane}) => {
    const big = t.priority==="Kritisch", size = big ? 14 : 10, on = picked && picked.item.id===t.id;
    const top = 8 + lane*LANE_H + LANE_H/2;
    const title = t.title+" · "+tf("fällig {0}", fmtDate(t.due_date))+" · "+translateString(t.status);
    const dot = <span style={{display:"inline-block",width:size,height:size,flexShrink:0,borderRadius:"50%",background:colorOf(t),border:"2px solid #fff",boxShadow:"0 0 0 "+(on?3:1)+"px "+colorOf(t)}} />;
    if(!showLabels) return <button onClick={()=>setPicked(on ? null : {kind:"task", item:t})} title={title} aria-label={t.title}
      style={{position:"absolute",insetInlineStart:pos(t.due_date),top,marginInlineStart:-size/2,marginTop:-size/2,padding:0,border:"none",background:"none",lineHeight:0,cursor:"pointer"}}>{dot}</button>;
    return <button onClick={()=>setPicked(on ? null : {kind:"task", item:t})} title={title}
      style={{position:"absolute",insetInlineStart:pos(t.due_date),top:top-10,height:20,maxWidth:CHIP_W,marginInlineStart:-7,display:"flex",alignItems:"center",gap:5,
        padding:"0 7px 0 2px",border:`1px solid ${on?colorOf(t):BORDER}`,borderRadius:999,background:"#fff",cursor:"pointer",fontSize:11,color:INK,whiteSpace:"nowrap",overflow:"hidden"}}>
      {dot}<span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{t.title}</span>
    </button>;
  };
  const Kpi = ({label, value, color}) => (
    <Card style={{padding:"12px 14px"}}>
      <div style={{fontSize:11.5,color:INK_MUTED,fontWeight:600}}>{label}</div>
      <div style={{fontFamily:"Fraunces, serif",fontSize:22,fontWeight:600,color:color||INK}}>{value}</div>
    </Card>
  );
  const seg = (k, label) => <button key={k} onClick={()=>pickRange(k)} style={{border:`1px solid ${range===k?INK:BORDER}`,background:range===k?INK:"#fff",color:range===k?"#fff":INK,borderRadius:999,padding:"5px 12px",fontSize:12.5,cursor:"pointer"}}>{label}</button>;

  return (
    <div>
      <div className="stack" style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(160px, 1fr))",gap:12,marginBottom:14}}>
        <Kpi label={tf("Bis zur Eröffnung")} value={daysLeft==null ? "—" : daysLeft>=0 ? tf("{0} Tage", daysLeft) : tf("seit {0} Tagen eröffnet", -daysLeft)} />
        <Kpi label={tf("Erledigt")} value={doneShare+" %"} color={doneShare>=80?GOOD:INK} />
        <Kpi label={tf("Überfällig")} value={late.length} color={late.length?BAD:GOOD} />
        <Kpi label={tf("Nächster Meilenstein")} value={nextMs ? <span style={{fontSize:14,fontFamily:"Inter, sans-serif",display:"block",lineHeight:1.3}}><span>{nextMs.title}</span><br /><span style={{color:INK_MUTED,fontSize:12.5}}>{fmtDate(nextMs.date)}</span></span> : "—"} />
      </div>

      <div className="no-print" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:12,fontSize:12.5,color:INK_MUTED}}>
        {seg("all", tf("Gesamt"))}{seg("3m", tf("3 Monate"))}{seg("6w", tf("6 Wochen"))}
        <span style={{marginInlineStart:10}}><span style={{color:GOOD}}>●</span> erledigt</span><span><span style={{color:BRASS}}>●</span> {tf("noch offen")}</span>
        <span><span style={{color:WARN}}>●</span> blockiert</span><span><span style={{color:BAD}}>●</span> überfällig</span><span>◆ Meilenstein</span>
        <label style={{marginInlineStart:"auto",display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={showLabels} onChange={e=>setLabelsPref(e.target.checked)} /> {tf("Titel anzeigen")}</label>
        <label style={{display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={onlyOpen} onChange={e=>setOnlyOpen(e.target.checked)} /> nur offene Aufgaben</label>
      </div>

      <Card style={{padding:"28px 0 0",overflowX:"auto",marginBottom:12}}>
        <div ref={boxRef} style={{position:"relative",minWidth:820}}>
          <VLine iso={today} color={INK} label={tf("Heute")} dashed />
          {hotel.opening_date && <VLine iso={hotel.opening_date} color={BRASS} label={tf("Eröffnung")} />}
          <Row label={range==="all" ? tf("Monate") : tf("Wochen")} height={26}>
            {ticks.map(m=><div key={m.iso} style={{position:"absolute",insetInlineStart:pos(m.iso),top:5,fontSize:11,color:INK_MUTED,whiteSpace:"nowrap",borderInlineStart:`1px solid ${BORDER}`,paddingInlineStart:4}} data-no-i18n="">{m.label}</div>)}
          </Row>
          <Row label={tf("Meilensteine")} height={30 + msLanes*14}>
            {ms.map((m,i)=>{
              const isLate = m.status!=="Abgeschlossen" && (m.date<today || m.status==="Gefährdet");
              const color = m.status==="Abgeschlossen"?GOOD:isLate?BAD:INK;
              return <React.Fragment key={m.id}>
                <button onClick={()=>setPicked({kind:"ms", item:m})} title={m.title+" · "+fmtDate(m.date)+" · "+translateString(m.status)} aria-label={m.title}
                  style={{position:"absolute",insetInlineStart:pos(m.date),top:10,width:13,height:13,marginInlineStart:-6.5,padding:0,border:"none",transform:"rotate(45deg)",background:color,cursor:"pointer"}} />
                <div style={{position:"absolute",insetInlineStart:pos(m.date),top:27 + (msLane[m.id]||0)*14,transform:"translateX(-50%)",fontSize:10.5,color,whiteSpace:"nowrap",maxWidth:146,overflow:"hidden",textOverflow:"ellipsis",pointerEvents:"none"}}>{m.title}</div>
              </React.Fragment>;
            })}
          </Row>
          {depts.map(d=>{
            const all = allDated.filter(t=>t.department===d);
            const lay = layout(dated.filter(t=>t.department===d));
            const done = all.filter(t=>t.status==="Abgeschlossen").length;
            const lateN = all.filter(t=>t.status!=="Abgeschlossen" && t.due_date<today).length;
            const pct = all.length ? Math.round(done/all.length*100) : 0;
            return (
              <Row key={d} label={translateString(d)} height={Math.max(44, 16 + lay.lanes*LANE_H)} sub={
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{flex:1,height:4,background:PAPER,borderRadius:3,overflow:"hidden"}}><div style={{width:pct+"%",height:"100%",background:pct>=80?GOOD:BRASS}} /></div>
                  <span style={{fontSize:10.5,color:lateN?BAD:INK_MUTED,whiteSpace:"nowrap"}} data-no-i18n="">{done}/{all.length}{lateN ? " · "+tf("{0} überfällig", lateN) : ""}</span>
                </div>}>
                {lay.placed.map(({t,lane})=><Dot key={t.id} t={t} lane={lane} />)}
              </Row>
            );
          })}
        </div>
      </Card>

      {picked && (
        <Card style={{marginBottom:14,borderColor:BRASS}}>
          <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,marginBottom:4}}>{picked.item.title}</div>
              <div style={{fontSize:13,color:INK_MUTED,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                {picked.kind==="task" ? <React.Fragment>
                  <span>{translateString(picked.item.department)}</span><span>·</span>
                  <span>{tf("fällig {0}", fmtDate(picked.item.due_date))}</span><span>·</span>
                  <Pill {...priorityColor(picked.item.priority)}>{picked.item.priority}</Pill>
                  <span>{picked.item.status}</span>
                  {picked.item.owner && <span data-no-i18n="">· {picked.item.owner}</span>}
                </React.Fragment> : <React.Fragment>
                  <span>◆ {tf("Meilenstein")}</span><span>·</span><span>{fmtDate(picked.item.date)}</span><span>·</span><span>{picked.item.status}</span>
                </React.Fragment>}
              </div>
            </div>
            <button onClick={()=>setPicked(null)} aria-label={tf("Schließen")} style={{...linkBtn,fontSize:16}}>✕</button>
          </div>
        </Card>
      )}

      <Card>
        <div style={{fontWeight:700,marginBottom:6}}>{tf("Was steht an")}</div>
        <div style={{fontSize:12.5,color:INK_MUTED,marginBottom:8}}>{tf("Überfälliges und alles, was in den nächsten 3 Wochen fällig ist.")}</div>
        {agendaGroups.length===0 && <div style={{color:INK_MUTED,fontSize:13.5}}>{tf("In den nächsten 3 Wochen ist nichts fällig.")}</div>}
        {agendaGroups.map(g=>(
          <div key={g.key} style={{marginTop:10}}>
            <div style={{fontSize:12,fontWeight:700,color:g.key==="late"?BAD:INK_MUTED,textTransform:"uppercase",letterSpacing:0.3,marginBottom:4}}>
              {g.key==="late" ? tf("Überfällig") : tf("KW {0}", isoWeekNumber(g.key)) + " · " + fmtDay(g.key,{day:"2-digit",month:"2-digit"}) + " – " + fmtDay(addD(g.key,6),{day:"2-digit",month:"2-digit"})}
            </div>
            {g.items.map(a=>(
              <div key={a.kind+a.item.id} onClick={()=>setPicked({kind:a.kind, item:a.item})}
                style={{display:"flex",gap:10,alignItems:"center",padding:"7px 0",borderTop:`1px solid ${BORDER}`,fontSize:13.5,cursor:"pointer"}}>
                <span style={{width:84,flexShrink:0,color:a.date<today?BAD:INK_MUTED,fontSize:12.5}} data-no-i18n="">{fmtDay(a.date)}</span>
                {a.kind==="ms"
                  ? <span style={{flex:1,fontWeight:600}}>◆ <span>{a.item.title}</span></span>
                  : <span style={{flex:1}}><span>{a.item.title}</span> <span style={{color:INK_MUTED,fontSize:12}}>· <span>{a.item.department}</span></span></span>}
                {a.kind==="task" && <Pill {...priorityColor(a.item.priority)}>{a.item.priority}</Pill>}
              </div>
            ))}
          </div>
        ))}
      </Card>
    </div>
  );
}

/* ------------------------------ KI-Lagebericht ------------------------------ */
const AMPEL = {
  "grün": {color:GOOD, bg:GOOD_SOFT, label:"Im Plan"},
  "gelb": {color:WARN, bg:WARN_SOFT, label:"Verzug – aufholbar"},
  "rot":  {color:BAD,  bg:BAD_SOFT,  label:"Eröffnung gefährdet"},
};
const URGENCY_COLOR = {"sofort":BAD, "diese Woche":WARN, "diesen Monat":INK_MUTED};

// Inhalt eines Lageberichts – im Dashboard und im druckbaren Statusbericht.
function AiReportBody({content, full}){
  const List = ({title, items}) => items && items.length>0 ? (
    <div className="avoid-break" style={{marginTop:12}}>
      <div style={{fontWeight:700,marginBottom:4}}>{title}</div>
      <ul style={{margin:0,paddingLeft:18,lineHeight:1.55}}>{items.map((x,i)=><li key={i}>{x}</li>)}</ul>
    </div>
  ) : null;
  return (
    <div>
      <div style={{lineHeight:1.6}}>{content.zusammenfassung}</div>
      {(content.handlungsbedarf||[]).length>0 && (
        <div style={{marginTop:12}}>
          <div style={{fontWeight:700,marginBottom:4}}>Handlungsbedarf</div>
          {content.handlungsbedarf.map((h,i)=>(
            <div key={i} className="avoid-break" style={{padding:"7px 0",borderTop:`1px solid ${BORDER}`}}>
              <div style={{display:"flex",gap:8,alignItems:"baseline",flexWrap:"wrap"}}>
                <span style={{fontWeight:600}}>{h.titel}</span>
                <span style={{fontSize:"0.85em",fontWeight:700,color:URGENCY_COLOR[h.dringlichkeit]||INK_MUTED}}>{h.dringlichkeit}</span>
                <span style={{fontSize:"0.85em",color:INK_MUTED}}>{h.abteilung}</span>
              </div>
              <div style={{color:INK_MUTED,marginTop:2,lineHeight:1.5}}>{h.begruendung}</div>
            </div>
          ))}
        </div>
      )}
      {full && <List title="Risikohinweise" items={content.risikohinweise} />}
      {full && <List title="Was gut läuft" items={content.positiv} />}
      {full && <List title="Nächste Schritte (7 Tage)" items={content.naechste_schritte} />}
    </div>
  );
}

function AiReportCard({hotel, api, ai, onChange, readOnly}){
  const [busy,setBusy] = useState(false);
  const [error,setError] = useState("");
  const [full,setFull] = useState(false);
  if(!ai || !ai.enabled) return null;
  const report = ai.report;
  if(readOnly && !report) return null;
  const a = report ? (AMPEL[report.content.ampel] || AMPEL["gelb"]) : null;

  const generate = async () => {
    setBusy(true); setError("");
    try { onChange({...ai, report: await api("/api/hotels/"+hotel.id+"/ai-report","POST")}); setFull(true); }
    catch(e){ setError(e.message); }
    setBusy(false);
  };

  return (
    <Card style={{marginBottom:18,borderColor:a ? a.color : BORDER}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:report||busy||error?12:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <div style={{fontWeight:700}}>KI-Lagebericht</div>
          {a && <Pill color={a.color} bg={a.bg}>{a.label}</Pill>}
          {report && <span style={{fontSize:12,color:INK_MUTED}}>{tf("Stand {0}", fmtDateTime(report.created_at))}</span>}
        </div>
        {!readOnly && <button className={report ? "" : "btn-primary"} onClick={generate} disabled={busy}
          style={report ? {background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer"} : {}}>
          {busy ? "Analysiert…" : report ? "Neu erstellen" : "Lagebericht erstellen"}
        </button>}
      </div>
      {!report && !busy && <div style={{fontSize:13,color:INK_MUTED,marginTop:8}}>
        Die KI wertet Aufgaben, Meilensteine, Risiken, Budget und Personal aus und schreibt eine Einschätzung für Geschäftsführung und Eigentümer – mit Ampel, Handlungsbedarf und nächsten Schritten.
      </div>}
      {busy && <div style={{fontSize:13,color:INK_MUTED}}>Die KI analysiert den Projektstand. Das dauert meist 20–60 Sekunden …</div>}
      {error && <div style={{color:BAD,fontSize:13}}>{error}</div>}
      {report && !busy && (
        <div style={{fontSize:13.5}}>
          <AiReportBody content={report.content} full={full} />
          <button style={{...linkBtn,marginTop:8,paddingLeft:0}} onClick={()=>setFull(!full)}>{full ? "Weniger anzeigen" : "Risikohinweise und nächste Schritte anzeigen"}</button>
        </div>
      )}
    </Card>
  );
}

// Kontaktadresse für Enterprise-Anfragen; leer = kein Mail-Link
const CONTACT_EMAIL = "";

function fmtEurPlain(n){ return Number(n).toLocaleString(UI_LOCALE,{style:"currency",currency:"EUR",maximumFractionDigits:0}); }

function BillingBanner({billing, onOpen}){
  if(!billing) return null;
  let tone = null, text = "";
  if(!billing.active){ tone = BAD; text = billing.status==="trialing" ? "Die Testphase ist abgelaufen. Ouverture ist im Nur-Lesen-Modus – alle Daten bleiben erhalten." : "Kein aktives Abo. Ouverture ist im Nur-Lesen-Modus – alle Daten bleiben erhalten."; }
  else if(billing.status==="past_due"){ tone = WARN; text = "Die letzte Zahlung ist fehlgeschlagen. Bitte die Zahlungsart aktualisieren."; }
  else if(billing.status==="trialing"){ tone = BRASS; text = billing.trial_days_left===1 ? tf("Testphase: noch 1 Tag.") : tf("Testphase: noch {0} Tage.", billing.trial_days_left); }
  if(!tone) return null;
  return (
    <div className="no-print" style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",border:`1px solid ${tone}`,background:tone===BAD?BAD_SOFT:tone===WARN?WARN_SOFT:BRASS_SOFT,color:INK,borderRadius:8,padding:"9px 14px",marginBottom:16,fontSize:13.5}}>
      <div style={{flex:1,minWidth:200}}>{text}</div>
      <button className="btn-primary" style={{padding:"6px 12px",fontSize:12.5}} onClick={onOpen}>{billing.status==="past_due" ? "Zahlungsart ändern" : "Tarif wählen"}</button>
    </div>
  );
}

const BILLING_NOTICES = {
  success: {ok:true, text:"Danke! Die Zahlung war erfolgreich. Das Abo wird in wenigen Sekunden aktiviert."},
  cancel: {ok:false, text:"Die Bezahlung wurde abgebrochen. Es wurde nichts berechnet."},
};

// Vorschlag für die Abo-Währung aus dem Land des Browsers (gleiche Regel wie billing.js)
function suggestBillingCurrency(){
  const REGION = {ch:"CHF",li:"CHF",gb:"GBP",us:"USD",ca:"CAD",au:"AUD",nz:"NZD",jp:"JPY",cn:"CNY",hk:"HKD",sg:"SGD",kr:"KRW",ae:"AED",sa:"SAR",qa:"QAR",
    bh:"USD",kw:"USD",om:"USD",tr:"TRY",br:"BRL",mx:"MXN",za:"ZAR",se:"SEK",no:"NOK",dk:"DKK",pl:"PLN",cz:"CZK",hu:"HUF"};
  const LANG = {ja:"JPY",zh:"CNY",ko:"KRW",tr:"TRY",ar:"AED",sv:"SEK",nb:"NOK",no:"NOK",da:"DKK",pl:"PLN",cs:"CZK",hu:"HUF"};
  const [l, r] = (navigator.language || "").toLowerCase().split(/[-_]/);
  return REGION[r] || LANG[UI_LANG] || LANG[l] || "EUR";
}
function fmtPrice(n, cur){ return Number(n).toLocaleString(UI_LOCALE,{style:"currency",currency:cur,maximumFractionDigits:0}); }

function BillingView({billing, orgId, api, isAdmin, notice, onReload}){
  const [cur,setCur] = useState(() => { try { return window.localStorage.getItem("hpoos_billing_currency") || (DISPLAY_CURRENCY && billing && (billing.currencies||[]).includes(DISPLAY_CURRENCY) ? DISPLAY_CURRENCY : suggestBillingCurrency()); } catch(e){ return suggestBillingCurrency(); } });
  const pickCur = (c) => { setCur(c); try { window.localStorage.setItem("hpoos_billing_currency", c); } catch(e){} };
  const [busy,setBusy] = useState(null);
  const [error,setError] = useState("");
  if(!billing) return <div style={{color:INK_MUTED}}>Abo-Daten werden geladen…</div>;

  const paid = billing.active && billing.plan!=="trial" && billing.has_customer;
  const go = async (path, body, key) => {
    setBusy(key); setError("");
    try { const r = await api("/api/organizations/"+orgId+"/billing/"+path, "POST", body); window.location.href = r.url; }
    catch(e){ setError(e.message); setBusy(null); }
  };
  const statusText = {
    trialing: billing.active ? tf("Testphase bis {0}", fmtDate(billing.trial_ends_at)) : tf("Testphase abgelaufen am {0}", fmtDate(billing.trial_ends_at)),
    active: billing.cancel_at_period_end ? tf("Gekündigt – läuft bis {0}", fmtDate(billing.current_period_end)) : (billing.current_period_end ? tf("Aktiv · nächste Abrechnung {0}", fmtDate(billing.current_period_end)) : tf("Aktiv")),
    past_due: "Zahlung offen – bitte Zahlungsart aktualisieren",
    canceled: "Beendet", unpaid: "Unbezahlt", incomplete: "Zahlung nicht abgeschlossen",
  }[billing.status] || billing.status;
  const n = notice && BILLING_NOTICES[notice];

  return (
    <div>
      {n && <div style={{color:n.ok?GOOD:WARN,fontSize:13.5,marginBottom:14}}>{n.text}</div>}
      <Card style={{marginBottom:18}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:12,flexWrap:"wrap",alignItems:"center"}}>
          <div>
            <div style={{fontSize:12.5,color:INK_MUTED,fontWeight:600}}>AKTUELLER TARIF</div>
            <div style={{fontFamily:"Fraunces, serif",fontSize:22,fontWeight:600}}>{billing.plan_name}</div>
            <div style={{fontSize:13.5,color:billing.active?INK:BAD}}>{statusText}</div>
            <div style={{fontSize:13,color:INK_MUTED,marginTop:4}}>{tf("{0} von {1} Hotels genutzt", billing.hotel_count, billing.hotel_limit)}</div>
          </div>
          {isAdmin && billing.has_customer && billing.stripe_enabled && (
            <button onClick={()=>go("portal", null, "portal")} disabled={!!busy} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:8,padding:"8px 14px",fontSize:13,cursor:"pointer"}}>
              {busy==="portal" ? "Öffnet…" : "Abo verwalten (Rechnungen, Zahlungsart, Kündigung)"}
            </button>
          )}
        </div>
        {error && <div style={{color:BAD,fontSize:13,marginTop:10}}>{error}</div>}
        {!isAdmin && <div style={{fontSize:12.5,color:INK_MUTED,marginTop:10}}>Nur Admins der Organisation können das Abo ändern.</div>}
        {!billing.stripe_enabled && <div style={{fontSize:12.5,color:INK_MUTED,marginTop:10}}>Die Online-Bezahlung wird gerade eingerichtet.{CONTACT_EMAIL ? <span> Für ein Abo schreib an <a href={"mailto:"+CONTACT_EMAIL}>{CONTACT_EMAIL}</a>.</span> : null}</div>}
      </Card>

      {(billing.currencies||[]).length > 1 && (
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:INK_MUTED}}>{tf("Bezahlen in")}</span>
          <select className="input" style={{width:"auto",minWidth:240}} value={(billing.currencies||[]).includes(cur) ? cur : "EUR"} onChange={e=>pickCur(e.target.value)} data-no-i18n="">
            {billing.currencies.map(c=><option key={c} value={c}>{currencyName(c)} ({c})</option>)}
          </select>
          <span style={{fontSize:12,color:INK_MUTED}}>{tf("Abgebucht wird genau in dieser Währung.")}</span>
        </div>
      )}
      <div className="stack" style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(240px, 1fr))",gap:18}}>
        {(billing.plans||[]).map(p=>{
          const current = billing.plan===p.key && billing.active;
          return (
            <Card key={p.key} style={{display:"flex",flexDirection:"column",borderColor:current?BRASS:BORDER}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontWeight:700,fontSize:16}}>{p.name}</div>
                {current && <Pill color={BRASS} bg={BRASS_SOFT}>Aktuell</Pill>}
              </div>
              <div style={{fontFamily:"Fraunces, serif",fontSize:26,fontWeight:600,margin:"8px 0 2px"}}>{fmtPrice((p.monthly && p.monthly[cur]) || p.monthlyEur, p.monthly && p.monthly[cur] ? cur : "EUR")}</div>
              <div style={{fontSize:12,color:INK_MUTED,marginBottom:10}}>pro Monat zzgl. USt., monatlich kündbar</div>
              <ul style={{margin:"0 0 14px",paddingLeft:18,fontSize:13.5,lineHeight:1.6,flex:1}}>{p.features.map(f=><li key={f}>{f}</li>)}</ul>
              {isAdmin && billing.stripe_enabled && !current && (
                paid
                  ? <button onClick={()=>go("portal", null, "portal")} disabled={!!busy} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:8,padding:"9px 14px",fontSize:13.5,cursor:"pointer"}}>Über „Abo verwalten“ wechseln</button>
                  : <button className="btn-primary" onClick={()=>go("checkout", {plan:p.key, currency:cur}, p.key)} disabled={!!busy || !p.available}>{busy===p.key ? "Öffnet Bezahlseite…" : p.available ? p.name+" wählen" : "Bald verfügbar"}</button>
              )}
            </Card>
          );
        })}
        <Card style={{display:"flex",flexDirection:"column"}}>
          <div style={{fontWeight:700,fontSize:16}}>Enterprise</div>
          <div style={{fontFamily:"Fraunces, serif",fontSize:22,fontWeight:600,margin:"8px 0 2px"}}>auf Anfrage</div>
          <div style={{fontSize:12,color:INK_MUTED,marginBottom:10}}>Jahresvertrag</div>
          <ul style={{margin:"0 0 14px",paddingLeft:18,fontSize:13.5,lineHeight:1.6,flex:1}}>
            <li>Mehr als 5 Hotels</li><li>Eigene Vorlagen je Marke</li><li>Onboarding und Schulung</li>
          </ul>
          {CONTACT_EMAIL && <a href={"mailto:"+CONTACT_EMAIL+"?subject=Ouverture%20Enterprise"} style={{textAlign:"center",border:`1px solid ${BORDER}`,borderRadius:8,padding:"9px 14px",fontSize:13.5,color:INK,textDecoration:"none"}}>Kontakt aufnehmen</a>}
        </Card>
      </div>
      <div style={{fontSize:12,color:INK_MUTED,marginTop:14}}>
        Die Bezahlung läuft sicher über Stripe. Rechnungen kommen per E-Mail und sind unter „Abo verwalten“ abrufbar.
        <button style={{...linkBtn,marginLeft:6}} onClick={onReload}>Status aktualisieren</button>
      </div>
    </div>
  );
}

const SHIFT_STYLE = {

function addDaysIso(iso, n){ const d = new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function mondayOfIso(iso){ const d = new Date(iso+"T00:00:00Z"); return addDaysIso(iso, -((d.getUTCDay()+6)%7)); }
function todayIso(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isoWeekNumber(iso){
  const d = new Date(iso+"T00:00:00Z"); const day = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-day+3);
  const firstThu = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  return 1 + Math.round(((d - firstThu)/86400000 - 3 + ((firstThu.getUTCDay()+6)%7))/7);
}
function fmtDay(iso, opts){ return new Date(iso+"T12:00:00").toLocaleDateString(UI_LOCALE, opts || {weekday:"short",day:"2-digit",month:"2-digit"}); }
const shortName = (email) => (email||"").split("@")[0];
function shiftHoursOf(s){
  if(!s.start_time || !s.end_time) return 0;
  const m = (t) => { const [h, mi] = String(t).split(":").map(Number); return h*60 + mi; };
  let d = m(s.end_time) - m(s.start_time); if(d <= 0) d += 24*60;
  return d/60;
}
const fmtHours = (h) => (Math.round(h*10)/10).toLocaleString(UI_LOCALE);
const shiftTimes = (s) => s.start_time ? String(s.start_time).slice(0,5)+"–"+String(s.end_time||"").slice(0,5) : "";

function ShiftChip({s, onClick, draggable, onDragStart}){
  const st = SHIFT_STYLE[s.kind] || SHIFT_STYLE["Frei"];
  return (
    <div onClick={onClick} title={s.note || ""} draggable={!!draggable} onDragStart={onDragStart}
      style={{background:st.bg,color:st.fg,borderRadius:4,padding:"3px 6px",fontSize:11.5,lineHeight:1.3,marginBottom:3,cursor:draggable?"grab":(onClick?"pointer":"default")}}>
      <b>{s.kind}</b>{s.start_time && <div data-no-i18n="" dir="ltr" style={{unicodeBidi:"isolate",textAlign:"start"}}>{shiftTimes(s)}</div>}
    </div>
  );
}

function drawBrand(x, width, height, logo, color){
  if(color){ x.fillStyle = color; x.fillRect(0, height-4, width, 4); }
  if(logo){ const h = Math.min(height-20, 46), w = Math.min(140, logo.width*h/logo.height);
    x.fillStyle = "#FFFFFF"; x.fillRect(width-w-30, 10, w+16, h+8); x.drawImage(logo, width-w-22, 14, w, h); }
}
function drawRosterImage({hotelName, weekLabel, days, groups, logo, color}){
  const scale = 2, colName = 190, colDay = 132, rowH = 38, headH = 92, deptH = 34, pad = 24;
  const width = pad*2 + colName + colDay*7;
  const rowsTotal = groups.reduce((n,g)=>n + Math.max(1, g.rows.length), 0);
  const height = headH + groups.length*deptH + rowsTotal*rowH + pad + 30;
  const c = document.createElement("canvas");
  c.width = width*scale; c.height = height*scale;
  const x = c.getContext("2d"); x.scale(scale, scale);
  const rtl = document.documentElement.dir === "rtl";
  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,width,height);
  const font = (w, size) => w+" "+size+"px Inter, 'Segoe UI', 'Noto Sans', 'Hiragino Sans', 'Microsoft YaHei', Arial, sans-serif";
  const text = (t, px, py, opts={}) => {
    x.font = font(opts.weight||"400", opts.size||13); x.fillStyle = opts.color||"#1C2430";
    x.textAlign = opts.align||"left"; x.direction = rtl ? "rtl" : "ltr";
    let s = String(t||""); const max = opts.max;
    if(max){ while(s.length>1 && x.measureText(s).width>max) s = s.slice(0,-1); if(s!==String(t||"")) s = s.slice(0,-1)+"…"; }
    x.fillText(s, px, py);
  };
  // Kopf
  x.fillStyle = "#1C2430"; x.fillRect(0,0,width,headH-22);
  drawBrand(x, width, headH-22, logo, color);
  text("Ouverture · " + hotelName, pad, 34, {weight:"600", size:20, color:"#FFFFFF", max: width-pad*2});
  text(tf("Dienstplan") + " · " + weekLabel, pad, 58, {size:14, color:"#C9A66B"});
  // Tage
  days.forEach((d,i)=>text(fmtDay(d), pad+colName+i*colDay+6, headH-6, {weight:"600", size:12, color:"#6B7280"}));
  let y = headH;
  for(const g of groups){
    x.fillStyle = "#F1E8D8"; x.fillRect(pad, y, width-pad*2, deptH);
    text(translateString(g.dept), pad+8, y+22, {weight:"700", size:14});
    y += deptH;
    const rows = g.rows.length ? g.rows : [{name:"—", empty:true}];
    rows.forEach((r,ri)=>{
      if(ri%2===1){ x.fillStyle = "#FAF8F4"; x.fillRect(pad, y, width-pad*2, rowH); }
      text(r.name, pad+8, y+24, {weight:"500", size:13, max: colName-14});
      days.forEach((d,i)=>{
        const list = r.empty ? [] : g.shiftsFor(r, d);
        list.slice(0,2).forEach((s,si)=>{
          const st = SHIFT_STYLE[s.kind] || SHIFT_STYLE["Frei"];
          const bx = pad+colName+i*colDay+4, by = y+4+si*16, bw = colDay-8, bh = list.length>1 ? 15 : rowH-8;
          x.fillStyle = st.bg; x.fillRect(bx, by, bw, bh);
          const label = translateString(s.kind) + (s.start_time ? " " + shiftTimes(s) : "");
          text(label, bx+5, by + (list.length>1 ? 11.5 : 19), {weight:"600", size: list.length>1 ? 10 : 11.5, color: st.fg, max: bw-8});
        });
      });
      x.strokeStyle = "#E4DFD3"; x.beginPath(); x.moveTo(pad, y+rowH); x.lineTo(width-pad, y+rowH); x.stroke();
      y += rowH;
    });
  }
  text(tf("Erstellt mit Ouverture") + " · " + new Date().toLocaleDateString(UI_LOCALE), pad, height-12, {size:11, color:"#6B7280"});
  return c;
}

function RosterView({hotel, api, me, members, role, myDepts, orgId}){
  const isAdmin = role==="admin";
  const canManage = isAdmin || role==="manager";
  const visibleDepts = (role==="admin" || role==="viewer" || (role==="manager" && myDepts.length===0)) ? DEPARTMENTS
    : DEPARTMENTS.filter(d=>myDepts.includes(d)).concat(myDepts.filter(d=>!DEPARTMENTS.includes(d)));
  // "" = alle sichtbaren Abteilungen auf einen Blick
  const [deptRaw,setDeptState] = useState(()=>{
    try { const saved = window.localStorage.getItem("hpoos_roster_dept"); if(saved && visibleDepts.includes(saved)) return saved; } catch(e){}
    return visibleDepts[0] || "";
  });
  const dept = visibleDepts.includes(deptRaw) ? deptRaw : (visibleDepts[0] || "");
  const setDept = (d) => { setDeptState(d); setEditor(null); try { window.localStorage.setItem("hpoos_roster_dept", d); } catch(e){} };
  const [week,setWeek] = useState(()=>mondayOfIso(todayIso()));
  const [shifts,setShifts] = useState([]);
  const [mins,setMins] = useState([]);
  const [requests,setRequests] = useState([]);
  const [myShifts,setMyShifts] = useState([]);
  const [msg,setMsg] = useState(null);
  const [editor,setEditor] = useState(null);
  const [extraNames,setExtraNames] = useState([]); // [{dept, name}]
  const [newName,setNewName] = useState("");
  const [newNameDept,setNewNameDept] = useState(visibleDepts[0] || "");
  const [minDept,setMinDept] = useState(visibleDepts[0] || "");
  const [sharing,setSharing] = useState(false);
  const [quick,setQuick] = useState(null); // {key, date}: kleines Menü direkt in der Zelle
  const [duties,setDuties] = useState([]);
  const [dutyDay,setDutyDay] = useState(null);
  const [pubs,setPubs] = useState([]);
  const [targets,setTargets] = useState([]);
  const [avail,setAvail] = useState([]);
  const [monthShifts,setMonthShifts] = useState([]);
  const [dragOver,setDragOver] = useState(null);
  const [dutyAll,setDutyAll] = useState(false); // auch Personen ohne Schicht an diesem Tag zeigen
  const [view,setViewState] = useState(()=>{
    try { const v = window.localStorage.getItem("hpoos_roster_view"); if(v) return v; } catch(e){}
    return window.innerWidth < 700 ? "days" : "week";
  });
  const setView = (v) => { setViewState(v); try { window.localStorage.setItem("hpoos_roster_view", v); } catch(e){} };
  const days = Array.from({length:7}, (_,i)=>addDaysIso(week,i));
  const weekHolidays = holidayMap(hotel.holiday_region, days[0], days[6]);
  const base = "/api/hotels/"+hotel.id;
  const today = todayIso();
  const shownDepts = dept ? [dept] : visibleDepts;

  const load = useCallback(async () => {
    try {
      api(base+"/duties?from="+week+"&to="+addDaysIso(week,6)).then(setDuties).catch(()=>setDuties([]));
      api(base+"/publications?from="+addDaysIso(week,-7)+"&to="+addDaysIso(week,7)).then(setPubs).catch(()=>setPubs([]));
      api(base+"/availabilities?from="+week+"&to="+addDaysIso(week,6)).then(setAvail).catch(()=>setAvail([]));
      if(canManage){
        api(base+"/staff-hours").then(setTargets).catch(()=>setTargets([]));
        const m0 = week.slice(0,8)+"01", m1 = addDaysIso(addDaysIso(m0,32).slice(0,8)+"01",-1);
        if(dept) api(base+"/shifts?from="+m0+"&to="+m1+"&department="+encodeURIComponent(dept)).then(setMonthShifts).catch(()=>setMonthShifts([]));
      }
      const [s,m,r,my] = await Promise.all([
        visibleDepts.length ? api(base+"/shifts?from="+week+"&to="+addDaysIso(week,6)+(dept ? "&department="+encodeURIComponent(dept) : "")) : Promise.resolve([]),
        api(base+"/shift-minimums"),
        api(base+"/shift-requests"),
        api("/api/organizations/"+orgId+"/my-shifts"),
      ]);
      setShifts(s); setMins(m); setRequests(r); setMyShifts(my);
    } catch(e){ setMsg({ok:false, text:e.message}); }
  }, [api, base, dept, week, orgId]);
  useEffect(()=>{ load(); }, [load]);

  const run = async (fn, okText) => {
    setMsg(null);
    try { const out = await fn(); if(okText) setMsg({ok:true, text:tf(okText)}); await load(); return out; }
    catch(e){ setMsg({ok:false, text:e.message}); }
  };

  // Zeilen je Abteilung: zugeordnete Teammitglieder, Personen mit Schichten, neu eingetragene Namen
  const rowsFor = (d) => {
    const rows = []; const seen = new Set();
    const add = (key, row) => { if(!seen.has(key)){ seen.add(key); rows.push({key: d+"|"+key, dept: d, ...row}); } };
    members.filter(m=>m.role!=="viewer" && (m.departments||[]).includes(d))
      .forEach(m=>add("u:"+m.user_id, {user_id:m.user_id, name:shortName(m.email), title:m.email}));
    shifts.filter(s=>s.department===d).forEach(s=>{
      if(s.user_id){ const m = members.find(x=>x.user_id===s.user_id); add("u:"+s.user_id, {user_id:s.user_id, name:m ? shortName(m.email) : tf("Teammitglied"), title:m ? m.email : ""}); }
      else add("n:"+(s.employee_name||"").toLowerCase(), {user_id:null, name:s.employee_name, title:""});
    });
    extraNames.filter(e=>e.dept===d).forEach(e=>add("n:"+e.name.toLowerCase(), {user_id:null, name:e.name, title:""}));
    return rows;
  };
  const shiftsFor = (row, date) => shifts.filter(s=>s.shift_date===date && s.department===row.dept &&
    (row.user_id ? s.user_id===row.user_id : (!s.user_id && (s.employee_name||"").toLowerCase()===row.name.toLowerCase())));
  const groups = shownDepts.map(d=>({dept:d, rows:rowsFor(d), shiftsFor}));

  // Besetzung und Unterbesetzung je Abteilung
  const minFor = (d, kind) => { const m = mins.find(x=>x.department===d && x.kind===kind); return m ? m.min_count : 0; };
  const count = (d, date, kind) => shifts.filter(s=>s.department===d && s.shift_date===date && s.kind===kind).length;
  const gaps = [];
  shownDepts.forEach(d=>days.forEach(day=>WORK_KINDS.forEach(k=>{ const need = minFor(d,k); const have = count(d,day,k); if(need>0 && have<need) gaps.push({d,day,k,have,need}); })));

  // Bearbeiten
  // Zeiten je Abteilung (an der Mindestbesetzung gespeichert), sonst Standard
  const timesFor = (d, k) => { const m = mins.find(x=>x.department===d && x.kind===k);
    return m && m.start_time ? [String(m.start_time).slice(0,5), String(m.end_time||"").slice(0,5)] : SHIFT_TIMES[k]; };
  const openNew = (row, date) => setEditor({row, date, id:null, kind:"Früh", start_time:timesFor(row.dept,"Früh")[0], end_time:timesFor(row.dept,"Früh")[1], note:""});
  const openEdit = (row, s) => setEditor({row, date:s.shift_date, id:s.id, kind:s.kind,
    start_time:(s.start_time||"").slice(0,5), end_time:(s.end_time||"").slice(0,5), note:s.note||""});
  const setKind = (k) => setEditor(e=>{ const t = timesFor(e.row.dept, k); return {...e, kind:k, start_time:t ? t[0] : "", end_time:t ? t[1] : ""}; });
  const saveShift = () => run(async () => {
    const work = WORK_KINDS.includes(editor.kind);
    const body = {department:editor.row.dept, shift_date:editor.date, kind:editor.kind,
      start_time:work ? editor.start_time : null, end_time:work ? editor.end_time : null, note:editor.note,
      user_id:editor.row.user_id || null, employee_name:editor.row.user_id ? null : editor.row.name};
    if(editor.id) await api("/api/shifts/"+editor.id, "PATCH", body); else await api(base+"/shifts", "POST", body);
    setEditor(null);
  });
  const deleteShift = () => run(async () => { await api("/api/shifts/"+editor.id, "DELETE"); setEditor(null); });
  const quickAdd = (row, date, kind) => { setQuick(null); run(()=>api(base+"/shifts", "POST", {
    department:row.dept, shift_date:date, kind,
    start_time: timesFor(row.dept,kind) ? timesFor(row.dept,kind)[0] : null, end_time: timesFor(row.dept,kind) ? timesFor(row.dept,kind)[1] : null,
    user_id: row.user_id || null, employee_name: row.user_id ? null : row.name })); };
  // Ziehen & Ablegen: verschieben, mit Strg/Alt kopieren
  const dropShift = (e, row, date) => {
    e.preventDefault(); setDragOver(null);
    let src; try { src = JSON.parse(e.dataTransfer.getData("text/plain")); } catch(x){ return; }
    const sh = shifts.find(x=>x.id===src.id); if(!sh || !canManageDept(row.dept)) return;
    const target = {department:row.dept, shift_date:date, user_id:row.user_id||null, employee_name:row.user_id?null:row.name};
    if(sh.shift_date===date && sh.department===row.dept && (sh.user_id||null)===target.user_id && (target.user_id || (sh.employee_name||"")===target.employee_name)) return;
    const copy = e.ctrlKey || e.altKey || e.metaKey;
    run(()=> copy
      ? api(base+"/shifts", "POST", {...target, kind:sh.kind, start_time:sh.start_time&&sh.start_time.slice(0,5), end_time:sh.end_time&&sh.end_time.slice(0,5), note:sh.note})
      : api("/api/shifts/"+sh.id, "PATCH", {...target, kind:sh.kind, start_time:sh.start_time&&sh.start_time.slice(0,5), end_time:sh.end_time&&sh.end_time.slice(0,5)}));
  };
  // Veröffentlichung der Woche
  const pub = pubs.find(x=>x.department===dept && x.week_start===week);
  const publish = () => run(async()=>{ const r = await api(base+"/publish","POST",{department:dept, week});
    setMsg({ok:true, text: r.sent ? tf("Veröffentlicht. {0} Personen wurden per E-Mail informiert.", r.sent) : tf("Veröffentlicht.")}); });
  const unpublish = () => { if(!window.confirm(tf("Veröffentlichung zurückziehen? Mitarbeitende sehen diese Woche dann nicht mehr."))) return;
    run(()=>api(base+"/publish?department="+encodeURIComponent(dept)+"&week="+week, "DELETE")); };
  // Soll-Stunden und Arbeitszeit-Prüfung (Arbeitszeitgesetz: max. 10 h am Tag, 48 h pro Woche, 11 h Ruhezeit)
  const targetOf = (row) => { const t = targets.find(x=>x.department===row.dept && (row.user_id ? x.user_id===row.user_id : (!x.user_id && (x.employee_name||"").toLowerCase()===row.name.toLowerCase()))); return t ? Number(t.weekly_hours) : null; };
  const setTarget = (row) => {
    const cur = targetOf(row); const v = window.prompt(tf("Soll-Stunden pro Woche für {0} (leer = keine)", row.name), cur==null ? "" : String(cur));
    if(v===null) return;
    run(()=>api(base+"/staff-hours","PUT",{department:row.dept, user_id:row.user_id||null, employee_name:row.user_id?null:row.name, weekly_hours: v.trim()==="" ? null : Number(v.replace(",","."))}));
  };
  const toMin = (t) => { const [h,m] = String(t).split(":").map(Number); return h*60+m; };
  const shiftSpan = (s) => { const st = new Date(s.shift_date+"T00:00:00Z").getTime()/60000 + toMin(s.start_time); let en = new Date(s.shift_date+"T00:00:00Z").getTime()/60000 + toMin(s.end_time); if(en<=st) en += 1440; return [st,en]; };
  const warningsFor = (row) => {
    const own = shifts.filter(s=>s.department===row.dept && WORK_KINDS.includes(s.kind) && s.start_time && s.end_time &&
      (row.user_id ? s.user_id===row.user_id : (!s.user_id && (s.employee_name||"").toLowerCase()===row.name.toLowerCase()))).sort((a,b)=>shiftSpan(a)[0]-shiftSpan(b)[0]);
    const w = [];
    own.forEach(s=>{ if(shiftHoursOf(s)>10) w.push(tf("{0}: mehr als 10 Stunden", fmtDay(s.shift_date))); });
    for(let i=1;i<own.length;i++){ const rest = (shiftSpan(own[i])[0]-shiftSpan(own[i-1])[1])/60; if(rest<11) w.push(tf("{0}: nur {1} h Ruhezeit", fmtDay(own[i].shift_date), fmtHours(rest))); }
    if(weekHours(row)>48) w.push(tf("mehr als 48 Stunden in der Woche"));
    return w;
  };
  // Verfügbarkeit (nur Personen mit Login)
  const availOf = (row, date) => row.user_id ? avail.find(a=>a.user_id===row.user_id && a.avail_date===date) : null;
  const AVAIL_STYLE = {"verfügbar":GOOD, "lieber nicht":WARN, "nicht verfügbar":BAD};
  // Tageseinteilung: ein freier Text je Person und Tag (Abteilung)
  const dDay = dutyDay && days.includes(dutyDay) ? dutyDay : (days.includes(today) ? today : days[0]);
  const dutyOf = (row, date) => duties.find(x=>x.duty_date===date && x.department===row.dept &&
    (row.user_id ? x.user_id===row.user_id : (!x.user_id && (x.employee_name||"").toLowerCase()===row.name.toLowerCase())));
  const saveDuty = async (row, date, text) => {
    const t = text.trim(); const ex = dutyOf(row, date);
    if(ex && ex.task===t) return;
    setMsg(null);
    try {
      if(ex && !t) await api("/api/duties/"+ex.id, "DELETE");
      else if(ex) await api("/api/duties/"+ex.id, "PATCH", {task:t});
      else if(t) await api(base+"/duties", "POST", {department:row.dept, duty_date:date, task:t, user_id:row.user_id||null, employee_name:row.user_id?null:row.name});
      setDuties(await api(base+"/duties?from="+week+"&to="+addDaysIso(week,6)));
    } catch(e){ setMsg({ok:false, text:e.message}); }
  };
  const dutyRows = (g, date) => {
    const rows = g.rows.slice();
    duties.filter(x=>x.duty_date===date && x.department===g.dept && !x.user_id).forEach(x=>{
      if(!rows.some(r=>!r.user_id && r.name.toLowerCase()===(x.employee_name||"").toLowerCase()))
        rows.push({key:g.dept+"|n:"+x.employee_name.toLowerCase(), dept:g.dept, user_id:null, name:x.employee_name, title:""});
    });
    return rows.filter(r=>dutyAll || dutyOf(r,date) || shiftsFor(r,date).some(s=>WORK_KINDS.includes(s.kind)));
  };
  const shareDuties = async () => {
    setSharing(true); setMsg(null);
    try {
      const items = shownDepts.map(d=>({dept:d, rows: dutyRows(groups.find(g=>g.dept===d), dDay).map(r=>({
        name:r.name, shift: shiftsFor(r,dDay).filter(s=>WORK_KINDS.includes(s.kind)).map(s=>translateString(s.kind)+" "+shiftTimes(s)).join(", "),
        task: (dutyOf(r,dDay)||{}).task || "" }))})).filter(g=>g.rows.length);
      const canvas = drawDutyImage({hotelName: hotel.name, dayLabel: fmtDay(dDay,{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}), groups: items, logo: await loadImage(hotel.logo_data), color: hotel.brand_color});
      const blob = await new Promise(r=>canvas.toBlob(r, "image/png"));
      const name = (tf("Tageseinteilung")+" "+hotel.name+" "+dDay).replace(/[\\/:*?"<>|]+/g,"") + ".png";
      const file = new File([blob], name, {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title: tf("Tageseinteilung")});
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
        setMsg({ok:true, text:tf("Bild gespeichert. Du kannst es jetzt in WhatsApp oder per E-Mail verschicken.")}); }
    } catch(e){ if(e && e.name!=="AbortError") setMsg({ok:false, text:e.message}); }
    setSharing(false);
  };

  const weekHours = (row) => days.reduce((h,d)=>h + shiftsFor(row,d).filter(s=>WORK_KINDS.includes(s.kind)).reduce((x,s)=>x+shiftHoursOf(s),0), 0);
  const copyPrev = () => {
    if(!window.confirm(tf("Arbeitsschichten der Vorwoche in diese Woche übernehmen? Bereits belegte Tage bleiben unverändert."))) return;
    run(async () => {
      let created = 0;
      for(const d of shownDepts){ const r = await api(base+"/shifts/copy-week", "POST", {department:d, from:addDaysIso(week,-7), to:week}); created += r.created || 0; }
      setMsg({ok:true, text:tf("Übernommene Schichten: {0}", created)});
    });
  };
  const saveMin = (d, kind, value) => {
    const v = Math.max(0, Math.min(200, parseInt(value,10) || 0));
    if(v===minFor(d, kind)) return;
    run(()=>api(base+"/shift-minimums", "PUT", {department:d, kind, min_count:v}));
  };
  const addName = () => {
    const n = newName.trim(); if(!n) return;
    const d = dept || newNameDept;
    setExtraNames([...extraNames, {dept:d, name:n}]); setNewName("");

  const weekLabel = tf("KW {0}", isoWeekNumber(week)) + " · " + fmtDay(week,{day:"2-digit",month:"2-digit"}) + " – " + fmtDay(days[6],{day:"2-digit",month:"2-digit",year:"numeric"});

  // Als Bild teilen: Handy -> Teilen-Menü (WhatsApp, Signal, Mail …); Computer -> Bild speichern
  const shareImage = async () => {
    setSharing(true); setMsg(null);
    try {
      const filled = groups.filter(g=>g.rows.length);
      const canvas = drawRosterImage({hotelName: hotel.name, weekLabel, days, groups: filled.length ? filled : groups, logo: await loadImage(hotel.logo_data), color: hotel.brand_color});
      const blob = await new Promise(r=>canvas.toBlob(r, "image/png"));
      const name = (tf("Dienstplan")+" "+hotel.name+" "+week).replace(/[\\/:*?"<>|]+/g,"") + ".png";
      const file = new File([blob], name, {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: tf("Dienstplan") + " · " + weekLabel});
      } else {
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
        setMsg({ok:true, text:tf("Bild gespeichert. Du kannst es jetzt in WhatsApp oder per E-Mail verschicken.")});
      }
    } catch(e){ if(e && e.name!=="AbortError") setMsg({ok:false, text:e.message}); }
    setSharing(false);
  };

  const exportXlsx = async () => {
    try {
      const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
      const cell = (list) => list.map(s=>translateString(s.kind)+(s.start_time ? " "+shiftTimes(s) : "")).join(", ");
      const data = [[tf("Abteilung"), tf("Name"), ...days.map(d=>fmtDay(d))]];
      groups.forEach(g=>g.rows.forEach(r=>data.push([translateString(g.dept), r.title || r.name, ...days.map(d=>cell(shiftsFor(r,d)))])));
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws["!cols"] = [{wch:22}, {wch:26}, ...days.map(()=>({wch:18}))];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, tf("Dienstplan").slice(0,31));
      XLSX.writeFile(wb, (tf("Dienstplan")+" "+hotel.name+" "+week).replace(/[\\/:*?"<>|]+/g,"")+".xlsx");
    } catch(e){ setMsg({ok:false, text:tf("Export fehlgeschlagen: {0}", e.message)}); }
  };

  // Anträge
  const requestDept = myDepts[0] || (dept || visibleDepts[0] || "");
  const emptyReq = {kind:"Urlaub", date_from:"", date_to:"", shift_id:"", swap_with:"", note:""};
  const [req,setReq] = useState(emptyReq);
  const myUpcoming = myShifts.filter(s=>s.hotel_id===hotel.id && WORK_KINDS.includes(s.kind));
  const swapShift = myUpcoming.find(s=>s.id===req.shift_id);
  const swapDept = swapShift ? swapShift.department : requestDept;
  const colleagues = members.filter(m=>m.role!=="viewer" && (!me || m.user_id!==me.id) && ((m.departments||[]).includes(swapDept) || m.role==="admin" || m.role==="manager"));
  const submitReq = () => run(async () => {
    await api(base+"/shift-requests", "POST", {...req, department:requestDept, date_to:req.date_to || req.date_from});
    setReq(emptyReq);
  }, "Antrag gestellt. Die Abteilungsleitung entscheidet darüber.");
  const decide = (r, approve) => {
    let note = "";
    if(!approve){ note = window.prompt(tf("Begründung für die Ablehnung (optional)")); if(note===null) return; }
    run(()=>api("/api/shift-requests/"+r.id+"/decide", "POST", {approve, note}), approve ? "Antrag genehmigt." : "Antrag abgelehnt.");
  };
  const withdraw = (r) => run(()=>api("/api/shift-requests/"+r.id+"/withdraw", "POST", {}), "Antrag zurückgezogen.");
  const nameOf = (uid) => { if(me && uid===me.id) return null; const m = members.find(x=>x.user_id===uid); return m ? shortName(m.email) : tf("Teammitglied"); };
  const toDecide = requests.filter(r=>r.status==="Offen" && (!me || r.user_id!==me.id) && canManageDept(r.department));
  const mine = me ? requests.filter(r=>r.user_id===me.id).slice(0,12) : [];
  const forMe = me ? requests.filter(r=>r.swap_with===me.id && r.status==="Offen") : [];

  const RequestLine = ({r, actions}) => {
    const st = REQUEST_STATUS_STYLE[r.status] || REQUEST_STATUS_STYLE["Offen"];
    const sh = r.kind==="Tausch" && shifts.concat(myShifts).find(s=>s.id===r.shift_id);
    return (
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",padding:"9px 0",borderTop:`1px solid ${BORDER}`,fontSize:13.5}}>
        <div style={{flex:"1 1 260px",minWidth:0}}>
          {nameOf(r.user_id) && <b data-no-i18n="" style={{marginInlineEnd:6}}>{nameOf(r.user_id)}</b>}
          <span>{r.kind==="Tausch" ? "Schichttausch" : r.kind}</span>
          <span style={{color:INK_MUTED}}> · </span>
          <bdi data-no-i18n="">{fmtDay(r.date_from)}{r.date_to!==r.date_from ? " – "+fmtDay(r.date_to) : ""}</bdi>
          {sh && <span style={{color:INK_MUTED}}> · <span>{sh.kind}</span> <bdi data-no-i18n="" dir="ltr">{shiftTimes(sh)}</bdi></span>}
          {r.kind==="Tausch" && r.swap_with && <span style={{color:INK_MUTED}}> → <span data-no-i18n="">{nameOf(r.swap_with) || translateString("Du")}</span></span>}
          <span style={{color:INK_MUTED}}> · <span>{r.department}</span></span>
          {r.note && <div style={{fontSize:12.5,color:INK_MUTED}} data-no-i18n="">„{r.note}“</div>}
          {r.decision_note && <div style={{fontSize:12.5,color:INK_MUTED}}><span>Antwort:</span> <span data-no-i18n="">{r.decision_note}</span></div>}
        </div>
        <Pill color={st.color} bg={st.bg}>{r.status}</Pill>
        {actions}
      </div>
    );
  };

  const navBtn = {background:"none",border:`1px solid ${BORDER}`,borderRadius:4,padding:"6px 10px",fontSize:13,cursor:"pointer"};
  const rtl = document.documentElement.dir==="rtl";
  const upcomingMine = myShifts.slice(0,14);

  return (
    <div>
      {msg && <div className="no-print" style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:12}}>{msg.text}</div>}

      {role!=="viewer" && upcomingMine.length>0 && (
        <Card className="no-print" style={{marginBottom:18}}>
          <div style={{fontWeight:700,marginBottom:8}}>Meine Schichten</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(150px, 1fr))",gap:8}}>
            {upcomingMine.map(s=>(
              <div key={s.id} style={{border:`1px solid ${s.shift_date===today?BRASS:BORDER}`,borderRadius:6,padding:"8px 10px"}}>
                <div style={{fontSize:12,color:INK_MUTED}} data-no-i18n="">{fmtDay(s.shift_date)}</div>
                <ShiftChip s={s} />
                <div style={{fontSize:11.5,color:INK_MUTED}}>{s.department}</div>
              </div>
            ))}
          </div>
        </Card>
      )}

      <DeptTabs depts={visibleDepts} value={dept} onChange={setDept} />
      {visibleDepts.length===0 ? (
        <Card style={{marginBottom:18}}><div style={{color:INK_MUTED,fontSize:13.5}}>Dir ist noch keine Abteilung zugeordnet. Ein Admin kann das unter „Team“ ändern – dann siehst du hier den Dienstplan deiner Abteilung.</div></Card>
      ) : (
      <Card style={{marginBottom:18,padding:0}}>
        <div className="no-print" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",padding:"14px 16px"}}>
          <button style={navBtn} onClick={()=>{ setWeek(addDaysIso(week,-7)); setEditor(null); }} aria-label="Vorige Woche">{rtl ? "›" : "‹"}</button>
          <div style={{fontSize:13.5,fontWeight:600,minWidth:150,textAlign:"center"}} data-no-i18n="">{weekLabel}</div>
          <button style={navBtn} onClick={()=>{ setWeek(addDaysIso(week,7)); setEditor(null); }} aria-label="Nächste Woche">{rtl ? "‹" : "›"}</button>
          <button style={navBtn} onClick={()=>{ setWeek(mondayOfIso(today)); setEditor(null); }}>Heute</button>
          <span style={{flex:1}}></span>
          <button className="btn-primary" onClick={shareImage} disabled={sharing} title={tf("Auf dem Handy direkt an WhatsApp & Co. – am Computer wird das Bild gespeichert.")}>
            {sharing ? "…" : tf("Als Bild teilen")}
          </button>
          {canManage && <button style={navBtn} onClick={copyPrev}>Vorwoche übernehmen</button>}
          <button style={navBtn} onClick={()=>window.print()}>Drucken</button>
          <button style={navBtn} onClick={exportXlsx}>Excel</button>
        </div>
        <div style={{padding:"0 16px 6px",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
          <div style={{fontFamily:"Fraunces, serif",fontSize:16,fontWeight:600,flex:"1 1 auto"}}>
            <span>Dienstplan</span> · <span data-no-i18n="">{hotel.name}</span>
          </div>
          <div className="no-print" style={{display:"flex",border:`1px solid ${BORDER}`,borderRadius:999,overflow:"hidden"}}>
            {[["week",tf("Wochentabelle")],["days",tf("Tagesübersicht")],["duties",tf("Tageseinteilung")]].map(([k,l])=>(
              <button key={k} onClick={()=>setView(k)} style={{border:"none",background:view===k?INK:"#fff",color:view===k?"#fff":INK,padding:"5px 12px",fontSize:12.5,cursor:"pointer"}}>{l}</button>
            ))}
          </div>
        </div>
        <div className="no-print" style={{display:"flex",gap:6,flexWrap:"wrap",padding:"0 16px 10px"}}>
          {SHIFT_KINDS.map(k=>{ const st = SHIFT_STYLE[k]; return (
            <span key={k} style={{background:st.bg,color:st.fg,borderRadius:4,padding:"2px 8px",fontSize:11.5}}>
              <b>{k}</b>{timesFor(dept,k) && <bdi data-no-i18n="" dir="ltr" style={{marginInlineStart:5,opacity:0.8}}>{timesFor(dept,k)[0]}–{timesFor(dept,k)[1]}</bdi>}
            </span>
          ); })}
        </div>

        {gaps.length>0 && (
          <div style={{margin:"6px 16px 10px",border:`1px solid ${BAD}`,background:BAD_SOFT,borderRadius:6,padding:"8px 12px",fontSize:13}}>
            <b>Unterbesetzt:</b>
            {shownDepts.filter(d=>gaps.some(g=>g.d===d)).map(d=>(
              <div key={d} style={{marginTop:2}}>
                <b>{translateString(d)}</b>{" – "}
                {days.filter(day=>gaps.some(g=>g.d===d && g.day===day)).map((day,i)=>(
                  <React.Fragment key={day}>{i>0 && " · "}<bdi data-no-i18n="">{fmtDay(day)}</bdi>{": "}
                    {gaps.filter(g=>g.d===d && g.day===day).map((g,j)=>(
                      <React.Fragment key={g.k}>{j>0 && ", "}<span>{g.k}</span> <bdi data-no-i18n="" dir="ltr">{g.have}/{g.need}</bdi></React.Fragment>
                    ))}
                  </React.Fragment>
                ))}
              </div>
            ))}
          </div>
        )}

        {view==="duties" && (
          <div style={{padding:"4px 16px 14px"}}>
            <div className="no-print" style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:10}}>
              {days.map(d=>(
                <button key={d} onClick={()=>setDutyDay(d)} style={{border:`1px solid ${d===dDay?INK:BORDER}`,background:d===dDay?INK:"#fff",color:d===dDay?"#fff":INK,
                  borderRadius:999,padding:"5px 11px",fontSize:12.5,cursor:"pointer"}} data-no-i18n="">{fmtDay(d)}</button>
              ))}
              <label style={{display:"flex",gap:6,alignItems:"center",fontSize:12.5,color:INK_MUTED,marginInlineStart:"auto",cursor:"pointer"}}>
                <input type="checkbox" checked={dutyAll} onChange={e=>setDutyAll(e.target.checked)} /> {tf("Auch Personen ohne Schicht")}
              </label>
              <button className="btn-primary" onClick={shareDuties} disabled={sharing}>{sharing ? "…" : tf("Einteilung als Bild teilen")}</button>
            </div>
            <div style={{fontSize:12.5,color:INK_MUTED,marginBottom:10}}>{tf("Trag frei ein, wer heute was macht – z. B. Zimmer 101–120, Frühstück Service, Lobby, Wareneingang.")}</div>
            {shownDepts.map(d=>{
              const g = groups.find(x=>x.dept===d); const list = dutyRows(g, dDay);
              if(!list.length && !canManageDept(d)) return null;
              return (
                <div key={d} style={{border:`1px solid ${BORDER}`,borderRadius:8,marginBottom:10,overflow:"hidden"}}>
                  <div style={{background:"#F1E8D8",padding:"7px 12px",fontWeight:700,fontSize:13}}>{d}</div>
                  {list.length===0 && <div style={{padding:"10px 12px",fontSize:13,color:INK_MUTED}}>{tf("An diesem Tag ist niemand eingeplant.")}</div>}
                  {list.map(r=>{
                    const sh = shiftsFor(r,dDay).filter(s=>WORK_KINDS.includes(s.kind)); const ex = dutyOf(r,dDay);
                    return (
                      <div key={r.key+dDay} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"8px 12px",borderTop:`1px solid ${BORDER}`,flexWrap:"wrap"}}>
                        <div style={{width:170,flexShrink:0}}>
                          <div data-no-i18n="" style={{fontWeight:600,fontSize:13.5}}>{r.name}</div>
                          {sh.map(s=><ShiftChip key={s.id} s={s} />)}

                    {myUpcoming.map(s=><option key={s.id} value={s.id} data-no-i18n="">{fmtDay(s.shift_date)} · {translateString(s.kind)} {shiftTimes(s)}</option>)}
                  </select>
                </label>
                <label style={{flex:"1 1 200px"}}><div className="field-label">Übernimmt</div>
                  <select className="input" value={req.swap_with} onChange={e=>setReq({...req,swap_with:e.target.value})}>
                    <option value="">Bitte wählen</option>
                    {colleagues.map(m=><option key={m.user_id} value={m.user_id} data-no-i18n="">{m.email}</option>)}
                  </select>
                </label>
              </React.Fragment>
            )}
            <label style={{flex:"1 1 200px"}}><div className="field-label">Notiz</div><input className="input" value={req.note} onChange={e=>setReq({...req,note:e.target.value})} /></label>
            <button className="btn-primary" onClick={submitReq}
              disabled={req.kind==="Tausch" ? !(req.shift_id && req.swap_with) : !req.date_from}>Antrag stellen</button>
          </div>
          {req.kind==="Tausch" && myUpcoming.length===0 && <div style={{fontSize:12.5,color:INK_MUTED,marginTop:8}}>Du hast in diesem Hotel keine kommenden Schichten, die du tauschen könntest.</div>}
        </Card>
      )}

      {mine.length>0 && (
        <Card className="no-print">
          <div style={{fontWeight:700,marginBottom:4}}>Meine Anträge</div>
          {mine.map(r=>(
            <RequestLine key={r.id} r={r} actions={r.status==="Offen" && <button style={linkBtn} onClick={()=>withdraw(r)}>Zurückziehen</button>} />
          ))}
        </Card>
      )}
    </div>
  );
}

const LOG_KINDS = ["Info","Wichtig","Offen"];
const LOG_STYLE = {"Info":{color:INK_MUTED,bg:PAPER}, "Wichtig":{color:BAD,bg:BAD_SOFT}, "Offen":{color:WARN,bg:WARN_SOFT}};
// Abteilungen, die man sehen darf (Dienstplan, Logbuch, Checklisten)
function visibleDeptsFor(role, myDepts){
  if(role==="admin" || role==="viewer" || (role==="manager" && myDepts.length===0)) return DEPARTMENTS;
  return DEPARTMENTS.filter(d=>myDepts.includes(d)).concat(myDepts.filter(d=>!DEPARTMENTS.includes(d)));
}
// Abteilungsauswahl als Reiter (gemerkt pro Bereich)
function DeptTabs({depts, value, onChange}){
  if(depts.length<=1) return null;
  return (
    <div className="no-print" style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:12}}>
      {depts.map(d=>(
        <button key={d} onClick={()=>onChange(d)} style={{flexShrink:0,border:`1px solid ${d===value?INK:BORDER}`,background:d===value?INK:"#fff",color:d===value?"#fff":INK,
          borderRadius:999,padding:"6px 13px",fontSize:12.5,cursor:"pointer",whiteSpace:"nowrap"}}>{d}</button>
      ))}
    </div>
  );
}
function useRememberedDept(storageKey, depts){
  const [d,setD] = useState(()=>{ try { const s = window.localStorage.getItem(storageKey); if(s && depts.includes(s)) return s; } catch(e){} return depts[0] || ""; });
  const set = (v) => { setD(v); try { window.localStorage.setItem(storageKey, v); } catch(e){} };
  return [depts.includes(d) ? d : (depts[0]||""), set];
}
