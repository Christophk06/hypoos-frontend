function TempView({hotel, api, me, members, role, myDepts}){
  const visible = visibleDeptsFor(role, myDepts);
  const [points,setPoints] = useState(null);
  const [vals,setVals] = useState({});
  const [acts,setActs] = useState({});
  const [form,setForm] = useState(null);
  const [msg,setMsg] = useState(null);
  const base = "/api/hotels/"+hotel.id;
  const load = useCallback(()=>api(base+"/temp-points").then(setPoints).catch(e=>{ setMsg({ok:false,text:e.message}); setPoints([]); }),[api, base]);
  useEffect(()=>{ load(); },[load]);
  const canSetup = ["Food & Beverage"].concat(visible).some(d=>canManageDept(d));
  if(points===null) return null;
  if(!points.length && !canSetup) return null;
  const outOf = (p, v) => v!=="" && !isNaN(Number(String(v).replace(",","."))) && ((p.min_c!=null && Number(String(v).replace(",","."))<Number(p.min_c)) || (p.max_c!=null && Number(String(v).replace(",","."))>Number(p.max_c)));
  const save = async (p) => {
    setMsg(null);
    try { await api("/api/temp-points/"+p.id+"/readings","POST",{value:vals[p.id], action:acts[p.id]||""}); setVals(v=>({...v,[p.id]:""})); setActs(a=>({...a,[p.id]:""})); await load(); }
    catch(e){ setMsg({ok:false,text:e.message}); }
  };
  const exportMonth = async () => {
    try {
      const m0 = todayIso().slice(0,8)+"01";
      const rows = await api(base+"/temp-readings?from="+addDaysIso(m0,-31)+"&to="+todayIso());
      const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
      const head = [tf("Datum"), tf("Uhrzeit"), tf("Messpunkt"), "°C", tf("Bereich"), tf("Abweichung"), tf("Maßnahme"), tf("Gemessen von")];
      const data = rows.map(r=>[toLocalInput(r.taken_at).slice(0,10), fmtClock(r.taken_at), r.point_name, Number(r.value_c), (r.min_c??"")+"–"+(r.max_c??""), r.out_of_range?tf("Ja"):"", r.action||"", memberLabel(members, me, r.taken_by)]);
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...data]), "HACCP");
      XLSX.writeFile(wb, ("HACCP "+hotel.name+" "+todayIso()).replace(/[\\/:*?"<>|]+/g,"")+".xlsx");
    } catch(e){ setMsg({ok:false,text:tf("Export fehlgeschlagen: {0}", e.message)}); }
  };
  return (
    <Card style={{marginBottom:14}}>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:8}}>
        <div style={{fontWeight:700,flex:1}}>🌡 {tf("Temperaturen (HACCP)")}</div>
        {points.length>0 && <button style={smallBtn} onClick={exportMonth}>{tf("Nachweis als Excel")}</button>}
        {canSetup && !form && <button style={smallBtn} onClick={()=>setForm({name:"", min_c:"0", max_c:"4", department:"Food & Beverage"})}>{tf("+ Messpunkt")}</button>}
      </div>
      {form && (
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",background:PAPER,borderRadius:6,padding:"8px 10px",marginBottom:10}}>
          <label style={{flex:2,minWidth:160}}><div className="field-label">{tf("Name")}</div><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder={tf("z. B. Kühlraum 1, Tiefkühler, Frühstücksbuffet")} /></label>
          <label><div className="field-label">{tf("min. °C")}</div><input className="input" type="number" step="0.5" style={{width:80}} value={form.min_c} onChange={e=>setForm({...form,min_c:e.target.value})} /></label>
          <label><div className="field-label">{tf("max. °C")}</div><input className="input" type="number" step="0.5" style={{width:80}} value={form.max_c} onChange={e=>setForm({...form,max_c:e.target.value})} /></label>
          <label><div className="field-label">{tf("Abteilung")}</div><select className="input" value={form.department} onChange={e=>setForm({...form,department:e.target.value})}>{DEPARTMENTS.filter(canManageDept).map(d=><option key={d} value={d}>{d}</option>)}</select></label>
          <button className="btn-primary" disabled={!form.name.trim()} onClick={async()=>{ try { await api(base+"/temp-points","POST",form); setForm(null); await load(); } catch(e){ setMsg({ok:false,text:e.message}); } }}>{tf("Anlegen")}</button>
          <button style={linkBtn} onClick={()=>setForm(null)}>{tf("Abbrechen")}</button>
        </div>
      )}
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:8}}>{msg.text}</div>}
      {points.length===0 && <div style={{fontSize:13,color:INK_MUTED}}>{tf("Lege Kühlräume, Kühlschränke und Buffets an – dann trägt das Team die Temperaturen hier am Handy ein.")}</div>}
      {points.map(p=>{ const last = p.readings[0]; const bad = outOf(p, vals[p.id]||""); const todayDone = last && toLocalInput(last.taken_at).slice(0,10)===todayIso(); return (
        <div key={p.id} style={{borderTop:`1px solid ${BORDER}`,padding:"9px 0"}}>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:150}}><b data-no-i18n="">{p.name}</b> <span style={{fontSize:12,color:INK_MUTED}} dir="ltr" data-no-i18n="">{p.min_c??"…"} – {p.max_c??"…"} °C</span>
              <div style={{fontSize:12,color:last?(last.out_of_range?BAD:todayDone?GOOD:WARN):WARN}} data-no-i18n="">{last ? (todayDone?"✓ ":"")+Number(last.value_c)+" °C · "+fmtDateTime(last.taken_at)+" · "+memberLabel(members, me, last.taken_by) : tf("Heute noch nicht gemessen")}</div></div>
            {role!=="viewer" && visible.includes(p.department) && <React.Fragment>
              <input className="input" inputMode="decimal" style={{width:80,borderColor:bad?BAD:undefined}} placeholder="°C" value={vals[p.id]||""} onChange={e=>setVals({...vals,[p.id]:e.target.value})} />
              <button className="btn-primary" style={{padding:"7px 12px"}} disabled={!vals[p.id] || (bad && !(acts[p.id]||"").trim())} onClick={()=>save(p)}>{tf("Eintragen")}</button>
            </React.Fragment>}
            {canManageDept(p.department) && <button style={{...linkBtn,color:BAD}} onClick={()=>{ if(window.confirm(tf("Messpunkt löschen? Alle Messwerte dazu werden entfernt."))) api("/api/temp-points/"+p.id,"DELETE").then(load); }}>✕</button>}
          </div>
          {bad && <input className="input" style={{marginTop:6,borderColor:BAD}} value={acts[p.id]||""} onChange={e=>setActs({...acts,[p.id]:e.target.value})} placeholder={tf("Außerhalb des Bereichs – welche Maßnahme? z. B. Tür geschlossen, Ware umgelagert, Technik informiert")} />}
        </div>
      ); })}
    </Card>
  );
}

// ------------------------------------------------------------ Unterweisungen
function trainingStatus(t, userId){
  const mine = t.acks.filter(a=>a.user_id===userId).sort((a,b)=>a.acked_at<b.acked_at?1:-1)[0];
  if(!mine) return {state:"offen"};
  if(t.valid_months){ const until = new Date(mine.acked_at); until.setMonth(until.getMonth()+t.valid_months); if(until < new Date()) return {state:"abgelaufen", at:mine.acked_at}; return {state:"ok", at:mine.acked_at, until:until.toISOString()}; }
  return {state:"ok", at:mine.acked_at};
}
const appliesTo = (t, m) => m.role!=="viewer" && (!t.departments.length || (m.departments||[]).some(d=>t.departments.includes(d)) || m.role==="admin");
function TrainingsView({orgId, api, me, members, role, myDepts}){
  const lead = role==="admin" || role==="manager";
  const [list,setList] = useState(null);
  const [open,setOpen] = useState(null);
  const [form,setForm] = useState(null);
  const [msg,setMsg] = useState(null);
  const load = useCallback(()=>api("/api/organizations/"+orgId+"/trainings").then(setList).catch(e=>{ setMsg({ok:false,text:e.message}); setList([]); }),[api, orgId]);
  useEffect(()=>{ load(); },[load]);
  const run = async (fn, ok) => { setMsg(null); try { await fn(); if(ok) setMsg({ok:true,text:ok}); await load(); } catch(e){ setMsg({ok:false,text:e.message}); } };
  if(list===null) return <div style={{color:INK_MUTED}}>…</div>;
  const meRow = {role, departments:myDepts};
  const mine = list.filter(t=>appliesTo(t, meRow));
  const pending = mine.filter(t=>trainingStatus(t, me && me.id).state!=="ok");
  const save = () => run(async()=>{ const {id, ...b} = form; if(id) await api("/api/trainings/"+id,"PATCH",b); else await api("/api/organizations/"+orgId+"/trainings","POST",b); setForm(null); }, tf("Gespeichert."));
  return (
    <div>
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:10}}>{msg.text}</div>}
      {pending.length>0 && <Card style={{marginBottom:14,borderColor:WARN,background:WARN_SOFT}}><b>{tf("{0} Unterweisungen warten auf deine Bestätigung.", pending.length)}</b></Card>}
      {lead && !form && <button className="btn-primary" style={{marginBottom:12}} onClick={()=>setForm({title:"", body:"", departments:[], valid_months:12})}>{tf("+ Unterweisung")}</button>}
      {form && (
        <Card style={{marginBottom:14,borderColor:BRASS}}>
          <Field label={tf("Titel")}><input className="input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder={tf("z. B. Brandschutz und Fluchtwege")} /></Field>
          <Field label={tf("Inhalt")}><textarea className="input" rows={8} value={form.body} onChange={e=>setForm({...form,body:e.target.value})} style={{fontFamily:"inherit"}} placeholder={tf("Was muss jede Person wissen? Wo sind Feuerlöscher, Sammelplatz, wen rufe ich an …")} /></Field>
          <div className="field-label">{tf("Für (leer = alle)")}</div>
          <DeptChips value={form.departments} onChange={v=>setForm({...form,departments:v})} />
          <label style={{display:"block",marginTop:10}}><div className="field-label">{tf("Wiederholen nach Monaten (leer = einmalig)")}</div><input className="input" type="number" min="1" max="120" style={{width:100}} value={form.valid_months??""} onChange={e=>setForm({...form,valid_months:e.target.value})} /></label>
          <div style={{display:"flex",gap:8,marginTop:10}}><button className="btn-primary" disabled={!form.title.trim()} onClick={save}>{tf("Speichern")}</button><button style={linkBtn} onClick={()=>setForm(null)}>{tf("Abbrechen")}</button></div>
        </Card>
      )}
      {(lead ? list : mine).length===0 && !form && <Card><div style={{color:INK_MUTED,fontSize:13.5}}>{tf("Noch keine Unterweisungen.")}</div></Card>}
      {(lead ? list : mine).map(t=>{
        const st = trainingStatus(t, me && me.id); const applies = appliesTo(t, meRow);
        const target = members.filter(m=>appliesTo(t, m));
        const okCount = target.filter(m=>trainingStatus(t, m.user_id).state==="ok").length;
        return (
          <Card key={t.id} style={{marginBottom:10,borderInlineStart:applies && st.state!=="ok" ? `4px solid ${WARN}` : undefined}}>
            <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",cursor:"pointer"}} onClick={()=>setOpen(open===t.id?null:t.id)}>
              <div style={{flex:1,minWidth:200}}><div style={{fontWeight:700}} data-no-i18n="">{t.title}</div>
                <div style={{fontSize:12,color:INK_MUTED}}>{t.departments.length ? t.departments.map((d,i)=><span key={d}>{i?", ":""}<span>{d}</span></span>) : tf("Alle")}{t.valid_months ? " · "+tf("alle {0} Monate", t.valid_months) : ""}</div></div>
              {applies && <Pill color={st.state==="ok"?GOOD:WARN} bg={st.state==="ok"?GOOD_SOFT:WARN_SOFT}>{st.state==="ok" ? tf("bestätigt") : st.state==="abgelaufen" ? tf("erneuern") : tf("offen")}</Pill>}
              {lead && <span style={{fontSize:12.5,fontWeight:600,color:okCount===target.length?GOOD:INK_MUTED}} data-no-i18n="">{okCount}/{target.length}</span>}
            </div>
            {open===t.id && (
              <div style={{marginTop:10}}>
                <div style={{whiteSpace:"pre-wrap",fontSize:14,lineHeight:1.55,background:PAPER,borderRadius:6,padding:"10px 12px"}} data-no-i18n="">{t.body || "—"}</div>
                {applies && role!=="viewer" && <div style={{marginTop:10,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                  {st.state==="ok" ? <span style={{color:GOOD,fontSize:13}}>✓ {tf("Bestätigt am {0}", fmtDate(st.at))}{st.until ? " · "+tf("gültig bis {0}", fmtDate(st.until)) : ""}</span>
                    : <button className="btn-primary" onClick={()=>run(()=>api("/api/trainings/"+t.id+"/ack","POST",{}), tf("Danke – bestätigt."))}>{tf("Gelesen und verstanden")}</button>}
                </div>}
                {lead && (
                  <div style={{marginTop:12}}>
                    <div className="field-label">{tf("Noch offen")}</div>
                    <div style={{fontSize:13}} data-no-i18n="">{target.filter(m=>trainingStatus(t, m.user_id).state!=="ok").map(m=>shortName(m.email)).join(", ") || "—"}</div>
                    <div style={{display:"flex",gap:8,marginTop:8}}>
                      <button style={linkBtn} onClick={()=>setForm({...t})}>{tf("Bearbeiten")}</button>
                      <button style={{...linkBtn,color:BAD}} onClick={()=>{ if(window.confirm(tf("Unterweisung löschen? Alle Bestätigungen werden entfernt."))) run(()=>api("/api/trainings/"+t.id,"DELETE")); }}>{tf("Löschen")}</button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

      {form && (

            <button style={smallBtn} onClick={()=>{ if(window.confirm(tf("Als entsorgt markieren?"))) run(()=>api("/api/lost-found/"+x.id,"PATCH",{status:"Entsorgt"})); }}>{tf("Entsorgt")}</button>
          </div>}

      ); })}

  );
}

function StockView({hotel, api, me, role, myDepts}){
  const depts = Array.from(new Set(visibleDeptsFor(role, myDepts)));
  const [dept,setDept] = useRememberedDept("hpoos_stock_dept", depts);
  const [items,setItems] = useState(null);
  const [amount,setAmount] = useState({});
  const [form,setForm] = useState(null);
  const [hist,setHist] = useState({});
  const [msg,setMsg] = useState(null);
  const base = "/api/hotels/"+hotel.id;
  const load = useCallback(()=>api(base+"/stock").then(setItems).catch(e=>{ setMsg({ok:false,text:e.message}); setItems([]); }),[api, base]);
  useEffect(()=>{ load(); },[load]);
  // ohne gemerkte Auswahl: erste Abteilung mit Artikeln zeigen
  useEffect(()=>{ let saved = null; try { saved = window.localStorage.getItem("hpoos_stock_dept"); } catch(e){}
    if(items && !saved && !items.some(i=>i.department===dept)){ const d = depts.find(x=>items.some(i=>i.department===x)); if(d) setDept(d); } },[items]);
  const move = async (it, sign) => {
    const n = Number(String(amount[it.id]||"1").replace(",",".")); if(!n) return;
    setMsg(null);
    try { const r = await api("/api/stock/"+it.id+"/move","POST",{delta:sign*n}); setItems(xs=>xs.map(x=>x.id===it.id?r:x)); setAmount(a=>({...a,[it.id]:""}));
      if(r.reorder_created) setMsg({ok:true,text:tf("Unter Mindestbestand – der Einkauf wurde benachrichtigt.")}); }
    catch(e){ setMsg({ok:false,text:e.message}); }
  };
  if(items===null) return <div style={{color:INK_MUTED}}>…</div>;
  const mine = items.filter(i=>i.department===dept);
  const low = items.filter(i=>Number(i.quantity)<Number(i.min_quantity));
  const fmtQ = (n) => Number(n).toLocaleString(UI_LOCALE, {maximumFractionDigits:2});
  return (
    <div>
      <DeptTabs depts={depts} value={dept} onChange={setDept} />
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:10}}>{msg.text}</div>}
      {low.length>0 && <Card style={{marginBottom:12,borderColor:BAD,background:BAD_SOFT,fontSize:13}}><b>{tf("Unter Mindestbestand:")}</b> <span data-no-i18n="">{low.map(i=>i.name).join(", ")}</span></Card>}
      {canManageDept(dept) && !form && <button className="btn-primary" style={{marginBottom:12}} onClick={()=>setForm({name:"", unit:"Stück", quantity:"0", min_quantity:"0", department:dept})}>{tf("+ Artikel")}</button>}
      {form && (
        <Card style={{marginBottom:12,borderColor:BRASS}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
            <label style={{flex:2,minWidth:160}}><div className="field-label">{tf("Artikel")}</div><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder={tf("z. B. Duschgel 30 ml, Handtuch groß")} /></label>
            <label><div className="field-label">{tf("Einheit")}</div><input className="input" style={{width:90}} value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})} /></label>
            <label><div className="field-label">{tf("Bestand")}</div><input className="input" type="number" style={{width:90}} value={form.quantity} onChange={e=>setForm({...form,quantity:e.target.value})} /></label>
            <label><div className="field-label">{tf("Mindestbestand")}</div><input className="input" type="number" style={{width:90}} value={form.min_quantity} onChange={e=>setForm({...form,min_quantity:e.target.value})} /></label>
            <button className="btn-primary" disabled={!form.name.trim()} onClick={async()=>{ try { await api(base+"/stock","POST",form); setForm(null); await load(); } catch(e){ setMsg({ok:false,text:e.message}); } }}>{tf("Anlegen")}</button>
            <button style={linkBtn} onClick={()=>setForm(null)}>{tf("Abbrechen")}</button>
          </div>
        </Card>
      )}
      {mine.length===0 && !form && <Card><div style={{color:INK_MUTED,fontSize:13.5}}>{canManageDept(dept) ? tf("Noch keine Artikel. Lege Wäsche, Amenities oder Minibar-Artikel mit Mindestbestand an.") : tf("Für diese Abteilung gibt es noch keine Artikel.")}</div></Card>}
      {mine.map(it=>{ const isLow = Number(it.quantity)<Number(it.min_quantity); return (
        <Card key={it.id} style={{marginBottom:8,padding:"10px 14px",borderInlineStart:isLow?`4px solid ${BAD}`:undefined}}>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:150}}><b data-no-i18n="">{it.name}</b>
              <div style={{fontSize:12,color:isLow?BAD:INK_MUTED}}><span data-no-i18n="">{fmtQ(it.quantity)} {it.unit}</span> · {tf("Minimum {0}", fmtQ(it.min_quantity))}{it.reorder_ticket ? " · "+tf("nachbestellt") : ""}</div></div>
            {role!=="viewer" && <React.Fragment>
              <button style={{...smallBtn,minWidth:38,fontWeight:700}} onClick={()=>move(it,-1)} title={tf("Entnahme")}>−</button>
              <input className="input" inputMode="decimal" style={{width:64,textAlign:"center"}} placeholder="1" value={amount[it.id]||""} onChange={e=>setAmount({...amount,[it.id]:e.target.value})} />
              <button style={{...smallBtn,minWidth:38,fontWeight:700}} onClick={()=>move(it,1)} title={tf("Zugang")}>+</button>
            </React.Fragment>}
            <button style={linkBtn} onClick={async()=>{ if(hist[it.id]) return setHist(h=>({...h,[it.id]:null})); const r = await api("/api/stock/"+it.id+"/moves"); setHist(h=>({...h,[it.id]:r})); }}>{tf("Verlauf")}</button>
            {canManageDept(it.department) && <button style={linkBtn} onClick={()=>{ const v = window.prompt(tf("Neuer Mindestbestand"), it.min_quantity); if(v!==null) api("/api/stock/"+it.id,"PATCH",{min_quantity:v}).then(load).catch(e=>setMsg({ok:false,text:e.message})); }}>{tf("Minimum")}</button>}
            {canManageDept(it.department) && <button style={{...linkBtn,color:BAD}} onClick={()=>{ if(window.confirm(tf("Artikel löschen?"))) api("/api/stock/"+it.id,"DELETE").then(load); }}>✕</button>}
          </div>
          {hist[it.id] && <div style={{marginTop:6,fontSize:12,color:INK_MUTED}} data-no-i18n="">{hist[it.id].length ? hist[it.id].map(m=><div key={m.id}>{fmtDateTime(m.created_at)} · <b style={{color:m.delta>0?GOOD:INK}}>{m.delta>0?"+":""}{fmtQ(m.delta)}</b>{m.note?" · "+m.note:""}</div>) : "—"}</div>}
        </Card>
      ); })}
    </div>
  );
}

// ------------------------------------------------------------ Kennzahlen
function KpiView({hotel, api}){
  const [range,setRange] = useState("month");
  const [k,setK] = useState(null);
  const [msg,setMsg] = useState(null);
  const today = todayIso();
  const m0 = today.slice(0,8)+"01";
  const ranges = {week:[addDaysIso(today,-6), today], month:[m0, today], last:[addDaysIso(m0,-1).slice(0,8)+"01", addDaysIso(m0,-1)]};
  const [from,to] = ranges[range];
  useEffect(()=>{ setK(null); api("/api/hotels/"+hotel.id+"/kpis?from="+from+"&to="+to).then(setK).catch(e=>setMsg({ok:false,text:e.message})); },[range, hotel.id]);

function PasswordCard({config, token}){
  const [pw,setPw] = useState(""); const [pw2,setPw2] = useState("");
  const [msg,setMsg] = useState(null); const [busy,setBusy] = useState(false);
  const save = async () => {
    setMsg(null);
    if(pw.length < 8) return setMsg({ok:false, text:"Das neue Passwort muss mindestens 8 Zeichen haben."});
    if(pw !== pw2) return setMsg({ok:false, text:"Die beiden Passwörter stimmen nicht überein."});
    setBusy(true);
    try {
      await supabaseSetNewPassword(config.supabaseUrl, config.supabaseAnonKey, await freshToken(token), pw);
      setPw(""); setPw2(""); setMsg({ok:true, text:"Passwort geändert."});
    } catch(e){ setMsg({ok:false, text:e.message}); }
    setBusy(false);
  };
  return (
    <Card style={{marginBottom:18,maxWidth:520}}>
      <div style={{fontWeight:700,marginBottom:12}}>Passwort ändern</div>
      <Field label="Neues Passwort"><input type="password" className="input" value={pw} onChange={e=>setPw(e.target.value)} autoComplete="new-password" /></Field>
      <Field label="Neues Passwort wiederholen"><input type="password" className="input" value={pw2} onChange={e=>setPw2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()} autoComplete="new-password" /></Field>
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:10}}>{msg.text}</div>}
      <button className="btn-primary" onClick={save} disabled={busy}>{busy?"Speichert…":"Passwort ändern"}</button>
    </Card>
  );
}

function TeamView({orgId, api, inviteLinkBase, orgName, onRenamed, me, orgLanguage, onOrgGone, onLanguageChanged}){
  const [members,setMembers] = useState([]);
  const [invites,setInvites] = useState([]);
  const [email,setEmail] = useState(""); const [role,setRole] = useState("member"); const [inviteDepts,setInviteDepts] = useState([]);
  const [error,setError] = useState(""); const [copiedId,setCopiedId] = useState(null); const [loading,setLoading] = useState(false);
  const [isAdmin,setIsAdmin] = useState(false);

  const load = useCallback(async () => {
    try {
      const [m,r] = await Promise.all([
        api("/api/organizations/"+orgId+"/members"),
        api("/api/organizations/"+orgId+"/my-role"),
      ]);
      setMembers(m); setIsAdmin(r.is_admin);
      // Einladungen sehen und verwalten dürfen nur Admins (erzwingt auch die Datenbank).
      setInvites(r.is_admin ? await api("/api/organizations/"+orgId+"/invites") : []);
    } catch(e){ setError(e.message); }
  }, [api, orgId]);

  useEffect(()=>{ load(); }, [load]);

  const invite = async () => {
    if(!email) return;
    setError(""); setInviteMsg(null); setLoading(true);
    try {
      const inv = await api("/api/invites","POST",{organization_id:orgId, email, role, departments: ROLES_WITH_DEPTS.includes(role) ? inviteDepts : []});
      setInviteMsg(inv.email_sent
        ? {ok:true, text:tf("Einladung per E-Mail an {0} verschickt.", inv.email)}
        : {ok:false, text:"Einladung angelegt, aber keine E-Mail verschickt (E-Mail-Versand nicht eingerichtet). Bitte unten den Link kopieren und weitergeben."});
      setEmail(""); await load();
    }
    catch(e){ setError(e.message); }
    setLoading(false);
  };
  const [inviteMsg,setInviteMsg] = useState(null);

  const revoke = async (id) => { await api("/api/invites/"+id,"DELETE"); await load(); };

  const [teamMsg,setTeamMsg] = useState(null);
  const changeRole = async (m, newRole) => {
    setTeamMsg(null);
    try { await api("/api/organizations/"+orgId+"/members/"+m.user_id, "PATCH", {role:newRole}); await load(); setTeamMsg({ok:true, text:tf("{0} ist jetzt {1}.", m.email, translateString(ROLE_LABELS[newRole]))}); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); }
  };
  const changeDepts = async (m, list) => {
    setTeamMsg(null);
    setMembers(ms=>ms.map(x=>x.user_id===m.user_id ? {...x, departments:list} : x));
    try { await api("/api/organizations/"+orgId+"/members/"+m.user_id, "PATCH", {departments:list}); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); await load(); }
  };
  const removeMember = async (m) => {
    if(!window.confirm(tf("{0} aus der Organisation entfernen? Die Person verliert sofort den Zugriff; ihre Aufgaben bleiben erhalten, aber ohne Zuständigkeit.", m.email))) return;
    setTeamMsg(null);
    try { await api("/api/organizations/"+orgId+"/members/"+m.user_id, "DELETE"); await load(); setTeamMsg({ok:true, text:tf("{0} wurde entfernt.", m.email)}); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); }
  };
  const leave = async () => {
    if(!window.confirm(tf("„{0}“ wirklich verlassen? Du verlierst den Zugriff, bis dich ein Admin wieder einlädt.", orgName))) return;
    try { await api("/api/organizations/"+orgId+"/members/"+me.id, "DELETE"); onOrgGone(); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); }
  };
  const [confirmName,setConfirmName] = useState("");
  const [deleting,setDeleting] = useState(false);
  const deleteOrg = async () => {
    setDeleting(true); setTeamMsg(null);
    try { await api("/api/organizations/"+orgId, "DELETE", {confirm:true}); onOrgGone(); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); setDeleting(false); }
  };
  const setLanguage = async (lang) => {
    setTeamMsg(null);
    try { await api("/api/organizations/"+orgId, "PATCH", {language:lang}); onLanguageChanged(lang); }
    catch(e){ setTeamMsg({ok:false, text:e.message}); }
  };

  const [shownLinkId,setShownLinkId] = useState(null);
  const linkFor = (invite) => inviteLinkBase + "?invite=" + invite.token;
  const copyLink = (invite) => {
    // Link immer auch sichtbar anzeigen – manche Browser blockieren die Zwischenablage.
    setShownLinkId(invite.id);
    try {
      navigator.clipboard.writeText(linkFor(invite))
        .then(()=>{ setCopiedId(invite.id); setTimeout(()=>setCopiedId(null),1800); })
        .catch(()=>{});
    } catch(e){}
  };

  return (
    <div>
      {!isAdmin && error && <div style={{color:BAD,fontSize:13,marginBottom:14}}>{error}</div>}
      {isAdmin && <OrgRenameCard orgId={orgId} orgName={orgName} api={api} onRenamed={onRenamed} />}
      {isAdmin && <Card style={{marginBottom:18}}>
        <div style={{fontWeight:700,marginBottom:10}}>Teammitglied einladen</div>
        <div className="stack" style={{display:"flex",gap:10}}>
          <input className="input" placeholder="E-Mail-Adresse" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&invite()} />
          <select className="input" style={{width:190}} value={role} onChange={e=>setRole(e.target.value)}>
            <option value="member">Mitarbeitende</option>
            <option value="manager">Abteilungsleitung</option>
            <option value="viewer">Eigentümer (nur lesen)</option>
            <option value="admin">Admin</option>
          </select>
          <button className="btn-primary" onClick={invite} disabled={loading}>{loading?"…":"Einladen"}</button>
        </div>
        {ROLES_WITH_DEPTS.includes(role) && (
          <div style={{marginTop:12}}>
            <div className="field-label">Abteilungen</div>
            <DeptChips value={inviteDepts} onChange={setInviteDepts} />
            <div style={{fontSize:12,color:INK_MUTED,marginTop:6}}>{role==="manager"
              ? tf("Abteilungsleitung: sieht und plant nur die markierten Abteilungen. Keine Abteilung markiert = alle Abteilungen (z. B. Direktion).")
              : tf("Mitarbeitende sehen nur Aufgaben und Dienstplan der markierten Abteilungen.")}</div>
          </div>
        )}
        {error && <div style={{color:BAD,fontSize:13,marginTop:10}}>{error}</div>}
        {inviteMsg && <div style={{color:inviteMsg.ok?GOOD:WARN,fontSize:13,marginTop:10}}>{inviteMsg.text}</div>}
        <div style={{fontSize:12,color:INK_MUTED,marginTop:10}}>
          Die Person bekommt den Einladungslink per E-Mail. Sie muss sich damit registrieren oder anmelden,
          dann gehört sie automatisch zu deiner Organisation. Kommt keine Mail an, kannst du den Link unten auch kopieren und selbst weitergeben.
          <br /><b>Admin</b> sieht und verwaltet alles, auch Abo und Team.
          <br /><b>Abteilungsleitung</b> {tf("sieht und verwaltet die zugeordneten Abteilungen – Aufgaben, Budget, Risiken, Personal und Dienstplan – und genehmigt Anträge. Ohne Abteilung: alle Abteilungen.")}
          <br /><b>Mitarbeitende</b> sehen nur die Aufgaben ihrer Abteilungen und ihre eigenen, ihren Dienstplan und können Urlaub, Frei-Wünsche und Schichttausch beantragen.
          <br /><b>Eigentümer (nur lesen)</b> sehen Dashboard, KI-Lagebericht und Statusbericht und können kommentieren, aber nichts ändern – ideal für Eigentümer und Investoren.
        </div>
      </Card>}

      <Card style={{marginBottom:18,padding:0}}>
        <div style={{fontWeight:700,padding:"14px 16px 6px"}}>Mitglieder</div>
        <table className="resp-table" style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
          {members.filter(m=>ACCESS.role!=="member" || m.role==="admin" || (me && m.user_id===me.id)
              || (m.departments||[]).some(d=>(ACCESS.depts||[]).includes(d))).map(m=>{
            const isMe = me && m.user_id===me.id;
            return (
              <tr key={m.user_id} style={{borderTop:`1px solid ${BORDER}`}}>
                <td style={{padding:12}}>
                  <span data-no-i18n="">{m.email}</span>{isMe && <span style={{color:INK_MUTED}}> (du)</span>}
                  {ROLES_WITH_DEPTS.includes(m.role) && (isAdmin
                    ? <div style={{marginTop:8}}><DeptChips value={m.departments} onChange={list=>changeDepts(m, list)} /></div>
                    : <div style={{fontSize:12,color:INK_MUTED,marginTop:4}}>{(m.departments||[]).length ? (m.departments||[]).map((d,i)=><React.Fragment key={d}>{i>0 && ", "}<span>{d}</span></React.Fragment>) : <span>Keine Abteilung</span>}</div>)}
                  {isAdmin && m.role==="member" && (m.departments||[]).length===0 && <div style={{fontSize:12,color:WARN,marginTop:4}}>Ohne Abteilung sieht diese Person nur Aufgaben, die ihr direkt zugewiesen sind.</div>}
                  {isAdmin && m.role==="manager" && <div style={{fontSize:12,color:INK_MUTED,marginTop:4}}>{(m.departments||[]).length ? tf("Leitet nur die markierten Abteilungen.") : tf("Ohne Abteilung: leitet alle Abteilungen (z. B. Direktion).")}</div>}
                </td>
                <td style={{padding:12,color:INK_MUTED}}>
                  {isAdmin && !isMe
                    ? <select className="input" style={{width:200,padding:"5px 8px",fontSize:13}} value={m.role} onChange={e=>changeRole(m, e.target.value)}>
                        {Object.entries(ROLE_LABELS).map(([k,l])=><option key={k} value={k}>{l}</option>)}
                      </select>
                    : (ROLE_LABELS[m.role] || m.role)}
                </td>
                <td style={{padding:12,color:INK_MUTED}}>{tf("seit {0}", fmtDate(m.joined_at))}</td>
                <td style={{padding:12,textAlign:"right"}}>
                  {isAdmin && !isMe && <button style={{...linkBtn,color:BAD}} onClick={()=>removeMember(m)}>Entfernen</button>}
                </td>
              </tr>
            );
          })}
        </tbody></table>
      </Card>

      {teamMsg && <div style={{color:teamMsg.ok?GOOD:BAD,fontSize:13,margin:"-8px 0 14px"}}>{teamMsg.text}</div>}

      {isAdmin && (
        <Card style={{marginBottom:18}}>
          <div style={{fontWeight:700,marginBottom:6}}>Standardsprache der Organisation</div>
          <div style={{fontSize:12.5,color:INK_MUTED,marginBottom:10}}>Gilt für E-Mails, die Pre-Opening-Vorlage, den KI-Lagebericht und für alle Mitglieder ohne eigene Sprachauswahl.</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}} data-no-i18n="">
            {LANGS.map(([k,l])=>(
              <button key={k} onClick={()=>setLanguage(k)} className={orgLanguage===k?"btn-primary":""}
                style={orgLanguage===k ? {} : {background:"none",border:`1px solid ${BORDER}`,borderRadius:4,padding:"9px 16px",fontSize:13.5,cursor:"pointer"}}>{l}</button>
            ))}
          </div>
        </Card>
      )}

      {invites.filter(i=>i.status==="ausstehend").length > 0 && (
        <Card style={{padding:0}}>
          <div style={{fontWeight:700,padding:"14px 16px 6px"}}>Ausstehende Einladungen</div>
          <table className="resp-table" style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
            {invites.filter(i=>i.status==="ausstehend").map(i=>(
              <tr key={i.id} style={{borderTop:`1px solid ${BORDER}`}}>
                <td style={{padding:12}}><span data-no-i18n="">{i.email}</span><div style={{fontSize:11.5,color:INK_MUTED}}>{ROLE_LABELS[i.role] || i.role}</div>
                  {shownLinkId===i.id && (
                    <input readOnly className="input" value={linkFor(i)} onFocus={e=>e.target.select()} autoFocus
                      style={{marginTop:8,fontSize:12}} />
                  )}
                </td>
                <td style={{padding:12}}>
                  <button onClick={()=>copyLink(i)} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 10px",fontSize:12.5,cursor:"pointer"}}>
                    {copiedId===i.id ? "Kopiert!" : "Link kopieren"}
                  </button>
                </td>
                <td style={{padding:12}}><button onClick={()=>revoke(i.id)} style={{background:"none",border:"none",color:INK_MUTED,cursor:"pointer"}}>✕</button></td>
              </tr>
            ))}
          </tbody></table>
        </Card>
      )}

      <Card style={{marginTop:18,borderColor:BAD_SOFT}}>
        <div style={{fontWeight:700,marginBottom:6,color:BAD}}>Gefahrenzone</div>
        {!isAdmin && (
          <div>
            <div style={{fontSize:13,color:INK_MUTED,marginBottom:10}}>Wenn du die Organisation verlässt, verlierst du den Zugriff auf alle ihre Hotels.</div>
            <button onClick={leave} style={{background:"none",border:`1px solid ${BAD}`,color:BAD,borderRadius:4,padding:"8px 14px",fontSize:13,cursor:"pointer"}}>Organisation verlassen</button>
          </div>
        )}
        {isAdmin && (
          <div>
            <div style={{fontSize:13,color:INK_MUTED,marginBottom:10}}>
              Löscht <b>„{orgName}“</b> endgültig mit allen Hotels, Aufgaben, Kommentaren, Dokumenten und Berichten. Ein laufendes Abo wird sofort beendet.
              Exportiere vorher bei Bedarf jedes Hotel über „Excel-Export“. <b>Das kann nicht rückgängig gemacht werden.</b>
            </div>
            <Field label={tf("Zur Bestätigung den Namen der Organisation eingeben: {0}", orgName)}>
              <input className="input" value={confirmName} onChange={e=>setConfirmName(e.target.value)} />
            </Field>
            <button onClick={deleteOrg} disabled={deleting || confirmName.trim()!==orgName.trim()}
              style={{background:confirmName.trim()===orgName.trim()?BAD:"#ccc",color:"#fff",border:"none",borderRadius:4,padding:"9px 16px",fontSize:13.5,fontWeight:600,cursor:"pointer"}}>
              {deleting ? "Wird gelöscht…" : "Organisation endgültig löschen"}
            </button>
          </div>
        )}
      </Card>
    </div>
  );
}

// Menü je Rolle
function navFor(role, hasBilling, myDepts){
  const N = (key,label,section) => ({key,label,section});
  if(role==="viewer") return [N("dashboard","Dashboard"), N("timeline","Zeitstrahl"), N("kpis","Kennzahlen"), N("team","Team"), N("account","Konto")];
  // Zimmerstatus sehen alle; im Menü nur für Housekeeping, Rezeption und die Leitung
  const rooms = role!=="member" || (myDepts||[]).some(d=>d==="Housekeeping" || d==="Rezeption & Empfang");
  const ops = [N("roster","Dienstplan","Betrieb"), N("time","Zeiterfassung","Betrieb"), ...(rooms ? [N("rooms","Zimmerstatus","Betrieb")] : []), N("tickets","Meldungen","Betrieb"),
    N("logbook","Übergabebuch","Betrieb"), N("checklists","Checklisten","Betrieb"), N("stock","Lager","Betrieb"), N("lostfound","Fundsachen","Betrieb"), N("trainings","Unterweisungen","Betrieb"), N("chat","Chat","Betrieb")];
  if(role==="member") return [N("dashboard","Start"), N("mine","Meine Aufgaben"), N("tasks","Aufgaben","Projekt"), N("timeline","Zeitstrahl","Projekt"),
    ...ops, N("docs","Dokumente","Allgemein"), N("team","Team","Allgemein"), N("account","Konto","Allgemein")];
  return [
    N("dashboard","Dashboard"), N("mine","Meine Aufgaben"), N("kpis","Kennzahlen"),
    N("tasks","Aufgaben","Projekt"), N("milestones","Meilensteine","Projekt"), N("timeline","Zeitstrahl","Projekt"),
    N("risks","Risiken","Projekt"), N("budget","Budget","Projekt"), N("staff","Personal","Projekt"),
    ...ops,
    N("docs","Dokumente","Allgemein"), N("team","Team","Allgemein"),
    ...(role==="admin" && hasBilling ? [N("billing","Abo","Allgemein")] : []),
    N("account","Konto","Allgemein"),
  ];
}

function App(){
  // Verbindungsdaten sofort setzen: eine gespeicherte Sitzung braucht sie schon beim ersten Anzeigen
  const [config,setConfig] = useState(DEFAULT_CONFIG);
  // Gespeicherte Sitzung wiederherstellen – so bleibt man nach dem Neuladen angemeldet
  const [token,setToken] = useState(() => { if(window.OUVERTURE_DEMO) return "demo"; const s = Session.load(); return s ? s.access_token : null; });
  const [orgId,setOrgId] = useState(null);
  const [orgs,setOrgs] = useState([]);
  const [members,setMembers] = useState([]);
  const [me,setMe] = useState(null);
  const [hotels,setHotels] = useState(null);
  const [hotel,setHotel] = useState(null);
  const [tab,setTab] = useState("dashboard");
  const [tasks,setTasks] = useState([]);
  const [milestones,setMilestones] = useState([]);
  const [risks,setRisks] = useState([]);
  const [budget,setBudget] = useState([]);
  const [staff,setStaff] = useState([]);
  const [readiness,setReadiness] = useState(null);
  const [fatalError,setFatalError] = useState("");
  const [recoveryToken,setRecoveryToken] = useState(null);
  const [recoveryDone,setRecoveryDone] = useState(false);
  const [editingHotel,setEditingHotel] = useState(false);
  const [showReport,setShowReport] = useState(false);
  const [billing,setBilling] = useState(null);
  const [billingNotice,setBillingNotice] = useState(null);
  const [ai,setAi] = useState(null);
  const [fxTick,setFxTick] = useState(0); // neu zeichnen, wenn Kurse oder Anzeigewährung sich ändern
  const [ticketPrefill,setTicketPrefill] = useState(null);
  // Aus einer Benachrichtigung geöffnet (?open=roster usw.): nach der Hotelauswahl dorthin
  const [openFromLink,setOpenFromLink] = useState(()=>{ try {
    const q = new URLSearchParams(window.location.search);
    if(q.get("clock")){ rememberClockCode(q.get("clock")); q.delete("clock"); window.history.replaceState(null,"",window.location.pathname+(q.toString()?"?"+q:"")); return "time"; }
    return q.get("open"); } catch(e){ return null; } });

  useEffect(()=>{
    // Verbindungsdaten sind fest eingebaut – niemand muss sie mehr eintragen.
    setConfig(DEFAULT_CONFIG);
    // Erkennt den Link aus der "Passwort vergessen"-E-Mail: Supabase hängt
    // #access_token=...&type=recovery an die URL an, wenn man draufklickt.
    try {
      const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
      const params = new URLSearchParams(hash);
      if(params.get("type")==="recovery" && params.get("access_token")){
        setRecoveryToken(params.get("access_token"));
        window.history.replaceState(null,"",window.location.pathname);
      }
    } catch(e){}
    // Erkennt einen Team-Einladungslink: ?invite=<token>. Der Token wird im
    // Browser gemerkt, damit er auch nach Registrierung + E-Mail-Bestätigung
    // (die zurück auf die Seite ohne ?invite führt) noch da ist.
    try {
      const search = new URLSearchParams(window.location.search);
      if(search.get("invite")){
        try { window.localStorage.setItem(LS_INVITE_KEY, search.get("invite")); } catch(e){}
        window.history.replaceState(null,"",window.location.pathname);
      }
      // Rückkehr von der Stripe-Bezahlseite oder der Abo-Verwaltung: ?billing=success|cancel|portal
      if(search.get("billing")){
        setBillingNotice(search.get("billing"));
        setTab("billing");
        window.history.replaceState(null,"",window.location.pathname);
      }
    } catch(e){}
  },[]);

  // Erneuerung fehlgeschlagen (z. B. lange nicht benutzt) -> zurück zur Anmeldung
  useEffect(()=>{ Session.onExpired = () => { setToken(null); setOrgId(null); }; return () => { Session.onExpired = null; }; },[]);
  const login = (data) => { Session.save(sessionFromAuth(data)); setToken(data.access_token); };
  const logout = async () => { await unsubscribePushOnLogout(api); Session.save(null); setToken(null); setOrgId(null); setOrgs([]); setHotel(null); setHotels(null); };

  const saveConfig = (cfg) => {
    setConfig(cfg);
    try { if(cfg) window.localStorage.setItem(LS_KEY, JSON.stringify(cfg)); else window.localStorage.removeItem(LS_KEY); } catch(e){}
  };

  const api = useCallback((path, method, body) => apiCall(config.backendUrl, token, path, method, body), [config, token]);

  useEffect(()=>{
    if(!token || !config) return;
    (async () => {
      try {
        let organizationId;
        let fromInvite = false;
        let inviteToken = null;
        try { inviteToken = window.localStorage.getItem(LS_INVITE_KEY); } catch(e){}
        if(inviteToken){
          try {
            const accepted = await apiCall(config.backendUrl, token, "/api/invites/accept", "POST", {token:inviteToken});
            organizationId = accepted.organization_id; fromInvite = true;
          } catch(e){ setFatalError(tf("Einladung: {0}", e.message)); }
          // Einladung nur einmal verarbeiten – egal ob angenommen oder ungültig.
          try { window.localStorage.removeItem(LS_INVITE_KEY); } catch(e){}
        }
        if(!organizationId){
          const boot = await apiCall(config.backendUrl, token, "/api/bootstrap-organization", "POST", {name:"Meine Organisation"});
          organizationId = boot.organization_id;
        }
        const list = await apiCall(config.backendUrl, token, "/api/organizations");
        // Zuletzt benutzte Organisation wiederherstellen – außer man kommt gerade über eine Einladung.
        let saved = null;
        try { saved = window.localStorage.getItem(LS_ORG_KEY); } catch(e){}
        if(!fromInvite && saved && list.some(o=>o.id===saved)) organizationId = saved;
        setOrgs(list);
        setOrgId(organizationId);
      } catch(e){ setFatalError(e.message); }
    })();
  },[token, config]);

  // Hotels immer nur für die gewählte Organisation laden.
  useEffect(()=>{
    if(!token || !orgId) return;
    let cancelled = false;
    setHotels(null);
    apiCall(config.backendUrl, token, "/api/hotels?organization_id=" + encodeURIComponent(orgId))
      .then(h=>{ if(!cancelled) setHotels(h); })
      .catch(e=>{ if(!cancelled) setFatalError(e.message); });
    return () => { cancelled = true; };
  },[token, orgId, config]);

  // Abo der gewählten Organisation. Fehlt es (z. B. Backend noch ohne Abo-Funktion), wird nichts angezeigt.
  const loadBilling = useCallback(() => {
    if(!token || !orgId) { setBilling(null); return; }
    apiCall(config.backendUrl, token, "/api/organizations/"+orgId+"/billing").then(setBilling).catch(()=>setBilling(null));
  },[token, orgId, config]);
  useEffect(()=>{ loadBilling(); },[loadBilling]);
  // Nach der Bezahlung meldet Stripe das Abo per Webhook – kann ein paar Sekunden dauern.
  useEffect(()=>{
    if(billingNotice!=="success" && billingNotice!=="portal") return;
    const timers = [2000, 5000, 10000, 20000].map(ms=>setTimeout(loadBilling, ms));
    return () => timers.forEach(clearTimeout);
  },[billingNotice, loadBilling]);

  const switchOrg = (id) => {
    setHotel(null); setTab("dashboard"); setFatalError(""); setOrgId(id);
    try { window.localStorage.setItem(LS_ORG_KEY, id); } catch(e){}
  };
  const currentOrg = orgs.find(o=>o.id===orgId);
  // Eigentümer-Zugang: alles sehen, nichts ändern (die Datenbank erzwingt das zusätzlich)
  const isViewer = !!(currentOrg && currentOrg.role==="viewer");
  const role = currentOrg ? currentOrg.role : "member";
  const myDepts = (currentOrg && currentOrg.departments) || [];
  ACCESS = {role, depts: myDepts};
  const isAdmin = role==="admin";
  const isLead = role==="admin" || role==="manager";
  // Oberfläche in der Sprache der Organisation
  useEffect(()=>{ if(currentOrg) followOrgLanguage(currentOrg.language || "de"); },[currentOrg && currentOrg.language]);
  useEffect(()=>{ if(currentOrg && !navFor(role, !!billing && !window.OUVERTURE_DEMO, myDepts).some(n=>n.key===tab)) setTab("dashboard"); },[role, tab, !!billing, !!currentOrg, myDepts.join("|")]);

  // Tageskurse für die eigene Anzeigewährung
  useEffect(()=>{
    apiCall(config.backendUrl, null, "/api/fx").then(r=>{ FX = r; setFxTick(x=>x+1); }).catch(()=>{});
  },[config]);
  // Sprache und Währung geräteübergreifend: gespeicherte Einstellung übernehmen bzw. nachtragen
  useEffect(()=>{
    if(!me) return;
    if(me.currency && !DISPLAY_CURRENCY){ setDisplayCurrency(me.currency); setFxTick(x=>x+1); }
    const chosen = chosenUiLanguage();
    if(me.language && !chosen && me.language !== UI_LANG){ chooseUiLanguage(me.language); return; }
    if(chosen && chosen !== me.language) apiCall(config.backendUrl, token, "/api/me/settings", "PUT", {language: chosen}).catch(()=>{});
  },[me && me.id]);
  // Zuletzt geöffnetes Hotel und Ansicht merken – nach Sprachwechsel oder Neuladen geht es dort weiter
  useEffect(()=>{
    if(!hotel || !orgId) return;
    try { window.localStorage.setItem(LS_HOTEL_KEY, JSON.stringify({orgId, hotelId: hotel.id, tab})); } catch(e){}
  },[hotel && hotel.id, tab, orgId]);
  useEffect(()=>{
    if(hotel || !hotels || !orgId) return;
    if(window.OUVERTURE_DEMO && hotels.length){ setHotel(hotels[0]); return; }
    let saved = null;
    try { saved = JSON.parse(window.localStorage.getItem(LS_HOTEL_KEY) || "null"); } catch(e){}
    if(!saved || saved.orgId !== orgId) return;
    const h = hotels.find(x=>x.id===saved.hotelId);
    if(h){ setHotel(h); if(saved.tab) setTab(saved.tab); }
  },[hotels, orgId]);
  const leaveHotel = () => { try { window.localStorage.removeItem(LS_HOTEL_KEY); } catch(e){} setHotel(null); };
  useEffect(()=>{
    if(!hotel || !openFromLink) return;
    setTab(openFromLink); setOpenFromLink(null);
    try { const u = new URL(window.location.href); u.searchParams.delete("open"); window.history.replaceState(null,"",u.pathname+u.search); } catch(e){}
  },[hotel && hotel.id, openFromLink]);

  // Wer bin ich, und wer ist im Team? (für Zuständigkeiten)
  useEffect(()=>{
    if(!token) { setMe(null); return; }
    apiCall(config.backendUrl, token, "/api/me").then(setMe).catch(()=>setMe(null));
  },[token, config]);
  useEffect(()=>{
    if(!token || !orgId) { setMembers([]); return; }
    apiCall(config.backendUrl, token, "/api/organizations/"+orgId+"/members").then(setMembers).catch(()=>setMembers([]));
  },[token, orgId, config]);

  const loadHotelData = useCallback(async (h) => {
    if(!h) return;
    const base = "/api/hotels/" + h.id;
    try {
      const [t,m,r,rd,b,s] = await Promise.all([
        apiCall(config.backendUrl, token, base+"/tasks"),
        apiCall(config.backendUrl, token, base+"/milestones"),
        apiCall(config.backendUrl, token, base+"/risks"),
        apiCall(config.backendUrl, token, base+"/readiness"),
        // Budget/Personal dürfen das Laden der übrigen Daten nie blockieren.
        apiCall(config.backendUrl, token, base+"/budget").catch(()=>[]),
        apiCall(config.backendUrl, token, base+"/staff").catch(()=>[]),
      ]);
      setTasks(t); setMilestones(m); setRisks(r); setReadiness(rd); setBudget(b); setStaff(s);
    } catch(e){ setFatalError(e.message); }
  },[config, token]);

  useEffect(()=>{ if(hotel) loadHotelData(hotel); },[hotel, loadHotelData]);
  const chatUnread = useChatUnread(api, hotel, me, role, tab);
  useEffect(()=>{
    setAi(null);
    if(!hotel || !token) return;
    if(ACCESS.role==="member") return;
    apiCall(config.backendUrl, token, "/api/hotels/"+hotel.id+"/ai-report").then(setAi).catch(()=>setAi(null));
  },[hotel, token, config]);

  if(config===undefined) return <div style={{padding:40,color:INK_MUTED}}>Lädt…</div>;
  if(!config) return <SetupView onSave={saveConfig} />;
  if(recoveryToken && !recoveryDone) return <ResetPasswordView config={config} accessToken={recoveryToken} onDone={()=>{setRecoveryDone(true);setRecoveryToken(null);}} />;
  if(recoveryDone) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:380,width:"100%",textAlign:"center"}}>
        <div style={{fontFamily:"Fraunces, serif",fontSize:18,fontWeight:600,marginBottom:10}}>Passwort geändert</div>
        <div style={{fontSize:13.5,color:INK_MUTED,marginBottom:16}}>Du kannst dich jetzt mit deinem neuen Passwort anmelden.</div>
        <button className="btn-primary" style={{width:"100%"}} onClick={()=>setRecoveryDone(false)}>Zur Anmeldung</button>
      </Card>
    </div>
  );
  if(!token) return <LoginView config={config} onLogin={login} onReset={()=>saveConfig(null)} />;
  // hotels === null heißt: noch nicht geladen. Erst danach entscheiden, ob Liste oder Formular.
  if(!hotel && hotels===null) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:380,width:"100%",textAlign:"center"}}>
        {fatalError
          ? <React.Fragment>
              <div style={{color:BAD,fontSize:13.5,marginBottom:14}}>{fatalError}</div>
              <button className="btn-primary" style={{width:"100%"}} onClick={()=>{setFatalError("");logout();}}>Zurück zur Anmeldung</button>
            </React.Fragment>
          : <div style={{color:INK_MUTED,fontSize:13.5}}>Hotels werden geladen…</div>}
      </Card>
    </div>
  );
  if(!hotel) return <HotelSetupView hotels={hotels} orgId={orgId} api={api} orgs={orgs} onSwitchOrg={switchOrg} readOnly={!isAdmin}
    onCreated={(h)=>{ setHotels([...hotels,h]); setHotel(h); }} onSelect={setHotel} />;
  if(hotel) HOTEL_CURRENCY = hotel.currency || "EUR";
  if(showReport) return <ReportView hotel={hotel} orgName={currentOrg ? currentOrg.name : ""} me={me}
    readiness={readiness} tasks={tasks} milestones={milestones} risks={risks} budget={budget} staff={staff}
    aiReport={ai && ai.report} onClose={()=>setShowReport(false)} />;

  const NAV = navFor(role, !!billing && !window.OUVERTURE_DEMO, myDepts);

  HOTEL_CURRENCY = hotel.currency || "EUR";
  const callHotel = (suffix, method, body) => api("/api/hotels/"+hotel.id+suffix, method, body);
  // Für Dokumente: Upload direkt in den Supabase-Speicher; Admins dürfen alle Dokumente löschen
  const docCtx = {
    hotel,
    upload: {supabaseUrl: config.supabaseUrl, anonKey: config.supabaseAnonKey, token},
    me: me ? {...me, isAdmin: !!(currentOrg && currentOrg.role==="admin")} : null,
  };
  const callId = (resource, id, method, body) => api("/api/"+resource+"/"+id, method, body);

  return (
    <div className="app-shell" style={{fontFamily:"Inter, sans-serif",background:PAPER,minHeight:"100vh",display:"flex"}}>
      <div className="sidebar" style={{width:210,background:INK,color:"#fff",padding:"22px 14px",flexShrink:0}}>
        <div className="brand" style={{fontFamily:"Fraunces, serif",fontSize:18,fontWeight:500,letterSpacing:0.3,padding:"0 8px 20px",borderBottom:"1px solid "+(hotel.brand_color||"rgba(201,166,107,0.3)"),marginBottom:16,display:"flex",alignItems:"center",gap:9}}><Logo size={22} color={hotel.brand_color||"#C9A66B"} />Ouverture</div>
        <OrgSwitcher orgs={orgs} orgId={orgId} onSwitch={switchOrg} dark />
        {NAV.map((n,i)=>(
          <React.Fragment key={n.key}>
          {n.section && n.section!==(NAV[i-1]||{}).section && <div style={{fontSize:10.5,letterSpacing:0.8,textTransform:"uppercase",color:"rgba(255,255,255,0.38)",margin:"14px 0 4px 12px"}}>{n.section}</div>}
          <div className="nav-item" onClick={()=>setTab(n.key)} style={{padding:"8px 10px 8px 12px",borderRadius:0,cursor:"pointer",marginBottom:2,fontSize:13.5,borderInlineStart:"2px solid "+(tab===n.key?(hotel.brand_color||"#C9A66B"):"transparent"),background:tab===n.key?"rgba(201,166,107,0.08)":"transparent",color:tab===n.key?"#fff":"rgba(255,255,255,0.62)"}}>{n.label}{n.key==="chat" && chatUnread>0 && tab!=="chat" && <span style={{color:"#E8A598",marginInlineStart:6,fontSize:11}}>●</span>}</div>
          </React.Fragment>
        ))}
        <div className="nav-item" onClick={leaveHotel} style={{padding:"9px 10px",borderRadius:7,cursor:"pointer",marginTop:14,fontSize:13,color:"rgba(255,255,255,0.65)"}}>Hotel wechseln</div>
        <div style={{marginTop:18}}><LanguageSwitcher dark withDefault api={api} me={me} onCurrency={()=>setFxTick(x=>x+1)} /></div>
        <div style={{marginTop:8}}><InstallAppButton dark /></div>
        <div className="logout" onClick={logout} style={{marginTop:20,fontSize:13,color:"rgba(255,255,255,0.5)",cursor:"pointer"}}>Abmelden</div>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div className="page-header" style={{padding:"18px 28px",borderBottom:`1px solid ${BORDER}`,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
          <div>
            <div style={{fontFamily:"Fraunces, serif",fontSize:20,fontWeight:600,display:"flex",alignItems:"center",gap:10}}>{hotel.logo_data && <img src={hotel.logo_data} alt="" style={{height:30,maxWidth:90,objectFit:"contain"}} />}<span data-no-i18n="">{hotel.name}</span>{hotel.is_demo && <Pill color={BRASS} bg={BRASS_SOFT}>Beispielhotel</Pill>}</div>
            <div style={{fontSize:12.5,color:INK_MUTED}}>{hotel.city} · {tf("{0} Zimmer · Eröffnung {1}", hotel.rooms, fmtDate(hotel.opening_date))}</div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {role!=="member" && <button onClick={()=>{ setShowReport(true); window.scrollTo(0,0); }} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer"}}>Statusbericht</button>}
            {role!=="member" && <button onClick={async ()=>{ try { await exportHotelXlsx({hotel, tasks, milestones, risks, budget, staff, members}); } catch(e){ setFatalError(tf("Export fehlgeschlagen: {0}", e.message)); } }}
              style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer"}}>Excel-Export</button>}
            <button onClick={()=>downloadIcs({hotel, tasks, milestones})} title="Offene Fristen und Meilensteine für Outlook, Google oder Apple Kalender"
              style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer"}}>Kalender</button>
            {hotel.is_demo && isAdmin && !window.OUVERTURE_DEMO && <button onClick={async ()=>{
                if(!window.confirm("Beispielhotel mit allen Beispieldaten löschen? Du kannst es später jederzeit neu anlegen.")) return;
                try { await api("/api/hotels/"+hotel.id,"DELETE"); setHotels((hotels||[]).filter(x=>x.id!==hotel.id)); setHotel(null); }
                catch(e){ setFatalError(e.message); }
              }} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer",color:INK_MUTED}}>Beispiel entfernen</button>}
            {!editingHotel && isAdmin && <button onClick={()=>setEditingHotel(true)} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 12px",fontSize:12.5,cursor:"pointer"}}>Hotel bearbeiten</button>}
          </div>
        </div>
        <div className="page-content" style={{padding:"22px 28px"}}>
          {window.OUVERTURE_DEMO && <DemoBar role={role} />}
          {fatalError && <div style={{color:BAD,marginBottom:14}}>{fatalError}</div>}
          {tab!=="billing" && isAdmin && !window.OUVERTURE_DEMO && <BillingBanner billing={billing} onOpen={()=>setTab("billing")} />}
          {role==="member" && tab==="dashboard" && <MemberHome hotel={hotel} api={api} me={me} orgId={orgId} tasks={tasks} myDepts={myDepts} onOpen={setTab} />}
          {isViewer && <div className="no-print" style={{border:`1px solid ${BRASS}`,background:BRASS_SOFT,borderRadius:8,padding:"9px 14px",marginBottom:16,fontSize:13.5}}>
            <b>Eigentümer-Ansicht:</b> Du siehst den aktuellen Stand, den KI-Lagebericht und den Statusbericht. Ändern können nur Mitglieder des Projektteams.
          </div>}
          {editingHotel && <HotelEditForm hotel={hotel} api={api} onCancel={()=>setEditingHotel(false)}
            onSaved={(h)=>{ setHotel(h); setHotels((hotels||[]).map(x=>x.id===h.id?h:x)); setEditingHotel(false); }} />}
          {tab==="dashboard" && isAdmin && <GettingStarted hotel={hotel} api={api} tasks={tasks} members={members} onOpen={setTab} />}
          {tab==="dashboard" && role!=="member" && <AiReportCard hotel={hotel} api={api} ai={ai} onChange={setAi} readOnly={!isLead} />}
          {tab==="dashboard" && role!=="member" && <DashboardView readiness={readiness} tasks={tasks} risks={risks} budget={budget} staff={staff} lead={role!=="member"} onOpen={isLead ? setTab : ()=>{}} />}
          {tab==="mine" && <MyTasksView orgId={orgId} api={api} hotelId={hotel.id} refresh={()=>loadHotelData(hotel)} />}
          {tab==="tasks" && <TasksView tasks={tasks} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} members={members} me={me} api={api} docCtx={docCtx} />}
          {tab==="timeline" && <TimelineView hotel={hotel} tasks={tasks} milestones={milestones} />}
          {tab==="milestones" && <MilestonesView milestones={milestones} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="risks" && <RisksView risks={risks} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="budget" && <ConversionNote />}
          {tab==="budget" && <BudgetView items={budget} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="time" && <TimeView hotel={hotel} api={api} me={me} members={members} role={role} myDepts={myDepts} onHotel={(h)=>{ setHotel(h); setHotels((hotels||[]).map(x=>x.id===h.id?h:x)); }} />}
          {tab==="rooms" && <RoomsView hotel={hotel} api={api} me={me} members={members} role={role} myDepts={myDepts} onReport={(loc)=>{ setTicketPrefill(loc); setTab("tickets"); }} />}
          {tab==="tickets" && <TicketsView hotel={hotel} api={api} me={me} members={members} role={role} myDepts={myDepts} prefill={ticketPrefill} onPrefillUsed={()=>setTicketPrefill(null)} />}
          {tab==="chat" && <ChatView hotel={hotel} api={api} me={me} members={members} role={role} myDepts={myDepts} />}
          {tab==="logbook" && <LogbookView hotel={hotel} api={api} me={me} members={members} role={role} myDepts={myDepts} />}
          {tab==="checklists" && <ChecklistsView hotel={hotel} api={api} me={me} role={role} myDepts={myDepts} members={members} />}
          {tab==="trainings" && <TrainingsView orgId={orgId} api={api} me={me} members={members} role={role} myDepts={myDepts} />}
          {tab==="lostfound" && <LostFoundView hotel={hotel} api={api} me={me} members={members} role={role} />}
          {tab==="stock" && <StockView hotel={hotel} api={api} me={me} role={role} myDepts={myDepts} />}
          {tab==="kpis" && <KpiView hotel={hotel} api={api} />}
          {tab==="roster" && <RosterView hotel={hotel} api={api} me={me} members={members} role={role} myDepts={myDepts} orgId={orgId} />}
          {tab==="docs" && <DocumentsPanel hotel={hotel} api={api} upload={docCtx.upload} me={docCtx.me} />}
          {tab==="staff" && <StaffView positions={staff} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="team" && <TeamView orgId={orgId} api={api} inviteLinkBase={window.location.origin + window.location.pathname}
            orgName={currentOrg ? currentOrg.name : ""} me={me} orgLanguage={currentOrg ? currentOrg.language : "de"}
            onRenamed={(org)=>setOrgs(orgs.map(o=>o.id===org.id?{...o,name:org.name}:o))}
            onLanguageChanged={(lang)=>setOrgs(orgs.map(o=>o.id===orgId?{...o,language:lang}:o))}
            onOrgGone={()=>{ try { window.localStorage.removeItem(LS_ORG_KEY); } catch(e){} window.location.reload(); }} />}
          {tab==="account" && <AccountView config={config} token={token} me={me} api={api}
            onDeleted={()=>{ Session.save(null); try { window.localStorage.removeItem(LS_ORG_KEY); } catch(e){} window.location.reload(); }} />}
          {tab==="billing" && <BillingView billing={billing} orgId={orgId} api={api} notice={billingNotice}
            isAdmin={isAdmin} onReload={loadBilling} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
