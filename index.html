// ------------------------------------------------------------ Betrieb: Zeiterfassung, Zimmer, Meldungen, Push
const pad2 = (n) => String(n).padStart(2,"0");
const fmtClock = (iso) => new Date(iso).toLocaleTimeString(UI_LOCALE,{hour:"2-digit",minute:"2-digit"});
const fmtHM = (h) => { const neg = h<0; const m = Math.round(Math.abs(h)*60); return (neg?"−":"")+Math.floor(m/60)+":"+pad2(m%60); };
const toLocalInput = (iso) => { if(!iso) return ""; const d = new Date(iso); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes()); };
const fromLocalInput = (v) => v ? new Date(v).toISOString() : null;
const entryHours = (e, now) => Math.max(0, ((e.clock_out ? new Date(e.clock_out) : (now||new Date())) - new Date(e.clock_in))/3600000 - (Number(e.break_minutes)||0)/60);
const memberLabel = (members, me, id) => { if(me && id===me.id) return tf("Du"); const m = members.find(x=>x.user_id===id); return m ? shortName(m.email) : tf("Teammitglied"); };
function myClockDepts(role, myDepts){ return (role==="admin" || role==="manager") && myDepts.length===0 ? DEPARTMENTS : myDepts; }
const currentMonth = () => todayIso().slice(0,7);
const smallBtn = {background:"#fff",border:`1px solid ${BORDER}`,borderRadius:6,padding:"6px 11px",fontSize:12.5,cursor:"pointer",color:INK};

// Foto verkleinern (lange Seite höchstens 1280 px, JPEG), damit es schnell hochlädt
function compressImage(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    if(!file || !/^image\//.test(file.type)) return reject(new Error(tf("Bitte eine Bilddatei wählen.")));
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, (maxSide||1280)/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
      const c = document.createElement("canvas"); c.width = w; c.height = h; const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      let q = quality||0.72, out = c.toDataURL("image/jpeg", q);
      while(out.length > 650000 && q > 0.3){ q -= 0.12; out = c.toDataURL("image/jpeg", q); }
      out.length > 690000 ? reject(new Error(tf("Das Foto ist zu groß."))) : resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(tf("Das Foto konnte nicht gelesen werden."))); };
    img.src = url;
  });
}

// Kommen / Gehen – für alle, die im Dienstplan stehen
function ClockCard({hotel, api, role, myDepts, compact, onChanged}){
  const depts = myClockDepts(role, myDepts);
  const [dept,setDept] = useRememberedDept("hpoos_clock_dept", depts);
  const [data,setData] = useState(null);
  const [brk,setBrk] = useState("");
  const [msg,setMsg] = useState(null);
  const [busy,setBusy] = useState(false);
  const [,setTick] = useState(0);
  const [queued,setQueued] = useState(clockQueue().length);
  const load = useCallback(()=>api("/api/time/me").then(d=>{ setData(d); if(d.open){ const h = (Date.now()-new Date(d.open.clock_in))/3600000; setBrk(b=>b!=="" ? b : String(h>6?30:0)); } })
    .catch(e=>{ if(isNetworkError(e)) setData(d=>d||{open:null, entries:[], offline:true}); else setMsg({ok:false,text:e.message}); }),[api]);
  useEffect(()=>{ load(); },[load]);
  useEffect(()=>{ const t = setInterval(()=>setTick(x=>x+1), 30000); return ()=>clearInterval(t); },[]);
  // offline gespeicherte Buchungen senden, sobald wieder Netz da ist
  useEffect(()=>{
    const f = () => flushClockQueue(api).then(r=>{ setQueued(clockQueue().length); if(r.sent){ setMsg({ok:true,text:tf("{0} offline gespeicherte Buchungen gesendet.", r.sent)}); load(); } if(r.errors.length) setMsg({ok:false,text:r.errors[0]}); });
    f(); window.addEventListener("online", f); return ()=>window.removeEventListener("online", f);
  },[api]);
  const code = clockCodeNow();
  const needQr = !!hotel.clock_qr_required && !code;
  const doClock = async (kind) => {
    setBusy(true); setMsg(null);
    const b = Number(brk)||0;
    try {
      if(kind==="in") await api("/api/hotels/"+hotel.id+"/time/clock-in","POST",{department:dept, code});
      else await api("/api/time/clock-out","POST",{break_minutes:b, code});
      setBrk(""); await load(); if(onChanged) onChanged();
    } catch(e){
      if(isNetworkError(e)){ setClockQueue([...clockQueue(), {kind, hotel:hotel.id, dept, brk:b, code, at:new Date().toISOString()}]); setQueued(clockQueue().length); setBrk("");
        setMsg({ok:true,text:tf("Kein Netz – die Buchung ist gespeichert und wird automatisch gesendet.")}); }
      else setMsg({ok:false,text:e.message});
    }
    setBusy(false);
  };
  if(role==="viewer") return null;
  const q = clockQueue(); const lastQ = q[q.length-1];
  const open = lastQ ? (lastQ.kind==="in" ? {clock_in:lastQ.at, department:lastQ.dept, hotel_id:lastQ.hotel, break_minutes:0} : null) : (data && data.open);
  const month = currentMonth();
  const monthEntries = data ? data.entries.filter(e=>e.clock_out && e.hotel_id===hotel.id && toLocalInput(e.clock_in).slice(0,7)===month) : [];
  const monthTotal = monthEntries.reduce((s,e)=>s+entryHours(e),0);
  return (
    <Card style={{marginBottom:14,borderColor:open?GOOD:BORDER}}>
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:180}}>
          <div style={{fontWeight:700}}>{tf("Zeiterfassung")}</div>
          {!data ? <div style={{fontSize:13,color:INK_MUTED}}>…</div> : open ? (
            <div style={{fontSize:13.5,marginTop:2}}>
              <span style={{color:GOOD,fontWeight:700}}>● {tf("Eingestempelt seit {0}", fmtClock(open.clock_in))}</span>
              <span style={{color:INK_MUTED}}> · <span data-no-i18n="">{fmtHM(entryHours({...open, break_minutes:0}))} h</span> · <span>{open.department}</span></span>
              {open.hotel_id!==hotel.id && <div style={{fontSize:12.5,color:WARN}}>{tf("Im Hotel {0}", open.hotel_name)}</div>}
            </div>
          ) : <div style={{fontSize:13,color:INK_MUTED,marginTop:2}}>{tf("Nicht eingestempelt.")}</div>}
          {data && <div style={{fontSize:12,color:INK_MUTED,marginTop:4}}>{tf("Diesen Monat: {0} h", fmtHM(monthTotal))}</div>}
        </div>
        {data && !open && depts.length>1 && <select className="input" style={{width:"auto",minWidth:150}} value={dept} onChange={e=>setDept(e.target.value)}>{depts.map(d=><option key={d} value={d}>{d}</option>)}</select>}
        {data && open && (
          <label style={{fontSize:12.5,color:INK_MUTED,display:"flex",alignItems:"center",gap:6}}>{tf("Pause")}
            <input className="input" type="number" min="0" max="600" step="5" value={brk} onChange={e=>setBrk(e.target.value)} style={{width:74}} /> {tf("Min.")}
          </label>
        )}
        {data && needQr && <div style={{fontSize:13,color:WARN,maxWidth:260}}>📷 {tf("Zum Stempeln den QR-Code am Mitarbeitereingang mit der Handykamera scannen.")}</div>}
        {data && !needQr && (open
          ? <button className="btn-primary" disabled={busy} style={{background:BAD,minWidth:110,padding:"11px 18px"}} onClick={()=>doClock("out")}>{tf("Gehen")}</button>
          : <button className="btn-primary" disabled={busy || !dept} style={{background:GOOD,minWidth:110,padding:"11px 18px"}} onClick={()=>doClock("in")}>{tf("Kommen")}</button>)}
      </div>
      {open && Number(brk)===0 && entryHours({...open, break_minutes:0})>6 && <div style={{fontSize:12.5,color:WARN,marginTop:8}}>{tf("Ab 6 Stunden Arbeit sind mindestens 30 Minuten Pause vorgeschrieben.")}</div>}
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginTop:8}}>{msg.text}</div>}
      {queued>0 && <div style={{fontSize:12.5,color:WARN,marginTop:6}}>⏳ {tf("{0} Buchungen warten auf Netz.", queued)}</div>}
      {!compact && monthEntries.length>0 && (
        <div style={{marginTop:12}}>
          <div style={{fontSize:12,fontWeight:700,color:INK_MUTED,textTransform:"uppercase",marginBottom:4}}>{tf("Meine Zeiten")}</div>
          {monthEntries.map(e=>(
            <div key={e.id} style={{display:"flex",gap:10,padding:"6px 0",borderTop:`1px solid ${BORDER}`,fontSize:13.5}} data-no-i18n="">
              <span style={{width:110,color:INK_MUTED}}>{fmtDay(toLocalInput(e.clock_in).slice(0,10))}</span>
              <span style={{flex:1}} dir="ltr">{fmtClock(e.clock_in)}–{fmtClock(e.clock_out)}{e.break_minutes ? " · "+e.break_minutes+" min" : ""}</span>
              {e.edited_by && <span style={{fontSize:11.5,color:WARN}}>{tf("korrigiert")}</span>}
              {e.offline && <span style={{fontSize:11.5,color:INK_MUTED}}>{tf("offline")}</span>}
              <b>{fmtHM(entryHours(e))}</b>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

function TimeView({hotel, api, me, members, role, myDepts, onHotel}){
  const lead = role==="admin" || role==="manager";
  return (
    <div>
      <ClockCard hotel={hotel} api={api} role={role} myDepts={myDepts} />

}

// Leitung: wer ist da, Monatsauswertung, Korrekturen, Lohn-Export
function TeamTime({hotel, api, me, members, role, myDepts}){
  const depts = visibleDeptsFor(role, myDepts).filter(canManageDept);
  const [dept,setDept] = useState("");
  const [month,setMonth] = useState(currentMonth());
  const [entries,setEntries] = useState([]);
  const [shifts,setShifts] = useState([]);
  const [targets,setTargets] = useState([]);
  const [openKey,setOpenKey] = useState(null);
  const [edit,setEdit] = useState(null);
  const [add,setAdd] = useState(null);
  const [msg,setMsg] = useState(null);
  const base = "/api/hotels/"+hotel.id;
  const mb = payrollMonthBounds(month);
  const load = useCallback(async()=>{
    const q = "?from="+mb.first+"&to="+mb.last+(dept ? "&department="+encodeURIComponent(dept) : "");
    try {
      const [e,s,t] = await Promise.all([api(base+"/time-entries"+q), api(base+"/shifts"+q), api(base+"/staff-hours")]);
      const ok = (d) => dept ? d===dept : depts.includes(d);
      setEntries(e.filter(x=>ok(x.department))); setShifts(s.filter(x=>ok(x.department))); setTargets(t.filter(x=>ok(x.department)));
    } catch(e){ setMsg({ok:false,text:e.message}); }
  },[api, base, dept, month]);
  useEffect(()=>{ load(); },[load]);
  if(!depts.length) return null;
  const nameOf = (id) => { const m = members.find(x=>x.user_id===id); return m ? shortName(m.email) : tf("Teammitglied"); };
  const partial = payrollSollDays(month, todayIso()) < mb.days; // laufender Monat: Soll bis heute
  const holidays = holidayMap(hotel.holiday_region, mb.first, mb.last);
  const rows = payrollSummary({month, entries, shifts, targets, nameOf, today: todayIso(), holidays});
  const openNow = entries.filter(e=>!e.clock_out);
  const run = async (fn) => { setMsg(null); try { await fn(); await load(); } catch(e){ setMsg({ok:false,text:e.message}); } };
  const saveEdit = () => run(async()=>{ await api("/api/time-entries/"+edit.id,"PATCH",{clock_in:fromLocalInput(edit.in), clock_out:fromLocalInput(edit.out), break_minutes:Number(edit.brk)||0, note:edit.note}); setEdit(null); });
  const saveAdd = () => run(async()=>{ await api(base+"/time-entries","POST",{user_id:add.user, department:add.dept, clock_in:fromLocalInput(add.in), clock_out:fromLocalInput(add.out), break_minutes:Number(add.brk)||0, note:add.note}); setAdd(null); });
  const H = (n) => n==null ? "–" : fmtHours(n);
  const exportRows = () => rows.map(r=>[r.name, r.user_id ? (members.find(m=>m.user_id===r.user_id)||{}).email||"" : "", r.departments.join(", "), r.target, r.planned, r.entries?r.worked:null, r.diff, r.breaks, r.night, r.sunday, r.holiday, r.vacation, r.sick, r.entries, r.corrected, r.open]);
  const header = [tf("Name"), tf("E-Mail"), tf("Abteilung"), partial ? tf("Soll bis heute (h)") : tf("Soll (h)"), tf("Geplant (h)"), tf("Ist (h)"), tf("Differenz (h)"), tf("Pausen (h)"), tf("Nachtstunden 22–6 (h)"), tf("Sonntagsstunden (h)"), tf("Feiertagsstunden (h)"), tf("Urlaubstage"), tf("Krankentage"), tf("Buchungen"), tf("davon korrigiert"), tf("offen")];
  const bookingRows = () => entries.filter(e=>e.clock_out).map(e=>[toLocalInput(e.clock_in).slice(0,10), nameOf(e.user_id), e.department, fmtClock(e.clock_in), fmtClock(e.clock_out), e.break_minutes, Math.round(entryHours(e)*100)/100, e.note||"", e.edited_by ? nameOf(e.edited_by) : "", e.edited_at ? fmtDateTime(e.edited_at) : ""]);
  const bookingHeader = [tf("Datum"), tf("Name"), tf("Abteilung"), tf("Kommen"), tf("Gehen"), tf("Pause (Min.)"), tf("Stunden"), tf("Notiz"), tf("korrigiert von"), tf("korrigiert am")];
  const fileName = (ext) => (tf("Lohn-Export")+" "+hotel.name+" "+month+(dept?" "+dept:"")).replace(/[\\/:*?"<>|]+/g,"")+"."+ext;
  const exportXlsx = async () => {
    try {
      const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
      const wb = XLSX.utils.book_new();
      const s1 = XLSX.utils.aoa_to_sheet([header, ...exportRows()]); s1["!cols"] = header.map((h,i)=>({wch:i<3?22:12}));
      XLSX.utils.book_append_sheet(wb, s1, tf("Monatsauswertung").slice(0,31));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([bookingHeader, ...bookingRows()]), tf("Buchungen").slice(0,31));
      XLSX.writeFile(wb, fileName("xlsx"));
    } catch(e){ setMsg({ok:false,text:tf("Export fehlgeschlagen: {0}", e.message)}); }
  };
  const exportCsv = () => {
    const blob = new Blob([payrollCsv(header, exportRows())], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName("csv"); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  };
  const deptMembers = members.filter(m=>m.role!=="viewer" && (!add || !add.dept || (m.departments||[]).includes(add.dept) || m.role==="admin"));
  const th = {textAlign:"end",padding:"6px 8px",fontSize:11.5,color:INK_MUTED,fontWeight:700,whiteSpace:"nowrap"};
  const td = {textAlign:"end",padding:"7px 8px",fontSize:13,whiteSpace:"nowrap"};
  return (
    <div>
      <div className="no-print" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"18px 0 12px"}}>
        <div style={{fontFamily:"Fraunces, serif",fontSize:18,fontWeight:600,flex:1,minWidth:200}}>{tf("Team und Monatsauswertung")}</div>
        <select className="input" style={{width:"auto"}} value={dept} onChange={e=>setDept(e.target.value)}>
          {depts.length>1 && <option value="">{tf("Alle meine Abteilungen")}</option>}
          {depts.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        <input type="month" className="input" style={{width:160}} value={month} onChange={e=>e.target.value && setMonth(e.target.value)} />
      </div>
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:10}}>{msg.text}</div>}
      <Card style={{marginBottom:14}}>
        <div style={{fontWeight:700,marginBottom:6}}>{tf("Jetzt im Dienst")} <span style={{color:INK_MUTED,fontWeight:400}} data-no-i18n="">({openNow.length})</span></div>
        {openNow.length===0 ? <div style={{fontSize:13,color:INK_MUTED}}>{tf("Gerade ist niemand eingestempelt.")}</div> : openNow.map(e=>(
          <div key={e.id} style={{display:"flex",gap:10,padding:"5px 0",borderTop:`1px solid ${BORDER}`,fontSize:13.5}}>
            <span style={{color:GOOD}}>●</span><span style={{flex:1}}><span data-no-i18n="">{nameOf(e.user_id)}</span> · <span>{e.department}</span></span><span dir="ltr" data-no-i18n="">{fmtClock(e.clock_in)} · {fmtHM(entryHours({...e,break_minutes:0}))} h</span>
          </div>
        ))}
      </Card>
      <Card style={{marginBottom:14,padding:0,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"14px 16px 6px",flexWrap:"wrap"}}>
          <div style={{fontWeight:700,flex:1}}>{tf("Monatsauswertung")} · <span data-no-i18n="">{new Date(mb.first+"T12:00:00").toLocaleDateString(UI_LOCALE,{month:"long",year:"numeric"})}</span></div>
          <button style={smallBtn} onClick={()=>setAdd({user:"", dept:dept||depts[0], in:"", out:"", brk:"30", note:""})}>{tf("+ Zeit nachtragen")}</button>
          <button style={smallBtn} onClick={exportCsv}>CSV</button>
          <button className="btn-primary" style={{padding:"7px 12px",fontSize:12.5}} onClick={exportXlsx}>{tf("Lohn-Export (Excel)")}</button>
        </div>
        <div style={{fontSize:12,color:INK_MUTED,padding:"0 16px 8px"}}>{tf("Ist = gestempelte Zeit abzüglich Pausen, in der Ortszeit dieses Geräts.")}{" "}
          {hotel.holiday_region ? <span>{tf("Feiertage ({0}): {1}", holidayRegionLabel(hotel.holiday_region, UI_LOCALE), Object.keys(holidays).length ? Object.entries(holidays).map(([d,n])=>fmtDay(d,{day:"2-digit",month:"2-digit"})+" "+n).join(", ") : tf("keine in diesem Monat"))}</span>
            : <span>{tf("Feiertage werden berücksichtigt, sobald unter „Hotel bearbeiten“ eine Feiertagsregion gewählt ist.")}</span>}</div>
        {add && (
          <div style={{padding:"10px 16px",background:PAPER,borderTop:`1px solid ${BORDER}`,display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
            <label style={{fontSize:12}}><div className="field-label">{tf("Abteilung")}</div><select className="input" value={add.dept} onChange={e=>setAdd({...add,dept:e.target.value})}>{depts.map(d=><option key={d} value={d}>{d}</option>)}</select></label>
            <label style={{fontSize:12}}><div className="field-label">{tf("Person")}</div><select className="input" value={add.user} onChange={e=>setAdd({...add,user:e.target.value})}><option value="">–</option>{deptMembers.map(m=><option key={m.user_id} value={m.user_id}>{shortName(m.email)}</option>)}</select></label>
            <label style={{fontSize:12}}><div className="field-label">{tf("Kommen")}</div><input className="input" type="datetime-local" value={add.in} onChange={e=>setAdd({...add,in:e.target.value})} /></label>
            <label style={{fontSize:12}}><div className="field-label">{tf("Gehen")}</div><input className="input" type="datetime-local" value={add.out} onChange={e=>setAdd({...add,out:e.target.value})} /></label>
            <label style={{fontSize:12}}><div className="field-label">{tf("Pause (Min.)")}</div><input className="input" type="number" min="0" style={{width:80}} value={add.brk} onChange={e=>setAdd({...add,brk:e.target.value})} /></label>
            <label style={{fontSize:12,flex:1,minWidth:140}}><div className="field-label">{tf("Notiz")}</div><input className="input" value={add.note} onChange={e=>setAdd({...add,note:e.target.value})} placeholder={tf("z. B. Stempeln vergessen")} /></label>
            <button className="btn-primary" disabled={!add.user||!add.in||!add.out} onClick={saveAdd}>{tf("Speichern")}</button>
            <button style={linkBtn} onClick={()=>setAdd(null)}>{tf("Abbrechen")}</button>
          </div>
        )}
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:720}}>
            <thead><tr style={{borderTop:`1px solid ${BORDER}`,background:PAPER}}>
              <th style={{...th,textAlign:"start"}}>{tf("Name")}</th><th style={th}>{partial ? tf("Soll bis heute") : tf("Soll")}</th><th style={th}>{tf("Geplant")}</th><th style={th}>{tf("Ist")}</th><th style={th}>{tf("Differenz")}</th>
              <th style={th}>{tf("Nacht")}</th><th style={th}>{tf("Sonntag")}</th><th style={th}>{tf("Feiertag")}</th><th style={th}>{tf("Urlaub")}</th><th style={th}>{tf("Krank")}</th>
            </tr></thead>
            <tbody>
              {rows.length===0 && <tr><td colSpan={10} style={{padding:16,fontSize:13,color:INK_MUTED}}>{tf("Für diesen Monat gibt es noch keine Schichten oder Zeiten.")}</td></tr>}
              {rows.map(r=>(
                <React.Fragment key={r.key}>
                  <tr onClick={()=>r.user_id && setOpenKey(openKey===r.key?null:r.key)} style={{borderTop:`1px solid ${BORDER}`,cursor:r.user_id?"pointer":"default",background:openKey===r.key?BRASS_SOFT:"transparent"}}>
                    <td style={{...td,textAlign:"start"}}><b data-no-i18n="">{r.name}</b>{r.open>0 && <span style={{color:GOOD}}> ●</span>}{r.corrected>0 && <span style={{color:WARN,fontSize:11}} data-no-i18n=""> ✎{r.corrected}</span>}<div style={{fontSize:11,color:INK_MUTED}}>{r.departments.map((d,i)=><span key={d}>{i?", ":""}<span>{d}</span></span>)}</div></td>
                    <td style={td}>{H(r.target)}</td><td style={td}>{H(r.planned)}</td><td style={td}>{r.entries?H(r.worked):"–"}</td>
                    <td style={{...td,fontWeight:700,color:r.diff==null?INK_MUTED:r.diff>0.01?WARN:r.diff<-0.01?BAD:GOOD}}>{r.diff==null?"–":(r.diff>0?"+":"")+fmtHours(r.diff)}</td>
                    <td style={td}>{r.night?H(r.night):"–"}</td><td style={td}>{r.sunday?H(r.sunday):"–"}</td><td style={td}>{r.holiday?H(r.holiday):"–"}</td><td style={td}>{r.vacation||"–"}</td><td style={td}>{r.sick||"–"}</td>
                  </tr>
                  {openKey===r.key && entries.filter(e=>e.user_id===r.user_id).map(e=>(
                    <tr key={e.id} style={{background:"#FBFAF7",borderTop:`1px dashed ${BORDER}`}}>
                      <td colSpan={10} style={{padding:"7px 12px",fontSize:13}}>
                        {edit && edit.id===e.id ? (
                          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                            <input className="input" type="datetime-local" style={{width:"auto"}} value={edit.in} onChange={ev=>setEdit({...edit,in:ev.target.value})} />
                            <input className="input" type="datetime-local" style={{width:"auto"}} value={edit.out} onChange={ev=>setEdit({...edit,out:ev.target.value})} />
                            <input className="input" type="number" min="0" style={{width:80}} value={edit.brk} onChange={ev=>setEdit({...edit,brk:ev.target.value})} title={tf("Pause (Min.)")} />
                            <input className="input" style={{flex:1,minWidth:120}} value={edit.note} onChange={ev=>setEdit({...edit,note:ev.target.value})} placeholder={tf("Notiz")} />
                            <button className="btn-primary" style={{padding:"6px 12px"}} onClick={saveEdit}>{tf("Speichern")}</button>
                            <button style={linkBtn} onClick={()=>setEdit(null)}>{tf("Abbrechen")}</button>
                          </div>
                        ) : (
                          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                            <span style={{width:110,color:INK_MUTED}} data-no-i18n="">{fmtDay(toLocalInput(e.clock_in).slice(0,10))}</span>
                            <span dir="ltr">{fmtClock(e.clock_in)}–{e.clock_out?fmtClock(e.clock_out):"…"}</span>
                            <span style={{color:INK_MUTED}}>{e.break_minutes?tf("Pause {0} Min.", e.break_minutes):""}</span>
                            <b data-no-i18n="">{fmtHM(entryHours(e))} h</b>
                            {e.department!==r.departments[0] && <span style={{color:INK_MUTED}}>{e.department}</span>}
                            {e.note && <span style={{color:INK_MUTED}} data-no-i18n="">· {e.note}</span>}
                            {e.edited_by && <span style={{color:WARN,fontSize:11.5}}>{tf("korrigiert von {0}", nameOf(e.edited_by))}</span>}
                            <span style={{flex:1}}></span>
                            {canManageDept(e.department) && <button style={linkBtn} onClick={()=>setEdit({id:e.id, in:toLocalInput(e.clock_in), out:toLocalInput(e.clock_out), brk:String(e.break_minutes||0), note:e.note||""})}>{tf("Bearbeiten")}</button>}
                            {canManageDept(e.department) && <button style={{...linkBtn,color:BAD}} onClick={()=>{ if(window.confirm(tf("Buchung löschen?"))) run(()=>api("/api/time-entries/"+e.id,"DELETE")); }}>✕</button>}
                          </div>
                        )}
                      </td>
                    </tr>
                  ))}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

// ------------------------------------------------------------ Zimmerstatus
const ROOM_STATUS = ["Schmutzig","In Reinigung","Sauber","Kontrolliert","Außer Betrieb"];
const ROOM_OCC = ["Unbelegt","Belegt","Abreise","Anreise"];
const ROOM_STYLE = {"Schmutzig":{bg:BAD_SOFT,fg:BAD}, "In Reinigung":{bg:WARN_SOFT,fg:WARN}, "Sauber":{bg:"#E3ECF5",fg:"#2D5B87"}, "Kontrolliert":{bg:GOOD_SOFT,fg:GOOD}, "Außer Betrieb":{bg:"#E5E7EB",fg:"#4B5563"}};
const roomLocation = (n) => tf("Zimmer {0}", n);

function RoomsView({hotel, api, me, members, role, myDepts, onReport}){
  const visible = visibleDeptsFor(role, myDepts);
  const canEdit = role!=="viewer" && (visible.includes("Housekeeping") || visible.includes("Rezeption & Empfang"));
  const canSetup = canManageDept("Housekeeping") || canManageDept("Rezeption & Empfang");
  const [rooms,setRooms] = useState(null);
  const [tickets,setTickets] = useState([]);
  const [filter,setFilter] = useState("");
  const [floor,setFloor] = useState("");
  const [mine,setMine] = useState(false);
  const [sel,setSel] = useState(null);
  const [numbers,setNumbers] = useState("");
  const [rtype,setRtype] = useState("");
  const [msg,setMsg] = useState(null);
  const base = "/api/hotels/"+hotel.id;
  const load = useCallback(async()=>{
    try { setRooms(await api(base+"/rooms")); } catch(e){ setMsg({ok:false,text:e.message}); setRooms([]); }
    api(base+"/tickets?status=open").then(setTickets).catch(()=>setTickets([]));
  },[api, base]);
  useEffect(()=>{ load(); },[load]);
  const patch = (r, changes) => {
    setRooms(rs=>rs.map(x=>x.id===r.id ? {...x, ...changes, updated_by:me&&me.id, updated_at:new Date().toISOString()} : x));
    api("/api/rooms/"+r.id,"PATCH",changes).catch(e=>{ setMsg({ok:false,text:e.message}); load(); });
  };
  const bulk = async (ids, changes, label) => {
    if(!ids.length) return;
    setMsg(null);
    try { const r = await api(base+"/rooms/bulk","POST",{ids, ...changes}); setMsg({ok:true,text:tf("{0} Zimmer geändert.", r.updated)}); await load(); }
    catch(e){ setMsg({ok:false,text:e.message}); }
  };
  const create = async () => {
    setMsg(null);
    try { const r = await api(base+"/rooms","POST",{numbers, room_type:rtype}); setMsg({ok:true,text:tf("{0} Zimmer angelegt.", r.created)+(r.skipped?" "+tf("{0} gab es schon.", r.skipped):"")}); setNumbers(""); await load(); }
    catch(e){ setMsg({ok:false,text:e.message}); }
  };
  if(rooms===null) return <div style={{color:INK_MUTED}}>…</div>;
  const floors = [...new Set(rooms.map(r=>r.floor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const ticketsFor = (n) => tickets.filter(t=>t.location && new RegExp("(^|\\D)"+String(n).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|\\D)").test(t.location));
  const shown = rooms.filter(r=>(!filter || r.status===filter || r.occupancy===filter) && (!floor || r.floor===floor) && (!mine || (me && r.assigned_to===me.id)));
  const count = (k) => rooms.filter(r=>r.status===k || r.occupancy===k).length;
  const cur = sel && rooms.find(r=>r.id===sel);
  const hkMembers = members.filter(m=>m.role!=="viewer" && ((m.departments||[]).includes("Housekeeping") || m.role==="admin"));
  const chip = (k, st) => (
    <button key={k} onClick={()=>setFilter(filter===k?"":k)} style={{border:`1px solid ${filter===k?INK:(st?st.fg+"55":BORDER)}`,background:st?st.bg:"#fff",color:st?st.fg:INK,borderRadius:999,padding:"5px 11px",fontSize:12.5,cursor:"pointer",fontWeight:filter===k?700:500,whiteSpace:"nowrap"}}>
      {k} <b data-no-i18n="">{count(k)}</b>
    </button>
  );
  return (
    <div>
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:10}}>{msg.text}</div>}
      {role==="admin" && <PmsCard hotel={hotel} api={api} onSynced={load} />}
      {canSetup && (
        <Card style={{marginBottom:14,borderColor:rooms.length?BORDER:BRASS}}>

const TICKET_STATUS = ["Offen","In Arbeit","Erledigt"];
const TICKET_STYLE = {"Offen":{color:WARN,bg:WARN_SOFT}, "In Arbeit":{color:"#2D5B87",bg:"#E3ECF5"}, "Erledigt":{color:GOOD,bg:GOOD_SOFT}};
const TICKET_DEPTS = ["Technik","IT & Systeme","Housekeeping","Sicherheit","Food & Beverage","Rezeption & Empfang"];

function TicketsView({hotel, api, me, members, role, myDepts, prefill, onPrefillUsed}){
  const visible = visibleDeptsFor(role, myDepts);
  const [section,setSection] = useState("defects"); // defects | wishes | plans
  const canPlans = TICKET_DEPTS.some(d=>canManageDept(d));
  const [list,setList] = useState(null);
  const [filter,setFilter] = useState("open");
  const [onlyMine,setOnlyMine] = useState(false);
  const [form,setForm] = useState(null);
  const [photos,setPhotos] = useState({});
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);
  const base = "/api/hotels/"+hotel.id;
  const load = useCallback(async()=>{
    try { setList(await api(base+"/tickets?status="+filter)); } catch(e){ setMsg({ok:false,text:e.message}); setList([]); }
  },[api, base, filter]);
  useEffect(()=>{ load(); },[load]);
  const emptyForm = (loc) => section==="wishes" ? {location:loc||"", title:"", description:"", priority:"Normal", department:"Housekeeping", photo:null, kind:"Gästewunsch"}
    : {location:loc||"", title:"", description:"", priority:"Normal", department:"Technik", photo:null, kind:"Mangel"};
  useEffect(()=>{ if(prefill){ setForm(emptyForm(prefill)); if(onPrefillUsed) onPrefillUsed(); window.scrollTo(0,0); } },[prefill]);
  const run = async (fn) => { setMsg(null); try { await fn(); await load(); } catch(e){ setMsg({ok:false,text:e.message}); } };
  const pickPhoto = async (file) => { if(!file) return; try { const d = await compressImage(file, 1280, 0.72); setForm(f=>({...f, photo:d})); } catch(e){ setMsg({ok:false,text:e.message}); } };
  const submit = async () => {
    setBusy(true); setMsg(null);
    try {
      await api(base+"/tickets","POST",{location:form.location, title:form.title, description:form.description, priority:form.priority, department:form.department, photo_data:form.photo||undefined, kind:form.kind});
      setForm(null); setMsg({ok:true,text:tf("Danke – die Meldung ist bei der zuständigen Abteilung.")}); await load();
    } catch(e){ setMsg({ok:false,text:e.message}); }
    setBusy(false);
  };
  const showPhoto = async (t) => { if(photos[t.id]) { setPhotos(p=>({...p,[t.id]:null})); return; } try { const r = await api("/api/tickets/"+t.id+"/photo"); setPhotos(p=>({...p,[t.id]:r.photo_data})); } catch(e){ setMsg({ok:false,text:e.message}); } };
  const shown = (list||[]).filter(t=>(section==="wishes" ? t.kind==="Gästewunsch" : t.kind!=="Gästewunsch") && (!onlyMine || (me && (t.reporter_id===me.id || t.assignee_id===me.id))));
  const T = useTranslated(api, shown.flatMap(t=>[t.title, t.description||""]));
  const canWork = (t) => visible.includes(t.department) || (me && t.assignee_id===me.id);
  const sections = [["defects","Mängel"],["wishes","Gästewünsche"], ...(canPlans ? [["plans","Wartungsplan"]] : [])];
  const tabs = (
    <div className="no-print" style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
      {sections.map(([k,l])=><button key={k} onClick={()=>{ setSection(k); setForm(null); }} style={{border:`1px solid ${section===k?INK:BORDER}`,background:section===k?INK:"#fff",color:section===k?"#fff":INK,borderRadius:8,padding:"7px 14px",fontSize:13,cursor:"pointer",fontWeight:section===k?700:500}}>{tf(l)}</button>)}
    </div>
  );
  if(section==="plans") return <div>{tabs}<MaintenancePlans hotel={hotel} api={api} role={role} myDepts={myDepts} /></div>;
  return (
    <div>
      {tabs}
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginBottom:10}}>{msg.text}</div>}
      {role!=="viewer" && !form && <button className="btn-primary" style={{marginBottom:14,padding:"11px 18px"}} onClick={()=>setForm(emptyForm(""))}>{section==="wishes" ? "🛎 "+tf("Gästewunsch erfassen") : "🔧 "+tf("Mangel melden")}</button>}
      {form && (
        <Card style={{marginBottom:16,borderColor:BRASS}}>
          <div style={{fontWeight:700,marginBottom:10}}>{form.kind==="Gästewunsch" ? tf("Gästewunsch erfassen") : tf("Mangel melden")}</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <label style={{flex:1,minWidth:150}}><div className="field-label">{tf("Wo?")}</div><input className="input" value={form.location} onChange={e=>setForm({...form,location:e.target.value})} placeholder={form.kind==="Gästewunsch" ? tf("z. B. Zimmer 305") : tf("z. B. Zimmer 214, Lobby, Küche")} /></label>
            <label style={{flex:2,minWidth:200}}><div className="field-label">{form.kind==="Gästewunsch" ? tf("Was wünscht der Gast?") : tf("Was ist kaputt?")}</div><input className="input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder={form.kind==="Gästewunsch" ? tf("z. B. Extra-Handtücher, Babybett, Wecker 6 Uhr") : tf("z. B. Licht im Bad flackert")} /></label>
          </div>
          <Field label={tf("Details (optional)")}><textarea className="input" rows={2} value={form.description} onChange={e=>setForm({...form,description:e.target.value})} style={{fontFamily:"inherit",resize:"vertical"}} /></Field>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end",marginBottom:12}}>
            <div><div className="field-label">{tf("Dringlichkeit")}</div>
              <div style={{display:"flex",gap:6}}>{["Normal","Dringend"].map(p=><button key={p} onClick={()=>setForm({...form,priority:p})} style={{border:`1px solid ${form.priority===p?(p==="Dringend"?BAD:INK):BORDER}`,background:form.priority===p?(p==="Dringend"?BAD_SOFT:PAPER):"#fff",color:p==="Dringend"&&form.priority===p?BAD:INK,fontWeight:form.priority===p?700:400,borderRadius:999,padding:"7px 14px",fontSize:13,cursor:"pointer"}}>{p}</button>)}</div></div>
            <label style={{minWidth:170}}><div className="field-label">{tf("Zuständig")}</div><select className="input" value={form.department} onChange={e=>setForm({...form,department:e.target.value})}>{TICKET_DEPTS.map(d=><option key={d} value={d}>{d}</option>)}</select></label>
            <label style={{...smallBtn,display:"inline-flex",alignItems:"center",gap:6,padding:"9px 13px"}}>📷 {form.photo ? tf("Anderes Foto") : tf("Foto aufnehmen")}

            {form.photo && <img src={form.photo} alt="" style={{height:56,borderRadius:6,border:`1px solid ${BORDER}`}} />}
            {form.photo && <button style={linkBtn} onClick={()=>setForm({...form,photo:null})}>{tf("Entfernen")}</button>}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn-primary" disabled={busy || !form.title.trim()} onClick={submit}>{busy ? "…" : tf("Meldung senden")}</button>
            <button style={linkBtn} onClick={()=>setForm(null)}>{tf("Abbrechen")}</button>
          </div>
        </Card>
      )}
      <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:10}}>
        {[["open","Offen"],["done","Erledigt"],["all","Alle"]].map(([k,l])=><button key={k} onClick={()=>setFilter(k)} style={{border:`1px solid ${filter===k?INK:BORDER}`,background:filter===k?INK:"#fff",color:filter===k?"#fff":INK,borderRadius:999,padding:"6px 13px",fontSize:12.5,cursor:"pointer"}}>{l}</button>)}
        <label style={{fontSize:12.5,color:INK_MUTED,display:"flex",gap:5,alignItems:"center",marginInlineStart:8,cursor:"pointer"}}><input type="checkbox" checked={onlyMine} onChange={e=>setOnlyMine(e.target.checked)} /> {tf("Nur meine")}</label>
        <span style={{flex:1}}></span><TranslateToggle t={T} />
      </div>
      {list===null ? <div style={{color:INK_MUTED}}>…</div> : shown.length===0 ? <Card><div style={{color:INK_MUTED,fontSize:13.5}}>{filter==="open" ? tf("Keine offenen Meldungen.") : tf("Noch keine Meldungen.")}</div></Card> : shown.map(t=>{
        const st = TICKET_STYLE[t.status];
        return (
          <Card key={t.id} style={{marginBottom:10,padding:"12px 14px",borderInlineStart:t.priority==="Dringend" && t.status!=="Erledigt" ? `4px solid ${BAD}` : undefined}}>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:4}}>
              {t.priority==="Dringend" && <Pill color={BAD} bg={BAD_SOFT}>Dringend</Pill>}
              {t.kind==="Wartung" && <Pill color={BRASS} bg={BRASS_SOFT}>Wartung</Pill>}
              <Pill color={st.color} bg={st.bg}>{t.status}</Pill>
              {t.location && <b data-no-i18n="">{t.location}</b>}
              <span style={{fontSize:12,color:INK_MUTED}}>· <span>{t.department}</span></span>
              <span style={{flex:1}}></span>
              <span style={{fontSize:11.5,color:INK_MUTED}} data-no-i18n="">{memberLabel(members, me, t.reporter_id)} · {fmtDateTime(t.created_at)}</span>

              {canWork(t) && t.status==="Erledigt" && <button style={smallBtn} onClick={()=>run(()=>api("/api/tickets/"+t.id,"PATCH",{status:"Offen"}))}>{tf("Wieder öffnen")}</button>}
              {canWork(t) && t.status!=="Erledigt" && (
                <select className="input" style={{width:"auto",padding:"5px 8px",fontSize:12.5}} value={t.assignee_id||""} onChange={e=>run(()=>api("/api/tickets/"+t.id,"PATCH",{assignee_id:e.target.value||null}))}>
                  <option value="">{tf("Niemand zugewiesen")}</option>
                  {members.filter(m=>m.role!=="viewer" && ((m.departments||[]).includes(t.department) || m.user_id===t.assignee_id || m.role==="admin")).map(m=><option key={m.user_id} value={m.user_id}>{shortName(m.email)}</option>)}

            </div>
          </Card>
        );
      })}
    </div>
  );

// ------------------------------------------------------------ Push-Benachrichtigungen
function urlB64ToUint8(b64){ const p = "=".repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function usePush(api){
  const [st,setSt] = useState({ready:false});
  const refresh = useCallback(async()=>{
    if(window.OUVERTURE_DEMO || !pushSupported()) { setSt({ready:true, supported:false}); return; }
    let key = null; try { key = (await api("/api/push/key")).key; } catch(e){}
    let sub = null; try { const reg = await navigator.serviceWorker.getRegistration(); sub = reg && await reg.pushManager.getSubscription(); } catch(e){}
    setSt({ready:true, supported:true, key, on:!!sub, perm:Notification.permission});
  },[api]);
  useEffect(()=>{ refresh(); },[refresh]);
  const enable = async () => {
    const perm = await Notification.requestPermission();
    if(perm!=="granted") { await refresh(); throw new Error(tf("Benachrichtigungen sind im Browser blockiert. Bitte in den Einstellungen des Browsers erlauben.")); }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(st.key)});
    await api("/api/push/subscribe","POST",{subscription:sub.toJSON()});
    await refresh();
  };
  const disable = async () => {
    const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ await api("/api/push/subscribe","DELETE",{endpoint:sub.endpoint}).catch(()=>{}); await sub.unsubscribe(); }
    await refresh();
  };
  return {...st, enable, disable, refresh};
}
// Beim Abmelden: dieses Gerät bekommt keine Nachrichten mehr für die Person
async function unsubscribePushOnLogout(api){
  try { const reg = pushSupported() && await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ await api("/api/push/subscribe","DELETE",{endpoint:sub.endpoint}).catch(()=>{}); await sub.unsubscribe(); } } catch(e){}
}

function PushCard({api}){
  const p = usePush(api);
  const [msg,setMsg] = useState(null);
  const [busy,setBusy] = useState(false);
  const act = async (fn, ok) => { setBusy(true); setMsg(null); try { await fn(); if(ok) setMsg({ok:true,text:ok}); } catch(e){ setMsg({ok:false,text:e.message}); } setBusy(false); };
  return (
    <Card style={{marginBottom:18,maxWidth:520}}>
      <div style={{fontWeight:700,marginBottom:6}}>{tf("Benachrichtigungen aufs Handy")}</div>

      {!p.ready ? <div style={{fontSize:13,color:INK_MUTED}}>…</div>
        : window.OUVERTURE_DEMO ? <div style={{fontSize:13,color:INK_MUTED}}>{tf("In der Live-Demo nicht verfügbar.")}</div>
        : !p.supported ? <div style={{fontSize:13,color:INK_MUTED}}>{isIos() && !isStandalone() ? tf("Auf dem iPhone funktionieren Benachrichtigungen, sobald Ouverture als App auf dem Startbildschirm installiert ist.") : tf("Dieser Browser unterstützt keine Benachrichtigungen.")}</div>
        : !p.key ? <div style={{fontSize:13,color:INK_MUTED}}>{tf("Push-Benachrichtigungen sind noch nicht eingerichtet.")}</div>
        : p.on ? (
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{color:GOOD,fontSize:13.5,flex:1}}>✓ {tf("Auf diesem Gerät eingeschaltet.")}</span>
            <button style={smallBtn} disabled={busy} onClick={()=>act(()=>api("/api/push/test","POST",{}), tf("Testnachricht gesendet."))}>{tf("Test senden")}</button>
            <button style={linkBtn} disabled={busy} onClick={()=>act(p.disable)}>{tf("Ausschalten")}</button>
          </div>
        ) : (
          <div>
            <button className="btn-primary" disabled={busy} onClick={()=>act(p.enable, tf("Benachrichtigungen sind eingeschaltet."))}>{tf("Benachrichtigungen einschalten")}</button>
            {p.perm==="denied" && <div style={{fontSize:12.5,color:WARN,marginTop:8}}>{tf("Benachrichtigungen sind im Browser blockiert. Bitte in den Einstellungen des Browsers erlauben.")}</div>}
          </div>
        )}
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginTop:8}}>{msg.text}</div>}
    </Card>
  );
}

// ------------------------------------------------------------ Team-Chat
const chatSeenKey = (hotelId) => "hpoos_chat_seen_" + hotelId;
function chatSeen(hotelId){ try { return JSON.parse(window.localStorage.getItem(chatSeenKey(hotelId)) || "{}"); } catch(e){ return {}; } }
function markChatSeen(hotelId, channel, at){ try { const s = chatSeen(hotelId); if(!s[channel] || s[channel] < at){ s[channel] = at; window.localStorage.setItem(chatSeenKey(hotelId), JSON.stringify(s)); } } catch(e){} }
const chatChannels = (role, myDepts) => role==="viewer" ? [] : ["_all", ...visibleDeptsFor(role, myDepts)];
const channelLabel = (c) => c==="_all" ? tf("Ganzes Hotel") : c;

// Anzahl Kanäle mit ungelesenen Nachrichten (für das Menü)
function useChatUnread(api, hotel, me, role, tab){
  const [latest,setLatest] = useState([]);
  const [tick,setTick] = useState(0);
  useEffect(()=>{
    if(!hotel || role==="viewer") return;
    let stop = false;
    const load = () => api("/api/hotels/"+hotel.id+"/chat/latest").then(l=>{ if(!stop) setLatest(l); }).catch(()=>{});
    load(); const t = setInterval(load, 60000);
    return ()=>{ stop = true; clearInterval(t); };
  },[hotel && hotel.id, role, tab]);
  useEffect(()=>{ const f = () => setTick(x=>x+1); window.addEventListener("hpoos-chat-seen", f); return ()=>window.removeEventListener("hpoos-chat-seen", f); },[]);
  if(!hotel) return 0;
  const seen = chatSeen(hotel.id);
  return latest.filter(l=>(!me || l.author_id!==me.id) && (!seen[l.channel] || seen[l.channel] < l.at)).length + 0*tick;
}

function ChatView({hotel, api, me, members, role, myDepts}){
  const channels = chatChannels(role, myDepts);
  const [channel,setChannel] = useRememberedDept("hpoos_chat_channel", channels);
  const [msgs,setMsgs] = useState([]);
  const [latest,setLatest] = useState([]);
  const [text,setText] = useState("");
  const [msg,setMsg] = useState(null);
  const [busy,setBusy] = useState(false);
  const listRef = React.useRef(null);
  const T = useTranslated(api, msgs.map(m=>m.body));
  const base = "/api/hotels/"+hotel.id;
  const lastAt = msgs.length ? msgs[msgs.length-1].created_at : null;
  const seen = (list) => { if(list.length){ markChatSeen(hotel.id, channel, list[list.length-1].created_at); window.dispatchEvent(new Event("hpoos-chat-seen")); } };
  useEffect(()=>{
    if(!channel) return;
    let stop = false; setMsgs([]);
    api(base+"/chat?channel="+encodeURIComponent(channel)).then(l=>{ if(!stop){ setMsgs(l); seen(l); } }).catch(e=>setMsg({ok:false,text:e.message}));
    return ()=>{ stop = true; };
  },[channel, hotel.id]);
  // neue Nachrichten alle 8 Sekunden, solange der Chat offen ist
  useEffect(()=>{
    if(!channel) return;
    const t = setInterval(()=>{
      if(document.hidden) return;
      api(base+"/chat?channel="+encodeURIComponent(channel)+(lastAt ? "&after="+encodeURIComponent(lastAt) : "")).then(l=>{ if(l.length){ setMsgs(m=>{ const ids = new Set(m.map(x=>x.id)); const all = [...m, ...l.filter(x=>!ids.has(x.id))]; seen(all); return all; }); } }).catch(()=>{});
      api(base+"/chat/latest").then(setLatest).catch(()=>{});
    }, 8000);
    return ()=>clearInterval(t);
  },[channel, lastAt]);
  useEffect(()=>{ api(base+"/chat/latest").then(setLatest).catch(()=>{}); },[channel]);
  useEffect(()=>{ if(listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; },[msgs.length]);
  const send = async () => {
    const body = text.trim(); if(!body) return;
    setBusy(true); setMsg(null);
    try { const m = await api(base+"/chat","POST",{channel, body}); setText(""); setMsgs(x=>[...x, m]); seen([m]); }
    catch(e){ setMsg({ok:false,text:e.message}); }
    setBusy(false);
  };
  const del = async (m) => { if(!window.confirm(tf("Nachricht löschen?"))) return; try { await api("/api/chat/"+m.id,"DELETE"); setMsgs(x=>x.filter(y=>y.id!==m.id)); } catch(e){ setMsg({ok:false,text:e.message}); } };
  if(!channels.length) return <Card><div style={{color:INK_MUTED}}>{tf("Der Chat ist für das Team.")}</div></Card>;
  const seenMap = chatSeen(hotel.id);
  const unread = (c) => latest.some(l=>l.channel===c && c!==channel && (!me || l.author_id!==me.id) && (!seenMap[c] || seenMap[c] < l.at));
  const canDelete = (m) => (me && m.author_id===me.id) || role==="admin" || (m.channel!=="_all" && canManageDept(m.channel));
  let lastDay = null;
  return (
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:6}}><TranslateToggle t={T} /></div>
      <div className="no-print" style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:12}}>
        {channels.map(c=>(
          <button key={c} onClick={()=>setChannel(c)} style={{flexShrink:0,border:`1px solid ${c===channel?INK:BORDER}`,background:c===channel?INK:"#fff",color:c===channel?"#fff":INK,
            borderRadius:999,padding:"6px 13px",fontSize:12.5,cursor:"pointer",whiteSpace:"nowrap",position:"relative"}}>
            {c==="_all" ? "# " : ""}<span>{channelLabel(c)}</span>{unread(c) && <span style={{color:BAD,marginInlineStart:5}}>●</span>}
          </button>
        ))}
      </div>
      <Card style={{padding:0,display:"flex",flexDirection:"column",height:"min(68vh, 640px)"}}>
        <div ref={listRef} style={{flex:1,overflowY:"auto",padding:"14px 16px"}}>
          {msgs.length===0 && <div style={{color:INK_MUTED,fontSize:13.5,textAlign:"center",marginTop:30}}>{tf("Noch keine Nachrichten. Schreib die erste!")}</div>}
          {msgs.map(m=>{
            const mine = me && m.author_id===me.id; const day = toLocalInput(m.created_at).slice(0,10);
            const showDay = day!==lastDay; lastDay = day;
            return (
              <React.Fragment key={m.id}>
                {showDay && <div style={{textAlign:"center",fontSize:11.5,color:INK_MUTED,margin:"10px 0 8px"}} data-no-i18n="">{fmtDay(day,{weekday:"long",day:"2-digit",month:"long"})}</div>}
                <div style={{display:"flex",justifyContent:mine?"flex-end":"flex-start",marginBottom:6}}>
                  <div style={{maxWidth:"78%",background:mine?BRASS_SOFT:PAPER,border:`1px solid ${mine?BRASS+"55":BORDER}`,borderRadius:12,padding:"7px 11px"}}>
                    {!mine && <div style={{fontSize:11.5,fontWeight:700,color:BRASS,marginBottom:2}} data-no-i18n="">{memberLabel(members, me, m.author_id)}</div>}
                    <div style={{fontSize:14,whiteSpace:"pre-wrap",wordBreak:"break-word"}}><TrText text={m.body} tr={T.tr} /></div>
                    <div style={{fontSize:10.5,color:INK_MUTED,textAlign:"end",marginTop:2}} data-no-i18n="">{fmtClock(m.created_at)}
                      {canDelete(m) && <button style={{...linkBtn,fontSize:10.5,padding:"0 0 0 6px"}} onClick={()=>del(m)} title={tf("Löschen")}>✕</button>}</div>
                  </div>
                </div>
              </React.Fragment>
            );
          })}
        </div>
        {msg && <div style={{color:BAD,fontSize:13,padding:"0 16px 6px"}}>{msg.text}</div>}
        <div style={{display:"flex",gap:8,padding:10,borderTop:`1px solid ${BORDER}`}}>
          <textarea className="input" rows={1} value={text} onChange={e=>setText(e.target.value)} placeholder={tf("Nachricht an {0} …", channelLabel(channel))}
            onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } }} style={{flex:1,resize:"none",fontFamily:"inherit",minHeight:40,maxHeight:120}} />
          <button className="btn-primary" disabled={busy || !text.trim()} onClick={send}>{tf("Senden")}</button>
        </div>
      </Card>
    </div>
  );
}

  const [form,setForm] = useState(null);

  const [busy,setBusy] = useState(false);
  const base = "/api/hotels/"+hotel.id+"/pms";

  useEffect(()=>{ load(); },[load]);
  const act = async (fn, ok) => { setBusy(true); setMsg(null); try { const r = await fn(); if(ok) setMsg({ok:true,text:typeof ok==="function" ? ok(r) : ok}); await load(); } catch(e){ setMsg({ok:false,text:e.message}); } setBusy(false); };
  if(conn===undefined || !form) return null;
  const save = () => act(async()=>{
    if(!form.provider){ if(conn) await api(base,"DELETE"); return; }
    const {provider, ...settings} = form;
    await api(base,"PUT",{provider, settings, access_token: token || undefined}); setToken("");
  }, tf("Gespeichert."));
  const sync = () => act(async()=>{ const r = await api(base+"/sync","POST",{}); if(onSynced) onSynced(); return r; },
    (r)=>tf("Abgleich fertig: {0} Zimmer neu, {1} geändert.", r.created, r.updated));
  const res = conn && conn.last_result;
  const status = !conn ? tf("Nicht verbunden") : conn.provider==="mews" ? "Mews" : tf("Webhook (anderes PMS)");
  const chk = (k, label) => <label style={{display:"flex",gap:8,alignItems:"center",fontSize:13,margin:"6px 0",cursor:"pointer"}}><input type="checkbox" checked={!!form[k]} onChange={e=>setForm({...form,[k]:e.target.checked})} /> {label}</label>;

      <div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setOpen(!open)}>
        <div style={{fontWeight:700,flex:1}}>{tf("PMS-Anbindung")} <span style={{fontWeight:400,color:conn?GOOD:INK_MUTED,fontSize:13}}>· {status}</span></div>
        {conn && conn.last_sync_at && <span style={{fontSize:12,color:INK_MUTED}}>{tf("Letzter Abgleich: {0}", fmtDateTime(conn.last_sync_at))}</span>}
        <span style={{color:INK_MUTED}}>{open?"▴":"▾"}</span>
      </div>
      {open && (
        <div style={{marginTop:12}}>
          <div style={{fontSize:12.5,color:INK_MUTED,marginBottom:10}}>{tf("Zimmerstatus und Belegung automatisch mit dem Hotelprogramm (PMS) abgleichen. Mews wird direkt angebunden, andere Systeme (z. B. Protel, Apaleo, Opera) über einen Webhook – oder per Datei-Import.")}</div>
          <Field label={tf("System")}>
            <select className="input" value={form.provider} onChange={e=>setForm({...form,provider:e.target.value})}>
              <option value="">{tf("Keine Anbindung")}</option><option value="mews">Mews</option><option value="webhook">{tf("Anderes PMS (Webhook)")}</option>
            </select>
          </Field>
          {form.provider==="mews" && (
            <div style={{background:PAPER,borderRadius:8,padding:"10px 12px",marginBottom:10}}>
              <div className="field-label">{tf("Umgebung")}</div>
              <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:6}}>
                {[["demo",tf("Mews-Testumgebung")],["production",tf("Produktiv")]].map(([k,l])=><label key={k} style={{fontSize:13,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="radio" checked={form.env===k} onChange={()=>setForm({...form,env:k})} /> {l}</label>)}
              </div>
              {form.env==="production" && <div style={{fontSize:12.5,color:WARN,marginBottom:6}}>{tf("Für den Produktivbetrieb muss Ouverture von Mews als Partner freigeschaltet sein. Bis dahin bitte die Testumgebung oder den Webhook nutzen.")}</div>}
              {form.env==="demo" && chk("use_demo_hotel", tf("Öffentliches Mews-Testhotel verwenden (Beispieldaten, ohne eigenen Schlüssel)"))}
              {!(form.env==="demo" && form.use_demo_hotel) && (
                <Field label={tf("Access Token aus Mews (Marketplace → Ouverture)")}>
                  <input className="input" type="password" autoComplete="off" value={token} onChange={e=>setToken(e.target.value)} placeholder={conn && conn.has_token ? tf("gespeichert – nur zum Ändern neu eingeben") : ""} />
                </Field>

              {chk("push_status", tf("Zimmerstatus nach Mews zurückschreiben"))}
              {chk("create_missing", tf("Fehlende Zimmer automatisch anlegen"))}

            </div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>

            {res && !res.ok && <span style={{fontSize:12.5,color:BAD}} data-no-i18n="">{res.error}</span>}
            {res && res.ok && res.via!=="webhook" && <span style={{fontSize:12.5,color:INK_MUTED}}>{tf("Zuletzt: {0} Zimmer neu, {1} geändert.", res.created||0, res.updated||0)}</span>}

          </div>
          {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginTop:8}}>{msg.text}</div>}
        </div>
      )}
    </Card>
  );
}

// Zimmerstatus/Belegung aus einer Excel- oder CSV-Datei (Export aus jedem PMS)
function RoomImportButton({hotel, api, onDone, onMsg}){
  const [busy,setBusy] = useState(false);
  const pick = async (file) => {
    if(!file) return;
    setBusy(true);
    try {
      const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
      const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
      const keyOf = (h) => { const k = String(h).toLowerCase(); if(/zimmer|room|nr\.?$|^nummer|number/.test(k)) return "number"; if(/belegung|occupancy|res(ervation)?\s*status|anreise|abreise/.test(k)) return "occupancy"; if(/status|housekeeping|reinigung|hk/.test(k)) return "status"; return null; };
      const rows = raw.map(r=>{ const o = {}; Object.keys(r).forEach(h=>{ const k = keyOf(h); if(k && o[k]===undefined) o[k] = r[h]; }); return o; });
      const r = await api("/api/hotels/"+hotel.id+"/rooms/import","POST",{rows});
      onMsg({ok:true, text:tf("{0} Zimmer aktualisiert.", r.updated) + (r.unknown.length ? " "+tf("Unbekannte Zimmer: {0}", r.unknown.join(", ")) : "")});
      onDone();
    } catch(e){ onMsg({ok:false, text:e.message}); }
    setBusy(false);
  };
  return (
    <label style={{...smallBtn,display:"inline-flex",alignItems:"center",gap:6,opacity:busy?0.6:1}} title={tf("Excel- oder CSV-Export aus dem PMS mit den Spalten Zimmer und Status bzw. Belegung")}>
      {busy ? "…" : tf("Aus Datei übernehmen")}
      <input type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={e=>{ pick(e.target.files[0]); e.target.value=""; }} />
    </label>
  );
}

// ------------------------------------------------------------ Automatische Übersetzung von Teamtexten
const LS_AUTO_TR = "hpoos_auto_translate";
const autoTranslateOn = () => { try { return window.localStorage.getItem(LS_AUTO_TR) !== "0"; } catch(e){ return true; } };
let TR_STATUS = null; // null = unbekannt, true/false
const TR_CACHE = {}; // "lang|text" -> Übersetzung
function useTranslated(api, texts){
  const [on,setOn] = useState(autoTranslateOn());
  const [tick,setTick] = useState(0);
  const [enabled,setEnabled] = useState(TR_STATUS);
  useEffect(()=>{ if(TR_STATUS===null && !window.OUVERTURE_DEMO) api("/api/translate/status").then(r=>{ TR_STATUS = !!r.enabled; setEnabled(TR_STATUS); }).catch(()=>{ TR_STATUS = false; setEnabled(false); }); },[]);
  const want = (texts||[]).filter(t=>t && t.trim() && TR_CACHE[UI_LANG+"|"+t]===undefined);
  const key = want.slice(0,60).join("\u0001");
  useEffect(()=>{
    if(!on || !enabled || !want.length) return;
    let stop = false;
    const batch = [...new Set(want)].slice(0,60);
    batch.forEach(t=>{ TR_CACHE[UI_LANG+"|"+t] = null; }); // läuft
    api("/api/translate","POST",{texts:batch, lang:UI_LANG}).then(r=>{ batch.forEach((t,i)=>{ TR_CACHE[UI_LANG+"|"+t] = r.translations[i]; }); if(!stop) setTick(x=>x+1); })
      .catch(()=>{ batch.forEach(t=>{ delete TR_CACHE[UI_LANG+"|"+t]; }); });
    return ()=>{ stop = true; };
  },[key, on, enabled]);
  const tr = (t) => { if(!on || !t) return t; const x = TR_CACHE[UI_LANG+"|"+t]; return x || t; };
  const toggle = (v) => { setOn(v); try { window.localStorage.setItem(LS_AUTO_TR, v?"1":"0"); } catch(e){} };
  return {tr, on, toggle, enabled: !!enabled, tick};
}
// Text mit Übersetzung; Antippen zeigt das Original
function TrText({text, tr, style}){
  const [orig,setOrig] = useState(false);
  const t = tr(text); const differs = t && t !== text;
  return <span style={style} data-no-i18n="">{orig || !differs ? text : t}{differs && <button onClick={()=>setOrig(!orig)} style={{...linkBtn,fontSize:10.5,padding:"0 0 0 6px",verticalAlign:"baseline"}} title={orig ? tf("Übersetzung anzeigen") : tf("Original anzeigen")}>🌐</button>}</span>;
}
function TranslateToggle({t}){
  if(!t.enabled) return null;

const LS_CLOCK_QUEUE = "hpoos_clock_queue";
function clockCodeNow(){ try { const c = JSON.parse(window.sessionStorage.getItem("hpoos_clock_code") || "null"); return c && Date.now() - c.at < 15*60000 ? c.code : null; } catch(e){ return null; } }
function rememberClockCode(code){ try { window.sessionStorage.setItem("hpoos_clock_code", JSON.stringify({code, at:Date.now()})); } catch(e){} }
function clockQueue(){ try { return JSON.parse(window.localStorage.getItem(LS_CLOCK_QUEUE) || "[]"); } catch(e){ return []; } }
function setClockQueue(q){ try { window.localStorage.setItem(LS_CLOCK_QUEUE, JSON.stringify(q)); } catch(e){} }
const isNetworkError = (e) => e instanceof TypeError || (typeof navigator!=="undefined" && navigator.onLine===false);
async function flushClockQueue(api){
  const q = clockQueue(); if(!q.length) return {sent:0, errors:[]};
  const left = [], errors = []; let sent = 0;
  for(const it of q){
    try {
      if(it.kind==="in") await api("/api/hotels/"+it.hotel+"/time/clock-in","POST",{department:it.dept, code:it.code, at:it.at});
      else await api("/api/time/clock-out","POST",{break_minutes:it.brk, code:it.code, at:it.at});
      sent++;
    } catch(e){ if(isNetworkError(e)) left.push(it); else errors.push(e.message); }
  }
  setClockQueue(left);
  return {sent, errors};
}

function loadScriptOnce(src){ return new Promise((res, rej)=>{ if(document.querySelector('script[src="'+src+'"]')) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Script")); document.head.appendChild(s); }); }
async function qrSvg(text, cell){
  await loadScriptOnce("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js");
  const q = window.qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({cellSize: cell || 6, margin: 2, scalable: true});
}

// ------------------------------------------------------------ Belegung, Personalbedarf und Plan-Vorschlag (im Dienstplan)
const BASIS = [["belegt","belegte Zimmer"],["abreisen","Abreisen"],["anreisen","Anreisen"],["abreisen+bleiber","Abreisen + Bleiber"]];
function staffNeededFe(rule, f){
  if(!rule || !f) return null;
  const stay = Math.max(0,(f.occupied||0)-(f.arrivals||0));
  const units = rule.basis==="abreisen" ? f.departures : rule.basis==="anreisen" ? f.arrivals : rule.basis==="abreisen+bleiber" ? (f.departures||0)+stay : f.occupied;
  return Math.max(Number(rule.minimum)||0, Math.ceil((Number(units)||0)/Number(rule.units_per_person)));
}
function RosterDemand({hotel, api, dept, week, days, shifts, onApplied}){
  const [fc,setFc] = useState([]);
  const [rule,setRule] = useState(null);
  const [edit,setEdit] = useState(false);
  const [msg,setMsg] = useState(null);
  const [busy,setBusy] = useState(false);
  const base = "/api/hotels/"+hotel.id;
  const load = useCallback(()=>{
    api(base+"/forecast?from="+days[0]+"&to="+days[6]).then(setFc).catch(()=>setFc([]));
    api(base+"/staffing-rules").then(rs=>setRule(rs.find(r=>r.department===dept)||null)).catch(()=>setRule(null));
  },[api, base, dept, week]);
  useEffect(()=>{ load(); },[load]);
  const fOf = (d) => fc.find(f=>f.day===d) || {day:d, occupied:0, arrivals:0, departures:0};
  const planned = (d) => shifts.filter(s=>s.department===dept && s.shift_date===d && WORK_KINDS.includes(s.kind)).length;
  const saveF = (d, field, v) => { const f = {...fOf(d), [field]: Number(v)||0}; setFc(x=>[...x.filter(y=>y.day!==d), f]); api(base+"/forecast","PUT",{days:[f]}).catch(e=>setMsg({ok:false,text:e.message})); };
  const saveRule = (r) => { setRule(r); api(base+"/staffing-rules","PUT",{department:dept, ...r}).then(x=>setRule(x && x.department ? x : null)).catch(e=>setMsg({ok:false,text:e.message})); };
  const suggest = async (apply) => {
    setBusy(true); setMsg(null);
    try {
      const r = await api(base+"/roster/suggest","POST",{department:dept, week, apply});
      if(!apply){
        const open = r.unfilled.length;
        if(!r.shifts.length){ setMsg({ok:!open, text: open ? tf("Kein Vorschlag möglich: {0} Schichten lassen sich mit dem Team nicht besetzen.", open) : tf("Die Woche ist bereits vollständig besetzt.")}); }
        else if(window.confirm(tf("{0} Schichten eintragen?", r.shifts.length) + (open ? "\n"+tf("{0} Schichten bleiben offen (zu wenig Personen, Verfügbarkeit oder Ruhezeit).", open) : ""))) await suggest(true);
      } else { setMsg({ok:true, text:tf("{0} Schichten als Entwurf eingetragen.", r.created) + (r.unfilled.length ? " "+tf("{0} Schichten bleiben offen.", r.unfilled.length) : "")}); onApplied(); }
    } catch(e){ setMsg({ok:false,text:e.message}); }
    setBusy(false);
  };
  const hasFc = fc.some(f=>f.occupied||f.arrivals||f.departures);
  return (
    <Card className="no-print" style={{marginBottom:18}}>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:8}}>
        <div style={{fontWeight:700,flex:1}}>{tf("Belegung und Personalbedarf")} · <span>{dept}</span></div>
        <button style={smallBtn} onClick={()=>setEdit(!edit)}>{edit ? tf("Fertig") : tf("Bearbeiten")}</button>
        <button className="btn-primary" style={{padding:"7px 12px",fontSize:12.5}} disabled={busy} onClick={()=>suggest(false)}>{busy ? "…" : "✨ "+tf("Plan-Vorschlag")}</button>
      </div>
      <div style={{fontSize:12.5,color:INK_MUTED,marginBottom:8}}>{tf("Der Plan-Vorschlag füllt freie Schichten nach Mindestbesetzung und Bedarf – mit Rücksicht auf Verfügbarkeit, Soll-Stunden und 11 Stunden Ruhezeit. Bestehende Schichten bleiben, alles kommt als Entwurf.")}</div>
      {edit && (
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",background:PAPER,borderRadius:6,padding:"8px 10px",marginBottom:8,fontSize:12.5}}>
          <span>{tf("1 Person je")}</span>
          <input className="input" type="number" min="1" style={{width:70}} defaultValue={rule ? rule.units_per_person : ""} key={"u"+dept+(rule&&rule.units_per_person)} onBlur={e=>saveRule({basis:(rule&&rule.basis)||"belegt", units_per_person:e.target.value===""?null:Number(e.target.value), minimum:(rule&&rule.minimum)||0})} />
          <select className="input" style={{width:"auto"}} value={(rule&&rule.basis)||"belegt"} onChange={e=>rule && saveRule({...rule, basis:e.target.value})}>{BASIS.map(([k,l])=><option key={k} value={k}>{tf(l)}</option>)}</select>
          <span>{tf("mindestens")}</span>
          <input className="input" type="number" min="0" style={{width:60}} defaultValue={rule ? rule.minimum : 0} key={"m"+dept+(rule&&rule.minimum)} onBlur={e=>rule && saveRule({...rule, minimum:Number(e.target.value)||0})} />
          <span style={{color:INK_MUTED}}>{tf("(leer lassen = kein Bedarf aus der Belegung)")}</span>
        </div>
      )}
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,minWidth:560}}>
          <thead><tr><th></th>{days.map(d=><th key={d} style={{padding:"4px 6px",fontWeight:600,color:INK_MUTED,textAlign:"center"}} data-no-i18n="">{fmtDay(d)}</th>)}</tr></thead>
          <tbody>
            {[["occupied","Belegt"],["arrivals","Anreise"],["departures","Abreise"]].map(([k,l])=>(
              <tr key={k} style={{borderTop:`1px solid ${BORDER}`}}><td style={{padding:"4px 6px",color:INK_MUTED}}>{tf(l)}</td>
                {days.map(d=><td key={d} style={{textAlign:"center",padding:"3px 4px"}}>{edit
                  ? <input className="input" type="number" min="0" style={{width:56,padding:"3px 4px",textAlign:"center"}} defaultValue={fOf(d)[k]} key={d+k+fOf(d)[k]} onBlur={e=>Number(e.target.value)!==fOf(d)[k] && saveF(d,k,e.target.value)} />
                  : <span data-no-i18n="">{fOf(d)[k]||"–"}</span>}</td>)}
              </tr>
            ))}
            {rule && (
              <tr style={{borderTop:`1px solid ${BORDER}`,fontWeight:700}}><td style={{padding:"4px 6px"}}>{tf("Bedarf / geplant")}</td>
                {days.map(d=>{ const n = staffNeededFe(rule, fOf(d)), p = planned(d); return <td key={d} style={{textAlign:"center",color:p<n?BAD:GOOD}} data-no-i18n="">{n}/{p}</td>; })}
              </tr>
            )}
          </tbody>
        </table>
      </div>
      {!hasFc && <div style={{fontSize:12,color:INK_MUTED,marginTop:6}}>{tf("Die Belegung kommt automatisch aus dem PMS (Mews) oder lässt sich unter „Bearbeiten“ eintragen.")}</div>}
      {msg && <div style={{color:msg.ok?GOOD:BAD,fontSize:13,marginTop:8}}>{msg.text}</div>}
    </Card>
  );
}
