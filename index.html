<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏨</text></svg>" />
<title>HPOOS</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  input, select, button, textarea { font-family: 'Inter', sans-serif; }
  .card { background: #fff; border: 1px solid #E4DFD3; border-radius: 10px; padding: 20px; }
  .btn-primary { background: #1C2430; color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .input { width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid #E4DFD3; font-size: 14px; color: #1C2430; background: #F6F4EF; }
  .field-label { font-size: 12.5px; font-weight: 600; color: #6B7280; margin-bottom: 5px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useCallback } = React;

const INK="#1C2430", INK_SOFT="#2A3444", PAPER="#F6F4EF", CARD="#FFFFFF", BORDER="#E4DFD3";
const BRASS="#A9834B", BRASS_SOFT="#F1E8D8", GOOD="#3F7A5C", GOOD_SOFT="#E4EFE8";
const WARN="#B9822E", WARN_SOFT="#F5E9D5", BAD="#A23B32", BAD_SOFT="#F5E1DE", INK_MUTED="#6B7280";

const DEPARTMENTS = ["Rezeption & Empfang","Housekeeping","Food & Beverage","Technik","IT & Systeme","Personal","Einkauf","Sicherheit"];
const PRIORITIES = ["Kritisch","Hoch","Mittel","Niedrig"];
const TASK_STATUSES = ["Nicht begonnen","In Arbeit","Blockiert","In Prüfung","Abgeschlossen"];
const MILESTONE_STATUSES = ["Geplant","In Arbeit","Gefährdet","Abgeschlossen"];
const LS_KEY = "hpoos_connection_config_v1";
const LS_INVITE_KEY = "hpoos_pending_invite_v1";
// Öffentliche Verbindungsdaten. Der publishable Key darf im Frontend stehen –
// die Daten schützen Login-Pflicht und Row Level Security in der Datenbank.
const DEFAULT_CONFIG = {
  backendUrl: "https://hpoos-backend.onrender.com",
  supabaseUrl: "https://czixqievmbftumcavtqr.supabase.co",
  supabaseAnonKey: "sb_publishable_z7UkYgbek05ZFR199O93eg_0MxUM3Nx",
};

function fmtDate(d){ return d ? new Date(d).toLocaleDateString("de-DE",{day:"2-digit",month:"short",year:"numeric"}) : "—"; }
function priorityColor(p){
  if(p==="Kritisch") return {color:BAD,bg:BAD_SOFT};
  if(p==="Hoch") return {color:WARN,bg:WARN_SOFT};
  if(p==="Mittel") return {color:BRASS,bg:BRASS_SOFT};
  return {color:INK_MUTED,bg:PAPER};
}

async function apiCall(backendUrl, token, path, method, body){
  const res = await fetch(backendUrl.replace(/\/$/,"") + path, {
    method: method || "GET",
    headers: { "Content-Type":"application/json", ...(token ? {Authorization:`Bearer ${token}`} : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if(!res.ok) throw new Error((data && data.error) || ("Fehler " + res.status));
  return data;
}
async function supabaseLogin(supabaseUrl, anonKey, email, password){
  const res = await fetch(supabaseUrl.replace(/\/$/,"") + "/auth/v1/token?grant_type=password", {
    method:"POST", headers:{apikey:anonKey,"Content-Type":"application/json"},
    body: JSON.stringify({email,password}),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || "Login fehlgeschlagen.");
  return data.access_token;
}
async function supabaseSignUp(supabaseUrl, anonKey, email, password){
  const res = await fetch(supabaseUrl.replace(/\/$/,"") + "/auth/v1/signup", {
    method:"POST", headers:{apikey:anonKey,"Content-Type":"application/json"},
    body: JSON.stringify({email,password}),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || "Registrierung fehlgeschlagen.");
  // Wenn E-Mail-Bestätigung in Supabase deaktiviert ist, liefert Supabase sofort
  // eine Session (access_token) zurück. Ist Bestätigung aktiviert, ist
  // access_token leer und der Nutzer muss zuerst auf den Link in der Mail klicken.
  return data.access_token || null;
}
async function supabaseRecover(supabaseUrl, anonKey, email, redirectTo){
  const res = await fetch(supabaseUrl.replace(/\/$/,"") + "/auth/v1/recover", {
    method:"POST", headers:{apikey:anonKey,"Content-Type":"application/json"},
    body: JSON.stringify({email, redirect_to: redirectTo}),
  });
  if(!res.ok){
    let data = null; try { data = await res.json(); } catch(e){}
    throw new Error((data && (data.error_description||data.msg)) || "Anfrage fehlgeschlagen.");
  }
}
async function supabaseSetNewPassword(supabaseUrl, anonKey, accessToken, newPassword){
  const res = await fetch(supabaseUrl.replace(/\/$/,"") + "/auth/v1/user", {
    method:"PUT",
    headers:{apikey:anonKey,"Content-Type":"application/json",Authorization:`Bearer ${accessToken}`},
    body: JSON.stringify({password:newPassword}),
  });
  const data = await res.json();
  if(!res.ok) throw new Error((data && (data.error_description||data.msg)) || "Passwort konnte nicht geändert werden.");
  return data;
}

function Card(props){ return <div className="card" style={props.style}>{props.children}</div>; }
function Field({label, children}){ return <label style={{display:"block",marginBottom:14}}><div className="field-label">{label}</div>{children}</label>; }
function Pill({children,color,bg}){ return <span style={{color,background:bg,fontSize:12,fontWeight:600,padding:"3px 9px",borderRadius:999}}>{children}</span>; }

function SetupView({onSave}){
  const [form,setForm] = useState({backendUrl:"https://hpoos-backend.onrender.com", supabaseUrl:"", supabaseAnonKey:""});
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:440,width:"100%"}}>
        <div style={{fontFamily:"Fraunces, serif",fontSize:19,fontWeight:600,marginBottom:16}}>HPOOS — Verbindung einrichten</div>
        <Field label="Backend-URL">
          <input className="input" value={form.backendUrl} onChange={e=>setForm({...form,backendUrl:e.target.value})} />
        </Field>
        <Field label="Supabase Project URL">
          <input className="input" value={form.supabaseUrl} onChange={e=>setForm({...form,supabaseUrl:e.target.value})} placeholder="https://dein-projekt.supabase.co" />
        </Field>
        <Field label="Supabase anon / publishable Key">
          <input className="input" value={form.supabaseAnonKey} onChange={e=>setForm({...form,supabaseAnonKey:e.target.value})} />
        </Field>
        <button className="btn-primary" style={{width:"100%"}}
          onClick={()=> form.backendUrl && form.supabaseUrl && form.supabaseAnonKey && onSave(form)}>
          Speichern &amp; weiter
        </button>
      </Card>
    </div>
  );
}

function LoginView({config,onLogin,onReset}){
  const [mode,setMode]=useState("login"); // "login" | "register" | "forgot"
  const [email,setEmail]=useState(""); const [password,setPassword]=useState("");
  const [error,setError]=useState(""); const [info,setInfo]=useState(""); const [loading,setLoading]=useState(false);

  const submitLogin = async () => {
    setError(""); setInfo(""); setLoading(true);
    try { const token = await supabaseLogin(config.supabaseUrl, config.supabaseAnonKey, email, password); onLogin(token); }
    catch(e){ setError(e.message); }
    setLoading(false);
  };

  const submitRegister = async () => {
    setError(""); setInfo(""); setLoading(true);
    try {
      if(password.length < 6){ setError("Das Passwort muss mindestens 6 Zeichen haben."); setLoading(false); return; }
      const token = await supabaseSignUp(config.supabaseUrl, config.supabaseAnonKey, email, password);
      if(token){ onLogin(token); }
      else { setInfo("Konto angelegt! Bitte bestätige deine E-Mail-Adresse über den Link, den wir dir geschickt haben, und melde dich danach an."); setMode("login"); }
    } catch(e){ setError(e.message); }
    setLoading(false);
  };

  const submitForgot = async () => {
    setError(""); setInfo(""); setLoading(true);
    try {
      const redirectTo = window.location.origin + window.location.pathname;
      await supabaseRecover(config.supabaseUrl, config.supabaseAnonKey, email, redirectTo);
      setInfo("Falls diese E-Mail-Adresse bei uns registriert ist, haben wir dir gerade einen Link zum Zurücksetzen deines Passworts geschickt. Bitte schau in dein Postfach (auch im Spam-Ordner).");
    } catch(e){ setError(e.message); }
    setLoading(false);
  };

  const submit = mode==="login" ? submitLogin : mode==="register" ? submitRegister : submitForgot;

  if(mode==="forgot"){
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
        <Card style={{maxWidth:380,width:"100%"}}>
          <div style={{fontFamily:"Fraunces, serif",fontSize:19,fontWeight:600,marginBottom:8}}>Passwort vergessen</div>
          <div style={{fontSize:13,color:INK_MUTED,marginBottom:16}}>Gib deine E-Mail-Adresse ein — wir schicken dir einen Link zum Zurücksetzen.</div>
          <Field label="E-Mail"><input className="input" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></Field>
          {error && <div style={{color:BAD,fontSize:13,marginBottom:12}}>{error}</div>}
          {info && <div style={{color:GOOD,fontSize:13,marginBottom:12}}>{info}</div>}
          <button className="btn-primary" style={{width:"100%"}} onClick={submit} disabled={loading}>{loading?"Bitte warten…":"Link schicken"}</button>
          <div style={{textAlign:"center",marginTop:12}}>
            <button onClick={()=>{setMode("login");setError("");setInfo("");}} style={{background:"none",border:"none",color:INK_MUTED,fontSize:12,cursor:"pointer",textDecoration:"underline"}}>Zurück zur Anmeldung</button>
          </div>
        </Card>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:380,width:"100%"}}>
        <div style={{display:"flex",gap:6,marginBottom:18,background:PAPER,borderRadius:8,padding:4}}>
          <button onClick={()=>{setMode("login");setError("");setInfo("");}}
            style={{flex:1,padding:"8px 0",borderRadius:6,border:"none",cursor:"pointer",fontSize:13.5,fontWeight:600,
              background:mode==="login"?INK:"transparent",color:mode==="login"?"#fff":INK_MUTED}}>Anmelden</button>
          <button onClick={()=>{setMode("register");setError("");setInfo("");}}
            style={{flex:1,padding:"8px 0",borderRadius:6,border:"none",cursor:"pointer",fontSize:13.5,fontWeight:600,
              background:mode==="register"?INK:"transparent",color:mode==="register"?"#fff":INK_MUTED}}>Registrieren</button>
        </div>
        <div style={{fontFamily:"Fraunces, serif",fontSize:19,fontWeight:600,marginBottom:18}}>
          {mode==="login" ? "Anmelden" : "Neues Konto erstellen"}
        </div>
        <Field label="E-Mail"><input className="input" value={email} onChange={e=>setEmail(e.target.value)} /></Field>
        <Field label="Passwort"><input type="password" className="input" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></Field>
        {error && <div style={{color:BAD,fontSize:13,marginBottom:12}}>{error}</div>}
        {info && <div style={{color:GOOD,fontSize:13,marginBottom:12}}>{info}</div>}
        <button className="btn-primary" style={{width:"100%"}} onClick={submit} disabled={loading}>
          {loading?"Bitte warten…":(mode==="login"?"Anmelden":"Konto erstellen")}
        </button>
        <div style={{textAlign:"center",marginTop:12,display:"flex",justifyContent:"center",gap:14}}>
          {mode==="login" && <button onClick={()=>{setMode("forgot");setError("");setInfo("");}} style={{background:"none",border:"none",color:INK_MUTED,fontSize:12,cursor:"pointer",textDecoration:"underline"}}>Passwort vergessen?</button>}
        </div>
      </Card>
    </div>
  );
}

function ResetPasswordView({config, accessToken, onDone}){
  const [password,setPassword]=useState(""); const [password2,setPassword2]=useState("");
  const [error,setError]=useState(""); const [loading,setLoading]=useState(false);
  const submit = async () => {
    setError("");
    if(password.length < 6){ setError("Das Passwort muss mindestens 6 Zeichen haben."); return; }
    if(password !== password2){ setError("Die beiden Passwörter stimmen nicht überein."); return; }
    setLoading(true);
    try { await supabaseSetNewPassword(config.supabaseUrl, config.supabaseAnonKey, accessToken, password); onDone(); }
    catch(e){ setError(e.message); }
    setLoading(false);
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:380,width:"100%"}}>
        <div style={{fontFamily:"Fraunces, serif",fontSize:19,fontWeight:600,marginBottom:8}}>Neues Passwort festlegen</div>
        <Field label="Neues Passwort"><input type="password" className="input" value={password} onChange={e=>setPassword(e.target.value)} /></Field>
        <Field label="Neues Passwort wiederholen"><input type="password" className="input" value={password2} onChange={e=>setPassword2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></Field>
        {error && <div style={{color:BAD,fontSize:13,marginBottom:12}}>{error}</div>}
        <button className="btn-primary" style={{width:"100%"}} onClick={submit} disabled={loading}>{loading?"Bitte warten…":"Passwort speichern"}</button>
      </Card>
    </div>
  );
}

function HotelSetupView({hotels, orgId, api, onCreated, onSelect}){
  const [showForm,setShowForm] = useState(hotels.length===0);
  const [form,setForm] = useState({name:"",city:"",country:"",rooms:100,opening_date:""});
  const [saving,setSaving] = useState(false); const [error,setError]=useState("");
  const submit = async () => {
    if(!form.name) return;
    setSaving(true); setError("");
    try { const hotel = await api("/api/hotels","POST",{organization_id:orgId, ...form, rooms:Number(form.rooms)}); onCreated(hotel); }
    catch(e){ setError(e.message); }
    setSaving(false);
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:440,width:"100%"}}>
        {!showForm && hotels.length>0 && (
          <React.Fragment>
            <div style={{fontFamily:"Fraunces, serif",fontSize:18,fontWeight:600,marginBottom:14}}>Hotel auswählen</div>
            {hotels.map(h=>(
              <div key={h.id} onClick={()=>onSelect(h)} style={{padding:"10px 12px",border:`1px solid ${BORDER}`,borderRadius:8,marginBottom:8,cursor:"pointer"}}>
                <div style={{fontWeight:600}}>{h.name}</div>
                <div style={{fontSize:12.5,color:INK_MUTED}}>{h.city} · {h.rooms} Zimmer</div>
              </div>
            ))}
            <button className="btn-primary" style={{width:"100%",marginTop:6}} onClick={()=>setShowForm(true)}>+ Neues Hotel</button>
          </React.Fragment>
        )}
        {showForm && (
          <React.Fragment>
            <div style={{fontFamily:"Fraunces, serif",fontSize:18,fontWeight:600,marginBottom:14}}>Neues Hotel</div>
            <Field label="Name"><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} /></Field>
            <Field label="Stadt"><input className="input" value={form.city} onChange={e=>setForm({...form,city:e.target.value})} /></Field>
            <Field label="Land"><input className="input" value={form.country} onChange={e=>setForm({...form,country:e.target.value})} /></Field>
            <Field label="Zimmeranzahl"><input type="number" className="input" value={form.rooms} onChange={e=>setForm({...form,rooms:e.target.value})} /></Field>
            <Field label="Eröffnungsdatum"><input type="date" className="input" value={form.opening_date} onChange={e=>setForm({...form,opening_date:e.target.value})} /></Field>
            {error && <div style={{color:BAD,fontSize:13,marginBottom:10}}>{error}</div>}
            <button className="btn-primary" style={{width:"100%"}} onClick={submit} disabled={saving}>{saving?"Speichert…":"Hotel anlegen"}</button>
            {hotels.length>0 && <button onClick={()=>setShowForm(false)} style={{width:"100%",textAlign:"center",marginTop:8,fontSize:12.5,background:"none",border:"none",color:INK_MUTED,cursor:"pointer"}}>Abbrechen</button>}
          </React.Fragment>
        )}
      </Card>
    </div>
  );
}

function DashboardView({readiness, tasks, risks}){
  if(!readiness) return <div style={{color:INK_MUTED}}>Lädt…</div>;
  const overdue = tasks.filter(t=>t.due_date && new Date(t.due_date) < new Date() && t.status!=="Abgeschlossen" && t.priority==="Kritisch");
  const topRisks = [...risks].sort((a,b)=>b.probability*b.impact - a.probability*a.impact).slice(0,4);
  const color = readiness.overall>=80?GOOD:readiness.overall>=60?WARN:BAD;
  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:24,marginBottom:22}}>
        <Card style={{display:"flex",alignItems:"center",gap:20}}>
          <div style={{fontFamily:"Fraunces, serif",fontSize:44,fontWeight:600,color}}>{readiness.overall}%</div>
          <div>
            <div style={{fontSize:12.5,color:INK_MUTED,fontWeight:600}}>BEREITSCHAFT</div>
            <Pill color={color} bg={readiness.overall>=80?GOOD_SOFT:readiness.overall>=60?WARN_SOFT:BAD_SOFT}>
              {readiness.overdueCriticalTasksCount} überfällig · {readiness.highRisksCount} hohe Risiken
            </Pill>
          </div>
        </Card>
        <Card>
          <div style={{fontWeight:700,marginBottom:8}}>Bereitschaft je Abteilung</div>
          {Object.entries(readiness.deptScores||{}).map(([dept,score])=>(
            <div key={dept} style={{display:"flex",alignItems:"center",gap:10,padding:"5px 0"}}>
              <div style={{width:150,fontSize:13}}>{dept}</div>
              <div style={{flex:1,height:6,background:PAPER,borderRadius:4,overflow:"hidden"}}>
                <div style={{width:score+"%",height:"100%",background:score>=80?GOOD:score>=60?WARN:BAD}}></div>
              </div>
              <div style={{width:32,textAlign:"right",fontSize:13,fontWeight:700}}>{score}%</div>
            </div>
          ))}
        </Card>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
        <Card>
          <div style={{fontWeight:700,marginBottom:10}}>Überfällige kritische Aufgaben</div>
          {overdue.length===0 ? <div style={{color:INK_MUTED,fontSize:13.5}}>Keine.</div> :
            overdue.map(t=><div key={t.id} style={{padding:"6px 0",borderTop:`1px solid ${BORDER}`,fontSize:13.5}}>{t.title} <span style={{color:INK_MUTED}}>· {t.department}</span></div>)}
        </Card>
        <Card>
          <div style={{fontWeight:700,marginBottom:10}}>Höchste Risiken</div>
          {topRisks.map(r=><div key={r.id} style={{padding:"6px 0",borderTop:`1px solid ${BORDER}`,fontSize:13.5}}>{r.title} <span style={{color:INK_MUTED}}>· Score {r.probability*r.impact}</span></div>)}
        </Card>
      </div>
    </div>
  );
}

function TasksView({tasks, callHotel, callId, refresh}){
  const [showForm,setShowForm]=useState(false);
  const [draft,setDraft]=useState({title:"",department:DEPARTMENTS[0],priority:"Mittel",status:"Nicht begonnen",due_date:"",owner:""});
  const add = async () => { if(!draft.title) return; await callHotel("/tasks","POST",draft); setShowForm(false); setDraft({...draft,title:""}); refresh(); };
  const updateStatus = async (id,status) => { await callId("tasks",id,"PATCH",{status}); refresh(); };
  const remove = async (id) => { await callId("tasks",id,"DELETE"); refresh(); };
  return (
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
        <button className="btn-primary" onClick={()=>setShowForm(!showForm)}>+ Aufgabe</button>
      </div>
      {showForm && (
        <Card style={{marginBottom:16}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>
            <input className="input" placeholder="Titel" value={draft.title} onChange={e=>setDraft({...draft,title:e.target.value})} />
            <select className="input" value={draft.department} onChange={e=>setDraft({...draft,department:e.target.value})}>{DEPARTMENTS.map(d=><option key={d}>{d}</option>)}</select>
            <select className="input" value={draft.priority} onChange={e=>setDraft({...draft,priority:e.target.value})}>{PRIORITIES.map(p=><option key={p}>{p}</option>)}</select>
          </div>
          <div style={{display:"flex",gap:10}}>
            <input type="date" className="input" value={draft.due_date} onChange={e=>setDraft({...draft,due_date:e.target.value})} />
            <input className="input" placeholder="Verantwortlich" value={draft.owner} onChange={e=>setDraft({...draft,owner:e.target.value})} />
            <button className="btn-primary" onClick={add}>Speichern</button>
          </div>
        </Card>
      )}
      <Card style={{padding:0}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
          {tasks.map(t=>(
            <tr key={t.id} style={{borderTop:`1px solid ${BORDER}`}}>
              <td style={{padding:12}}>{t.title}<div style={{fontSize:11.5,color:INK_MUTED}}>{t.department}</div></td>
              <td style={{padding:12}}><Pill {...priorityColor(t.priority)}>{t.priority}</Pill></td>
              <td style={{padding:12}}>
                <select value={t.status} onChange={e=>updateStatus(t.id,e.target.value)} className="input" style={{width:"auto",padding:"5px 8px",fontSize:12.5}}>{TASK_STATUSES.map(s=><option key={s}>{s}</option>)}</select>
              </td>
              <td style={{padding:12,color:INK_MUTED}}>{fmtDate(t.due_date)}</td>
              <td style={{padding:12}}><button onClick={()=>remove(t.id)} style={{background:"none",border:"none",color:INK_MUTED,cursor:"pointer"}}>✕</button></td>
            </tr>
          ))}
        </tbody></table>
      </Card>
    </div>
  );
}

function MilestonesView({milestones, callHotel, callId, refresh}){
  const [draft,setDraft]=useState({title:"",date:"",criticality:"Hoch"});
  const add = async () => { if(!draft.title||!draft.date) return; await callHotel("/milestones","POST",draft); setDraft({title:"",date:"",criticality:"Hoch"}); refresh(); };
  const updateStatus = async (id,status) => { await callId("milestones",id,"PATCH",{status}); refresh(); };
  return (
    <div>
      <Card style={{marginBottom:16}}>
        <div style={{display:"flex",gap:10}}>
          <input className="input" placeholder="Titel" value={draft.title} onChange={e=>setDraft({...draft,title:e.target.value})} />
          <input type="date" className="input" value={draft.date} onChange={e=>setDraft({...draft,date:e.target.value})} />
          <select className="input" value={draft.criticality} onChange={e=>setDraft({...draft,criticality:e.target.value})}><option>Kritisch</option><option>Hoch</option><option>Mittel</option></select>
          <button className="btn-primary" onClick={add}>+</button>
        </div>
      </Card>
      {[...milestones].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(m=>(
        <Card key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div><div style={{fontWeight:600}}>{m.title}</div><div style={{fontSize:12.5,color:INK_MUTED}}>{fmtDate(m.date)} · {m.criticality}</div></div>
          <select value={m.status} onChange={e=>updateStatus(m.id,e.target.value)} className="input" style={{width:"auto",padding:"6px 9px",fontSize:12.5}}>{MILESTONE_STATUSES.map(s=><option key={s}>{s}</option>)}</select>
        </Card>
      ))}
    </div>
  );
}

function RisksView({risks, callHotel, refresh}){
  const [draft,setDraft]=useState({title:"",department:DEPARTMENTS[0],probability:3,impact:3,mitigation:""});
  const add = async () => { if(!draft.title) return; await callHotel("/risks","POST",draft); setDraft({...draft,title:""}); refresh(); };
  return (
    <div>
      <Card style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10,marginBottom:10}}>
          <input className="input" placeholder="Titel" value={draft.title} onChange={e=>setDraft({...draft,title:e.target.value})} />
          <select className="input" value={draft.department} onChange={e=>setDraft({...draft,department:e.target.value})}>{DEPARTMENTS.map(d=><option key={d}>{d}</option>)}</select>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:12.5}}>W: {draft.probability}</span>
          <input type="range" min="1" max="5" value={draft.probability} onChange={e=>setDraft({...draft,probability:Number(e.target.value)})} />
          <span style={{fontSize:12.5}}>A: {draft.impact}</span>
          <input type="range" min="1" max="5" value={draft.impact} onChange={e=>setDraft({...draft,impact:Number(e.target.value)})} />
          <button className="btn-primary" onClick={add}>+</button>
        </div>
      </Card>
      {[...risks].sort((a,b)=>b.probability*b.impact - a.probability*a.impact).map(r=>(
        <Card key={r.id} style={{marginBottom:10}}>
          <div style={{fontWeight:600}}>{r.title} <Pill color={BAD} bg={BAD_SOFT}>{r.probability*r.impact}</Pill></div>
          <div style={{fontSize:12.5,color:INK_MUTED}}>{r.department}</div>
        </Card>
      ))}
    </div>
  );
}

function TeamView({orgId, api, inviteLinkBase}){
  const [members,setMembers] = useState([]);
  const [invites,setInvites] = useState([]);
  const [email,setEmail] = useState(""); const [role,setRole] = useState("member");
  const [error,setError] = useState(""); const [copiedId,setCopiedId] = useState(null); const [loading,setLoading] = useState(false);

  const load = useCallback(async () => {
    try {
      const [m,i] = await Promise.all([
        api("/api/organizations/"+orgId+"/members"),
        api("/api/organizations/"+orgId+"/invites"),
      ]);
      setMembers(m); setInvites(i);
    } catch(e){ setError(e.message); }
  }, [api, orgId]);

  useEffect(()=>{ load(); }, [load]);

  const invite = async () => {
    if(!email) return;
    setError(""); setLoading(true);
    try { await api("/api/invites","POST",{organization_id:orgId, email, role}); setEmail(""); await load(); }
    catch(e){ setError(e.message); }
    setLoading(false);
  };

  const revoke = async (id) => { await api("/api/invites/"+id,"DELETE"); await load(); };

  const [shownLinkId,setShownLinkId] = useState(null);
  const linkFor = (invite) => inviteLinkBase + "?invite=" + invite.token;
  const copyLink = (invite) => {
    // Link immer auch sichtbar anzeigen – manche Browser blockieren die Zwischenablage.
    setShownLinkId(invite.id);
    try {
      navigator.clipboard.writeText(linkFor(invite))
        .then(()=>{ setCopiedId(invite.id); setTimeout(()=>setCopiedId(null),1800); })
        .catch(()=>{});
    } catch(e){}
  };

  return (
    <div>
      <Card style={{marginBottom:18}}>
        <div style={{fontWeight:700,marginBottom:10}}>Teammitglied einladen</div>
        <div style={{display:"flex",gap:10}}>
          <input className="input" placeholder="E-Mail-Adresse" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&invite()} />
          <select className="input" style={{width:150}} value={role} onChange={e=>setRole(e.target.value)}>
            <option value="member">Mitglied</option>
            <option value="admin">Admin</option>
          </select>
          <button className="btn-primary" onClick={invite} disabled={loading}>{loading?"…":"Einladen"}</button>
        </div>
        {error && <div style={{color:BAD,fontSize:13,marginTop:10}}>{error}</div>}
        <div style={{fontSize:12,color:INK_MUTED,marginTop:10}}>
          Nach dem Einladen bekommst du einen Link zum Kopieren — den schickst du der Person (z. B. per E-Mail oder Chat).
          Sie muss sich damit registrieren oder anmelden, dann gehört sie automatisch zu deiner Organisation.
        </div>
      </Card>

      <Card style={{marginBottom:18,padding:0}}>
        <div style={{fontWeight:700,padding:"14px 16px 6px"}}>Mitglieder</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
          {members.map(m=>(
            <tr key={m.user_id} style={{borderTop:`1px solid ${BORDER}`}}>
              <td style={{padding:12}}>{m.email}</td>
              <td style={{padding:12,color:INK_MUTED}}>{m.role}</td>
              <td style={{padding:12,color:INK_MUTED}}>seit {fmtDate(m.joined_at)}</td>
            </tr>
          ))}
        </tbody></table>
      </Card>

      {invites.filter(i=>i.status==="ausstehend").length > 0 && (
        <Card style={{padding:0}}>
          <div style={{fontWeight:700,padding:"14px 16px 6px"}}>Ausstehende Einladungen</div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}><tbody>
            {invites.filter(i=>i.status==="ausstehend").map(i=>(
              <tr key={i.id} style={{borderTop:`1px solid ${BORDER}`}}>
                <td style={{padding:12}}>{i.email}<div style={{fontSize:11.5,color:INK_MUTED}}>{i.role}</div>
                  {shownLinkId===i.id && (
                    <input readOnly className="input" value={linkFor(i)} onFocus={e=>e.target.select()} autoFocus
                      style={{marginTop:8,fontSize:12}} />
                  )}
                </td>
                <td style={{padding:12}}>
                  <button onClick={()=>copyLink(i)} style={{background:"none",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 10px",fontSize:12.5,cursor:"pointer"}}>
                    {copiedId===i.id ? "Kopiert!" : "Link kopieren"}
                  </button>
                </td>
                <td style={{padding:12}}><button onClick={()=>revoke(i.id)} style={{background:"none",border:"none",color:INK_MUTED,cursor:"pointer"}}>✕</button></td>
              </tr>
            ))}
          </tbody></table>
        </Card>
      )}
    </div>
  );
}

function App(){
  const [config,setConfig] = useState(undefined);
  const [token,setToken] = useState(null);
  const [orgId,setOrgId] = useState(null);
  const [hotels,setHotels] = useState(null);
  const [hotel,setHotel] = useState(null);
  const [tab,setTab] = useState("dashboard");
  const [tasks,setTasks] = useState([]);
  const [milestones,setMilestones] = useState([]);
  const [risks,setRisks] = useState([]);
  const [readiness,setReadiness] = useState(null);
  const [fatalError,setFatalError] = useState("");
  const [recoveryToken,setRecoveryToken] = useState(null);
  const [recoveryDone,setRecoveryDone] = useState(false);

  useEffect(()=>{
    // Verbindungsdaten sind fest eingebaut – niemand muss sie mehr eintragen.
    setConfig(DEFAULT_CONFIG);
    // Erkennt den Link aus der "Passwort vergessen"-E-Mail: Supabase hängt
    // #access_token=...&type=recovery an die URL an, wenn man draufklickt.
    try {
      const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
      const params = new URLSearchParams(hash);
      if(params.get("type")==="recovery" && params.get("access_token")){
        setRecoveryToken(params.get("access_token"));
        window.history.replaceState(null,"",window.location.pathname);
      }
    } catch(e){}
    // Erkennt einen Team-Einladungslink: ?invite=<token>. Der Token wird im
    // Browser gemerkt, damit er auch nach Registrierung + E-Mail-Bestätigung
    // (die zurück auf die Seite ohne ?invite führt) noch da ist.
    try {
      const search = new URLSearchParams(window.location.search);
      if(search.get("invite")){
        try { window.localStorage.setItem(LS_INVITE_KEY, search.get("invite")); } catch(e){}
        window.history.replaceState(null,"",window.location.pathname);
      }
    } catch(e){}
  },[]);

  const saveConfig = (cfg) => {
    setConfig(cfg);
    try { if(cfg) window.localStorage.setItem(LS_KEY, JSON.stringify(cfg)); else window.localStorage.removeItem(LS_KEY); } catch(e){}
  };

  const api = useCallback((path, method, body) => apiCall(config.backendUrl, token, path, method, body), [config, token]);

  useEffect(()=>{
    if(!token || !config) return;
    (async () => {
      try {
        let organizationId;
        let inviteToken = null;
        try { inviteToken = window.localStorage.getItem(LS_INVITE_KEY); } catch(e){}
        if(inviteToken){
          try {
            const accepted = await apiCall(config.backendUrl, token, "/api/invites/accept", "POST", {token:inviteToken});
            organizationId = accepted.organization_id;
          } catch(e){ setFatalError("Einladung: " + e.message); }
          // Einladung nur einmal verarbeiten – egal ob angenommen oder ungültig.
          try { window.localStorage.removeItem(LS_INVITE_KEY); } catch(e){}
        }
        if(!organizationId){
          const boot = await apiCall(config.backendUrl, token, "/api/bootstrap-organization", "POST", {name:"Meine Organisation"});
          organizationId = boot.organization_id;
        }
        setOrgId(organizationId);
        const h = await apiCall(config.backendUrl, token, "/api/hotels");
        setHotels(h);
      } catch(e){ setFatalError(e.message); }
    })();
  },[token, config]);

  const loadHotelData = useCallback(async (h) => {
    if(!h) return;
    const base = "/api/hotels/" + h.id;
    try {
      const [t,m,r,rd] = await Promise.all([
        apiCall(config.backendUrl, token, base+"/tasks"),
        apiCall(config.backendUrl, token, base+"/milestones"),
        apiCall(config.backendUrl, token, base+"/risks"),
        apiCall(config.backendUrl, token, base+"/readiness"),
      ]);
      setTasks(t); setMilestones(m); setRisks(r); setReadiness(rd);
    } catch(e){ setFatalError(e.message); }
  },[config, token]);

  useEffect(()=>{ if(hotel) loadHotelData(hotel); },[hotel, loadHotelData]);

  if(config===undefined) return <div style={{padding:40,color:INK_MUTED}}>Lädt…</div>;
  if(!config) return <SetupView onSave={saveConfig} />;
  if(recoveryToken && !recoveryDone) return <ResetPasswordView config={config} accessToken={recoveryToken} onDone={()=>{setRecoveryDone(true);setRecoveryToken(null);}} />;
  if(recoveryDone) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:380,width:"100%",textAlign:"center"}}>
        <div style={{fontFamily:"Fraunces, serif",fontSize:18,fontWeight:600,marginBottom:10}}>Passwort geändert</div>
        <div style={{fontSize:13.5,color:INK_MUTED,marginBottom:16}}>Du kannst dich jetzt mit deinem neuen Passwort anmelden.</div>
        <button className="btn-primary" style={{width:"100%"}} onClick={()=>setRecoveryDone(false)}>Zur Anmeldung</button>
      </Card>
    </div>
  );
  if(!token) return <LoginView config={config} onLogin={setToken} onReset={()=>saveConfig(null)} />;
  // hotels === null heißt: noch nicht geladen. Erst danach entscheiden, ob Liste oder Formular.
  if(!hotel && hotels===null) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
      <Card style={{maxWidth:380,width:"100%",textAlign:"center"}}>
        {fatalError
          ? <React.Fragment>
              <div style={{color:BAD,fontSize:13.5,marginBottom:14}}>{fatalError}</div>
              <button className="btn-primary" style={{width:"100%"}} onClick={()=>{setFatalError("");setToken(null);setOrgId(null);}}>Zurück zur Anmeldung</button>
            </React.Fragment>
          : <div style={{color:INK_MUTED,fontSize:13.5}}>Hotels werden geladen…</div>}
      </Card>
    </div>
  );
  if(!hotel) return <HotelSetupView hotels={hotels} orgId={orgId} api={api}
    onCreated={(h)=>{ setHotels([...hotels,h]); setHotel(h); }} onSelect={setHotel} />;

  const NAV = [
    {key:"dashboard", label:"Dashboard"},
    {key:"tasks", label:"Aufgaben"},
    {key:"milestones", label:"Meilensteine"},
    {key:"risks", label:"Risiken"},
    {key:"team", label:"Team"},
  ];

  const callHotel = (suffix, method, body) => api("/api/hotels/"+hotel.id+suffix, method, body);
  const callId = (resource, id, method, body) => api("/api/"+resource+"/"+id, method, body);

  return (
    <div style={{fontFamily:"Inter, sans-serif",background:PAPER,minHeight:"100vh",display:"flex"}}>
      <div style={{width:210,background:INK,color:"#fff",padding:"22px 14px",flexShrink:0}}>
        <div style={{fontFamily:"Fraunces, serif",fontSize:15.5,fontWeight:600,padding:"0 8px 22px",borderBottom:"1px solid rgba(255,255,255,0.12)",marginBottom:14}}>HPOOS</div>
        {NAV.map(n=>(
          <div key={n.key} onClick={()=>setTab(n.key)} style={{padding:"9px 10px",borderRadius:7,cursor:"pointer",marginBottom:3,fontSize:13.5,background:tab===n.key?INK_SOFT:"transparent",color:tab===n.key?"#fff":"rgba(255,255,255,0.65)"}}>{n.label}</div>
        ))}
        <div onClick={()=>{setToken(null);setOrgId(null);setHotel(null);setHotels(null);}} style={{marginTop:20,fontSize:13,color:"rgba(255,255,255,0.5)",cursor:"pointer"}}>Abmelden</div>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{padding:"18px 28px",borderBottom:`1px solid ${BORDER}`}}>
          <div style={{fontFamily:"Fraunces, serif",fontSize:20,fontWeight:600}}>{hotel.name}</div>
          <div style={{fontSize:12.5,color:INK_MUTED}}>{hotel.city} · {hotel.rooms} Zimmer</div>
        </div>
        <div style={{padding:"22px 28px"}}>
          {fatalError && <div style={{color:BAD,marginBottom:14}}>{fatalError}</div>}
          {tab==="dashboard" && <DashboardView readiness={readiness} tasks={tasks} risks={risks} />}
          {tab==="tasks" && <TasksView tasks={tasks} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="milestones" && <MilestonesView milestones={milestones} callHotel={callHotel} callId={callId} refresh={()=>loadHotelData(hotel)} />}
          {tab==="risks" && <RisksView risks={risks} callHotel={callHotel} refresh={()=>loadHotelData(hotel)} />}
          {tab==="team" && <TeamView orgId={orgId} api={api} inviteLinkBase={window.location.origin + window.location.pathname} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
