  if (p.description) h += '<div class="box desc" dir="auto">' + esc(p.description) + "</div>";
  if (p.salary_note) h += '<div class="box"><b>' + esc(t("salary")) + ':</b> <span dir="auto">' + esc(p.salary_note) + "</span></div>";
  if (state.sent) { h += '<div class="msg ok" data-live="1">✓ ' + esc(t("sent")) + "</div>"; a.innerHTML = h; bindBack(); return; }
  var f = state.f;
  h += "<h2>" + esc(t("apply")) + "</h2><form id=\"form\" novalidate>"
    + '<label class="t" for="name">' + esc(t("name")) + ' *</label><input type="text" id="name" autocomplete="name" maxlength="120" required value="' + esc(f.name) + '" />'
    + '<label class="t" for="email">' + esc(t("email")) + '</label><input type="email" id="email" autocomplete="email" maxlength="200" value="' + esc(f.email) + '" aria-describedby="chint" />'
    + '<label class="t" for="phone">' + esc(t("phone")) + '</label><input type="tel" id="phone" autocomplete="tel" maxlength="60" value="' + esc(f.phone) + '" aria-describedby="chint" />'
    + '<div class="note" id="chint">' + esc(t("contactHint")) + "</div>"
    + '<label class="t" for="message">' + esc(t("message")) + '</label><textarea id="message" maxlength="2000" dir="auto">' + esc(f.message) + "</textarea>"
    + '<label class="t" for="cv">' + esc(t("cv")) + '</label><input type="file" id="cv" accept="application/pdf,.pdf" />' + (state.cvName ? '<div class="note">✓ ' + esc(state.cvName) + "</div>" : "")
    + '<input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />'
    + '<label class="check"><input type="checkbox" id="consent"' + (f.consent ? " checked" : "") + ' aria-labelledby="cText" aria-describedby="cHint" /><span id="cText">' + esc(t("consent", { hotel: d.hotel.name })) + " *</span></label>"
    + '<div class="note" id="cHint">' + esc(t("consentHint")) + "</div>"
    + '<button type="submit" class="send" id="send"' + (state.busy ? " disabled" : "") + ">" + esc(state.busy ? "…" : t("send")) + "</button>"
    + (state.formError ? '<div class="msg err" role="alert">' + esc(state.formError) + "</div>" : "") + "</form>";
  a.innerHTML = h; bindBack();
  ["name", "email", "phone", "message"].forEach(function (k) { $(k).oninput = function () { state.f[k] = this.value; }; });
  $("consent").onchange = function () { state.f.consent = this.checked; };
  $("cv").onchange = function () {
    var file = this.files && this.files[0]; state.cv = null; state.cvName = "";
    if (!file) return;
    if (file.size > 3 * 1024 * 1024 || !/pdf$/i.test(file.type || file.name)) { state.formError = t("cvBad"); this.value = ""; render(); return; }
    var r = new FileReader(); r.onload = function () { state.cv = String(r.result).replace(/^data:[^;]*;/, "data:application/pdf;"); state.cvName = file.name; state.formError = null; render(); }; r.readAsDataURL(file);
  };
  $("form").onsubmit = function (e) {
    e.preventDefault();
    var err = !f.name.trim() ? [t("needName"), "name"] : !f.email.trim() && !f.phone.trim() ? [t("needContact"), "email"] : !f.consent ? [t("needConsent"), "consent"] : null;
    if (err) { state.formError = err[0]; render(); $(err[1]).focus(); return; }
    state.busy = true; state.formError = null; render();
    api("/api/public/jobs/" + encodeURIComponent(p.token) + "/apply", { method: "POST", body: JSON.stringify({ name: f.name, email: f.email, phone: f.phone, message: f.message, cv_data: state.cv, consent: true, lang: lang, website: $("website") ? $("website").value : "" }) })
      .then(function () { state.sent = true; state.cv = null; state.cvName = ""; state.f = { name: "", email: "", phone: "", message: "", consent: false }; })
      .catch(function (e) { state.formError = e.message; })
      .then(function () { state.busy = false; render(); var m = document.querySelector(".msg"); if (m) m.scrollIntoView({ block: "center" }); });
  };
}
function bindBack() { if ($("back")) $("back").onclick = function () { state.open = null; render(); }; }
function brand(h) {
  $("hotel").textContent = h.name; document.title = h.name;
  if (h.logo_data) { $("logo").src = h.logo_data; $("logo").alt = h.name; $("logo").hidden = false; }
  if (h.brand_color) document.documentElement.style.setProperty("--ink", h.brand_color);
}
render();
var path = token ? "/api/public/jobs/" + encodeURIComponent(token) : hotelId ? "/api/public/jobs/hotel/" + encodeURIComponent(hotelId) : null;
if (!path && !demo) { state.error = t("invalid"); render(); }
else api(path || "").then(function (d) { state.data = d; brand(d.hotel); render(); }).catch(function (e) { state.error = e.message || t("invalid"); render(); });
</script>
</body>
</html>
