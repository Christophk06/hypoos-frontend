    + '<div class="note">' + esc(t("linkHint")) + "</div>" + (state.copyMsg ? '<div class="note" role="status">' + esc(state.copyMsg) + "</div>" : "") + "</div>";
  h += "<h2>" + esc(t("months")) + "</h2>";
  if (!d.months.length) h += '<div class="box">' + esc(t("noMonths")) + "</div>";
  else {
    h += '<div class="box scroll"><table><thead><tr><th scope="col">' + esc(t("month")) + '</th><th scope="col" class="r">' + esc(t("commission")) + '</th><th scope="col" class="r">' + esc(t("paid")) + '</th><th scope="col" class="r">' + esc(t("open")) + "</th></tr></thead><tbody>";
    d.months.forEach(function (m) { h += "<tr><td>" + esc(fmtMonth(m.period)) + '</td><td class="r">' + esc(money(m.commission, m.currency)) + '</td><td class="r">' + esc(money(m.paid, m.currency)) + '</td><td class="r ' + (m.open > 0 ? "open" : "okc") + '">' + esc(money(m.open, m.currency)) + "</td></tr>"; });
    h += "</tbody></table></div>";
  }
  if (d.estimate && d.estimate.monthly_commission_eur > 0) h += '<div class="msg warnbox">' + esc(t("estimate", { amount: money(d.estimate.monthly_commission_eur, "EUR") })) + "</div>";
  h += "<h2>" + esc(t("orgs")) + '</h2><div class="box">';
  if (!d.organizations.length) h += esc(t("noOrgs"));
  d.organizations.forEach(function (o) { h += '<div class="row"><b dir="auto">' + esc(o.name) + '</b><span class="note" style="margin:0">' + esc(t("since", { date: fmtDate(o.since) })) + '</span><span class="tag' + (o.active ? " ok" : "") + '">' + esc(o.active ? t("active") : o.trial ? t("trial") : t("inactive")) + "</span></div>"; });
  h += "</div><h2>" + esc(t("payouts")) + '</h2><div class="box">';
  if (!d.payouts.length) h += esc(t("noPayouts"));
  d.payouts.forEach(function (x) { h += '<div class="row"><b>' + esc(fmtMonth(x.period)) + "</b><span>" + esc(money(x.amount, x.currency)) + '</span><span class="note" style="margin:0">' + esc(x.paid_at ? t("paidOn", { date: fmtDate(x.paid_at) }) : "") + "</span></div>"; });
  h += '</div><div class="note">' + esc(t("private")) + "</div>";
  a.innerHTML = h;
  $("copy").onclick = function () {
    var done = function (ok) { state.copyMsg = ok ? t("copied") : t("copyFail"); render(); $("copy").focus(); };
    try { navigator.clipboard.writeText(d.link).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
  };
}
render();
if (!demo && !/^[A-Za-z0-9_-]{20,64}$/.test(token)) { state.error = t("invalid"); render(); }
else api("/api/public/partner/" + encodeURIComponent(token)).then(function (d) { state.data = d; render(); }).catch(function (e) { state.error = e.message || t("invalid"); render(); });
</script>
</body>
</html>
