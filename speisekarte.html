        + '</div><div class="p">' + (i.price != null ? esc(money(i.price)) : "") + (i.price_note ? "<small>" + esc(i.price_note) + "</small>" : "") + "</div></div>";
    });
  });
  if (!any) h += '<div class="note" style="margin-top:12px">' + esc(t("none")) + "</div>";
  h += '<div class="legend"><b>' + esc(t("allergens")) + ":</b> " + ALG.map(function (x) { return x + " " + esc(an(x)); }).join(" · ") + "<br>" + esc(t("ask")) + (d.footer ? "<br>" + esc(d.footer) : "") + "</div>";

}
function bind() {
