<script>
  // Live-Demo ohne Anmeldung (?demo): Daten kommen aus demo/, nichts wird gespeichert
  if (/[?&]demo\b/.test(location.search)) {
    document.write('<script src="demo/data-' + (["de","en","fr","it","es","pt","tr","ja","zh","ar"].indexOf(UI_LANG) >= 0 ? UI_LANG : "en") + '.js"><\/script>');
    document.write('<script src="demo/demo-mock.js"><\/script>');
  }
  // Als App installierbar: Service Worker (nicht in der Demo)
  if ("serviceWorker" in navigator && !/[?&]demo\b/.test(location.search)) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  // Installations-Angebot des Browsers merken (Knopf "App installieren")
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); window.__installPrompt = e; window.dispatchEvent(new Event("ouverture-installable")); });
</script>
<style>
  @import url('fonts/fonts.css');
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; }
  /* Sichtbarer Fokus für Tastatur und Schalterbedienung */
  :focus-visible { outline: 2px solid #A9834B; outline-offset: 2px; }
  .sidebar :focus-visible, .mobile-tabbar :focus-visible, .btn-primary:focus-visible { outline-color: #C9A66B; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: #F6F4EF; color: #1C2430; }
  input, select, button, textarea { font-family: 'Inter', sans-serif; }
  .card { background: #fff; border: 1px solid #E4DFD3; border-radius: 6px; padding: 22px; }
  .btn-primary { background: #1C2430; color: #fff; border: none; border-radius: 4px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; letter-spacing: .01em; }
  .btn-primary:hover { background: #2A3444; }
  .nav-item:hover { color: #fff !important; }
  .login-side { display: flex; }
  @media (max-width: 760px) { .login-side { display: none !important; } }
  .input { width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid #E4DFD3; font-size: 14px; color: #1C2430; background: #F6F4EF; }
  .field-label { font-size: 12.5px; font-weight: 600; color: #6B7280; margin-bottom: 5px; }

  /* ---------- Dunkler Modus: Farben der Oberfläche (auch die direkt an Elementen gesetzten) umstellen ---------- */
  @media screen {
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="dark"] body { background: #12161c; color: #e7e4dc; }
    html[data-theme="dark"] .card { background: #1b212a; border-color: #2d3542; }
    html[data-theme="dark"] .input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { background: #12161c !important; color: #e7e4dc !important; border-color: #2d3542 !important; }
    html[data-theme="dark"] .btn-primary { background: #C9A66B; color: #12161c; }
    html[data-theme="dark"] .btn-primary:hover { background: #d6b47a; }
    html[data-theme="dark"] .field-label { color: #9aa3af; }
    html[data-theme="dark"] [style*="background: rgb(255, 255, 255)"] { background: #1b212a !important; }
    html[data-theme="dark"] [style*="background: rgb(246, 244, 239)"] { background: #12161c !important; }
    html[data-theme="dark"] [style*="background: rgb(244, 247, 251)"] { background: #1f2833 !important; }
    html[data-theme="dark"] [style*="background: rgb(241, 232, 216)"] { background: #3a3122 !important; }
    html[data-theme="dark"] [style*="background: rgb(228, 239, 232)"] { background: #1f3329 !important; }
    html[data-theme="dark"] [style*="background: rgb(245, 233, 213)"] { background: #3a2f1c !important; }
    html[data-theme="dark"] [style*="background: rgb(245, 225, 222)"] { background: #3b2224 !important; }
    html[data-theme="dark"] [style*="background: rgb(28, 36, 48)"] { background: #3a4352 !important; }
    html[data-theme="dark"] [style^="color: rgb(28, 36, 48)"], html[data-theme="dark"] [style*="; color: rgb(28, 36, 48)"] { color: #e7e4dc !important; }
    html[data-theme="dark"] [style*="rgb(228, 223, 211)"] { border-color: #2d3542 !important; }
    html[data-theme="dark"] .sidebar, html[data-theme="dark"] .login-side { background: #0b0e13 !important; }
    html[data-theme="dark"] a { color: #d6b47a; }
    html[data-theme="dark"] img { opacity: 0.92; }
  }

  /* Handy: Menü bleibt eine waagrechte Leiste – Gruppen, Favoriten-Kopf und Sterne ausblenden */
  @media (max-width: 640px) {
    .sidenav, .sidenav-group { display: contents; }
    .sidenav-favs, .nav-section, .nav-star { display: none !important; }
  }

  /* ---------- Untere Leiste am Handy (Mitarbeitende) ---------- */
  .mobile-tabbar { display: none; }
  @media (max-width: 640px) {
    .mobile-tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; background: #1C2430;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 18px rgba(0,0,0,0.15); }
    .mobile-tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none;
      color: rgba(255,255,255,0.65); font-size: 10.5px; padding: 4px 0; cursor: pointer; }
    .mobile-tabbar button.on { color: #C9A66B; }
    .mobile-tabbar .lbl { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body:has(.mobile-tabbar) .page-content { padding-bottom: 84px !important; }
    .kbd-hint { display: none; }
  }

  /* ---------- Feedback-Knopf ---------- */
  .feedback-fab { position: fixed; right: 16px; bottom: 16px; z-index: 80; background: #1C2430; color: #fff; border: none; border-radius: 999px;
    padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.18); opacity: 0.85; }
  .feedback-fab:hover { opacity: 1; }
  .feedback-panel { position: fixed; right: 16px; bottom: 16px; z-index: 81; width: 340px; max-width: calc(100vw - 32px); border-radius: 12px;
    padding: 14px; box-shadow: 0 14px 40px rgba(0,0,0,0.22); }
  @media (max-width: 640px) {
    body:has(.mobile-tabbar) .feedback-fab { bottom: 76px; }
    .feedback-fab { padding: 7px 11px; }
  }
  @media print { .feedback-ui, .mobile-tabbar { display: none !important; } }

  /* ---------- Menü links: eigener Bildlauf, bleibt beim Scrollen der rechten Seite stehen ---------- */
  @media (min-width: 641px) {
    .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain;
               scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.25) transparent; }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 6px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
  }
  @media print { .sidebar { position: static; height: auto; overflow: visible; } }

  /* ---------- Handy-Ansicht ---------- */
  /* ---------- Statusbericht (Druck / PDF) ---------- */
  .report { max-width: 210mm; margin: 0 auto; background: #fff; color: #1C2430; padding: 14mm 14mm 10mm; font-size: 12.5px; }
  .report h2 { font-family: 'Fraunces', serif; font-size: 15px; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #E4DFD3; }
  .report table { width: 100%; border-collapse: collapse; }
  .report td, .report th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #F0ECE3; vertical-align: top; }
  .report th { font-size: 11px; color: #6B7280; font-weight: 600; }
  .report .avoid-break { break-inside: avoid; }
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff !important; }
    .no-print, .sidebar, .page-header { display: none !important; }
    .page-content { padding: 8mm !important; }
    .report-wrap { background: #fff !important; padding: 0 !important; min-height: 0 !important; }
    .report { max-width: none; padding: 12mm 14mm; box-shadow: none !important; border-radius: 0 !important; margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  @media (max-width: 640px) {
    .app-shell { flex-direction: column !important; }
    .sidebar { width: auto !important; padding: 8px 10px !important; display: flex; align-items: center; gap: 2px;
               overflow-x: auto; position: sticky; top: 0; z-index: 10; -webkit-overflow-scrolling: touch; }
    .sidebar .brand { padding: 0 10px 0 4px !important; border: none !important; margin: 0 !important; }
    .sidebar .nav-item { margin: 0 !important; white-space: nowrap; }
    .sidebar .logout { margin: 0 0 0 auto !important; padding: 9px 10px; white-space: nowrap; }
    .sidebar .org-switcher { margin: 0 6px 0 0 !important; min-width: 130px; }
    .sidebar .org-switcher > div:first-child { display: none; }
    .page-header { padding: 14px 16px !important; flex-wrap: wrap; }
    .page-content { padding: 16px !important; }
    .stack { display: flex !important; flex-direction: column !important; align-items: stretch !important; }
    .stack > * { width: 100% !important; }
    .resp-table tr { display: flex; flex-wrap: wrap; align-items: center; }
    .resp-table td { padding: 8px 12px !important; }
    .resp-table td:first-child { flex-basis: 100%; padding-bottom: 2px !important; }
    .dept-label { width: 110px !important; }
    .card { padding: 16px; }
    .input { font-size: 16px; } /* verhindert automatisches Hineinzoomen auf dem iPhone */
  }
</style>
