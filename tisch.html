  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--paper); color: var(--ink); }
  .w { max-width: 520px; margin: 0 auto; padding: 22px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { height: 40px; max-width: 120px; object-fit: contain; }
  .hotel { font-family: Georgia, serif; font-size: 20px; font-weight: 600; flex: 1; }
  select, input, textarea { font: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: #fff; color: var(--ink); width: 100%; min-height: 44px; }

  label.f { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 25px; margin: 4px 0 6px; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  .sub { color: var(--muted); font-size: 14.5px; margin-bottom: 14px; }
  .box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 8px 10px; min-height: 44px; min-width: 64px; cursor: pointer; font: inherit; font-size: 14px; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
  .chip:disabled { opacity: .45; cursor: not-allowed; text-decoration: line-through; }
  .alg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .alg label { display: flex; gap: 6px; align-items: center; font-size: 13.5px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: #fff; min-height: 44px; }
  .alg input { width: auto; min-height: 0; }
  button.main { background: var(--ink); color: #fff; border: none; border-radius: 10px; padding: 13px 18px; font: inherit; font-weight: 700; width: 100%; min-height: 48px; cursor: pointer; margin-top: 16px; }
  button.main:disabled { opacity: .5; }
  button.sec { background: #fff; color: var(--bad); border: 1px solid var(--bad); border-radius: 10px; padding: 12px 16px; font: inherit; font-weight: 600; min-height: 44px; cursor: pointer; }
  .msg { padding: 14px; border-radius: 10px; font-size: 15px; margin-bottom: 12px; }
  .err { background: #F5E1DE; color: var(--bad); } .ok { background: #E3F0E8; color: var(--good); } .wait { background: #F7EBD3; color: var(--warn); }
  .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 15px; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; }
  footer { margin-top: 26px; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>

var state = { info: null, error: null, party: 2, day: null, time: null, done: null, busy: false, m: null, form: { name: "", email: "", phone: "", room_no: "", note: "", allergens: [], allergen_consent: false } };
var lang = (function () { try { var s = localStorage.getItem("ouv_guest_lang"); if (T[s]) return s; } catch (e) {} var n = (navigator.language || "en").slice(0, 2).toLowerCase(); return T[n] ? n : "en"; })();
var $ = function (id) { return document.getElementById(id); };
function t(k) { var L = T[lang] || T.en; return L[k] != null ? L[k] : (T.en[k] != null ? T.en[k] : ""); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
LANGS.forEach(function (l) { if (!T[l[0]]) return; var o = document.createElement("option"); o.value = l[0]; o.textContent = l[1]; $("lang").appendChild(o); });
$("lang").value = lang;
$("lang").onchange = function () { lang = this.value; try { localStorage.setItem("ouv_guest_lang", lang); } catch (e) {} render(); };
function fmtDay(iso, opt) { try { return new Intl.DateTimeFormat(lang === "en" ? "en-GB" : lang, Object.assign({ timeZone: "UTC" }, opt || { weekday: "short", day: "numeric", month: "short" })).format(new Date(iso + "T12:00:00Z")); } catch (e) { return iso; } }
function brand(h) {
  $("hotel").textContent = h.name || ""; document.title = (h.name ? h.name + " · " : "") + t("title");
  if (h.logo && /^data:image\/(png|jpeg|webp|svg\+xml);/.test(h.logo)) { $("logo").src = h.logo; $("logo").hidden = false; }
  if (h.color && /^#[0-9a-fA-F]{3,8}$/.test(h.color)) document.documentElement.style.setProperty("--ink", h.color);
}
function call(method, path, body) {
  return fetch(API + path, { method: method, headers: { "Content-Type": "application/json", "Accept-Language": lang }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(r.status === 404 ? t("invalid") : j.error || t("error")); return j; }); });
}
function demoInfo() {
  var d0 = new Date(), days = [];
  for (var i = 0; i < 6; i++) { var d = new Date(d0.getTime() + i * 86400000).toISOString().slice(0, 10); days.push({ day: d, slots: ["18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"].map(function (x, n) { return { time: x, free: (n + i) % 4 !== 2 }; }) }); }
  return { hotel: { name: "Beispielhotel Alpenblick" }, note: "Warme Küche bis 21:30.", max_party: 8, max_days: 60, days: days };
}
function loadInfo() {
  var p = demo ? Promise.resolve(demoInfo()) : call("GET", "/api/public/dining/" + encodeURIComponent(token) + "?party=" + state.party);
  return p.then(function (i) {
    state.info = i; state.error = null; brand(i.hotel || {});
    if (!state.day || !i.days.some(function (d) { return d.day === state.day; })) state.day = i.days.length ? i.days[0].day : null;
    var d = i.days.filter(function (x) { return x.day === state.day; })[0];
    if (!d || !d.slots.some(function (s) { return s.time === state.time && s.free; })) state.time = null;
    render();
  }).catch(function (e) { state.error = e.message || t("error"); render(); });
}
function render() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  var hn = $("hotel").textContent; document.title = (hn && hn !== "…" ? hn + " · " : "") + t(manage ? "your" : "title");
  var a = $("app");
  if (manage) return renderManage(a);
  if (state.error && !state.info) { a.innerHTML = '<div class="msg err" role="alert">' + esc(state.error) + "</div>"; return; }
  if (!state.info) { a.innerHTML = '<div class="sub">' + esc(t("loading")) + "</div>"; return; }
  if (state.done) {
    var d = state.done, link = location.origin + location.pathname + "?m=" + encodeURIComponent(d.manage || "");
    a.innerHTML = "<h1>" + esc(t("title")) + '</h1><div class="msg ' + (d.status === "bestätigt" ? "ok" : "wait") + '" role="status">' + esc(t(d.status === "bestätigt" ? "confirmed" : "requested")) + "</div>"
      + '<div class="box"><dl><dt>' + esc(t("day")) + "</dt><dd>" + esc(fmtDay(d.day, { weekday: "long", day: "numeric", month: "long" })) + "</dd><dt>" + esc(t("time")) + "</dt><dd>" + esc(d.time) + "</dd><dt>" + esc(t("party")) + "</dt><dd>" + esc(d.party) + "</dd></dl></div>"
      + (state.form.email ? '<div class="note">' + esc(t("mailed")) + "</div>" : "")
      + (d.manage ? '<div class="note">' + esc(t("keep")) + '<br><a href="' + esc(link) + '">' + esc(link) + "</a></div>" : "");
    return;
  }
  var i = state.info, f = state.form, h = "<h1>" + esc(t("title")) + "</h1>";
  if (i.note) h += '<div class="sub">' + esc(i.note) + "</div>";
  if (state.error) h += '<div class="msg err" role="alert">' + esc(state.error) + "</div>";
  h += '<label class="f" for="party">' + esc(t("party")) + '</label><select id="party">';
  for (var n = 1; n <= i.max_party; n++) h += '<option value="' + n + '"' + (n === state.party ? " selected" : "") + ">" + n + "</option>";
  h += '</select><div class="note">' + esc(t("more")) + "</div>";
  if (!i.days.length) { a.innerHTML = h + '<div class="msg wait" style="margin-top:12px">' + esc(t("noDays")) + "</div>"; bind(); return; }
  h += "<h2>" + esc(t("day")) + '</h2><div class="chips" role="group" aria-label="' + esc(t("day")) + '">' + i.days.map(function (d) { var free = d.slots.some(function (s) { return s.free; }); return '<button type="button" class="chip" data-day="' + esc(d.day) + '" aria-pressed="' + (d.day === state.day) + '"' + (free ? "" : " disabled") + ">" + esc(fmtDay(d.day)) + "</button>"; }).join("") + "</div>";
  var day = i.days.filter(function (d) { return d.day === state.day; })[0];
  h += "<h2>" + esc(t("time")) + "</h2>";
  if (!day || !day.slots.some(function (s) { return s.free; })) h += '<div class="sub">' + esc(t("none")) + "</div>";
  else h += '<div class="chips" role="group" aria-label="' + esc(t("time")) + '">' + day.slots.map(function (s) { return '<button type="button" class="chip" data-time="' + esc(s.time) + '" aria-pressed="' + (s.time === state.time) + '"' + (s.free ? "" : " disabled") + ">" + esc(s.time) + "</button>"; }).join("") + "</div>";
  h += "<h2>" + esc(t("details")) + "</h2><form id=\"frm\" novalidate>"
    + '<label class="f" for="name">' + esc(t("name")) + ' *</label><input id="name" autocomplete="name" required maxlength="120" value="' + esc(f.name) + '" />'
    + '<label class="f" for="email">' + esc(t("email")) + '</label><input id="email" type="email" autocomplete="email" maxlength="200" value="' + esc(f.email) + '" />'
    + '<label class="f" for="phone">' + esc(t("phone")) + '</label><input id="phone" type="tel" autocomplete="tel" maxlength="40" value="' + esc(f.phone) + '" />'
    + '<label class="f" for="room">' + esc(t("room")) + '</label><input id="room" maxlength="20" value="' + esc(f.room_no) + '" />'
    + '<fieldset style="border:none;padding:0;margin:10px 0 0"><legend class="f" style="font-size:13px;color:var(--muted)">' + esc(t("allergens")) + '</legend><div class="alg">'
    + ALG.map(function (k) { return '<label><input type="checkbox" data-alg="' + k + '"' + (f.allergens.indexOf(k) >= 0 ? " checked" : "") + " /> " + k + " · " + esc((t("alg") || {})[k] || "") + "</label>"; }).join("") + '</div><label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px"><input type="checkbox" id="algok" style="width:auto;min-height:0;margin-top:3px"' + (f.allergen_consent ? " checked" : "") + " /> <span>" + esc(t("consentAlg")) + "</span></label></fieldset>"
    + '<label class="f" for="note">' + esc(t("note")) + '</label><textarea id="note" rows="2" maxlength="500">' + esc(f.note) + "</textarea>"
    + '<div class="hp" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off" /></div>'
    + '<button class="main" type="submit"' + (state.time && !state.busy ? "" : " disabled") + ">" + esc(state.busy ? t("sending") : t("send")) + "</button>"
    + '<div class="note">' + esc(t("privacy")) + "</div></form>";
  a.innerHTML = h; bind();
}
function readForm() {
  var f = state.form; if (!$("name")) return;
  f.name = $("name").value; f.email = $("email").value; f.phone = $("phone").value; f.room_no = $("room").value; f.note = $("note").value;
  f.allergen_consent = !!($("algok") && $("algok").checked);
  f.allergens = Array.prototype.slice.call(document.querySelectorAll("[data-alg]")).filter(function (x) { return x.checked; }).map(function (x) { return x.getAttribute("data-alg"); });
}
function bind() {
  var p = $("party"); if (p) p.onchange = function () { readForm(); state.party = Number(this.value); loadInfo(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-day]"), function (b) { b.onclick = function () { readForm(); state.day = b.getAttribute("data-day"); state.time = null; render(); }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-time]"), function (b) { b.onclick = function () { readForm(); state.time = b.getAttribute("data-time"); render(); var m = document.querySelector('[data-time="' + state.time + '"]'); if (m) m.focus(); }; });
  var frm = $("frm"); if (!frm) return;
  frm.onsubmit = function (e) {
    e.preventDefault(); readForm();
    var f = state.form;
    if (!f.name.trim()) { state.error = t("name") + " *"; render(); $("name").focus(); return; }
    if (!f.email.trim() && !f.phone.trim()) { state.error = t("contact"); render(); $("email").focus(); return; }
    if (f.allergens.length && !f.allergen_consent) { state.error = t("consentNeed"); render(); $("algok").focus(); return; }
    state.busy = true; state.error = null; render();
    var body = { day: state.day, time: state.time, party: state.party, name: f.name, email: f.email, phone: f.phone, room_no: f.room_no, note: f.note, allergens: f.allergen_consent ? f.allergens : [], allergen_consent: !!f.allergen_consent, lang: lang, website: $("website") ? $("website").value : "" };
    var p = demo ? Promise.resolve({ ok: true, status: "bestätigt", day: state.day, time: state.time, party: state.party, manage: "" }) : call("POST", "/api/public/dining/" + encodeURIComponent(token), body);
    p.then(function (r) { state.busy = false; state.done = r; render(); window.scrollTo(0, 0); })
     .catch(function (e) { state.busy = false; state.error = e.message || t("error"); loadInfo(); });
  };
}
function renderManage(a) {
  var m = state.m;
  if (state.error && !m) { a.innerHTML = '<div class="msg err" role="alert">' + esc(state.error) + "</div>"; return; }
  if (!m) { a.innerHTML = '<div class="sub">' + esc(t("loading")) + "</div>"; return; }
  var h = "<h1>" + esc(t("your")) + "</h1>";
  if (state.error) h += '<div class="msg err" role="alert">' + esc(state.error) + "</div>";
  if (m.status === "abgesagt") h += '<div class="msg wait" role="status">' + esc(t("cancelled")) + "</div>";
  h += '<div class="box"><dl><dt>' + esc(t("name")) + "</dt><dd>" + esc(m.name) + "</dd><dt>" + esc(t("day")) + "</dt><dd>" + esc(fmtDay(m.day, { weekday: "long", day: "numeric", month: "long" })) + "</dd><dt>" + esc(t("time")) + "</dt><dd>" + esc(m.time) + "</dd><dt>" + esc(t("party")) + "</dt><dd>" + esc(m.party) + "</dd><dt>" + esc(t("status")) + "</dt><dd>" + esc(t(m.status)) + "</dd></dl></div>";
  if (m.can_cancel) h += '<button class="sec" id="cancel" type="button">' + esc(t("cancel")) + "</button>";
  a.innerHTML = h;
  var c = $("cancel");
  if (c) c.onclick = function () {
    if (!confirm(t("cancelQ"))) return;
    call("DELETE", "/api/public/dining/manage/" + encodeURIComponent(manage)).then(function () { m.status = "abgesagt"; m.can_cancel = false; state.error = null; render(); })
      .catch(function (e) { state.error = e.message || t("error"); render(); });
  };
}
render();
if (manage) {
  if (!TOK.test(manage)) { state.error = t("invalid"); render(); }
  else call("GET", "/api/public/dining/manage/" + encodeURIComponent(manage)).then(function (m) { state.m = m; brand(m.hotel || {}); render(); }).catch(function (e) { state.error = e.message || t("error"); render(); });
} else if (!demo && !TOK.test(token)) { state.error = t("invalid"); render(); }
else loadInfo();
</script>
</body>
