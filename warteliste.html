  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--paper); color: #1C2430; }
  .w { max-width: 520px; margin: 0 auto; padding: 22px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { height: 44px; max-width: 140px; object-fit: contain; }
  .hotel { font-family: Georgia, serif; font-size: 20px; font-weight: 600; flex: 1; }
  select.lang { border: 1px solid var(--border); border-radius: 6px; padding: 8px; background: #fff; font-size: 14px; min-height: 44px; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 27px; margin: 4px 0 8px; line-height: 1.25; }
  .date { color: var(--brass); font-weight: 700; font-size: 15px; margin-bottom: 14px; }
  .box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .info { white-space: pre-line; font-size: 15px; line-height: 1.55; }
  .offer { border-color: var(--brass); }
  .offer .l { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); font-weight: 700; margin-bottom: 4px; }
  label.t { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  input[type=email], input[type=text] { width: 100%; border: 1px solid #B9B3A6; border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; background: #fff; min-height: 48px; }
  input:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .consent { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 14px; line-height: 1.45; cursor: pointer; }
  .consent input { width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px; accent-color: #1C2430; }
  button.send { width: 100%; margin-top: 16px; background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; min-height: 48px; }
  button.send:disabled { opacity: .55; }
  .msg { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 15px; line-height: 1.45; }
  .ok { background: #E4EFE8; color: #2F5E46; } .err { background: #F5E1DE; color: #8A2F27; }
  .hp { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
  .note { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); text-align: center; }
  footer a { color: var(--muted); }
</style>

  if (!h) return;
  $("hotel").textContent = h.name || ""; document.title = h.name || "Ouverture";
  if (h.logo_data && /^data:image\//.test(h.logo_data)) { $("logo").src = h.logo_data; $("logo").alt = h.name || ""; $("logo").hidden = false; }
  if (h.brand_color && /^#[0-9a-fA-F]{6}$/.test(h.brand_color)) document.documentElement.style.setProperty("--ink", h.brand_color);
}
function focusMsg() { var m = document.querySelector(".msg"); if (m) { m.setAttribute("tabindex", "-1"); m.focus(); } }
function render() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  var a = $("app");
  if (mode !== "signup") {
    if (state.error) { a.innerHTML = '<div class="msg err" role="alert">' + esc(state.error) + "</div>"; return; }
    if (!state.result) { a.innerHTML = '<p class="note">' + esc(t("loading")) + "</p>"; return; }
    var r = state.result, txt = null;
    if (mode === "unsubscribe" && r.unsubscribed) txt = t("unsubscribed");
    if (mode === "confirm" && r.confirmed) txt = r.done ? t("confirmed") : t("already");
    if (txt) { a.innerHTML = '<div class="msg ok" data-live="1">✓ ' + esc(txt) + "</div>"; return; }
    a.innerHTML = '<div class="box"><p class="info" style="margin-top:0">' + esc(t(mode === "confirm" ? "confirmQ" : "unsubQ")) + '</p><button class="send" type="button" id="act"' + (state.busy ? " disabled" : "") + ">" + esc(t(mode === "confirm" ? "confirmBtn" : "unsubBtn")) + "</button></div>";
    $("act").onclick = function () {
      state.busy = true; render();
      api("/api/public/waitlist/" + mode + "/" + encodeURIComponent(ctoken), { method: "POST", body: "{}" })
        .then(function (x) { state.result = x; }).catch(function (e) { state.error = e.message || t("error"); })
        .then(function () { state.busy = false; render(); focusMsg(); });
    };
    return;
  }
  var i = state.info;
  if (state.error && !i) { a.innerHTML = '<div class="msg err" role="alert">' + esc(state.error) + "</div>"; return; }
  if (!i) { a.innerHTML = '<p class="note">' + esc(t("loading")) + "</p>"; return; }
  var html = (i.headline ? '<h1 dir="auto">' + esc(i.headline) + "</h1>" : '<h1 dir="auto">' + esc(i.hotel.name) + "</h1>")
    + (i.hotel.opening_date ? '<div class="date">' + esc(t("opening", { date: fmtDate(i.hotel.opening_date) })) + "</div>" : "");
  if (i.text) html += '<div class="box info" dir="auto">' + esc(i.text) + "</div>";
  if (i.offer) html += '<div class="box offer"><div class="l">' + esc(t("offer")) + '</div><div class="info" dir="auto">' + esc(i.offer) + "</div></div>";
  if (state.sent) {
    html += '<div class="msg ' + (state.sent === "ok" ? "ok" : "err") + '" ' + (state.sent === "ok" ? 'data-live="1"' : 'role="alert"') + '>' + esc(state.sent === "ok" ? "✓ " + t("checkMail") : t("mailFailed")) + "</div>";
    a.innerHTML = html; return;
  }
  html += '<form id="f" class="box" novalidate>'
    + '<label class="t" for="email" style="margin-top:0">' + esc(t("email")) + ' *</label><input type="email" id="email" required autocomplete="email" inputmode="email" maxlength="200" dir="ltr" value="' + esc(state.email) + '" />'
    + '<label class="t" for="name">' + esc(t("name")) + '</label><input type="text" id="name" autocomplete="name" maxlength="120" dir="auto" value="' + esc(state.name) + '" />'
    + '<input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />'
    + '<label class="consent"><input type="checkbox" id="consent" required' + (state.consent ? " checked" : "") + " /><span>" + esc(t("consent")) + "</span></label>"
    + '<button class="send" type="submit" id="send"' + (state.busy ? " disabled" : "") + ">" + esc(t("send")) + "</button>"
    + (state.error ? '<div class="msg err" role="alert">' + esc(state.error) + "</div>" : "")
    + '<p class="note">' + esc(t("privacy")) + "</p></form>";
  a.innerHTML = html;
  $("email").oninput = function () { state.email = this.value; };
  $("name").oninput = function () { state.name = this.value; };
  $("consent").onchange = function () { state.consent = this.checked; };
  $("f").onsubmit = function (ev) {
    ev.preventDefault();
    state.email = $("email").value.trim(); state.name = $("name").value.trim(); state.consent = $("consent").checked;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(state.email)) { state.error = t("badEmail"); render(); $("email").setAttribute("aria-invalid", "true"); $("email").focus(); return; }
    if (!state.consent) { state.error = t("needConsent"); render(); $("consent").focus(); return; }
    state.busy = true; state.error = null; render();
    api("/api/public/waitlist/" + encodeURIComponent(token), { method: "POST", body: JSON.stringify({ email: state.email, name: state.name, consent: true, language: lang, website: $("website") ? $("website").value : "" }) })
      .then(function (r) { state.sent = r && r.mail_sent === false ? "fail" : "ok"; }).catch(function (e) { state.error = e.message; })
      .then(function () { state.busy = false; render(); focusMsg(); });
  };
}
render();
var okToken = function (s) { return /^[A-Za-z0-9_-]{20,64}$/.test(s); };
if (mode === "signup") {
  if (!okToken(token) && !demo) { state.error = t("invalid"); render(); }
  else api("/api/public/waitlist/" + encodeURIComponent(token)).then(function (i) { state.info = i; brand(i.hotel); render(); }).catch(function (e) { state.error = e.message || t("invalid"); render(); });
} else {
  if (!okToken(ctoken) && !demo) { state.error = t("invalid"); render(); }
  else api("/api/public/waitlist/" + mode + "/" + encodeURIComponent(ctoken)).then(function (r) { state.result = r; brand(r.hotel); render(); }).catch(function (e) { state.error = e.message || t("error"); render(); });
}
</script>
</body>
</html>
