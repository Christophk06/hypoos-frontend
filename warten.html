<style>

  .hotel { font-family: Georgia, serif; font-size: 20px; font-weight: 600; flex: 1; }

  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 25px; margin: 4px 0 6px; }

  label.t { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .in { width: 100%; min-height: 44px; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font: inherit; font-size: 15px; background: #fff; color: inherit; }
  button.main { width: 100%; margin-top: 16px; background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; min-height: 48px; }
  button.main:disabled { opacity: .5; }
  button.line { width: 100%; margin-top: 10px; background: #fff; color: var(--ink); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 15px; cursor: pointer; min-height: 44px; }
  .big { font-family: Georgia, serif; font-size: 64px; line-height: 1; margin: 6px 0; }
  .center { text-align: center; }
  .called { background: var(--ink); color: #fff; border-radius: 14px; padding: 26px 18px; text-align: center; animation: pulse 1.6s ease-in-out infinite; }
  .called h1 { color: #fff; font-size: 30px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(169,131,75,.6); } 50% { box-shadow: 0 0 0 14px rgba(169,131,75,0); } }
  @media (prefers-reduced-motion: reduce) { .called { animation: none; } }
  .msg { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 15px; }
  .ok { background: #E4EFE8; color: var(--good); } .err { background: #F5E1DE; color: var(--bad); }
  .hp { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  footer { margin-top: 26px; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>

</div>

    enableSound(); // die Berührung des Knopfes erlaubt den Ton beim Aufruf
    state.busy = true; state.error = null; render();
    api("/api/public/queue-hotel/" + encodeURIComponent(htoken), { method: "POST", body: JSON.stringify({ area: f.area, name: f.name, party_size: Number(f.party), note: f.note, website: $("website") ? $("website").value : "" }) })
      .then(function (r) { if (!r.token) return; remember(r.token); return poll(); }).catch(function (x) { state.error = x.message; }).then(function () { state.busy = false; render(); });
  };
}
function remember(tok) {
  state.token = tok; try { localStorage.setItem(KEY, tok); } catch (e) {}
  try { var u = new URL(location.href); u.searchParams.set("q", tok); history.replaceState(null, "", u.toString()); } catch (e) {}
}
function forget() {
  state.token = ""; state.entry = null; state.lastStatus = null; stopBlink();
  try { localStorage.removeItem(KEY); } catch (e) {}
  try { var u = new URL(location.href); u.searchParams.delete("q"); history.replaceState(null, "", u.toString()); } catch (e) {}
  if (!state.hotel) loadHotel();
}
function poll() {
  if (!state.token) return Promise.resolve();
  return api("/api/public/queue/" + encodeURIComponent(state.token)).then(function (e) {
    state.entry = e; state.error = null; brand(e.hotel);
    state.updated = new Date().toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });
    if (e.status === "aufgerufen" && state.lastStatus !== "aufgerufen") alertGuest();
    if (e.status !== "aufgerufen") stopBlink();
    state.lastStatus = e.status; render();
  }).catch(function (x) { if (x.status === 404) { forget(); } else state.error = x.message; render(); });
}
function loadHotel() {
  if (!htoken && !demo) { state.error = t("invalid"); render(); return; }
  api("/api/public/queue-hotel/" + encodeURIComponent(htoken)).then(function (r) { state.hotel = r.hotel; state.areas = r.areas || []; brand(r.hotel); render(); })
    .catch(function (x) { state.error = x.message || t("invalid"); render(); });
}
render();
if (state.token) poll(); else loadHotel();
// alle 20 Sekunden nachsehen (im Hintergrund drosselt der Browser selbst)
setInterval(function () { if (state.token && state.entry && (state.entry.status === "wartet" || state.entry.status === "aufgerufen")) poll(); }, 20000);
</script>
